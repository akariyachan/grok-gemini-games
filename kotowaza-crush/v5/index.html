function resize(){

let actx=null,muted=lsGet(MUTE_KEY)==='1',bus=null,voices=0,sfxVol=1;
// mix: every tone goes through one master gain + a soft compressor so stacked sounds don't clip
const MAX_VOICES=18;
const SFX_VOL={heart:0.55,boom:0.6,baku:0.6,fevtick:0.75,note:0.9,pop:0.85,fan:0.85,buzz:0.8,wrong:0.9,chalin:0.7,kira:1.2,new:1.1,mission:1.1,drop:0.8,over:0.9};
function ensureAudio(){
 if(!actx){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){actx=new AC();
  const comp=actx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.15;
  bus=actx.createGain();bus.gain.value=0.85;bus.connect(comp);comp.connect(actx.destination);}}catch(e){actx=null;bus=null;}}
 if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
}
function tone(f,d,type,v,delay,slide){
 if(!actx||muted||voices>=MAX_VOICES)return;
 const t0=actx.currentTime+(delay||0);
 const o=actx.createOscillator(),g=actx.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.exponentialRampToValueAtTime(Math.max(0.0002,(v||0.15)*sfxVol),t0+0.01);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
 o.connect(g);g.connect(bus||actx.destination);voices++;o.onended=()=>{voices=Math.max(0,voices-1);};
 o.start(t0);o.stop(t0+d+0.03);
}
function comboPitch(){return Math.pow(2,Math.min(Math.max(combo-1,0)*2,14)/12);}
function sfx(n,i){

 sfxVol=SFX_VOL[n]||1;

  case 'pop':tone(520*Math.pow(2,Math.min(i,12)*2/12)*pm,0.06,'triangle',0.07);break;
  case 'kira':[1568,2093,2637].forEach((f,k)=>tone(f,0.2,'sine',0.045,k*0.045));break;
  case 'shinsoku':tone(700,0.28,'sine',0.06,0.04,2600);tone(1400,0.2,'triangle',0.04,0.12,3000);break;
  case 'brk':tone(392,0.12,'triangle',0.07);tone(294,0.18,'triangle',0.07,0.08);break;
  case 'back':tone(330,0.06,'sine',0.08);break;
  case 'fan':[523,659,784,1047].forEach((f,k)=>tone(f*pm,k===3?0.35:0.14,'square',0.07,k*0.07));[784,988,1319].forEach((f,k)=>tone(f*pm,0.3,'triangle',0.06,0.28+k*0.02));break;
  case 'part':tone(660,0.08,'triangle',0.12);tone(990,0.12,'triangle',0.1,0.06);break;
  case 'buzz':tone(140,0.22,'square',0.08,0,90);tone(147,0.22,'sawtooth',0.04,0,95);break;
  case 'drop':tone(180,0.1,'sine',0.1,0,90);break;
  case 'boom':tone(90,0.5,'sawtooth',0.18,0,35);tone(60,0.6,'sine',0.25,0,30);break;
  case 'start':tone(523,0.08,'triangle',0.1);tone(784,0.12,'triangle',0.1,0.07);break;
  case 'over':[440,370,311,262].forEach((f,k)=>tone(f,0.22,'triangle',0.12,k*0.13));break;
  // reward-effect flavour sounds
  case 'chalin':tone(2350+(i||0)*120,0.07,'triangle',0.045);tone(3300,0.12,'sine',0.03,0.04);break;
  case 'boing':tone(150,0.25,'sine',0.13,0,420);break;
  case 'pyuu':tone(1500,0.45,'sine',0.06,0,260);break;
  case 'kon':tone(820,0.05,'square',0.06);tone(410,0.12,'triangle',0.09,0.02);break;
  case 'nupu':tone(260,0.25,'sine',0.13,0,70);break;
  case 'pii':tone(1900,0.5,'sine',0.035,0,2300);break;
  case 'kaa':tone(1000,0.32,'sawtooth',0.05,0,620);break;
  case 'pon':tone(600,0.08,'sine',0.12,0,1100);break;
  case 'harisen':tone(1400,0.05,'square',0.08,0,300);tone(260,0.14,'sawtooth',0.08,0.01,120);break;
  case 'hmm':tone(500,0.12,'sine',0.07,0,700);break;
  case 'new':[880,1175,1568].forEach((f,k)=>tone(f,0.12,'square',0.04,k*0.06));break;
  case 'kachi':tone(1300,0.04,'square',0.06);tone(900,0.06,'square',0.04,0.05);break;
  // pinch / special tiles / fever

  case 'pinch':tone(880,0.1,'square',0.05);tone(660,0.1,'square',0.05,0.12);tone(880,0.1,'square',0.05,0.24);break;

function missionProg(m){const v=Math.min(m.n,m.v()||0);return m.n>1?' ('+v+'/'+m.n+')':'';}
function toast(text,color){toasts.push({text,color:color||'#7dff9a',t:0});}
function checkMissions(){
 for(const m of missions)if(!m.done&&(m.v()||0)>=m.n){m.done=true;toast('ミッション達成! '+m.t,'#7dff9a');sfx('mission');}
 const r=rankOf(score);if(r>rankIdx){rankIdx=r;toast('段位アップ!「'+RANKS[r].n+'」','#ffd54a');sfx('new');}
}
// difficulty curve: the first ~45s are gentle, then it eases into the full game
function ease(){return elapsed<45?1:Math.max(0,1-(elapsed-45)/40);}
function rowIv(){return elapsed<45?8-elapsed*0.02:Math.max(1.3,7.1-(elapsed-45)*0.06);}
function maxLen(){return elapsed<45?6:elapsed<65?7:elapsed<85?9:99;}
// hints fade for experts: full strength early, weaker later
function hintK(){return tut>0?1:Math.max(0.3,1-Math.max(0,elapsed-30)/150);}
const SPEED_TIERS=[{r:0.35,label:'神速!!',mul:2,color:'#ffe066',size:34},{r:0.6,label:'はやい!',mul:1.5,color:'#7ee8ff',size:28},{r:1,label:'いいね',mul:1.2,color:'#b2ff9e',size:22}];
window.__game={state:'title',score:0,best:best,solved:0,target:'',combo:0,speed:'',dex:dex.size,dexTotal:PROVERBS.length,fakes:fakeDex.size,fakeTotal:PARODIES.length,parody:'',fx:'',pinch:false,fever:0,streak:0,bombs:0,wilds:0,tutorial:0,rank:'',nextRank:0,missions:'',missionsDone:0,hintK:1,rowInterval:0,maxLen:0,share:'',pick:'',copied:'',copyBtn:null,effects:0,popups:0,particles:0};

function mkTile(ch,c,y,sp){return {ch,c,y,vy:0,id:tileId++,flash:0,shk:0,hold:0,sp:sp||null};}
// special tiles: 'bomb' (blasts its neighbours when part of a completed proverb), 'wild' (？ = any kana, max 1 per word)
function matchT(t,ch){return t.ch===ch||t.sp==='wild';}
function fitsT(ts,w){if(!w||ts.length>w.length)return false;let n=0;
 for(let i=0;i<ts.length;i++){const t=ts[i];if(t.sp==='wild'){if(++n>1)return false;}else if(t.ch!==w[i])return false;}return true;}
function countSp(sp){let n=0;for(const col of cols)for(const t of col)if(t.sp===sp)n++;return n;}
function maxHeight(){let m=0;for(const col of cols)m=Math.max(m,col.length);return m;}
function landedT(t,i){return t.vy===0&&Math.abs(t.y-i)<0.01;}
function tileAt(c,r){if(c<0||c>=COLS||r<0)return null;const t=cols[c][r];return t&&landedT(t,r)?t:null;}
function rIdx(t){return cols[t.c].indexOf(t);}
function landedCount(){let n=0;for(let c=0;c<COLS;c++)for(let r=0;r<cols[c].length;r++)if(tileAt(c,r))n++;return n;}
function anyFalling(){for(let c=0;c<COLS;c++)for(let r=0;r<cols[c].length;r++)if(!landedT(cols[c][r],r))return true;return false;}
function tileXY(t,i){return [L.bx+(t.c+0.5)*L.cell,L.bb-(t.y+0.5)*L.cell];}

function rowChar(){
 if(target){
  const need={};for(const ch of target.k)need[ch]=(need[ch]||0)+1;
  for(const col of cols)for(const t of col)if(need[t.ch])need[t.ch]--;
  const miss=Object.keys(need).filter(k=>need[k]>0);
  // early on: more of the letters you need, fewer fillers
  const e=ease();
  if(miss.length&&Math.random()<0.45+0.3*e)return pick(miss);
  if(Math.random()<0.2+0.3*e)return pick(target.k);
  if(parody&&Math.random()<0.12)return pick(parody.k);
 }
 return Math.random()<0.55?pick(PCHARS):pick(BASIC);
}
function pickTarget(){
 let pool=PROVERBS.filter(p=>!recent.includes(p));
 if(feverT>0){
  // fever: short proverbs only (6 letters max); repeats allowed when all of them are recent
  const s=PROVERBS.filter(p=>p.k.length<=6),f=s.filter(p=>!recent.includes(p)),g=s.filter(p=>p!==target);
  pool=f.length?f:g.length?g:s;
 }else{
  // gentle opening: short proverbs first, longer ones phase in over time
  const s=pool.filter(p=>p.k.length<=maxLen());if(s.length)pool=s;
 }
 target=pick(pool);
 recent.push(target);if(recent.length>4)recent.shift();
 needCheck=true;hintT=0;hintPath=null;freshTarget=true;tutPath=null;
 targetT=0;targetGoal=3+0.5*target.k.length;
 // sometimes a fake proverb hides inside this target (planted on the board once)
 const pc=PARODIES.filter(q=>q.base===target.k);
 parody=pc.length&&solved>=1&&Math.random()<0.5?{...pick(pc),planted:false}:null;
}
function plantParody(){
 if(!parody||parody.planted)return;
 parody.planted=true;
 if(findPath(parody.k))return;
 const keep=new Set(target?findPath(target.k)||[]:[]);
 let bw=null,bs=-1;
 for(let i=0;i<20;i++){
  const w=randomWalk(parody.k.length,parody.k);if(!w)break;
  if(w.some((t,j)=>(keep.has(t)&&t.ch!==parody.k[j])||t.sp==='wild'))continue;
  let sc=0;w.forEach((t,j)=>{if(t.ch===parody.k[j])sc++;});
  if(sc>bs){bs=sc;bw=w;}
 }
 if(!bw)return;
 bw.forEach((t,j)=>{if(t.ch!==parody.k[j]){t.ch=parody.k[j];t.flash=0.6;}});
}

/* ---------- path search ---------- */
function findPath(s){
 const starts=[];
 for(let c=0;c<COLS;c++)for(let r=0;r<cols[c].length;r++){const t=tileAt(c,r);if(t&&matchT(t,s[0]))starts.push([c,r]);}
 shuffle(starts);
 // a ？ tile matches any kana, but only one per word
 const used=new Set(),out=[];let steps=0,wild=0;
 const ok=n=>n.ch===s[out.length]||(n.sp==='wild'&&wild===0);
 const dfs=(c,r,k)=>{
  if(++steps>20000)return false;
  const t=tileAt(c,r);used.add(t);out.push(t);if(t.sp==='wild')wild++;
  if(k===s.length-1)return true;
  for(const [dc,dr] of shuffle(DIRS.slice())){
   const n=tileAt(c+dc,r+dr);
   if(n&&!used.has(n)&&ok(n)&&dfs(c+dc,r+dr,k+1))return true;
  }
  used.delete(t);out.pop();if(t.sp==='wild')wild--;return false;
 };
 for(const [c,r] of starts){if(dfs(c,r,0))return out.slice();}
 return null;
}
function randomWalk(n,s){
 const cells=[];
 for(let c=0;c<COLS;c++)for(let r=0;r<cols[c].length;r++)if(tileAt(c,r))cells.push([c,r]);
 if(cells.length<n)return null;
 shuffle(cells);
 if(s)cells.sort((a,b)=>(tileAt(b[0],b[1]).ch===s[0])-(tileAt(a[0],a[1]).ch===s[0]));
 for(let k=0;k<Math.min(8,cells.length);k++){
  const used=new Set(),out=[];let steps=0;
  const dfs=(c,r)=>{
   if(++steps>2500)return false;
   const t=tileAt(c,r);used.add(t);out.push(t);
   if(out.length===n)return true;
   const nb=shuffle(DIRS.slice());
   if(s){const want=s[out.length];nb.sort((a,b)=>{const ta=tileAt(c+a[0],r+a[1]),tb=tileAt(c+b[0],r+b[1]);return ((tb&&tb.ch===want)?1:0)-((ta&&ta.ch===want)?1:0);});}
   for(const [dc,dr] of nb){const nt=tileAt(c+dc,r+dr);if(nt&&!used.has(nt)&&dfs(c+dc,r+dr))return true;}
   used.delete(t);out.pop();return false;
  };
  if(dfs(cells[k][0],cells[k][1]))return out;
 }
 return null;
}
// gentle opening: lay the answer out in a tidy, low clump (a row, a zigzag or a 2-row snake)
function shapeCells(kind,n,c0,r){
 const out=[];
 if(kind==='row')for(let i=0;i<n;i++)out.push([c0+i,r]);
 else if(kind==='zig')for(let i=0;i<n;i++)out.push([c0+i,r+(i%2)]);
 else{const k=Math.ceil(n/2);for(let i=0;i<k;i++)out.push([c0+i,r]);for(let j=0;j<n-k;j++)out.push([c0+k-1-j,r+1]);}
 return out;
}
function plantCompact(kinds){
 const n=target.k.length,cand=[];
 for(const kind of kinds){const wdt=kind==='snake'?Math.ceil(n/2):n;
  for(let r=0;r<ROWS;r++)for(let c0=0;c0+wdt<=COLS;c0++){
   const cs=shapeCells(kind,n,c0,r);if(cs.every(([c,rr])=>tileAt(c,rr)))cand.push({cs,s:r+Math.random()*1.6});}}
 if(!cand.length)return null;
 cand.sort((a,b)=>a.s-b.s);
 const ts=cand[0].cs.map(([c,r])=>tileAt(c,r));
 ts.forEach((t,j)=>{if(t.ch!==target.k[j]||t.sp==='wild'){t.ch=target.k[j];t.flash=Math.max(t.flash,tut>0?1:0.5);if(t.sp==='wild')t.sp=null;}});
 hintPath=null;
 return ts;
}
function isCompact(p){
 const cs=p.map(t=>t.c),rs=p.map(rIdx),w=Math.max(...cs)-Math.min(...cs)+1,h=Math.max(...rs)-Math.min(...rs)+1;
 return h<=2||w*h<=p.length+3;
}
function ensurePath(fresh){
 if(!target)return true;
 // tutorial: 1st = a straight row, 2nd = a zigzag (shows that diagonal steps are OK)
 if(tut>0&&fresh){const t=plantCompact([tut>=2?'row':'zig']);if(t){tutPath=t;return true;}}
 const compact=tut>0||Math.random()<ease(),p=findPath(target.k);
 if(p&&!(fresh&&compact&&!isCompact(p)))return true;
 if(compact){const t=plantCompact(['row','zig','snake']);if(t){if(tut>0)tutPath=t;return true;}}
 if(p)return true;
 let bw=null,bs=-1;
 for(let i=0;i<20;i++){
  const w=randomWalk(target.k.length,target.k);if(!w)break;
  let sc=0;w.forEach((t,j)=>{if(t.ch===target.k[j])sc++;});
  if(sc>bs){bs=sc;bw=w;}
 }
 if(!bw)return false;
 // keep the first ？ in the walk as a joker; any extra ？ turns into the needed letter
 let wild=0;
 bw.forEach((t,j)=>{if(t.sp==='wild'&&wild++===0)return;
  if(t.ch!==target.k[j]||t.sp==='wild'){t.ch=target.k[j];t.flash=1;if(t.sp==='wild')t.sp=null;}});
 hintPath=null;
 return true;
}

/* ---------- game flow ---------- */
function startGame(){
 state='play';stateT=0;score=0;solved=0;combo=0;elapsed=0;newBest=false;solvedList=[];recent=[];
 particles=[];effects=[];popups=[];banner=null;path=[];dragging=false;shake=0;
 morphs=[];lineShake=0;edgeA=0;edgeFlash=0;lastRating='';
 parody=null;newRun=new Set();newFakeRun=new Set();
 pinch=false;pinchRaw=false;heartT=0;beatK=0;feverT=0;feverBeat=0;feverN=0;feverA=0;streak=0;lastClearT=-9;wildMsgT=0;
 tut=lsGet(TUT_KEY)?0:2;tutPath=null;toasts=[];rankIdx=0;
 R={solved:0,fast:0,god:0,maxCombo:0,fakes:0,fevers:0,bombs:0,wilds:0,escapes:0,long:0};
 missions=pickMissions();runPicks=[];copyMsg=null;copyArm=false;
 cols=[];for(let c=0;c<COLS;c++)cols.push([]);
 pickTarget();
 for(let r=0;r<4;r++)for(let c=0;c<COLS;c++)cols[c].push(mkTile(rowChar(),c,r));
 rowInterval=rowIv();rowTimer=rowInterval;

 bot.phase='idle';bot.wait=0.6;

function spawnRow(){
 for(let c=0;c<COLS;c++)if(cols[c].length>=ROWS){gameOver();return;}
 // special tiles: bombs show up more often in a pinch (a chance to turn it around)
 const hi=maxHeight(),spc=Math.random()*COLS|0;let sp=null;
 if(elapsed>6&&countSp('bomb')<3&&Math.random()<(hi>=ROWS-3?0.45:0.2))sp='bomb';
 else if(elapsed>10&&countSp('wild')<2&&Math.random()<0.14)sp='wild';
 for(let c=0;c<COLS;c++){const s=c===spc?sp:null,t=mkTile(s==='wild'?'？':rowChar(),c,ROWS+0.4+Math.random()*0.7,s);t.vy=3;cols[c].push(t);}
 settleCols();
 hintPath=null;
 sfx('drop');
}
function startFever(){
 feverT=FEVER_DUR;feverN++;streak=0;if(R.fevers!=null)R.fevers++;
 popups.push({text:'FEVER!!',x:L.bx+L.bw/2,y:L.by+L.bh*0.42,t:0,color:'#ffe066',size:Math.round(Math.max(30,Math.min(48,L.cell*0.9))),pop:1,life:1.2});
 popups.push({text:'得点2倍・行が止まる!',x:L.bx+L.bw/2,y:L.by+L.bh*0.42+L.cell*0.8,t:-0.1,color:'#fff6c0',size:Math.round(Math.max(14,Math.min(20,L.cell*0.38))),life:1.3});
 for(let k=0;k<40;k++){const a=rnd(0,Math.PI*2),sp=rnd(150,520);particles.push({x:L.bx+L.bw/2,y:L.by+L.bh*0.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:0,max:rnd(0.6,1),size:rnd(4,9),color:pick(['#ffe066','#fff6c0','#ffb347','#fff']),kind:'sq',rot:rnd(0,6)});}
 shake=Math.max(shake,0.3);sfx('fever');

function gameOver(){
 state='over';overT=0;dragging=false;path=[];feverT=0;
 if(score>best){best=score;newBest=true;lsSet(BEST_KEY,String(best));}

function burst(x,y,ch){
 for(let k=0;k<9;k++){const a=rnd(0,Math.PI*2),sp=rnd(120,380);
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-150,life:0,max:rnd(0.4,0.7),size:rnd(4,9)*L.cell/60,color:pick(['#ffd54a','#ff8a65','#fff6e0','#81d4fa','#f48fb1']),kind:'sq',rot:rnd(0,6)});}
 if(ch)particles.push({x,y,vx:rnd(-30,30),vy:-220,life:0,max:0.6,size:L.cell*0.6,color:'#fff',kind:'txt',text:ch,rot:0});
}
// chain: tiles pop one by one in traced order (~0.3s total), each letter flies up to the HUD and
// they turn into the kanji proverb. Tiles above a popping tile wait (hold) until it pops.
function clearTiles(ts,chain){
 const n=ts.length,step=chain?Math.min(0.06,0.3/Math.max(1,n-1)):0;
 let m=null;
 if(chain){
  m={j:chain.j,t:0,cs:[],tm:(n-1)*step+0.3,cx:hudPos.cx,dy:hudPos.dy,w:hudPos.w};
  morphs.push(m);
 }
 ts.forEach((t,k)=>{
  const i=rIdx(t);if(i<0)return;
  const [x,y]=tileXY(t),d=k*step;
  cols[t.c].splice(i,1);
  if(m){
   // only resting tiles wait; tiles already falling keep falling
   for(let r=i;r<cols[t.c].length;r++){const u=cols[t.c][r];if(u.vy===0)u.hold=Math.max(u.hold,d+0.03);}
   m.cs.push({ch:t.sp==='wild'&&chain.k?chain.k[k]:t.ch,sp:t.sp,x,y,t0:d,k,popped:false,tx:m.cx+(k-(n-1)/2)*Math.min(hudPos.sz*0.95,hudPos.w/n),ty:m.dy,fs:Math.min(hudPos.sz*0.95,hudPos.w/n)*0.9});
  }else burst(x,y,t.ch);
 });
 settleCols();
 needCheck=true;hintPath=null;hintT=0;
}
// 爆 tiles in a completed word blow away their 8 neighbours; a blasted bomb chains on
function blastSet(ts){
 const inP=new Set(ts),out=[],seen=new Set(),q=ts.filter(t=>t.sp==='bomb');
 const centers=[];
 while(q.length){const b=q.shift();const r=rIdx(b);if(r<0)continue;centers.push(tileXY(b));
  for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){const n=tileAt(b.c+dc,r+dr);
   if(!n||inP.has(n)||seen.has(n))continue;seen.add(n);out.push(n);if(n.sp==='bomb')q.push(n);}}
 return {tiles:out,centers};
}
function detonate(bl){
 for(const [x,y] of bl.centers){
  effects.push({kind:'blast',t:0,dur:0.6,parts:[],x,y});
  for(let k=0;k<22;k++){const a=rnd(0,Math.PI*2),sp=rnd(200,620);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:0,max:rnd(0.4,0.8),size:rnd(5,11)*L.cell/60,color:pick(['#ff7043','#ffb300','#ffe066','#5d4037','#fff']),kind:'sq',rot:rnd(0,6)});}
 }
 if(bl.tiles.length)clearTiles(bl.tiles);
 shake=Math.max(shake,0.45);sfx('baku');
}
// keep every column consistent: no tile below its slot, none overlapping the one under it,
// and nothing resting in mid-air (update() then lets them fall into place)
function settleCols(){
 for(const col of cols)for(let i=0;i<col.length;i++){const t=col[i];
  if(!(t.y>=i)){t.y=i;t.vy=0;}
  if(i>0&&t.y<col[i-1].y+1){t.y=col[i-1].y+1;t.vy=Math.min(t.vy,col[i-1].vy);}
  if(t.hold>0.35)t.hold=0.35;
 }
}
// solve feedback: all lines stacked in one panel above the tile stack, so they never overlap
function pushPanel(lines){
 popups=popups.filter(q=>!q.grp);
 const k=Math.max(0.6,Math.min(1,L.cell/52));
 lines=lines.map(l=>({text:l.text,color:l.color,size:Math.round(l.size*k)}));
 const lh=lines.map(l=>Math.round(l.size*1.25)),hh=lh.reduce((a,b)=>a+b,0);
 let top=0;for(const c of cols)top=Math.max(top,c.length);
 const y=Math.min(L.bb-hh/2-8,Math.max(L.by+hh/2+10,L.bb-top*L.cell-hh/2-12));
 popups.push({grp:1,lines,lh,hh,x:L.bx+L.bw/2,y,t:0,life:1.1});
}
function evaluate(){
 const s=pathText(),fmul=feverT>0?2:1;
 if(path.length>=1&&target){
  if(path.length===target.k.length&&fitsT(path,target.k)){
   // combo continues only if solved before the time gauge ran out
   if(targetT>targetGoal){combo=0;streak=0;}
   combo++;
   const r=targetT/targetGoal,tier=SPEED_TIERS.find(q=>r<=q.r);
   const smul=tier?tier.mul:1,cmul=1+0.25*Math.min(combo-1,8),pmul=pinch?1.5:1;
   const bl=blastSet(path),bpts=bl.tiles.length*50*fmul;
   const pts=Math.round((100+40*s.length)*cmul*smul*pmul*fmul)+bpts;
   score+=pts;solved++;solvedList.push(target.j);lastRating=tier?tier.label:'';lastClearT=stateT;
   // mission stats
   R.solved++;R.maxCombo=Math.max(R.maxCombo,combo);if(tier&&tier.mul>=1.5)R.fast++;if(tier&&tier.mul>=2)R.god++;
   if(bl.centers.length)R.bombs++;if(path.some(t=>t.sp==='wild'))R.wilds++;if(target.k.length>=8)R.long++;
   if(tut>0){tut--;tutPath=null;if(!tut){lsSet(TUT_KEY,'1');toast('チュートリアル完了! ここから本番','#7ee8ff');}}
   clearTiles(path,target);
   if(bl.centers.length)detonate(bl);
   const lines=[];
   const fresh=!dex.has(target.k);runPicks.push({p:target,nise:false,isNew:fresh});
   if(fresh){dex.add(target.k);newRun.add(target.k);saveDex();
    lines.push({text:'図鑑 NEW!',color:'#ff7ad9',size:24});sfx('new');}
   if(tier)lines.push({text:tier.label+' ×'+tier.mul.toFixed(1),color:tier.color,size:Math.min(28,tier.size)});
   if(pinch)lines.push({text:'ピンチ逆転 ×1.5',color:'#ff6b6b',size:24});
   if(bl.centers.length)lines.push({text:'爆破 '+bl.tiles.length+'枚 +'+bpts,color:'#ffab40',size:24});
   if(fmul>1)lines.push({text:'FEVER ×2',color:'#ffe066',size:22});
   lines.push({text:'+'+pts,color:'#ffe066',size:30});

function copyFallback(txt){

  ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();

function hit(x,y,rad){
 const c=Math.floor((x-L.bx)/L.cell),r=Math.floor((L.bb-y)/L.cell);
 const t=tileAt(c,r);if(!t)return null;
 const cx=L.bx+(c+0.5)*L.cell,cy=L.bb-(r+0.5)*L.cell;
 return Math.hypot(x-cx,y-cy)<=rad*L.cell?t:null;
}
function adjacent(a,b){const ra=rIdx(a),rb=rIdx(b);return a!==b&&Math.abs(a.c-b.c)<=1&&Math.abs(ra-rb)<=1;}
function pathOk(){return !!target&&fitsT(path,target.k);}

function pathNise(){return !!parody&&!pathOk()&&fitsT(path,parody.k);}

function pathText(){const w=pathOk()?target.k:pathNise()?parody.k:null;return path.map((t,i)=>t.sp==='wild'&&w?w[i]:t.ch).join('');}

function tryAdd(x,y,rad){
 const t=hit(x,y,rad);if(!t)return;
 if(path.length===0){pushTile(t);return;}
 const last=path[path.length-1];if(t===last)return;
 if(path.length>=2&&t===path[path.length-2]){path.pop();sfx('back');return;}

  if(stateT-wildMsgT>0.8){wildMsgT=stateT;const [mx,my]=tileXY(t);popups.push({text:'？は1つまで',x:mx,y:my,t:0,color:'#80deea',size:16});sfx('nowild');}

/* ---------- bot ---------- */
const bot={phase:'idle',wait:0.8,pts:[],idx:0,seg:0,x:0,y:0};
function botUpdate(dt){
 if(state==='title'){if(stateT>0.8)onDown(W/2,H/2);return;}
 if(state==='over'){if(overT>=2)onDown(W/2,H/2);return;}
 if(bot.phase==='idle'){
  bot.wait-=dt;if(bot.wait>0)return;
  let full=findPath(target.k);
  if(!full){bot.wait=0.2;return;}
  // likes to route through a 爆 tile when it can (findPath already uses a ？ when needed)
  for(let i=0;i<3&&!full.some(t=>t.sp==='bomb');i++){const f2=findPath(target.k);if(f2&&f2.some(t=>t.sp==='bomb'))full=f2;}
  // test bot gets worse over time and always loses eventually (~1-2 min)
  const failP=elapsed>120?1:Math.min(0.97,0.08+elapsed/150);
  let p=full;const r=Math.random();
  if(r<failP){
   p=null;
   for(let i=0;i<6&&!p;i++){const w=randomWalk(3+(Math.random()*2|0));if(w&&!fitsT(w,target.k)&&!w.some(t=>t.sp==='wild'))p=w;}
   if(!p)p=[full[full.length-1]];
  }else if(r<failP+0.1){p=full.slice(0,2+(Math.random()*2|0));}
  else if(parody&&Math.random()<0.5){const pp=findPath(parody.k);if(pp)p=pp;}
  bot.pts=p.map(t=>{const [x,y]=tileXY(t);return [x+rnd(-4,4),y+rnd(-4,4)];});
  bot.idx=0;bot.seg=0;bot.x=bot.pts[0][0];bot.y=bot.pts[0][1];
  onDown(bot.x,bot.y);bot.phase='trace';
  if(bot.pts.length===1){onUp();bot.phase='idle';bot.wait=0.5;}
  return;
 }
 if(bot.phase==='trace'){
  if(state!=='play'){bot.phase='idle';return;}
  bot.seg+=dt;
  const a=bot.pts[bot.idx],b=bot.pts[bot.idx+1],k=Math.min(1,bot.seg/(0.15+Math.min(0.15,elapsed*0.0015)));
  bot.x=a[0]+(b[0]-a[0])*k;bot.y=a[1]+(b[1]-a[1])*k;
  onMove(bot.x,bot.y);
  if(k>=1){bot.idx++;bot.seg=0;
   if(bot.idx>=bot.pts.length-1){onUp();bot.phase='idle';bot.wait=0.35+Math.random()*0.9+Math.min(3,elapsed*0.02);}
  }
 }
}

/* ---------- update ---------- */
function update(dt){
 stateT+=dt;
 if(shake>0)shake=Math.max(0,shake-dt);
 if(sfxBudget>0)sfxBudget=Math.max(0,sfxBudget-dt);
 if(state==='over')overT+=dt;
 if(copyMsg)copyMsg.t+=dt;
 if(state==='play'){
  elapsed+=dt;
  rowInterval=rowIv();
  const falling=anyFalling();
  if(feverT>0){
   // fever: no new rows (only an emergency refill when the board runs out of letters)
   feverT=Math.max(0,feverT-dt);
   feverBeat-=dt;if(feverBeat<=0){feverBeat=0.25;sfx('fevtick',feverN++);}
   if(!falling&&landedCount()<target.k.length+4){rowTimer=Math.min(rowTimer,0.6)-dt;}
   if(feverT<=0){rowTimer=Math.max(rowTimer,rowInterval);popups.push({text:'フィーバー終了',x:L.bx+L.bw/2,y:L.by+L.bh*0.3,t:0,color:'#ffe066',size:20});sfx('fevend');}
  }else{
   // tutorial: no new rows until the first proverbs are done
   if(!tut)rowTimer-=dt;
   if(!falling&&landedCount()<target.k.length+6&&rowTimer>0.6)rowTimer=0.6;
  }
  if(rowTimer<=0){rowTimer=rowInterval;spawnRow();}
  if(state==='play'){
   targetT+=dt;
   if(combo>0&&!dragging&&targetT>targetGoal){
    if(combo>=2){popups.push({text:'コンボ終了',x:hudPos.cx,y:hudPos.dy,t:0,color:'#ff9ecb',size:16});sfx('brk');}
    combo=0;streak=0;
   }
   // pinch: stack within the top 2 rows -> "ピンチ!", red pulsing frame, heartbeat (paused during fever)
   const mh=maxHeight(),was=pinchRaw;
   pinchRaw=mh>=ROWS-2;
   const np=pinchRaw&&feverT<=0;
   if(np&&!pinch){popups.push({text:'ピンチ!',x:L.bx+L.bw/2,y:L.by+L.bh*0.45,t:0,color:'#ff5252',size:Math.round(Math.max(28,Math.min(44,L.cell*0.8))),pop:1});sfx('pinch');heartT=0.25;}
   pinch=np;
   if(was&&!pinchRaw&&stateT-lastClearT<1.5){
    // cleared out of the danger zone: comeback bonus
    const b=300*(feverT>0?2:1);score+=b;R.escapes++;
    popups.push({text:'ピンチ脱出!! +'+b,x:L.bx+L.bw/2,y:L.by+L.bh*0.35,t:0,color:'#7dff9a',size:Math.round(Math.max(20,Math.min(30,L.cell*0.55))),pop:1,life:1.2});
    sfx('escape');edgeFlash=1;
   }
   if(pinch){heartT-=dt;if(heartT<=0){heartT=mh>=ROWS?0.42:mh>=ROWS-1?0.6:0.82;beatK=1;sfx('heart');}}
  }

  const ri=rankOf(score),nx=RANKS[ri+1],cx=x+w/2,u=Math.max(0,Math.min(1,(overT-0.25)/0.2));

  if(u>0){ctx.save();ctx.translate(cx,y+36*k);const sc=1+0.35*(1-u);ctx.scale(sc,sc);ctx.globalAlpha*=u;
   const fs=fitFont(RANKS[ri].n,w-16,32*k|0,'900');ctx.lineWidth=Math.max(4,fs*0.18);ctx.lineJoin='round';ctx.strokeStyle='rgba(60,20,0,0.95)';ctx.strokeText(RANKS[ri].n,0,0);
   const g=ctx.createLinearGradient(0,-fs/2,0,fs/2);g.addColorStop(0,'#fff8c8');g.addColorStop(0.6,'#ffd54a');g.addColorStop(1,'#ff9f1c');ctx.fillStyle=g;ctx.fillText(RANKS[ri].n,0,0);ctx.restore();}
  const t2=nx?'次の「'+nx.n+'」まで あと'+(nx.s-score)+'点':'最高段位! おみごと!';
  cardText(t2,cx,y+64*k,w-16,13*k,'bold',nx?'rgba(255,240,200,0.9)':'#7dff9a');
  if(nx){const bw=Math.min(w-40,200);bar(cx-bw/2,y+76*k,bw,Math.max(4,5*k),(score-RANKS[ri].s)/(nx.s-RANKS[ri].s),'#ffd54a');}
 }},
 score:{h:96,draw(x,y,w,h,k){
  const cx=x+w/2;
  cardText('スコア',cx,y+9*k,w,13*k,'bold','rgba(255,255,255,0.85)');
  cardText(String(score),cx,y+44*k,w-20,50*k,'900','#ffffff','rgba(70,20,90,0.95)');
  if(newBest){const s2=1+0.06*Math.sin(overT*8);ctx.save();ctx.translate(cx,y+81*k);ctx.scale(s2,s2);
   ctx.font='900 '+(15*k|0)+'px '+FONT;const tw=Math.min(w-16,ctx.measureText('NEW BEST! ベスト更新').width+24*k);
   ctx.fillStyle='#1b5e20';rr(-tw/2,-12*k,tw,24*k,12*k);ctx.fill();ctx.strokeStyle='#7dff9a';ctx.lineWidth=1.5;ctx.stroke();
   cardText('NEW BEST! ベスト更新',0,1,tw-12,15*k,'900','#c8ffd4');ctx.restore();}
  else cardText('ベスト '+best,cx,y+80*k,w-16,15*k,'bold','#ffd54a');
 }},
 pick:{h:136,draw(x,y,w,h,k){
  const b=pickBest(),ns=b&&b.nise,cx=x+w/2,pad=8*k;
  ctx.fillStyle=ns?'rgba(190,110,255,0.16)':'rgba(255,213,74,0.1)';rr(x+pad,y,w-pad*2,h,12*k);ctx.fill();
  ctx.strokeStyle=ns?'rgba(220,160,255,0.75)':'rgba(255,213,74,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  const iw=w-pad*2-20,yy=f=>y+h*f;
  cardText(ns?'今回いちばん笑えた ニセことわざ':'今回のいちばん',cx,yy(0.15),iw,12*k,'bold',ns?'#e8c4ff':'#ffe59a');
  if(!b){
   cardText('完成なし…',cx,yy(0.45),iw,26*k,'900','#ffffff','rgba(40,10,60,0.9)');
   cardText('となりの文字をなぞって ことわざを作ろう!',cx,yy(0.74),iw,13*k,'bold','rgba(255,255,255,0.85)');
   return;
  }
  const p=b.p,ttl=ns?'「'+p.j+'」':p.j;
  cardText(ttl,cx,yy(0.42),iw,30*k,'900',ns?'#f6dcff':'#fff3c4',ns?'rgba(70,10,100,0.95)':'rgba(90,40,0,0.95)');
  cardText(p.m,cx,yy(0.66),iw,13*k,'bold','rgba(255,255,255,0.92)');
  if(ns){const base=PROVERBS.find(q=>q.k===p.base);if(base)cardText('（本物は「'+base.j+'」）',cx,yy(0.86),iw,12*k,'bold','rgba(230,200,255,0.85)');}
  else cardText(b.isNew?'図鑑に新登録!':'完成 '+solved+'個のなかから',cx,yy(0.86),iw,12*k,'bold',b.isNew?'#ff9be0':'rgba(255,240,200,0.8)');
  // stamp in the corner
  const st=ns?'ニセ':b.isNew?'NEW':null;
  if(st){const r=17*k;ctx.save();ctx.translate(x+w-pad-r-4,y+r+4);ctx.rotate(0.25);ctx.strokeStyle=ns?'#ff5b8a':'#ff5bbd';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();cardText(st,0,1,r*1.6,13*k,'900',ns?'#ff7da0':'#ff7ad9');ctx.restore();}
 }},
 stats:{h:56,draw(x,y,w,h,k){
  const nd=missions.filter(m=>m.done).length,cells=[['完成',solved+'個'],['最大コンボ',String(R.maxCombo||0)],['ミッション',nd+'/'+missions.length]],cw=w/3;
  cells.forEach(([l,v],i)=>{const cx=x+cw*(i+0.5);
   if(i){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x+cw*i,y+h*0.18,1,h*0.64);}
   cardText(l,cx,y+h*0.28,cw-8,12*k,'bold','rgba(255,255,255,0.78)');
   cardText(v,cx,y+h*0.68,cw-8,22*k,'900',i===2&&nd===missions.length?'#7dff9a':'#ffffff');});
 }},
 dex:{h:68,draw(x,y,w,h,k){
  const pad=14*k,iw=w-pad*2,nn=newRun.size+newFakeRun.size;
  const row=(yy,label,n,N,c)=>{
   ctx.textAlign='left';cardText(label,x+pad,yy,iw*0.6,13*k,'bold','rgba(255,255,255,0.9)');
   ctx.textAlign='right';cardText(n+' / '+N,x+w-pad,yy,iw*0.4,13*k,'900',c);ctx.textAlign='center';
   bar(x+pad,yy+9*k,iw,Math.max(4,6*k),n/N,c);
  };
  row(y+h*0.18,'ことわざ図鑑'+(nn?'　今回 +'+nn+' NEW!':''),dex.size,PROVERBS.length,'#ffd54a');
  row(y+h*0.66,'ニセことわざ図鑑',fakeDex.size,PARODIES.length,'#d8a6ff');
 }},
 footer:{h:20,draw(x,y,w,h,k){cardText('#ことわざクラッシュ',x+w/2,y+h/2,w-8,12*k,'bold','rgba(255,255,255,0.6)');}}
};
function drawCardButton(r,label,fill,edge,fc,a){
 ctx.save();ctx.globalAlpha*=a;
 ctx.fillStyle='rgba(0,0,0,0.35)';rr(r.x,r.y+3,r.w,r.h,r.h/2);ctx.fill();
 ctx.fillStyle=fill;rr(r.x,r.y,r.w,r.h,r.h/2);ctx.fill();ctx.strokeStyle=edge;ctx.lineWidth=2;ctx.stroke();
 cardText(label,r.x+r.w/2,r.y+r.h/2+1,r.w-20,Math.min(18,r.h*0.4),'900',fc);
 ctx.restore();
}
function drawOver(){
 ctx.fillStyle='rgba(10,5,20,0.97)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.textBaseline='middle';
 const land=W>H*1.2;
 // heading in the top bar between "← ゲーム一覧" and the mute button when it fits, else just under them
 ctx.font='900 20px '+FONT;
 const hw=W-2*126,hfs=Math.min(20,Math.floor(20*hw/Math.max(1,ctx.measureText('ゲームオーバー').width)));
 const inBar=hfs>=15,top=inBar?42:72;
 cardText('ゲームオーバー',W/2,inBar?22:56,inBar?hw:W-40,inBar?hfs:20,'900','#ff9a9a');
 const btnH=land?Math.max(38,Math.min(46,H*0.11|0)):Math.max(44,Math.min(54,H*0.064|0)),gap=land?10:14;
 const cw=land?Math.min(W-24,780):Math.min(W-20,440),cx0=W/2-cw/2,cTop=top,cBot=H-btnH-gap-Math.max(10,gap);
 const chH=cBot-cTop,pad=land?10:12;
 const colsDef=land?[['header','rank','score','footer'],['pick','stats','dex']]:[['header','rank','score','pick','stats','dex','footer']];
 let k=1.3;for(const c of colsDef){const sum=c.reduce((a,n)=>a+CARD[n].h,0);k=Math.min(k,(chH-pad*2)/sum);}
 k=Math.max(0.55,k);
 // slide-in
 const e=Math.min(1,overT/0.3),ein=1-Math.pow(1-e,3);
 ctx.save();ctx.globalAlpha=ein;ctx.translate(0,(1-ein)*24);
 const g=ctx.createLinearGradient(0,cTop,0,cBot);g.addColorStop(0,'#3d2766');g.addColorStop(1,'#26173f');
 ctx.fillStyle=g;rr(cx0,cTop,cw,chH,18);ctx.fill();ctx.strokeStyle='rgba(255,213,74,0.8)';ctx.lineWidth=2;ctx.stroke();
 ctx.strokeStyle='rgba(255,213,74,0.25)';ctx.lineWidth=1;rr(cx0+5,cTop+5,cw-10,chH-10,14);ctx.stroke();
 const colW=cw/colsDef.length;
 colsDef.forEach((c,ci)=>{
  const x=cx0+ci*colW,sum=c.reduce((a,n)=>a+CARD[n].h*k,0),sp=(chH-pad*2-sum)/(c.length+1);
  if(ci){ctx.fillStyle='rgba(255,213,74,0.2)';ctx.fillRect(x,cTop+16,1,chH-32);}
  let y=cTop+pad+sp;
  for(const n of c){const h=CARD[n].h*k;ctx.save();CARD[n].draw(x+6,y,colW-12,h,Math.min(k,1.2));ctx.restore();ctx.textAlign='center';ctx.textBaseline='middle';y+=h+sp;}
 });
 ctx.restore();
 // buttons: copy the result / retry (tapping anywhere else also retries)
 const bw=Math.min((cw-12)/2,220),by=H-btnH-Math.max(10,gap);
 overUI.copy={x:W/2-6-bw,y:by,w:bw,h:btnH};overUI.retry={x:W/2+6,y:by,w:bw,h:btnH};
 const cm=copyMsg&&copyMsg.t<1.8?copyMsg:null,ready=overT>0.5;
 drawCardButton(overUI.copy,cm?(cm.ok?'コピーしました!':'コピーできませんでした'):'結果をコピー',cm&&cm.ok?'#1f7a4a':'#1d5f7a',cm&&cm.ok?'#7dff9a':'#7ee8ff','#ffffff',ready?1:0.5);
 drawCardButton(overUI.retry,'リトライ ▶','#ffc533','#fff1a8','#5a2a00',ready?0.8+0.2*Math.sin(overT*5):0.5);
}

/* ---------- loop ---------- */
let lastT=performance.now(),frameDt=0;
function frame(now){
 frameDt=Math.min(0.05,Math.max(0,(now-lastT)/1000));lastT=now;
 update(frameDt);
 draw();
 const G=window.__game;
 G.state=state;G.score=score;G.best=Math.max(best,score);G.solved=solved;G.target=target?target.k:'';G.combo=combo;G.speed=lastRating;
 G.dex=dex.size;G.fakes=fakeDex.size;G.parody=parody?parody.k:'';G.fx=effects.map(e=>e.kind).join(',');
 G.pinch=pinch;G.fever=+feverT.toFixed(2);G.streak=streak;G.bombs=countSp('bomb');G.wilds=countSp('wild');
 G.tutorial=tut;G.rank=RANKS[rankOf(score)].n;{const nx=RANKS[rankOf(score)+1];G.nextRank=nx?nx.s-score:0;}
 G.missions=missions.map(m=>(m.done?'[x]':'[ ]')+m.t).join(' / ');G.missionsDone=missions.filter(m=>m.done).length;
 G.hintK=+hintK().toFixed(2);G.rowInterval=+rowInterval.toFixed(2);G.maxLen=maxLen();
 {const b=state==='over'?pickBest():null;G.share=state==='over'?shareText():'';G.pick=b?(b.nise?'ニセ:':'')+b.p.j:'';}
 G.copied=copyMsg?(copyMsg.ok?'ok':'ng'):'';G.copyBtn=overUI.copy&&state==='over'?{...overUI.copy}:null;
 G.effects=effects.length;G.popups=popups.length;G.particles=particles.length;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
