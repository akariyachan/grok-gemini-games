<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>重力反転ランナー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230284c7'/><path d='M16 6 L22 13 L18 13 L18 26 L14 26 L14 13 L10 13 Z' fill='%23ffffff'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <script>
  (function() {
    'use strict';

    // --- Audio System (Pure Web Audio API with procedural BGM & SFX) ---
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmPlaying = false;
        this.bgmStep = 0;
        this.nextNoteTime = 0;
        this.bpm = 118;
        try {
          const saved = localStorage.getItem('gravity_runner_muted');
          if (saved !== null) this.muted = (saved === 'true');
        } catch(e) {}
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);

            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
            this.sfxGain.connect(this.masterGain);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            this.bgmGain.connect(this.masterGain);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        try {
          localStorage.setItem('gravity_runner_muted', String(this.muted));
        } catch(e) {}
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);
        }
        return this.muted;
      }

      setBpm(newBpm) {
        this.bpm = newBpm;
      }

      startBgm() {
        this.init();
        if (this.bgmPlaying) return;
        this.bgmPlaying = true;
        this.bgmStep = 0;
        if (this.ctx) {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
        }
      }

      stopBgm() {
        this.bgmPlaying = false;
      }

      updateBgm() {
        if (this.muted || !this.ctx || !this.bgmPlaying) return;
        const currentTime = this.ctx.currentTime;
        const secondsPerStep = (60.0 / this.bpm) / 4; // 16th note

        while (this.nextNoteTime < currentTime + 0.12) {
          this.scheduleBgmStep(this.bgmStep, this.nextNoteTime);
          this.nextNoteTime += secondsPerStep;
          this.bgmStep = (this.bgmStep + 1) % 64; // 4 bars (16 steps each)
        }
      }

      scheduleBgmStep(step, time) {
        if (!this.ctx || !this.bgmGain) return;

        const bar = Math.floor(step / 16);
        const beatInBar = step % 16;

        // 1. Drum: Kick on 0, 4, 8, 12 (Four-on-the-floor)
        if (beatInBar % 4 === 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115, time);
          osc.frequency.exponentialRampToValueAtTime(32, time + 0.07);
          gain.gain.setValueAtTime(0.35, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.09);
        }

        // 2. Drum: Hi-hat on offbeats (2, 6, 10, 14)
        if (beatInBar % 4 === 2) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, time);
          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.03);
        }

        // 3. Bassline: Am - F - C - G progression (1 bar each)
        const rootFreqs = [55.0, 43.65, 65.4, 49.0];
        const currentRoot = rootFreqs[bar];

        // Bass groove pattern on steps 0, 3, 6, 8, 11, 14
        const isBassStep = (beatInBar === 0 || beatInBar === 3 || beatInBar === 6 || beatInBar === 8 || beatInBar === 11 || beatInBar === 14);
        if (isBassStep) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const freqMultiplier = (beatInBar === 6 || beatInBar === 14) ? 2.0 : 1.0;
          osc.frequency.setValueAtTime(currentRoot * freqMultiplier, time);

          gain.gain.setValueAtTime(0.18, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.14);
        }

        // 4. Arpeggiated high chime melody on selected syncopated steps
        const isChimeStep = (beatInBar === 2 || beatInBar === 5 || beatInBar === 7 || beatInBar === 10 || beatInBar === 13);
        if (isChimeStep) {
          const pentatonicOffsets = [0, 3, 7, 10, 12];
          const offsetIndex = (beatInBar * 3 + bar) % pentatonicOffsets.length;
          const semitone = pentatonicOffsets[offsetIndex];
          const chimeFreq = currentRoot * 8 * Math.pow(2, semitone / 12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(chimeFreq, time);
          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.1);
        }
      }

      playFlip(isToCeiling) {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          if (isToCeiling) {
            osc.frequency.setValueAtTime(260, t);
            osc.frequency.exponentialRampToValueAtTime(540, t + 0.18);
          } else {
            osc.frequency.setValueAtTime(500, t);
            osc.frequency.exponentialRampToValueAtTime(240, t + 0.18);
          }
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.24);
        } catch(e) {}
      }

      playLand() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.08);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.12);
        } catch(e) {}
      }

      playCrash() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(28, t + 0.38);
          gain.gain.setValueAtTime(0.26, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.44);
        } catch(e) {}
      }

      playStart() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.14);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.2);
        } catch(e) {}
      }

      playCoin(streakStep = 0, multiplier = 1, isStar = false) {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          if (isStar) {
            // High sparkling gold star arpeggio chime (+50)
            const freqs = [880, 1108.73, 1318.51, 1760, 2217.46]; // A5, C#6, E6, A6, C#7
            freqs.forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              const nStart = t + idx * 0.035;
              osc.frequency.setValueAtTime(freq, nStart);
              gain.gain.setValueAtTime(0.18, nStart);
              gain.gain.exponentialRampToValueAtTime(0.001, nStart + 0.18);
              osc.connect(gain);
              gain.connect(this.sfxGain);
              osc.start(nStart);
              osc.stop(nStart + 0.2);
            });
            return;
          }

          // Pentatonic scale with octave escalation for satisfying consecutive pickups
          const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0];
          const stepIndex = Math.min(scale.length - 1, Math.max(0, streakStep));
          const f1 = scale[stepIndex];
          const f2 = f1 * 1.5; // Perfect 5th harmonic

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(f1, t);
          gain1.gain.setValueAtTime(0.15, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.1);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(f2, t + 0.03);
          gain2.gain.setValueAtTime(0.18, t + 0.03);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t + 0.03);
          osc2.stop(t + 0.15);
        } catch(e) {}
      }

      playPowerUp() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [440, 554.37, 659.25, 880, 1108.73]; // A major rising flourish
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const noteStart = t + idx * 0.04;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.2, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.16);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.18);
          });
        } catch(e) {}
      }

      playShieldBreak() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          // Glass shattering metallic burst
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(980, t);
          osc1.frequency.exponentialRampToValueAtTime(140, t + 0.22);
          gain1.gain.setValueAtTime(0.28, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.25);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1600, t);
          osc2.frequency.exponentialRampToValueAtTime(300, t + 0.18);
          gain2.gain.setValueAtTime(0.22, t);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t);
          osc2.stop(t + 0.21);
        } catch(e) {}
      }

      playMilestone() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [587.33, 739.99, 880, 1174.66]; // D, F#, A, D
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const noteStart = t + idx * 0.05;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.18, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.22);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.24);
          });
        } catch(e) {}
      }

      playBestRecord() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98]; // Celebratory fanfare
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const noteStart = t + idx * 0.045;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.22, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.25);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.28);
          });
        } catch(e) {}
      }

      // Enhanced Near Miss SFX (punchy whoosh + high crystalline chime)
      playNearMiss() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          // Punchy dynamic whoosh
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(320, t);
          osc1.frequency.exponentialRampToValueAtTime(70, t + 0.14);
          gain1.gain.setValueAtTime(0.24, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.16);

          // Brilliant high crystal chime
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1400, t);
          osc2.frequency.exponentialRampToValueAtTime(2800, t + 0.06);
          osc2.frequency.exponentialRampToValueAtTime(1200, t + 0.16);
          gain2.gain.setValueAtTime(0.22, t);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t);
          osc2.stop(t + 0.19);
        } catch(e) {}
      }

      playTutorialChime() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, t);
          osc.frequency.setValueAtTime(880, t + 0.08);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.24);
        } catch(e) {}
      }

      playSpeedUp() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const noteStart = t + idx * 0.045;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.14, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.12);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.13);
          });
        } catch(e) {}
      }
    }

    const sound = new SoundFx();

    // --- Speed Tiers & Visual Themes ---
    const SPEED_TIERS = [
      {
        minMeters: 0,
        name: 'NORMAL',
        bannerTitle: 'TIER 1 ― DAYLIGHT',
        bpm: 118,
        accent: '#0284c7',
        bgTop: '#f8fafc',
        bgBottom: '#e0f2fe',
        trackTone: '#f1f5f9',
        trackLine: '#0f172a',
        hatchLine: 'rgba(203, 213, 225, 0.45)',
        textColor: '#0f172a',
        pattern: 'day'
      },
      {
        minMeters: 400,
        name: 'FAST',
        bannerTitle: 'TIER 2 ― SUNSET',
        bpm: 132,
        accent: '#ea580c',
        bgTop: '#fff7ed',
        bgBottom: '#fed7aa',
        trackTone: '#ffedd5',
        trackLine: '#7c2d12',
        hatchLine: 'rgba(251, 146, 60, 0.35)',
        textColor: '#0f172a',
        pattern: 'sunset'
      },
      {
        minMeters: 900,
        name: 'TURBO',
        bannerTitle: 'TIER 3 ― NEON NIGHT',
        bpm: 148,
        accent: '#c084fc',
        bgTop: '#09090b',
        bgBottom: '#2e1065',
        trackTone: '#180b2e',
        trackLine: '#a855f7',
        hatchLine: 'rgba(168, 85, 247, 0.35)',
        textColor: '#f8fafc',
        pattern: 'neon'
      },
      {
        minMeters: 1500,
        name: 'HYPER',
        bannerTitle: 'TIER 4 ― CRITICAL RED',
        bpm: 165,
        accent: '#ef4444',
        bgTop: '#180404',
        bgBottom: '#450a0a',
        trackTone: '#2b0b0b',
        trackLine: '#dc2626',
        hatchLine: 'rgba(239, 68, 68, 0.4)',
        textColor: '#ffffff',
        pattern: 'critical'
      }
    ];

    let currentTierIndex = 0;
    let prevTierIndex = 0;
    let tierTransitionTimer = 0;
    const TIER_TRANSITION_DURATION = 1.0; // 1-second color blend on tier change

    function hexToRgb(hex) {
      if (!hex || hex[0] !== '#') return [0, 0, 0];
      let h = hex.slice(1);
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgbToHex(r, g, b) {
      const clamp = v => Math.round(Math.max(0, Math.min(255, v)));
      return '#' + [clamp(r), clamp(g), clamp(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function lerpColor(c1, c2, t) {
      if (!c1 || !c2) return c2 || '#000000';
      const [r1, g1, b1] = hexToRgb(c1);
      const [r2, g2, b2] = hexToRgb(c2);
      return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);
    }

    function getActivePalette() {
      const curr = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];
      if (tierTransitionTimer <= 0) {
        return {
          accent: curr.accent,
          bgTop: curr.bgTop,
          bgBottom: curr.bgBottom,
          trackTone: curr.trackTone,
          trackLine: curr.trackLine,
          hatchLine: curr.hatchLine,
          textColor: curr.textColor,
          patternPrev: null,
          patternCurr: curr.pattern,
          blendT: 1.0
        };
      }
      const prev = SPEED_TIERS[prevTierIndex] || SPEED_TIERS[0];
      const blendT = 1.0 - (tierTransitionTimer / TIER_TRANSITION_DURATION);
      return {
        accent: lerpColor(prev.accent, curr.accent, blendT),
        bgTop: lerpColor(prev.bgTop, curr.bgTop, blendT),
        bgBottom: lerpColor(prev.bgBottom, curr.bgBottom, blendT),
        trackTone: lerpColor(prev.trackTone, curr.trackTone, blendT),
        trackLine: lerpColor(prev.trackLine, curr.trackLine, blendT),
        hatchLine: blendT > 0.5 ? curr.hatchLine : prev.hatchLine,
        textColor: lerpColor(prev.textColor, curr.textColor, blendT),
        patternPrev: prev.pattern,
        patternCurr: curr.pattern,
        blendT: blendT
      };
    }

    // --- Canvas & Responsive Scaling ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    let dpr = 1;
    let renderScale = 1;
    const MIN_VIRTUAL_W = 800;
    const MIN_VIRTUAL_H = 500;
    let virtualW = MIN_VIRTUAL_W;
    let virtualH = MIN_VIRTUAL_H;
    let playerInitialized = false;
    let isPortrait = false;

    // Track vertical bounds (in virtual coordinates)
    const TRACK_HEIGHT = 300;
    let trackCenterY = 250;
    let ceilingY = 100;
    let floorY = 400;

    function handleResize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvasWidth = w;
      canvasHeight = h;
      isPortrait = (h > w);

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      // Always guarantee at least 800px virtual width for gameplay visibility
      renderScale = Math.min((w * dpr) / MIN_VIRTUAL_W, (h * dpr) / MIN_VIRTUAL_H);
      if (renderScale <= 0) renderScale = 1;

      virtualW = (w * dpr) / renderScale;
      virtualH = (h * dpr) / renderScale;

      trackCenterY = virtualH / 2;
      ceilingY = trackCenterY - (TRACK_HEIGHT / 2);
      floorY = trackCenterY + (TRACK_HEIGHT / 2);

      if (playerInitialized && player && player.isGrounded) {
        player.y = (player.groundedSurface === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      }
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    handleResize();

    // --- High Score Persistence (Score-based with backwards compatibility) ---
    const STORAGE_KEY = 'gravity_runner_best_score';
    const BEST_DISTANCE_KEY = 'gravity_runner_best_distance';
    const TUTORIAL_STORAGE_KEY = 'gravity_runner_tutorial_done';

    function getStoredBestScore() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null && saved !== '') {
          const val = parseInt(saved, 10);
          return (!isNaN(val) && val > 0) ? val : 0;
        }
      } catch(e) {}
      return 0;
    }

    function getStoredBestDistance() {
      try {
        const saved = localStorage.getItem(BEST_DISTANCE_KEY);
        if (saved !== null && saved !== '') {
          const val = parseFloat(saved);
          return (!isNaN(val) && val > 0) ? val : 0;
        }
      } catch(e) {}
      return 0;
    }

    function isTutorialCompleted() {
      try {
        return localStorage.getItem(TUTORIAL_STORAGE_KEY) === 'true';
      } catch(e) {
        return false;
      }
    }

    let bestScore = getStoredBestScore();
    let bestDistance = getStoredBestDistance();
    let bestLineCrossed = false;
    let lastDeathCause = '';

    // --- Milestone & Consecutive Pickups Tracking ---
    let nextMilestone = 250;
    let milestoneBanner = null; // { text, bonus, timer, maxTimer }
    let coinStreak = 0;
    let coinStreakTimer = 0;

    // --- Power-ups System State ---
    let powerUps = [];
    let magnetTimer = 0;
    let lastPowerUpSpawnDist = 0;
    let totalObstaclesSpawned = 0;
    let totalPowerUpsSpawned = 0;

    // --- Tutorial System State ---
    let isTutorialActive = false;
    let tutorialStep = 0; // 1: Tap to flip, 2: Float until landing, 3: Collect coins, 4: Near miss
    let tutorialStepTimer = 0;
    let forceTutorial = false;
    let tutorialObstacleSpawned = false;

    function completeTutorial() {
      if (!isTutorialActive) return;
      isTutorialActive = false;
      tutorialStep = 0;
      tutorialStepTimer = 0;
      try {
        localStorage.setItem(TUTORIAL_STORAGE_KEY, 'true');
      } catch(e) {}
      sound.playSpeedUp();
      spawnPopupText(virtualW / 2, trackCenterY, 'チュートリアル完了！ START!', '#10b981', 18, true);
      nextSpawnX = Math.max(nextSpawnX, virtualW + 200);
    }

    function advanceTutorialToStep4() {
      if (!isTutorialActive || tutorialStep !== 3) return;
      tutorialStep = 4;
      tutorialStepTimer = 0;
      sound.playTutorialChime();
      if (!tutorialObstacleSpawned) {
        const obsX = player.x + 420;
        const obs = new Obstacle({ surface: 'floor', type: 'block', x: obsX, w: 34, h: 36 });
        obs.isTutorial = true;
        obstacles.push(obs);
        spawnCoinArc(obsX - currentSpeed * 0.28, 'floor', 'ceiling', 5);
        tutorialObstacleSpawned = true;
      }
    }

    // --- Game State & Metrics ---
    let state = 'title'; // 'title' | 'playing' | 'gameover'
    let gameScore = 0;
    let scoreMeters = 0;
    let coinsCollected = 0;
    let nearMissCount = 0;
    let comboCount = 0;
    let comboMultiplier = 1;
    let comboTimer = 0;
    let maxCombo = 0;
    let isNewBest = false;
    let gameOverTimer = 0;
    let startInputLockTimer = 0;
    let gameTime = 0;
    const GAME_OVER_INPUT_LOCK = 0.6; // 0.6s input lock after game over

    // Juice timers
    let hitStopTimer = 0;
    let slowMotionTimer = 0; // 0.15s slow-motion on near miss
    let screenShake = { timer: 0, duration: 0, intensity: 0 };
    let speedUpBanner = { active: false, timer: 0, title: '', accent: '#0284c7' };

    function addScreenShake(intensity, duration) {
      screenShake.intensity = Math.max(screenShake.intensity, intensity);
      screenShake.duration = Math.max(screenShake.duration, duration);
      screenShake.timer = Math.max(screenShake.timer, duration);
    }

    function getComboMultiplier(combo) {
      if (combo >= 4) return 5;
      if (combo === 3) return 3;
      if (combo === 2) return 2;
      return 1;
    }

    // Speed configuration
    const SPEED_INITIAL = 270; // px/s
    const SPEED_MAX = 560;     // px/s
    const SPEED_RAMP_METERS = 1400;
    let currentSpeed = SPEED_INITIAL;

    // Physics parameters (soft floaty gravity)
    const GRAVITY_ACCEL = 1000; // px/s^2
    const MAX_VERTICAL_SPEED = 680;
    const FIGURE_HALF_HEIGHT = 21;
    const PLAYER_X = 84;
    const FLIP_BUFFER_WINDOW = 0.12; // 0.12s input buffer window before landing

    // --- Autopilot AI Player (?bot=1 or window.__game.autopilot) ---
    const urlParams = new URLSearchParams(window.location.search);
    let autopilot = (urlParams.get('bot') === '1');
    let autopilotActionCooldown = 0;

    function updateAutopilot(dt) {
      if (!autopilot) return;

      autopilotActionCooldown = Math.max(0, autopilotActionCooldown - dt);

      if (state === 'title') {
        if (autopilotActionCooldown <= 0) {
          autopilotActionCooldown = 0.5;
          startGame();
        }
        return;
      }

      if (state === 'gameover') {
        if (gameOverTimer >= GAME_OVER_INPUT_LOCK + 0.3 && autopilotActionCooldown <= 0) {
          autopilotActionCooldown = 0.5;
          startGame();
        }
        return;
      }

      if (state !== 'playing' || !player.isGrounded) return;

      const surf = player.groundedSurface; // 'floor' | 'ceiling'
      const otherSurf = (surf === 'floor') ? 'ceiling' : 'floor';
      const transitTime = 0.7194;
      const transitDist = currentSpeed * transitTime;

      // 1. Tutorial automated progression
      if (isTutorialActive) {
        if (tutorialStep === 1) {
          if (tutorialStepTimer >= 0.3 && autopilotActionCooldown <= 0) {
            autopilotActionCooldown = 0.4;
            player.flip();
          }
          return;
        } else if (tutorialStep === 2) {
          return; // Wait to land on ceiling
        } else if (tutorialStep === 3) {
          const nearestCoin = coins.find(c => !c.collected && c.x > player.x);
          if (nearestCoin && nearestCoin.x - player.x <= transitDist * 0.75 && autopilotActionCooldown <= 0) {
            autopilotActionCooldown = 0.5;
            player.flip();
          }
          return;
        } else if (tutorialStep === 4) {
          const obs = obstacles.find(o => o.x + o.w > player.x);
          if (obs) {
            const dist = obs.x - player.x;
            if (dist <= currentSpeed * 0.36 && autopilotActionCooldown <= 0) {
              autopilotActionCooldown = 0.5;
              player.flip();
            }
          }
          return;
        }
      }

      // 2. Comprehensive Trajectory Safety Simulation:
      // Checks if flipping NOW would cause collision during transit, on landing, or for 0.45s after landing.
      function isSafeToFlip() {
        const totalSimTime = transitTime + 0.45;
        const steps = 12;

        for (let i = 1; i <= steps; i++) {
          const t = (i / steps) * totalSimTime;
          const tRatio = Math.min(1.0, t / transitTime);
          const simY = (t <= transitTime)
            ? getFlipTrajectoryY(surf, tRatio)
            : ((otherSurf === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT));

          const simHitbox = {
            x: player.x - 12,
            y: simY - FIGURE_HALF_HEIGHT + 3,
            w: 24,
            h: FIGURE_HALF_HEIGHT * 2 - 6
          };

          for (const obs of obstacles) {
            const simObsX = obs.x - currentSpeed * t;
            if (simObsX + obs.w < simHitbox.x - 20 || simObsX > simHitbox.x + simHitbox.w + 20) {
              continue;
            }

            let simObsY = 0;
            if (obs.surface === 'floor') {
              simObsY = floorY - obs.h;
            } else if (obs.surface === 'ceiling') {
              simObsY = ceilingY;
            } else {
              simObsY = obs.baseY + Math.sin((gameTime + t) * obs.speedFactor + obs.phase) * obs.amplitude - (obs.h / 2);
            }

            const margin = 8;
            if (
              simHitbox.x < simObsX + obs.w + margin &&
              simHitbox.x + simHitbox.w > simObsX - margin &&
              simHitbox.y < simObsY + obs.h + margin &&
              simHitbox.y + simHitbox.h > simObsY - margin
            ) {
              return false; // Collision risk along simulated trajectory!
            }
          }
        }
        return true;
      }

      // 3. Find immediate danger on CURRENT surface
      const threat = obstacles.find(o => {
        if (o.x + o.w <= player.x - 5) return false;
        if (o.surface === surf) return true;
        if (o.surface === 'moving') {
          const oy = o.getY();
          const targetY = (surf === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
          return Math.abs(oy + o.h / 2 - targetY) < 70;
        }
        return false;
      });

      if (threat) {
        const timeToHit = (threat.x - (player.x + 13)) / currentSpeed;

        // Approaching danger on current surface: react with ample safety margin (0.58s)
        if (timeToHit <= 0.58 && autopilotActionCooldown <= 0) {
          if (isSafeToFlip() || timeToHit <= 0.22) {
            autopilotActionCooldown = 0.35;
            player.flip();
            return;
          }
        }
      }

      // 4. Safe Opportunistic Flip for Power-ups, Gold Stars, and Aerial Coins
      // Only flip when current surface is completely clear of threats for at least 1.35 seconds!
      const isCurrentSurfaceClear = !threat || ((threat.x - player.x) / currentSpeed > 1.35);

      if (isCurrentSurfaceClear && autopilotActionCooldown <= 0) {
        // (a) Target aerial Power-ups (Shield, Magnet)
        const powerUpAhead = powerUps.find(p => !p.collected && p.x > player.x + 20 && p.x < player.x + transitDist + 70);
        if (powerUpAhead && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }

        // (b) Target high-value Gold Stars (+50)
        const starAhead = coins.find(c => !c.collected && c.type === 'star' && c.x > player.x + 30 && c.x < player.x + transitDist + 50);
        if (starAhead && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }

        // (c) Target aerial Coin arcs if safe and profitable
        const coinsAhead = coins.filter(c => !c.collected && c.x >= player.x + 40 && c.x <= player.x + transitDist + 40);
        if (coinsAhead.length >= 2 && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }
      }
    }

    // --- Player Object ---
    const player = {
      x: PLAYER_X,
      y: 0,
      vy: 0,
      gravityDir: 1, // 1: towards floor, -1: towards ceiling
      isGrounded: true,
      rotation: 0,   // radians
      animPhase: 0,
      groundedSurface: 'floor', // 'floor' | 'ceiling'
      ghostTrails: [],
      flipBufferTimer: 0,
      squashTimer: 0,
      hasShield: false,
      invincibleTimer: 0,

      reset() {
        this.x = PLAYER_X;
        this.gravityDir = 1;
        this.isGrounded = true;
        this.groundedSurface = 'floor';
        this.y = floorY - FIGURE_HALF_HEIGHT;
        this.vy = 0;
        this.rotation = 0;
        this.animPhase = 0;
        this.ghostTrails = [];
        this.flipBufferTimer = 0;
        this.squashTimer = 0;
        this.hasShield = false;
        this.invincibleTimer = 0;
      },

      flip() {
        if (startInputLockTimer > 0) return false;
        if (!this.isGrounded) {
          // Responsive input buffer: tap arrives up to 0.12s before landing
          this.flipBufferTimer = FLIP_BUFFER_WINDOW;
          return false;
        }
        this.flipBufferTimer = 0;
        this.isGrounded = false;
        this.gravityDir = -this.gravityDir;
        this.vy = 0;
        this.squashTimer = 0;
        sound.playFlip(this.gravityDir === -1);

        // Juice: Minor screen shake and extra trails on flip
        addScreenShake(3.2, 0.12);
        for (let i = 0; i < 3; i++) {
          this.ghostTrails.push({
            x: this.x - i * 6,
            y: this.y,
            rotation: this.rotation,
            alpha: 0.5 - i * 0.12,
            phase: this.animPhase
          });
        }

        // Spawn takeoff dust particles
        spawnDustBurst(this.x, this.y + (this.gravityDir === -1 ? FIGURE_HALF_HEIGHT : -FIGURE_HALF_HEIGHT), 8, -this.gravityDir);

        // Tutorial step 1 progression
        if (isTutorialActive && tutorialStep === 1) {
          tutorialStep = 2;
          tutorialStepTimer = 0;
          sound.playTutorialChime();
        }
        return true;
      },

      update(dt) {
        this.x = PLAYER_X;

        // Running gait animation speed tied to game speed
        if (this.isGrounded) {
          const runFrequency = (currentSpeed / 270) * 16;
          this.animPhase += runFrequency * dt;
        }

        // Squash & invincibility countdown
        if (this.squashTimer > 0) {
          this.squashTimer = Math.max(0, this.squashTimer - dt);
        }
        if (this.invincibleTimer > 0) {
          this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
        }

        const floorCenterY = floorY - FIGURE_HALF_HEIGHT;
        const ceilingCenterY = ceilingY + FIGURE_HALF_HEIGHT;
        const totalTravel = floorCenterY - ceilingCenterY;

        if (!this.isGrounded) {
          // Accelerate gently toward target surface
          this.vy += GRAVITY_ACCEL * this.gravityDir * dt;
          if (Math.abs(this.vy) > MAX_VERTICAL_SPEED) {
            this.vy = Math.sign(this.vy) * MAX_VERTICAL_SPEED;
          }
          this.y += this.vy * dt;

          // Ghost trail record during transit
          if (Math.random() < 0.5) {
            this.ghostTrails.push({
              x: this.x,
              y: this.y,
              rotation: this.rotation,
              alpha: 0.4,
              phase: this.animPhase
            });
          }

          // Check landing on floor
          if (this.gravityDir === 1 && this.y >= floorCenterY) {
            this.y = floorCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'floor';
            this.rotation = 0;
            this.squashTimer = 0.16;
            sound.playLand();
            spawnDustBurst(this.x, floorY, 6, -1);

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }
          // Check landing on ceiling
          else if (this.gravityDir === -1 && this.y <= ceilingCenterY) {
            this.y = ceilingCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'ceiling';
            this.rotation = Math.PI;
            this.squashTimer = 0.16;
            sound.playLand();
            spawnDustBurst(this.x, ceilingY, 6, 1);

            // Tutorial Step 2 progression
            if (isTutorialActive && tutorialStep === 2) {
              tutorialStep = 3;
              tutorialStepTimer = 0;
              sound.playTutorialChime();
              spawnCoinArc(this.x + 130, 'ceiling', 'floor', 6);
            }

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }

          // In-flight countdown of input buffer window
          if (!this.isGrounded && this.flipBufferTimer > 0) {
            this.flipBufferTimer = Math.max(0, this.flipBufferTimer - dt);
          }

          // Smooth 180° rotation while in transit
          if (!this.isGrounded) {
            if (this.gravityDir === -1) {
              const p = Math.max(0, Math.min(1, (floorCenterY - this.y) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = ease * Math.PI;
            } else {
              const p = Math.max(0, Math.min(1, (this.y - ceilingCenterY) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = Math.PI + ease * Math.PI;
            }
          }
        } else {
          // Grounded
          if (this.groundedSurface === 'floor') {
            this.y = floorCenterY;
            this.rotation = 0;
          } else {
            this.y = ceilingCenterY;
            this.rotation = Math.PI;
          }
          this.vy = 0;
        }

        // Update ghost trails
        for (let i = this.ghostTrails.length - 1; i >= 0; i--) {
          this.ghostTrails[i].alpha -= dt * 2.4;
          this.ghostTrails[i].x -= currentSpeed * dt * 0.45;
          if (this.ghostTrails[i].alpha <= 0) {
            this.ghostTrails.splice(i, 1);
          }
        }
      },

      getHitbox() {
        return {
          x: this.x - 7,
          y: this.y - 17,
          w: 14,
          h: 34
        };
      }
    };
    playerInitialized = true;

    // --- Particle & Floating Popup Systems ---
    let particles = [];
    let deathDebris = [];
    let popupTexts = [];

    function spawnDustBurst(x, y, count, normalY) {
      for (let i = 0; i < count; i++) {
        const angle = normalY > 0 ? (Math.PI * 0.2 + Math.random() * Math.PI * 0.6) : (-Math.PI * 0.2 - Math.random() * Math.PI * 0.6);
        const spd = 40 + Math.random() * 80;
        particles.push({
          type: 'dust',
          x: x + (Math.random() - 0.5) * 10,
          y: y,
          vx: Math.cos(angle) * spd - currentSpeed * 0.3,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 2.5,
          alpha: 0.8,
          life: 0.3 + Math.random() * 0.25
        });
      }
    }

    function spawnCoinSparkles(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 50 + Math.random() * 110;
        particles.push({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 2.5,
          color: Math.random() < 0.5 ? '#f59e0b' : '#fbbf24',
          alpha: 1.0,
          life: 0.35 + Math.random() * 0.2
        });
      }
    }

    function spawnNearMissSparkles(x, y) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 90 + Math.random() * 160;
        particles.push({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 3.0,
          color: Math.random() < 0.5 ? '#38bdf8' : '#0284c7',
          alpha: 1.0,
          life: 0.35 + Math.random() * 0.25
        });
      }
    }

    function spawnPopupText(x, y, text, color = '#0284c7', fontSize = 14, isBold = true) {
      popupTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        fontSize: fontSize,
        isBold: isBold,
        vy: -40,
        alpha: 1.0,
        life: 0.85
      });
    }

    function spawnShieldBreakParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 70 + Math.random() * 180;
        particles.push({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 3.5,
          color: Math.random() < 0.5 ? '#38bdf8' : (Math.random() < 0.5 ? '#bae6fd' : '#ffffff'),
          alpha: 1.0,
          life: 0.4 + Math.random() * 0.3
        });
      }
      particles.push({
        type: 'shockwave',
        x: x,
        y: y,
        r: 8,
        maxR: 45,
        alpha: 0.8,
        life: 0.3
      });
    }

    function createDeathExplosion(p) {
      deathDebris = [];
      const segments = [
        { type: 'head', x: 0, y: -20, r: 6 },
        { type: 'torso', x1: 0, y1: -14, x2: 0, y2: 2 },
        { type: 'arm1', x1: 0, y1: -12, x2: -8, y2: -4 },
        { type: 'arm2', x1: 0, y1: -12, x2: 8, y2: -4 },
        { type: 'leg1', x1: 0, y1: 2, x2: -7, y2: 18 },
        { type: 'leg2', x1: 0, y1: 2, x2: 7, y2: 18 },
        { type: 'scarf', x1: -2, y1: -14, x2: -18, y2: -14 }
      ];

      for (const seg of segments) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 90 + Math.random() * 200;
        deathDebris.push({
          ...seg,
          originX: p.x,
          originY: p.y,
          rot: p.rotation,
          rotSpeed: (Math.random() - 0.5) * 14,
          vx: Math.cos(angle) * spd - 40,
          vy: Math.sin(angle) * spd,
          alpha: 1.0
        });
      }

      particles.push({
        type: 'shockwave',
        x: p.x,
        y: p.y,
        r: 10,
        maxR: 55,
        alpha: 0.9,
        life: 0.4
      });
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life -= dt;
        if (pt.type === 'shockwave') {
          pt.r += (pt.maxR - pt.r) * 12 * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        } else {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        }
        if (pt.life <= 0 || pt.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = deathDebris.length - 1; i >= 0; i--) {
        const d = deathDebris[i];
        d.originX += d.vx * dt;
        d.originY += d.vy * dt;
        d.rot += d.rotSpeed * dt;
        d.alpha -= dt * 0.6;
        if (d.alpha <= 0) {
          deathDebris.splice(i, 1);
        }
      }

      for (let i = popupTexts.length - 1; i >= 0; i--) {
        const pt = popupTexts[i];
        pt.y += pt.vy * dt;
        pt.life -= dt;
        pt.alpha = Math.max(0, pt.life / 0.85);
        if (pt.life <= 0) {
          popupTexts.splice(i, 1);
        }
      }
    }

    // --- Coins & Aerial Arc Trajectories ---
    let coins = [];

    class Coin {
      constructor(x, y, type = 'coin') {
        this.x = x;
        this.y = y;
        this.type = type; // 'coin' (normal aerial: 10), 'low' (runway: 5), 'star' (gold star: 50)
        this.value = (type === 'star') ? 50 : (type === 'low' ? 5 : 10);
        this.r = (type === 'star') ? 11 : (type === 'low' ? 7 : 8.5);
        this.collected = false;
        this.animPhase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.x -= currentSpeed * dt;
        this.animPhase += dt * (this.type === 'star' ? 4.5 : 5.5);

        // Magnet suction effect toward player
        if (magnetTimer > 0 && !this.collected) {
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 260) {
            const pullSpeed = Math.max(340, 850 * (1 - dist / 260));
            this.x += (dx / dist) * pullSpeed * dt;
            this.y += (dy / dist) * pullSpeed * dt;
          }
        }
      }

      render(ctx) {
        if (this.collected) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.type === 'star') {
          // Sparkling 5-point Gold Star (+50)
          const rot = this.animPhase * 1.5;
          ctx.rotate(rot);

          // Star outer glow
          ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 7, 0, Math.PI * 2);
          ctx.fill();

          // 5-point star geometry
          ctx.fillStyle = '#fbbf24';
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          const outerR = this.r;
          const innerR = this.r * 0.44;
          for (let i = 0; i < 10; i++) {
            const r = (i % 2 === 0) ? outerR : innerR;
            const a = (i * Math.PI) / 5 - Math.PI / 2;
            const sx = Math.cos(a) * r;
            const sy = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner gleam
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'low') {
          // Low-point runway coin (+5)
          const wScale = Math.abs(Math.sin(this.animPhase));
          const coinW = Math.max(2, this.r * wScale);

          ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW + 1, this.r + 1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fcd34d';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW, this.r, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Standard Aerial Coin (+10)
          const wScale = Math.abs(Math.sin(this.animPhase));
          const coinW = Math.max(2, this.r * wScale);

          ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW + 1, this.r + 1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW, this.r, 0, 0, Math.PI * 2);
          ctx.fill();

          if (wScale > 0.35) {
            ctx.fillStyle = '#fffbeb';
            ctx.beginPath();
            ctx.ellipse(0, 0, Math.max(1, 2 * wScale), 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      collidesWith(hitbox) {
        if (this.collected) return false;
        // Expanded forgiving collection radius
        const closestX = Math.max(hitbox.x, Math.min(this.x, hitbox.x + hitbox.w));
        const closestY = Math.max(hitbox.y, Math.min(this.y, hitbox.y + hitbox.h));
        const dx = this.x - closestX;
        const dy = this.y - closestY;
        return (dx * dx + dy * dy) < (this.r + 14) * (this.r + 14);
      }
    }

    // --- Power-ups System (Shield & Magnet, Aerial Only) ---
    class PowerUp {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'shield' | 'magnet'
        this.r = 15;
        this.collected = false;
        this.animPhase = Math.random() * Math.PI * 2;
        totalPowerUpsSpawned++;
      }

      update(dt) {
        this.x -= currentSpeed * dt;
        this.animPhase += dt * 3.5;
      }

      render(ctx) {
        if (this.collected) return;
        const bounceY = this.y + Math.sin(this.animPhase) * 4;
        ctx.save();
        ctx.translate(this.x, bounceY);

        const isShield = (this.type === 'shield');
        const auraColor = isShield ? 'rgba(56, 189, 248, 0.35)' : 'rgba(239, 68, 68, 0.35)';
        const ringColor = isShield ? '#0284c7' : '#dc2626';

        // Outer pulsing aura
        ctx.fillStyle = auraColor;
        ctx.beginPath();
        ctx.arc(0, 0, this.r + 6, 0, Math.PI * 2);
        ctx.fill();

        // Round capsule badge
        ctx.fillStyle = isShield ? '#e0f2fe' : '#fee2e2';
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (isShield) {
          // Shield crest icon
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.moveTo(0, -9);
          ctx.lineTo(8, -6);
          ctx.lineTo(6, 4);
          ctx.lineTo(0, 9);
          ctx.lineTo(-6, 4);
          ctx.lineTo(-8, -6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#bae6fd';
          ctx.beginPath();
          ctx.moveTo(0, -7);
          ctx.lineTo(5, -5);
          ctx.lineTo(4, 2);
          ctx.lineTo(0, 6);
          ctx.closePath();
          ctx.fill();
        } else {
          // Magnet U-shape icon
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(0, -2, 8, Math.PI, 0, false);
          ctx.lineTo(8, 6);
          ctx.lineTo(4, 6);
          ctx.lineTo(4, -2);
          ctx.arc(0, -2, 4, 0, Math.PI, true);
          ctx.lineTo(-4, 6);
          ctx.lineTo(-8, 6);
          ctx.closePath();
          ctx.fill();

          // Silver contact tips
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-8, 3, 4, 4);
          ctx.fillRect(4, 3, 4, 4);
        }

        ctx.restore();
      }

      collidesWith(hitbox) {
        if (this.collected) return false;
        const closestX = Math.max(hitbox.x, Math.min(this.x, hitbox.x + hitbox.w));
        const closestY = Math.max(hitbox.y, Math.min(this.y, hitbox.y + hitbox.h));
        const dx = this.x - closestX;
        const dy = this.y - closestY;
        return (dx * dx + dy * dy) < (this.r + 15) * (this.r + 15);
      }
    }

    // Trajectory calculation using true physical acceleration & max vertical speed
    function getFlipTrajectoryY(fromSurface, tRatio) {
      const isFromFloor = (fromSurface === 'floor');
      const startY = isFromFloor ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      const dir = isFromFloor ? -1 : 1;
      const totalT = 0.7194; // Total transit duration (0.68s accel + 0.0394s at max speed)
      const t = Math.max(0, Math.min(totalT, tRatio * totalT));
      let dy = 0;
      if (t <= 0.68) {
        dy = 0.5 * GRAVITY_ACCEL * t * t;
      } else {
        dy = 231.2 + MAX_VERTICAL_SPEED * (t - 0.68);
      }
      return startY + dir * Math.min(258, dy);
    }

    function spawnCoinArc(startX, fromSurface, toSurface, count = 5) {
      const transitDist = currentSpeed * 0.7194;
      for (let i = 0; i < count; i++) {
        const tRatio = (i + 1) / (count + 1);
        const cx = startX + tRatio * transitDist;
        const cy = getFlipTrajectoryY(fromSurface, tRatio);
        coins.push(new Coin(cx, cy, 'coin'));
      }
    }

    function spawnRunwayCoins(startX, surface, count = 3, type = 'low') {
      const cy = (surface === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      for (let i = 0; i < count; i++) {
        coins.push(new Coin(startX + i * 36, cy, type));
      }
    }

    function spawnGoldStar(x, y) {
      coins.push(new Coin(x, y, 'star'));
    }

    function maybeSpawnPowerUp(spawnX) {
      if (scoreMeters - lastPowerUpSpawnDist >= 440 + Math.random() * 80) {
        // Only in aerial space (between floor and ceiling)
        const airY = trackCenterY + (Math.random() < 0.5 ? -35 : 35);
        const type = (!player.hasShield && Math.random() < 0.6) ? 'shield' : 'magnet';
        powerUps.push(new PowerUp(spawnX, airY, type));
        lastPowerUpSpawnDist = scoreMeters;
      }
    }

    function updateCoins(dt) {
      // Countdown streak timer
      if (coinStreakTimer > 0) {
        coinStreakTimer -= dt;
        if (coinStreakTimer <= 0) {
          coinStreak = 0;
        }
      }

      const hitbox = player.getHitbox();

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.update(dt);

        if (state === 'playing' && !c.collected && c.collidesWith(hitbox)) {
          c.collected = true;
          coinsCollected++;

          // Consecutive pickup chain pitch elevation
          if (coinStreakTimer > 0) {
            coinStreak++;
          } else {
            coinStreak = 0;
          }
          coinStreakTimer = 0.85;

          // Combo progression
          comboCount++;
          comboMultiplier = getComboMultiplier(comboCount);
          comboTimer = 2.0; // Reset landing timer
          maxCombo = Math.max(maxCombo, comboCount);

          const isStar = (c.type === 'star');
          const baseGain = c.value;
          const gain = baseGain * comboMultiplier;
          gameScore += gain;

          sound.playCoin(coinStreak, comboMultiplier, isStar);

          if (isStar) {
            spawnNearMissSparkles(c.x, c.y);
            spawnPopupText(c.x, c.y - 16, `★ GOLD STAR! +${gain}`, '#f59e0b', 15, true);
          } else {
            spawnCoinSparkles(c.x, c.y);
            spawnPopupText(c.x, c.y - 12, `+${gain}`, c.type === 'low' ? '#fcd34d' : '#f59e0b', 13, true);
          }

          // Tutorial Step 3 progression
          if (isTutorialActive && tutorialStep === 3) {
            advanceTutorialToStep4();
          }
        }

        if (c.x < -60 || c.collected) {
          coins.splice(i, 1);
        }
      }
    }

    function updatePowerUps(dt) {
      if (magnetTimer > 0) {
        magnetTimer = Math.max(0, magnetTimer - dt);
      }

      const hitbox = player.getHitbox();

      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.update(dt);

        if (state === 'playing' && !p.collected && p.collidesWith(hitbox)) {
          p.collected = true;
          sound.playPowerUp();

          if (p.type === 'shield') {
            player.hasShield = true;
            spawnShieldBreakParticles(p.x, p.y);
            spawnPopupText(p.x, p.y - 18, '🛡️ SHIELD GET! (1被弾無効)', '#38bdf8', 15, true);
          } else if (p.type === 'magnet') {
            magnetTimer = 5.0;
            spawnNearMissSparkles(p.x, p.y);
            spawnPopupText(p.x, p.y - 18, '🧲 MAGNET GET! (5秒吸着)', '#ef4444', 15, true);
          }
        }

        if (p.x < -60 || p.collected) {
          powerUps.splice(i, 1);
        }
      }
    }

    // --- Obstacle Generation & Passable Patterns ---
    let obstacles = [];
    let nextSpawnX = 0;
    let patternIndex = 0;

    class Obstacle {
      constructor(opts) {
        this.surface = opts.surface; // 'floor' | 'ceiling' | 'moving'
        this.type = opts.type;       // 'spike' | 'block' | 'moving'
        this.x = opts.x;
        this.w = opts.w || 36;
        this.h = opts.h || 40;
        this.baseY = opts.baseY || trackCenterY;
        this.amplitude = opts.amplitude || 55;
        this.speedFactor = opts.speedFactor || 3.2;
        this.phase = opts.phase || 0;
        this.nearMissAwarded = false;
        this.isTutorial = !!opts.isTutorial;
        if (!this.isTutorial) {
          totalObstaclesSpawned++;
        }
      }

      getY() {
        if (this.surface === 'floor') {
          return floorY - this.h;
        } else if (this.surface === 'ceiling') {
          return ceilingY;
        } else {
          return this.baseY + Math.sin(gameTime * this.speedFactor + this.phase) * this.amplitude - (this.h / 2);
        }
      }

      collidesWith(hitbox) {
        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        if (this.type === 'block') {
          const hx = ox + 3;
          const hy = oy + 3;
          const hw = ow - 6;
          const hh = oh - 6;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        } else if (this.type === 'spike') {
          const isFloor = (this.surface === 'floor');
          const baseH = oh * 0.42;
          const baseW = ow * 0.65;
          const baseX = ox + (ow - baseW) / 2;
          const baseY = isFloor ? (oy + oh - baseH) : oy;
          if (hitbox.x < baseX + baseW && hitbox.x + hitbox.w > baseX &&
              hitbox.y < baseY + baseH && hitbox.y + hitbox.h > baseY) {
            return true;
          }
          const tipH = oh * 0.58;
          const tipW = ow * 0.32;
          const tipX = ox + (ow - tipW) / 2;
          const tipY = isFloor ? oy : (oy + oh - tipH);
          if (hitbox.x < tipX + tipW && hitbox.x + hitbox.w > tipX &&
              hitbox.y < tipY + tipH && hitbox.y + hitbox.h > tipY) {
            return true;
          }
          return false;
        } else if (this.type === 'moving') {
          const hx = ox + 4;
          const hy = oy + 4;
          const hw = ow - 8;
          const hh = oh - 8;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        }
        return false;
      }

      // NEAR MISS detection: within 14px of obstacle edge without colliding
      checkNearMiss(hitbox) {
        if (this.nearMissAwarded) return false;

        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        let dx = 0;
        if (hitbox.x + hitbox.w < ox) {
          dx = ox - (hitbox.x + hitbox.w);
        } else if (hitbox.x > ox + ow) {
          dx = hitbox.x - (ox + ow);
        }

        let dy = 0;
        if (hitbox.y + hitbox.h < oy) {
          dy = oy - (hitbox.y + hitbox.h);
        } else if (hitbox.y > oy + oh) {
          dy = hitbox.y - (oy + oh);
        }

        if (dx === 0 && dy === 0) return false; // Overlap is handled by collision

        const dist = Math.hypot(dx, dy);
        if (dist <= 14) {
          this.nearMissAwarded = true;
          return true;
        }
        return false;
      }
    }

    function resetObstacles() {
      obstacles = [];
      coins = [];
      powerUps = [];
      magnetTimer = 0;
      nextSpawnX = virtualW + 40;
      patternIndex = 0;
      totalObstaclesSpawned = 0;
      totalPowerUpsSpawned = 0;
    }

    function spawnNextPattern() {
      if (isTutorialActive) return; // Completely obstacle-free during tutorial guided zone

      const transitDist = currentSpeed * 0.7194;
      const isFirst60s = (gameTime < 60 || scoreMeters < 400);
      const isTier3Plus = (currentTierIndex >= 2);

      // Chance to spawn aerial Power-Up in the gap
      maybeSpawnPowerUp(nextSpawnX + transitDist * 0.4);

      let minRunBuffer = Math.max(180, currentSpeed * 0.52);
      if (isFirst60s) {
        minRunBuffer = Math.max(260, currentSpeed * 0.7);
      } else if (isTier3Plus) {
        minRunBuffer = Math.max(110, currentSpeed * 0.32);

      let choices = [0, 1];
      if (!isFirst60s) {
        choices = [0, 1, 2, 3, 4, 5, 6, 7];
        if (scoreMeters >= 450) choices.push(8); // Moving energy hazard
        if (scoreMeters >= 750) choices.push(9); // Zigzag rhythm run
        if (scoreMeters >= 950) choices.push(10); // Narrow tunnel challenge
      } else {
        choices = [0, 1, 2, 3];
      }

      const patternChoice = choices[Math.floor(Math.random() * choices.length)];

          spawnRunwayCoins(nextSpawnX + transitDist + 40, 'ceiling', 3, 'low');
