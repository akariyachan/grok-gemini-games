          spawnGoldStar(gate2X + 19, ceilingY + 56);
          spawnCoinArc(gate2X - currentSpeed * 0.25, 'ceiling', 'floor', 4);

          // Gate 3: Floor short tunnel (Floor block)
          const gate3X = gate2X + gateGap;
          obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: gate3X, w: 38, h: 48 }));
          spawnGoldStar(gate3X + 19, floorY - 56);
          spawnCoinArc(gate3X - currentSpeed * 0.25, 'floor', 'ceiling', 4);

          nextSpawnX = gate3X + transitDist + minRunBuffer + 160;
          break;
        }
      }

      patternIndex++;
    }

    function updateObstacles(dt) {
      if (!isTutorialActive && (gameTime >= 1.5 || state === 'title')) {
        nextSpawnX -= currentSpeed * dt;
        if (nextSpawnX < virtualW + 40) {
          nextSpawnX = virtualW + 40;
        }
        while (nextSpawnX < virtualW + 850) {
          spawnNextPattern();
        }
      }

      const hitbox = player.getHitbox();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= currentSpeed * dt;

        if (state === 'playing') {
          // 1. Collision check
          if (obs.collidesWith(hitbox)) {
            if (obs.isTutorial) {
              // Safe tutorial completion even if player bumps the practice obstacle
              sound.playLand();
              spawnPopupText(player.x, player.y - 10, 'ドンマイ！ 練習完了！', '#f59e0b', 14, true);
              completeTutorial();
            } else {
              // Shield Protection Check: absorb 1 hit + 1s invincibility
              if (player.hasShield) {
                player.hasShield = false;
                player.invincibleTimer = 1.0;
                sound.playShieldBreak();
                spawnShieldBreakParticles(player.x, player.y);
                spawnPopupText(player.x, player.y - 18, '🛡️ SHIELD BROKEN!', '#38bdf8', 15, true);
                addScreenShake(7.5, 0.25);
                continue;
              }
              if (player.invincibleTimer > 0) {
                continue; // Safe during invincibility flicker
              }

              // Determine death cause
              if (obs.type === 'block') {
                lastDeathCause = 'ブロックに激突！';
              } else if (obs.type === 'spike') {
                lastDeathCause = 'トゲに接触！';
              } else if (obs.type === 'moving') {
                lastDeathCause = '動くハザードに接触！';
              } else {
                lastDeathCause = '障害物に衝突！';
              }

              triggerGameOver();
              return;
            }
          }

          // 2. Near Miss check
          if (obs.checkNearMiss(hitbox)) {
            nearMissCount++;
            comboCount++;
            comboMultiplier = getComboMultiplier(comboCount);
            comboTimer = 2.0;
            maxCombo = Math.max(maxCombo, comboCount);

            const bonus = 50 * comboMultiplier;
            gameScore += bonus;

            // Satisfying 0.15s slow-motion (disabled if prefers-reduced-motion)
            slowMotionTimer = prefersReducedMotion ? 0 : 0.15;

            sound.playNearMiss();
            spawnNearMissSparkles(player.x, player.y);
            spawnPopupText(player.x + 24, player.y - 14, `NEAR MISS! +${bonus}`, '#38bdf8', 15, true);

            if (isTutorialActive && tutorialStep === 4) {
              completeTutorial();
            }
          }

          // Tutorial obstacle safe pass completion
          if (isTutorialActive && tutorialStep === 4 && obs.isTutorial && (obs.x + obs.w < player.x)) {
            completeTutorial();
          }
        } else if (state === 'title') {
          // In title demo: near miss triggers visual sparkles, collision does not end game
          if (obs.checkNearMiss(hitbox)) {
            spawnNearMissSparkles(player.x, player.y);
          }
        }

        if (obs.x + obs.w < -140) {
          obstacles.splice(i, 1);
        }
      }
    }

    // --- Background & Speed Lines ---
    let bgScroll = 0;
    const speedLines = [];
    for (let i = 0; i < 28; i++) {
      speedLines.push({
        x: Math.random() * 800,
        y: 100 + Math.random() * 300,
        len: 30 + Math.random() * 70,
        speedFactor: 0.6 + Math.random() * 0.8,
        alpha: 0.1 + Math.random() * 0.15
      });
    }

    function updateBackground(dt) {
      bgScroll = (bgScroll + currentSpeed * dt) % 240;
      for (const line of speedLines) {
        line.x -= currentSpeed * line.speedFactor * dt;
        if (line.x < -line.len) {
          line.x = virtualW + Math.random() * 160;
          line.y = ceilingY + 15 + Math.random() * (trackHeight - 30);
        }
      }
    }

    // --- Game Control Actions ---
    function startGame() {
      sound.init();
      sound.playStart();
      state = 'playing';
      gameTime = 0;
      gameScore = 0;
      scoreMeters = 0;
      coinsCollected = 0;
      nearMissCount = 0;
      comboCount = 0;
      comboMultiplier = 1;
      comboTimer = 0;
      maxCombo = 0;
      currentTierIndex = 0;
      prevTierIndex = 0;
      tierTransitionTimer = 0;
      hitStopTimer = 0;
      slowMotionTimer = 0;
      isNewBest = false;
      currentSpeed = SPEED_INITIAL;

      coinStreak = 0;
      coinStreakTimer = 0;
      magnetTimer = 0;
      lastPowerUpSpawnDist = 0;
      nextMilestone = 250;
      milestoneBanner = null;
      bestDistance = getStoredBestDistance();
      bestLineCrossed = false;

      player.reset();
      resetObstacles();
      particles = [];
      deathDebris = [];
      popupTexts = [];

      // Check tutorial trigger (first time or explicit replay)
      bestScore = getStoredBestScore();
      startInputLockTimer = 0.22;
      const tutorialDone = isTutorialCompleted();
      if (!tutorialDone || forceTutorial) {
        isTutorialActive = true;
        tutorialStep = 1;
        tutorialStepTimer = 0;
        tutorialObstacleSpawned = false;
      } else {
        isTutorialActive = false;
        tutorialStep = 0;
      }
      forceTutorial = false;

      sound.setBpm(SPEED_TIERS[0].bpm);
      sound.startBgm();

      isPaused = false;
      pauseCountdown = 0;
      copySuccessTimer = 0;
      showFallbackShareText = false;
      removeFallbackInputElement();

      syncGameTestingObj();
    }

    function triggerGameOver() {
      state = 'gameover';
      gameOverTimer = 0;
      player.flipBufferTimer = 0;
      isTutorialActive = false;

      isPaused = false;
      pauseCountdown = 0;
      copySuccessTimer = 0;
      showFallbackShareText = false;
      removeFallbackInputElement();

      // Juice: 80ms hit-stop & strong screen shake
      hitStopTimer = 0.08;
      addScreenShake(14.0, 0.42);

      sound.playCrash();
      sound.stopBgm();
      createDeathExplosion(player);

      const finalScore = Math.floor(gameScore);
      const currentStoredBest = getStoredBestScore();
      if (finalScore > currentStoredBest && finalScore > 0) {
        bestScore = finalScore;
        isNewBest = true;
        try {
          localStorage.setItem(STORAGE_KEY, String(bestScore));
        } catch(e) {}
      } else {
        bestScore = currentStoredBest;
        isNewBest = false;
      }

      const finalDist = Math.floor(scoreMeters);
      const currentStoredDist = getStoredBestDistance();
      if (finalDist > currentStoredDist && finalDist > 0) {
        bestDistance = finalDist;
        try {
          localStorage.setItem(BEST_DISTANCE_KEY, String(bestDistance));
        } catch(e) {}
      } else {
        bestDistance = currentStoredDist;
      }

      syncGameTestingObj();
    }

    function handleUserInput() {
      sound.init();
      if (state === 'title') {
        startGame();
      } else if (state === 'playing') {
        if (isPaused) {
          if (pauseCountdown <= 0) {
            startResumeCountdown();
          }
          return; // CRITICAL: NEVER flip while paused!
        }
        if (startInputLockTimer > 0) return;
        player.flip();
      } else if (state === 'gameover') {
        if (gameOverTimer >= GAME_OVER_INPUT_LOCK) {
          startGame();
        }
      }
    }

    // --- Input Listeners ---
    const MUTE_BTN_SIZE = 28;
    const MUTE_BTN_MARGIN = 14;

    function isMuteButtonClicked(clientX, clientY) {
      const hitPadding = 8;
      const x = canvasWidth - MUTE_BTN_MARGIN - MUTE_BTN_SIZE;
      const y = MUTE_BTN_MARGIN;
      return (
        clientX >= x - hitPadding &&
        clientX <= x + MUTE_BTN_SIZE + hitPadding &&
        clientY >= y - hitPadding &&
        clientY <= y + MUTE_BTN_SIZE + hitPadding
      );
    }

    function isPauseButtonClicked(clientX, clientY) {
      if (state !== 'playing') return false;
      const hitPadding = 8;
      const x = canvasWidth - MUTE_BTN_MARGIN - MUTE_BTN_SIZE - 8 - PAUSE_BTN_SIZE;
      const y = PAUSE_BTN_MARGIN;
      return (
        clientX >= x - hitPadding &&
        clientX <= x + PAUSE_BTN_SIZE + hitPadding &&
        clientY >= y - hitPadding &&
        clientY <= y + PAUSE_BTN_SIZE + hitPadding
      );
    }

    let lastInputTime = 0;
    function handlePointer(e, clientX, clientY) {
      const now = performance.now();
      if (now - lastInputTime < 80) return;
      lastInputTime = now;

      // 1. Mute button click
      if (isMuteButtonClicked(clientX, clientY)) {
        if (e && e.cancelable) e.preventDefault();
        sound.init();
        sound.toggleMute();
        return;
      }

      // 2. Pause button click
      if (isPauseButtonClicked(clientX, clientY)) {
        if (e && e.cancelable) e.preventDefault();
        sound.init();
        togglePause();
        return;
      }

      // 3. If currently paused in game, tap triggers resume countdown (NEVER flip!)
      if (state === 'playing' && isPaused) {
        if (e && e.cancelable) e.preventDefault();
        sound.init();
        if (pauseCountdown <= 0) {
          startResumeCountdown();
        }
        return;
      }

      // 4. Title screen buttons
      if (state === 'title') {
        const vx = (clientX * dpr) / renderScale;
        const vy = (clientY * dpr) / renderScale;
        const centerX = virtualW / 2;
        const cardH = 286;
        const cardY = trackCenterY - cardH / 2 - 10;

        // Tutorial replay link
        if (Math.abs(vx - centerX) <= 120 && vy >= cardY + cardH - 26 && vy <= cardY + cardH + 6) {
          if (e && e.cancelable) e.preventDefault();
          forceTutorial = true;
          startGame();
          return;
        }

        // Screen Shake Toggle button
        const shakeBtnW = 160;
        const shakeBtnH = 28;
        const shakeBtnX = centerX - shakeBtnW / 2;
        const shakeBtnY = cardY + cardH - 62;
        if (vx >= shakeBtnX && vx <= shakeBtnX + shakeBtnW && vy >= shakeBtnY && vy <= shakeBtnY + shakeBtnH) {
          if (e && e.cancelable) e.preventDefault();
          sound.init();
          toggleScreenShake();
          return;
        }
      }

      // 5. Game Over screen buttons
      if (state === 'gameover') {
        if (gameOverTimer >= GAME_OVER_INPUT_LOCK) {
          const vx = (clientX * dpr) / renderScale;
          const vy = (clientY * dpr) / renderScale;
          const centerX = virtualW / 2;
          const cardH = 340;
          const cardY = trackCenterY - cardH / 2;

          // Copy Result button check
          const copyBtnW = 190;
          const copyBtnH = 32;
          const copyBtnX = centerX - copyBtnW / 2;
          const copyBtnY = cardY + cardH - 78;
          if (vx >= copyBtnX && vx <= copyBtnX + copyBtnW && vy >= copyBtnY && vy <= copyBtnY + copyBtnH) {
            if (e && e.cancelable) e.preventDefault();
            copyResultToClipboard();
            return;
          }
        }
      }

      if (e && e.cancelable) e.preventDefault();
      handleUserInput();
    }

    window.addEventListener('pointerdown', (e) => {
      handlePointer(e, e.clientX, e.clientY);
    }, { passive: false });

    window.addEventListener('click', (e) => {
      handlePointer(e, e.clientX, e.clientY);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      // Pause toggle via Escape or P key
      if (e.code === 'Escape' || e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
        return;
      }

      // If paused, space/enter triggers resume countdown, no flipping
      if (state === 'playing' && isPaused) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          if (pauseCountdown <= 0) {
            startResumeCountdown();
          }
        }
        return;
      }

      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW' || e.code === 'KeyS') {
        e.preventDefault();
        handleUserInput();
      } else if (e.code === 'KeyM') {
        sound.toggleMute();
      }
    });

    // Auto pause on tab switch or window blur
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state === 'playing' && !isPaused) {
        pauseGame();
      }
    });

    window.addEventListener('blur', () => {
      if (state === 'playing' && !isPaused) {
        pauseGame();
      }
    });

    // --- Main Update Loop ---
    function update(dt) {
      // 80ms Hit-stop on death
      if (hitStopTimer > 0) {
        hitStopTimer -= dt;
        updateScreenShake(dt);
        return;
      }

      updateScreenShake(dt);

      // 0.15s Slow-motion on Near Miss (dt clamped for physics simulation, disabled if prefersReducedMotion)
      let simDt = dt;
      if (!prefersReducedMotion && slowMotionTimer > 0) {
        slowMotionTimer -= dt;
        simDt = dt * 0.35;
      } else {
        slowMotionTimer = 0;
      }

      // Tier transition 1-second color blend countdown
      if (tierTransitionTimer > 0) {
        tierTransitionTimer = Math.max(0, tierTransitionTimer - dt);
      }

      if (startInputLockTimer > 0) {
        startInputLockTimer = Math.max(0, startInputLockTimer - dt);
      }

      if (state === 'playing') {
        gameTime += simDt;

        if (isTutorialActive) {
          tutorialStepTimer += simDt;
          if (tutorialStep === 3) {
            if (coins.length === 0 || tutorialStepTimer > 3.5) {
              advanceTutorialToStep4();
            }
          } else if (tutorialStep === 4) {
            if (tutorialStepTimer > 5.0) {
              completeTutorial();
            }
          }
        }

        // Speed ramp with distance (ramps higher in late game)
        const progress = Math.min(1, scoreMeters / SPEED_RAMP_METERS);
        currentSpeed = SPEED_INITIAL + (SPEED_MAX - SPEED_INITIAL) * (1 - Math.exp(-progress * 2.8));

        // Distance in meters
        const deltaMeters = (currentSpeed * simDt) / 24;
        scoreMeters += deltaMeters;

        // Score progression from distance (scaled by combo multiplier)
        gameScore += deltaMeters * 5 * comboMultiplier;

        // Milestone trigger: subtle 250m notice and +100 bonus
        if (scoreMeters >= nextMilestone) {
          const mText = `${nextMilestone}m!`;
          milestoneBanner = {
            text: mText,
            bonus: 100,
            timer: 2.2,
            maxTimer: 2.2
          };
          gameScore += 100;
          sound.playMilestone();
          // Milestone is prominently shown via milestoneBanner at track top; avoid cluttering screen center with duplicate text
          nextMilestone += 250;
        }

        // BEST distance line crossing celebration
        if (bestDistance > 20 && !bestLineCrossed && scoreMeters >= bestDistance) {
          bestLineCrossed = true;
          sound.playBestRecord();
          addScreenShake(6.0, 0.3);
          spawnPopupText(player.x + 30, trackCenterY, '★ NEW BEST DISTANCE! ★', '#f59e0b', 18, true);
          for (let i = 0; i < 35; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = 70 + Math.random() * 220;
            addParticle({
              type: 'sparkle',
              x: player.x,
              y: trackCenterY,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              size: 3 + Math.random() * 3,
              alpha: 1.0,
              life: 0.6 + Math.random() * 0.5,
              color: ['#f59e0b', '#38bdf8', '#10b981', '#ec4899', '#8b5cf6'][Math.floor(Math.random() * 5)]
            });
          }
        }

        // Speed tier check & trigger
        for (let i = SPEED_TIERS.length - 1; i >= 0; i--) {
          if (scoreMeters >= SPEED_TIERS[i].minMeters) {
            if (i > currentTierIndex) {
              prevTierIndex = currentTierIndex;
              currentTierIndex = i;
              tierTransitionTimer = TIER_TRANSITION_DURATION;
              speedUpBanner.active = true;
              speedUpBanner.timer = 2.0;
              speedUpBanner.title = SPEED_TIERS[i].bannerTitle;
              speedUpBanner.accent = SPEED_TIERS[i].accent;
              sound.setBpm(SPEED_TIERS[i].bpm);
              sound.setTier(currentTierIndex);
              sound.playSpeedUp();
            }
            break;
          }
        }

        // Combo timeout check (only counts down when grounded)
        if (player.isGrounded) {
          if (comboCount > 0) {
            comboTimer -= simDt;
            if (comboTimer <= 0) {
              comboCount = 0;
              comboMultiplier = 1;
              comboTimer = 0;
            }
          }
        }

        updateAutopilot(dt);
        player.update(simDt);
        updateObstacles(simDt);
        updateCoins(simDt);
        updatePowerUps(simDt);
        updateBackground(simDt);
        sound.updateBgm();
      } else if (state === 'title') {
        // Title Screen Autopilot Demo Runner:
        // Runs physical simulation in background with autopilot flips.
        // Zero impact on game score, best distance, or localStorage.
        updateAutopilot(dt);
        player.update(dt);
        updateObstacles(dt);
        updateCoins(dt);
        updatePowerUps(dt);
        updateBackground(dt * 0.9);
      } else if (state === 'gameover') {
        updateAutopilot(dt);
        gameOverTimer += dt;
        updateBackground(dt * 0.2);
      }

      if (speedUpBanner.active) {
        speedUpBanner.timer -= dt;
        if (speedUpBanner.timer <= 0) {
          speedUpBanner.active = false;
        }
      }

      if (milestoneBanner) {
        milestoneBanner.timer -= dt;
        if (milestoneBanner.timer <= 0) {
          milestoneBanner = null;
        }
      }

      updateParticles(dt);
      syncGameTestingObj();
    }

    function updateScreenShake(dt) {
      if (screenShake.timer > 0) {
        screenShake.timer -= dt;
        if (screenShake.timer <= 0) {
          screenShake.intensity = 0;
          screenShake.duration = 0;
        }
      }
    }

    // --- Render Distant Patterns ---
    function renderDistantPattern(pattern, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      if (pattern === 'day') {
        // Soft floating geometric clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        const cloudOffset = bgScroll * 0.4;
        const cloudPositions = [
          { x: (120 - cloudOffset + virtualW * 2) % (virtualW + 240) - 100, y: ceilingY - 45, r: 18 },
          { x: (380 - cloudOffset + virtualW * 2) % (virtualW + 240) - 100, y: ceilingY - 55, r: 24 },
          { x: (640 - cloudOffset + virtualW * 2) % (virtualW + 240) - 100, y: ceilingY - 38, r: 16 },
          { x: (220 - cloudOffset + virtualW * 2) % (virtualW + 240) - 100, y: floorY + 45, r: 20 },
          { x: (520 - cloudOffset + virtualW * 2) % (virtualW + 240) - 100, y: floorY + 52, r: 22 }
        ];
        for (const c of cloudPositions) {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
          ctx.arc(c.x + c.r * 0.8, c.y - c.r * 0.2, c.r * 0.75, 0, Math.PI * 2);
          ctx.arc(c.x - c.r * 0.8, c.y - c.r * 0.1, c.r * 0.65, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pattern === 'sunset') {
        // Giant setting sun on horizon & warm mountain ridges
        const sunX = virtualW * 0.72;
        const sunY = trackCenterY + 15;
        // Radial glow
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 130);
        sunGlow.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
        sunGlow.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 130, 0, Math.PI * 2);
        ctx.fill();

        // Sun disc
        ctx.fillStyle = 'rgba(254, 215, 170, 0.85)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 44, 0, Math.PI * 2);
        ctx.fill();

        // Distant mountain silhouette ridges
        ctx.fillStyle = 'rgba(154, 52, 18, 0.18)';
        ctx.beginPath();
        ctx.moveTo(0, ceilingY);
        ctx.lineTo(virtualW * 0.2, ceilingY - 35);
        ctx.lineTo(virtualW * 0.45, ceilingY - 10);
        ctx.lineTo(virtualW * 0.7, ceilingY - 45);
        ctx.lineTo(virtualW, ceilingY - 15);
        ctx.lineTo(virtualW, ceilingY);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(virtualW * 0.25, floorY + 40);
        ctx.lineTo(virtualW * 0.55, floorY + 15);
        ctx.lineTo(virtualW * 0.85, floorY + 48);
        ctx.lineTo(virtualW, floorY + 20);
        ctx.lineTo(virtualW, floorY);
        ctx.closePath();
        ctx.fill();
      } else if (pattern === 'neon') {
        // Cyber city skyline silhouettes with glowing neon windows
        const bldgOffset = bgScroll * 0.6;
        const bldgs = [
          { x: 40, w: 55, h: 65 },
          { x: 120, w: 45, h: 85 },
          { x: 185, w: 70, h: 55 },
          { x: 280, w: 50, h: 95 },
          { x: 350, w: 60, h: 70 },
          { x: 440, w: 55, h: 80 },
          { x: 520, w: 75, h: 60 },
          { x: 620, w: 48, h: 90 },
          { x: 700, w: 65, h: 75 }
        ];

        ctx.fillStyle = '#1e1b4b';
        // Above ceiling
        for (const b of bldgs) {
          const bx = (b.x - bldgOffset + virtualW * 2) % (virtualW + 120) - 60;
          ctx.fillRect(bx, ceilingY - b.h, b.w, b.h);
          // Neon window lights
          ctx.fillStyle = Math.random() < 0.5 ? '#c084fc' : '#38bdf8';
          for (let wy = ceilingY - b.h + 8; wy < ceilingY - 10; wy += 14) {
            for (let wx = bx + 8; wx < bx + b.w - 8; wx += 12) {
              ctx.fillRect(wx, wy, 4, 6);
            }
          }
          ctx.fillStyle = '#1e1b4b';
        }

        // Below floor perspective neon grid lines
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.4)';
        ctx.lineWidth = 1.2;
        const gridStep = 32;
        const startGX = -(bgScroll % gridStep);
        ctx.beginPath();
        for (let gx = startGX; gx < virtualW + gridStep; gx += gridStep) {
          ctx.moveTo(gx, floorY);
          ctx.lineTo(gx + (gx - virtualW / 2) * 0.6, virtualH);
        }
        for (let gy = floorY + 16; gy < virtualH; gy += 24) {
          ctx.moveTo(0, gy);
          ctx.lineTo(virtualW, gy);
        }
        ctx.stroke();
      } else if (pattern === 'critical') {
        // Red warning caution bars and flashing chevrons
        ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
        const chevronOffset = bgScroll * 1.5;
        const cStep = 60;
        const cStartX = -(chevronOffset % cStep);
        ctx.beginPath();
        for (let cx = cStartX - 80; cx < virtualW + 80; cx += cStep) {
          // Top chevrons
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx + 25, ceilingY);
          ctx.lineTo(cx + 45, ceilingY);
          ctx.lineTo(cx + 20, 0);
          // Bottom chevrons
          ctx.moveTo(cx, floorY);
          ctx.lineTo(cx + 25, virtualH);
          ctx.lineTo(cx + 45, virtualH);
          ctx.lineTo(cx + 20, floorY);
        }
        ctx.fill();

        // Pulsing warning text banner along ceiling edge
        const pulse = (Math.sin(Date.now() * 0.01) + 1) * 0.5;
        ctx.fillStyle = `rgba(239, 68, 68, ${0.4 + pulse * 0.4})`;
        ctx.font = '900 12px system-ui, sans-serif';
        ctx.letterSpacing = '4px';
        ctx.textAlign = 'center';
        ctx.fillText('<<< WARNING : CRITICAL SPEED >>>', virtualW / 2, ceilingY - 12);
        ctx.fillText('<<< WARNING : CRITICAL SPEED >>>', virtualW / 2, floorY + 22);
        ctx.letterSpacing = '0px';
      }

      ctx.restore();
    }

    // --- Render Functions ---
    function renderBackground() {
      const palette = getActivePalette();

      // 1. Smooth gradient background fill based on active speed tier & blend
      const bgGrad = ctx.createLinearGradient(0, 0, 0, virtualH);
      bgGrad.addColorStop(0, palette.bgTop);
      bgGrad.addColorStop(1, palette.bgBottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, virtualW, virtualH);

      // 2. Distant Patterns (Cross-faded during 1-second tier transition)
      if (palette.patternPrev && palette.blendT < 1.0) {
        renderDistantPattern(palette.patternPrev, 1.0 - palette.blendT);
        renderDistantPattern(palette.patternCurr, palette.blendT);
      } else {
        renderDistantPattern(palette.patternCurr, 1.0);
      }

      // 3. Dynamic speed streaks tinted with tier accent
      ctx.lineWidth = (currentTierIndex === 3) ? 2.0 : 1.2;
      for (const line of speedLines) {
        ctx.strokeStyle = (currentTierIndex === 3) ? `rgba(239, 68, 68, ${line.alpha * 1.8})` : `rgba(148, 163, 184, ${line.alpha})`;
        ctx.beginPath();
        ctx.moveTo(line.x, line.y);
        ctx.lineTo(line.x + line.len * (currentTierIndex === 3 ? 1.5 : 1.0), line.y);
        ctx.stroke();
      }

      // 4. Outside play zone architectural hatch
      // Above ceiling
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, virtualW, ceilingY);
      ctx.clip();
      ctx.fillStyle = palette.trackTone;
      ctx.fillRect(0, 0, virtualW, ceilingY);

      ctx.strokeStyle = palette.hatchLine;
      ctx.lineWidth = 1;
      const step = 24;
      const startX = -(bgScroll % step);
      ctx.beginPath();
      for (let x = startX - ceilingY; x < virtualW + step + ceilingY; x += step) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x + ceilingY, ceilingY);
      }
      ctx.stroke();
      ctx.restore();

      // Below floor
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, floorY, virtualW, virtualH - floorY);
      ctx.clip();
      ctx.fillStyle = palette.trackTone;
      ctx.fillRect(0, floorY, virtualW, virtualH - floorY);

      ctx.strokeStyle = palette.hatchLine;
      ctx.lineWidth = 1;
      const floorH = virtualH - floorY;
      ctx.beginPath();
      for (let x = startX - floorH; x < virtualW + step + floorH; x += step) {
        ctx.moveTo(x, floorY);
        ctx.lineTo(x + floorH, virtualH);
      }
      ctx.stroke();
      ctx.restore();

      // 5. Distance markers every 100m
      if (state === 'playing') {
        const markerStep = 100;
        const currentDist = scoreMeters;
        const speedPixelsPerMeter = 24;
        const nextMarkerM = Math.ceil((currentDist - 10) / markerStep) * markerStep;
        for (let m = nextMarkerM; m <= nextMarkerM + 300; m += markerStep) {
          const markerX = player.x + (m - currentDist) * speedPixelsPerMeter;
          if (markerX > -50 && markerX < virtualW + 50) {
            ctx.strokeStyle = (currentTierIndex >= 2) ? 'rgba(255, 255, 255, 0.25)' : 'rgba(148, 163, 184, 0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(markerX, ceilingY + 5);
            ctx.lineTo(markerX, floorY - 5);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = (currentTierIndex >= 2) ? '#cbd5e1' : '#94a3b8';
            ctx.font = '600 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${m}m`, markerX, trackCenterY);
          }
        }
      }

      // 6. Track Boundary Lines with Tier-blended colors
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = palette.trackLine;
      ctx.beginPath();
      ctx.moveTo(0, ceilingY);
      ctx.lineTo(virtualW, ceilingY);
      ctx.moveTo(0, floorY);
      ctx.lineTo(virtualW, floorY);
      ctx.stroke();

      // 7. Dynamic Accent stripes according to speed tier
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = palette.accent;
      ctx.beginPath();
      ctx.moveTo(0, ceilingY - 3.5);
      ctx.lineTo(virtualW, ceilingY - 3.5);
      ctx.moveTo(0, floorY + 3.5);
      ctx.lineTo(virtualW, floorY + 3.5);
      ctx.stroke();
    }

    function renderObstacles() {
      const palette = getActivePalette();

      for (const obs of obstacles) {
        const oy = obs.getY();

        if (obs.type === 'block') {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(obs.x, oy, obs.w, obs.h);

          ctx.lineWidth = 2.5;
          ctx.strokeStyle = palette.trackLine;
          ctx.strokeRect(obs.x, oy, obs.w, obs.h);

          ctx.fillStyle = palette.accent;
          if (obs.surface === 'floor') {
            ctx.fillRect(obs.x + 3, oy + 2, obs.w - 6, 3);
          } else {
            ctx.fillRect(obs.x + 3, oy + obs.h - 5, obs.w - 6, 3);
          }

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(obs.x + 6, oy + 6);
          ctx.lineTo(obs.x + obs.w - 6, oy + obs.h - 6);
          ctx.stroke();
        } else if (obs.type === 'spike') {
          const isFloor = (obs.surface === 'floor');
          const tipY = isFloor ? oy : (oy + obs.h);
          const baseY = isFloor ? (oy + obs.h) : oy;
          const leftX = obs.x;
          const rightX = obs.x + obs.w;
          const midX = obs.x + (obs.w / 2);

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.moveTo(leftX, baseY);
          ctx.lineTo(midX, tipY);
          ctx.lineTo(rightX, baseY);
          ctx.closePath();
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.strokeStyle = palette.accent;
          ctx.stroke();

          ctx.fillStyle = palette.accent;
          ctx.beginPath();
          ctx.arc(midX, tipY + (isFloor ? 3 : -3), 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (obs.type === 'moving') {
          const midX = obs.x + obs.w / 2;
          const midY = oy + obs.h / 2;
          const r = obs.w / 2;

          ctx.save();
          ctx.translate(midX, midY);
          ctx.rotate(gameTime * 4.0);

          // Glow halo
          ctx.fillStyle = 'rgba(239, 68, 68, 0.24)';
          ctx.beginPath();
          ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
          ctx.fill();

          // Outer diamond
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r, 0);
          ctx.lineTo(0, r);
          ctx.lineTo(-r, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner pulsing core
          const coreR = 4 + Math.sin(gameTime * 8) * 2;
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(0, 0, coreR, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }
    }

    function renderMilestoneBanner() {

    function renderPlayerFigure(x, y, rotation, animPhase, isGrounded, alpha = 1.0, squashTimer = 0, surface = 'floor') {
      if (player.invincibleTimer > 0 && Math.sin(player.invincibleTimer * 32) > 0) {
        alpha *= 0.25; // Invincibility flicker
      }

      ctx.save();
      ctx.translate(x, y);

      // Energy Shield Barrier Visual
      if (player.hasShield && alpha > 0.4) {
        ctx.save();
        const pulse = Math.sin(gameTime * 6) * 2;
        const shieldR = FIGURE_HALF_HEIGHT + 7 + pulse;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.0;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.beginPath();
        ctx.arc(0, 0, shieldR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.rotate(gameTime * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, shieldR - 3, 0, Math.PI * 0.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, shieldR - 3, Math.PI, Math.PI * 1.6);
        ctx.stroke();
        ctx.restore();
      }

      // Magnet Active Electromagnetic Aura
      if (magnetTimer > 0 && alpha > 0.4) {
        ctx.save();
        const magPulse = Math.sin(gameTime * 12) * 3;
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, FIGURE_HALF_HEIGHT + 13 + magPulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      ctx.rotate(rotation);

      // Juice: Squash & stretch animation on landing
      if (squashTimer > 0) {
        const p = 1.0 - (squashTimer / 0.16);
        const wave = Math.sin(p * Math.PI * 2) * Math.exp(-p * 3.5) * 0.35;
        ctx.scale(1.0 + wave, 1.0 - wave);
      }

      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const darkColor = '#0f172a';
      const accentColor = getActivePalette().accent;

      // 1. Scarf fluttering
      if (alpha > 0.8) {
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(-2, -14);
        ctx.quadraticCurveTo(-11, -14 + Math.sin(animPhase * 0.8) * 4, -20, -12 + Math.sin(animPhase * 0.8 - 0.8) * 6);
        ctx.stroke();

        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(-2, -13);
        ctx.quadraticCurveTo(-9, -17 + Math.cos(animPhase * 0.8) * 3, -16, -18 + Math.cos(animPhase * 0.8 - 0.6) * 4);
        ctx.stroke();
      }

      // 2. Limb angles
      let leftThighAngle = 0;
      let leftShinAngle = 0;
      let rightThighAngle = 0;
      let rightShinAngle = 0;
      let leftArmAngle = 0;
      let rightArmAngle = 0;

      if (isGrounded) {
        const sinP = Math.sin(animPhase);
        const cosP = Math.cos(animPhase);

        leftThighAngle = sinP * 0.65;
        leftShinAngle = Math.max(0, -cosP) * 0.85;

        rightThighAngle = -sinP * 0.65;
        rightShinAngle = Math.max(0, cosP) * 0.85;

        leftArmAngle = -sinP * 0.6;
        rightArmAngle = sinP * 0.6;
      } else {
        leftThighAngle = -0.4;
        leftShinAngle = 0.6;
        rightThighAngle = 0.5;
        rightShinAngle = 0.3;
        leftArmAngle = -0.5;
        rightArmAngle = 0.5;
      }

      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 2.8;

      // 3. Back Arm
      const shoulderX = 0;
      const shoulderY = -12;
      const armLen = 11;
      const leftElbowX = shoulderX + Math.sin(leftArmAngle) * armLen;
      const leftElbowY = shoulderY + Math.cos(leftArmAngle) * armLen;
      const leftHandX = leftElbowX + Math.sin(leftArmAngle + 0.4) * armLen;
      const leftHandY = leftElbowY + Math.cos(leftArmAngle + 0.4) * armLen;

      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(leftElbowX, leftElbowY);
      ctx.lineTo(leftHandX, leftHandY);
      ctx.stroke();

      // 4. Back Leg
      const hipX = 0;
      const hipY = 2;
      const thighLen = 10;
      const shinLen = 10;
      const leftKneeX = hipX + Math.sin(leftThighAngle) * thighLen;
      const leftKneeY = hipY + Math.cos(leftThighAngle) * thighLen;
      const leftFootX = leftKneeX + Math.sin(leftThighAngle - leftShinAngle) * shinLen;
      const leftFootY = leftKneeY + Math.cos(leftThighAngle - leftShinAngle) * shinLen;

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(leftKneeX, leftKneeY);
      ctx.lineTo(leftFootX, leftFootY);
      ctx.lineTo(leftFootX + 3, leftFootY);
      ctx.stroke();

      // 5. Torso
      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(shoulderX, shoulderY);
      ctx.lineTo(0, -15);
      ctx.stroke();

      // 6. Front Leg
      const rightKneeX = hipX + Math.sin(rightThighAngle) * thighLen;
      const rightKneeY = hipY + Math.cos(rightThighAngle) * thighLen;
      const rightFootX = rightKneeX + Math.sin(rightThighAngle - rightShinAngle) * shinLen;
      const rightFootY = rightKneeY + Math.cos(rightThighAngle - rightShinAngle) * shinLen;

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(rightKneeX, rightKneeY);
      ctx.lineTo(rightFootX, rightFootY);
      ctx.lineTo(rightFootX + 3, rightFootY);
      ctx.stroke();

      // 7. Front Arm
      const rightElbowX = shoulderX + Math.sin(rightArmAngle) * armLen;
      const rightElbowY = shoulderY + Math.cos(rightArmAngle) * armLen;
      const rightHandX = rightElbowX + Math.sin(rightArmAngle + 0.4) * armLen;
      const rightHandY = rightElbowY + Math.cos(rightArmAngle + 0.4) * armLen;

      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(rightElbowX, rightElbowY);
      ctx.lineTo(rightHandX, rightHandY);
      ctx.stroke();

      // 8. Head
      const headCenterY = -20;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(0, headCenterY, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Headband
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(-5, headCenterY - 1.5);
      ctx.lineTo(5, headCenterY - 1.5);
      ctx.stroke();

      // Eye
      ctx.fillStyle = darkColor;
      ctx.beginPath();
      ctx.arc(2.5, headCenterY + 1.0, 1.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function renderFlipIndicatorNearPlayer() {
      if (state !== 'playing') return;

      const arrowX = player.x + 28;
      const arrowY = player.y;
      const accent = getActivePalette().accent;

      if (player.isGrounded) {
        const pointsUp = (player.groundedSurface === 'floor');
        const pulse = Math.sin(Date.now() * 0.008) * 2;

        ctx.save();
        ctx.translate(arrowX, arrowY + (pointsUp ? -pulse : pulse));
        ctx.strokeStyle = accent;
        ctx.fillStyle = accent;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        if (pointsUp) {
          ctx.moveTo(-4, 2);
          ctx.lineTo(0, -6);
          ctx.lineTo(4, 2);
          ctx.moveTo(0, -6);
          ctx.lineTo(0, 6);
        } else {
          ctx.moveTo(-4, -2);
          ctx.lineTo(0, 6);
          ctx.lineTo(4, -2);
          ctx.moveTo(0, 6);
          ctx.lineTo(0, -6);
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, pointsUp ? -10 : 10, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(arrowX, arrowY);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function renderParticles() {
      const accent = getActivePalette().accent;

      for (const pt of particles) {
        if (pt.type === 'shockwave') {
          ctx.save();
          ctx.strokeStyle = `rgba(2, 132, 199, ${pt.alpha})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (pt.type === 'sparkle') {
          ctx.save();
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = pt.alpha;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.fillStyle = `rgba(15, 23, 42, ${pt.alpha})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      if (deathDebris.length > 0) {
        for (const d of deathDebris) {
          ctx.save();
          ctx.translate(d.originX, d.originY);
          ctx.rotate(d.rot);
          ctx.globalAlpha = Math.max(0, d.alpha);
          ctx.lineWidth = 2.8;
          ctx.lineCap = 'round';

          if (d.type === 'head') {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fill();
          } else if (d.type === 'scarf') {
            ctx.strokeStyle = accent;
            ctx.beginPath();
            ctx.moveTo(d.x1, d.y1);
            ctx.lineTo(d.x2, d.y2);
            ctx.stroke();
          } else {
            ctx.strokeStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(d.x1, d.y1);
            ctx.lineTo(d.x2, d.y2);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // Floating popup texts (hide during pause to prevent overlap with countdown numbers and pause card)
      if (!isPaused) {
        for (const pt of popupTexts) {
          ctx.save();
          ctx.globalAlpha = pt.alpha;
          ctx.fillStyle = pt.color;
          ctx.textAlign = 'center';
          ctx.font = `${pt.isBold ? '800' : '600'} ${pt.fontSize}px system-ui, sans-serif`;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
          ctx.shadowBlur = 4;
          ctx.fillText(pt.text, pt.x, pt.y);
          ctx.restore();
        }
      }
    }

    // --- Portrait Mode Hint ---
    function renderPortraitHint() {
      if (!isPortrait) return;

      const hintW = 210;
      const hintH = 26;
      const hintX = (canvasWidth - hintW) / 2;
      const hintY = 14;

      ctx.save();

    // --- HUD Overlays ---
    function renderHUD() {
      const dist = Math.floor(scoreMeters);
      const score = Math.floor(gameScore);
      const palette = getActivePalette();
      const tier = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];

      const scaleFactor = renderScale / dpr;
      const trackScreenY = canvasHeight / 2;
      const ceilingScreenY = trackScreenY - (trackHeight / 2) * scaleFactor;
      const floorScreenY = trackScreenY + (trackHeight / 2) * scaleFactor;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const ceilingClearance = Math.min(26, Math.max(18, ceilingScreenY * 0.22));
      const hudBottomY = ceilingScreenY - ceilingClearance;

      // 1. Prominent Score (Adapts color for dark neon/critical tiers)
      ctx.textAlign = 'left';
      ctx.fillStyle = palette.textColor;
      ctx.font = '900 28px system-ui, sans-serif';
      ctx.fillText(score.toLocaleString(), 16, hudBottomY - 35);

      // Distance
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = (currentTierIndex >= 2) ? '#cbd5e1' : '#64748b';
      ctx.fillText(`${dist} m`, 16, hudBottomY - 17);

      // Best Score
      const currentBest = Math.max(score, getStoredBestScore());
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.fillStyle = (currentTierIndex >= 2) ? '#94a3b8' : '#94a3b8';
      ctx.fillText(`BEST ${currentBest.toLocaleString()}`, 16, hudBottomY);

      // 2. Flip Availability HUD Pill (Center)
      const pillW = 114;
      const pillH = 26;
      const pillX = (canvasWidth - pillW) / 2;
      const pillY = hudBottomY - 26;

      if (player.isGrounded) {
        ctx.fillStyle = 'rgba(2, 132, 199, 0.12)';
        ctx.strokeStyle = palette.accent;
        ctx.lineWidth = 1.5;
        roundRect(ctx, pillX, pillY, pillW, pillH, 13);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = palette.accent;
        ctx.beginPath();
        ctx.arc(pillX + 15, pillY + 13, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = palette.accent;
        ctx.font = '700 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('反転可能 ⇅', pillX + 63, pillY + 13);
      } else {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.08)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 1.2;
        roundRect(ctx, pillX, pillY, pillW, pillH, 13);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(pillX + 15, pillY + 13, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('浮遊中...', pillX + 63, pillY + 13);
      }

      // 3. Multiplier & Combo Badge (Top Right)
      const comboW = 96;
      const comboH = 26;
      const comboX = canvasWidth - comboW - 16;
      const comboY = hudBottomY - 26;

      const multColors = { 1: '#64748b', 2: '#0284c7', 3: '#8b5cf6', 5: '#f59e0b' };
      const currentMultColor = multColors[comboMultiplier] || '#64748b';

      ctx.fillStyle = comboMultiplier > 1 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(241, 245, 249, 0.8)';
      ctx.strokeStyle = currentMultColor;
      ctx.lineWidth = comboMultiplier > 1 ? 2.0 : 1.2;
      roundRect(ctx, comboX, comboY, comboW, comboH, 13);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = currentMultColor;
      ctx.font = comboMultiplier > 1 ? '900 13px system-ui, sans-serif' : '700 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const comboLabel = comboMultiplier > 1 ? `x${comboMultiplier} COMBO` : 'x1 MULTI';
      ctx.fillText(comboLabel, comboX + comboW / 2, comboY + 13);

        if (player.isGrounded && comboCount > 0 && comboTimer > 0) {
        const timerPct = Math.max(0, comboTimer / 2.0);
        ctx.fillStyle = currentMultColor;
        ctx.fillRect(comboX + 10, comboY + comboH - 3, (comboW - 20) * timerPct, 2);
      }

      // 4. Magnet Active HUD Remaining Time Gauge
      if (magnetTimer > 0) {
        const magW = 126;
        const magH = 22;
        const magX = (canvasWidth - magW) / 2;
        const magY = pillY + pillH + 6;
        const pct = Math.max(0, magnetTimer / 5.0);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        roundRect(ctx, magX, magY, magW, magH, 11);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        roundRect(ctx, magX + 2, magY + 2, Math.max(0, (magW - 4) * pct), magH - 4, 9);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '800 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🧲 MAGNET ${magnetTimer.toFixed(1)}s`, magX + magW / 2, magY + magH / 2);

      // 5. Coins & Speed Gauge with Tier Color Reflecting
      const bottomY = floorScreenY + 14;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#d97706';
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillText(`🪙 ${coinsCollected}`, 16, bottomY + 12);

      if (player.hasShield) {
        ctx.fillStyle = '#0284c7';
        ctx.font = '700 12px system-ui, sans-serif';
        ctx.fillText(`🛡️ SHIELD ACTIVE`, 72, bottomY + 12);
      }

      const speedPct = Math.min(1, (currentSpeed - SPEED_INITIAL) / (SPEED_MAX - SPEED_INITIAL));
      const barW = 110;
      const barH = 5;
      const barX = 16;
      const barY = bottomY + 20;

      ctx.fillStyle = (currentTierIndex >= 2) ? 'rgba(255, 255, 255, 0.2)' : 'rgba(15, 23, 42, 0.15)';
      roundRect(ctx, barX, barY, barW, barH, 2.5);
      ctx.fill();

      // Tier-colored speed bar with soft glow
      ctx.fillStyle = palette.accent;
      ctx.shadowColor = palette.accent;
      ctx.shadowBlur = 6;
      roundRect(ctx, barX, barY, Math.max(barH, barW * speedPct), barH, 2.5);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      ctx.fillStyle = palette.textColor;
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.fillText(`SPEED ${Math.round(currentSpeed / 10)} (${tier.name})`, 16, bottomY + 38);

      // Autopilot Active Badge
      if (autopilot) {
        ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;
        const bW = 104;
        const bH = 22;
        const bX = canvasWidth - bW - 16;
        const bY = bottomY + 18;
        roundRect(ctx, bX, bY, bW, bH, 11);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#10b981';
        ctx.font = '800 10px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡ BOT ACTIVE', bX + bW / 2, bY + bH / 2);
      }

      ctx.restore();
    }

    function renderGameOverScreen() {
      const centerX = virtualW / 2;
      const alpha = Math.min(1, gameOverTimer / 0.25);

      ctx.save();
      ctx.globalAlpha = alpha;

      const cardW = Math.min(virtualW - 40, 440);
      const cardH = 340;
      const cardX = centerX - cardW / 2;
      const cardY = trackCenterY - cardH / 2;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(15, 23, 42, 0.16)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 8;
      roundRect(ctx, cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.stroke();

      // Title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 24px system-ui, sans-serif';
      ctx.fillText('GAME OVER', centerX, cardY + 30);

        ctx.fillStyle = '#f59e0b';

        ctx.font = '700 12px system-ui, sans-serif';
        ctx.fillText(`死因: ${lastDeathCause}`, centerX, currentTopY);
        currentTopY += 12;

      ctx.fillStyle = '#0f172a';

      // Stats 2-column layout
      const statsY = currentTopY + 68;

      // "One More Run" Motivation: Points to Best & Stored Best

    function renderPauseOverlay() {
      if (state !== 'playing' || !isPaused) return;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Dark translucent backdrop (darker during countdown to ensure high contrast against background elements)
      ctx.fillStyle = (pauseCountdown > 0) ? 'rgba(15, 23, 42, 0.78)' : 'rgba(15, 23, 42, 0.65)';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      const centerX = canvasWidth / 2;
      const centerY = canvasHeight / 2;

      if (pauseCountdown > 0) {
        // Countdown display (3, 2, 1)
        const curSec = Math.ceil(pauseCountdown);
        const frac = pauseCountdown - Math.floor(pauseCountdown);
        const scale = 1.0 + frac * 0.32;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 72px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 24;
        ctx.fillText(String(curSec), 0, 0);
        ctx.restore();

        ctx.font = '700 14px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

    // --- Helper Utility Functions ---
    function roundRect(c, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // --- Testing API Hook (window.__game - Preserved & Extended) ---
    function syncGameTestingObj() {
      if (!window.__game) {
        window.__game = {};
        Object.defineProperty(window.__game, 'state', { get: () => state, set: v => { state = v; }, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'score', { get: () => Math.floor(gameScore), configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'distance', {
          get: () => Math.floor(scoreMeters),
          set: (v) => { scoreMeters = Number(v) || 0; },
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'bestScore', { get: () => getStoredBestScore(), configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'isGrounded', { get: () => player.isGrounded, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'speed', { get: () => currentSpeed, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'player', { get: () => player, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'obstacles', { get: () => obstacles, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'coins', { get: () => coins, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'powerUps', { get: () => powerUps, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'totalObstaclesSpawned', { get: () => totalObstaclesSpawned, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'totalPowerUpsSpawned', { get: () => totalPowerUpsSpawned, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'lastDeathCause', { get: () => lastDeathCause, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'coinsCollected', { get: () => coinsCollected, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'nearMisses', { get: () => nearMissCount, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'combo', { get: () => comboCount, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'comboMultiplier', { get: () => comboMultiplier, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'maxCombo', { get: () => maxCombo, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'tier', { get: () => currentTierIndex, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'virtualW', { get: () => virtualW, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'virtualH', { get: () => virtualH, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'gameOverTimer', { get: () => gameOverTimer, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'gameTime', { get: () => gameTime, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'sound', { get: () => sound, configurable: true, enumerable: true });

        // Autopilot switch
        Object.defineProperty(window.__game, 'autopilot', {
          get: () => autopilot,
          set: (v) => { autopilot = !!v; },
          configurable: true,
          enumerable: true
        });

        // Tutorial status
        Object.defineProperty(window.__game, 'isTutorialActive', {
          get: () => isTutorialActive,
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'tutorialStep', {
          get: () => tutorialStep,
          configurable: true,
          enumerable: true
        });

        // Pause state & controls
        Object.defineProperty(window.__game, 'isPaused', {
          get: () => isPaused,
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'pauseCountdown', {
          get: () => pauseCountdown,
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'screenShakeEnabled', {
          get: () => screenShakeEnabled,
          set: (v) => { screenShakeEnabled = !!v; },
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'trackHeight', {
          get: () => trackHeight,
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'travelScale', {
          get: () => travelScale,
          configurable: true,
          enumerable: true
        });
        Object.defineProperty(window.__game, 'transitTime', {
          get: () => getTransitTime(),
          configurable: true,
          enumerable: true
        });
        window.__game.getTransitTime = getTransitTime;
        Object.defineProperty(window.__game, 'popupTexts', {
          get: () => popupTexts,
          configurable: true,
          enumerable: true
        });

        window.__game.pause = pauseGame;
        window.__game.resume = startResumeCountdown;
        window.__game.togglePause = togglePause;
        window.__game.toggleScreenShake = toggleScreenShake;
        window.__game.copyResultToClipboard = copyResultToClipboard;
        window.__game.getShareText = getShareText;
        window.__game.start = startGame;
        window.__game.startTutorial = () => {
          forceTutorial = true;
          startGame();
        };
        window.__game.flip = () => {
          return player.flip();
        };
        window.__game.reset = () => {
          state = 'title';
          gameTime = 0;
          gameScore = 0;
          scoreMeters = 0;
          coinsCollected = 0;
          nearMissCount = 0;
          comboCount = 0;
          comboMultiplier = 1;
          comboTimer = 0;
          maxCombo = 0;
          currentTierIndex = 0;
          prevTierIndex = 0;
          tierTransitionTimer = 0;
          hitStopTimer = 0;
          slowMotionTimer = 0;
          isPaused = false;
          pauseCountdown = 0;
          copySuccessTimer = 0;
          showFallbackShareText = false;
          removeFallbackInputElement();
          bestScore = getStoredBestScore();
          const tutorialDone = isTutorialCompleted();
          isTutorialActive = !tutorialDone;
          tutorialStep = isTutorialActive ? 1 : 0;
          tutorialStepTimer = 0;
          tutorialObstacleSpawned = false;
          player.reset();
          resetObstacles();
          sound.stopBgm();
          syncGameTestingObj();
        };
      }
    }
    syncGameTestingObj();

    // --- Main Game Loop (requestAnimationFrame with clamped dt) ---
    let lastTime = 0;
    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      let dt = (time - lastTime) / 1000;
      lastTime = time;

      // Delta time clamp to avoid tunnelling on lag spikes
      dt = Math.min(dt, 0.05);

      if (copySuccessTimer > 0) {
        copySuccessTimer = Math.max(0, copySuccessTimer - dt);
      }

      // Pause & Resume Countdown update
      if (state === 'playing' && isPaused) {
        if (pauseCountdown > 0) {
          pauseCountdown -= dt;
          const curSec = Math.ceil(pauseCountdown);
          if (curSec > 0 && curSec !== countdownAnnouncedSecond) {
            countdownAnnouncedSecond = curSec;
            sound.playCountdown(curSec);
          }
          if (pauseCountdown <= 0) {
            pauseCountdown = 0;
            isPaused = false;
            countdownAnnouncedSecond = -1;
            sound.startBgm();
            sound.playCountdown(0);
          }
        }
      } else {
        update(dt);
      }

      // Render in virtual coordinate space with Screen Shake
      ctx.save();
      ctx.scale(renderScale, renderScale);

      // Screen Shake offset
      if (screenShake.timer > 0) {
        const progress = screenShake.timer / screenShake.duration;
        const mag = screenShake.intensity * progress;
        const offsetX = (Math.random() - 0.5) * 2 * mag;
        const offsetY = (Math.random() - 0.5) * 2 * mag;
        ctx.translate(offsetX, offsetY);
      }

      renderBackground();
      renderBestLine();
      renderObstacles();

      // Render coins
      for (const coin of coins) {
        coin.render(ctx);
      }

      // Render power-ups (Shield, Magnet)
      for (const p of powerUps) {
        p.render(ctx);
      }

      // Ghost silhouettes during transit
      if (player.ghostTrails.length > 0) {
        for (const g of player.ghostTrails) {
          renderPlayerFigure(g.x, g.y, g.rotation, g.phase, false, g.alpha * 0.45, 0);
        }
      }

      // Stick figure runner with landing squash & stretch
      if (state !== 'gameover' || hitStopTimer > 0) {
        renderPlayerFigure(
          player.x,
          player.y,
          player.rotation,
          player.animPhase,
          player.isGrounded,
          1.0,
          player.squashTimer,
          player.groundedSurface
        );
        renderFlipIndicatorNearPlayer();
      }

      renderParticles();
      renderSpeedUpBanner();
      renderMilestoneBanner();
      renderTutorialBanner();

      if (state === 'title') {
        renderTitleScreen();
      } else if (state === 'gameover') {
        renderGameOverScreen();
      }

      ctx.restore();

      renderPortraitHint();

      if (state === 'playing') {
        renderHUD();
      }

      // Screen-space UI (pause overlay, pause button, mute button)
      renderPauseOverlay();
      renderPauseButton();
      renderMuteButton();

      // Back-to-games link: visible ONLY on title and gameover screens
      const backLink = document.getElementById('back-link');
      if (backLink) {
        backLink.classList.toggle('hidden', state === 'playing');
      }

      requestAnimationFrame(gameLoop);
    }

    player.reset();
    requestAnimationFrame(gameLoop);

  })();
  </script>
