  <script>
  (function() {
    'use strict';

    // --- Audio System (Pure Web Audio API with procedural BGM & SFX) ---
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmPlaying = false;
        this.bgmStep = 0;
        this.nextNoteTime = 0;
        this.bpm = 118;
        this.currentTier = 0;
        try {
          const saved = localStorage.getItem('gravity_runner_muted');
          if (saved !== null) this.muted = (saved === 'true');
        } catch(e) {}
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);

            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
            this.sfxGain.connect(this.masterGain);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            this.bgmGain.connect(this.masterGain);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        try {
          localStorage.setItem('gravity_runner_muted', String(this.muted));
        } catch(e) {}
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);
        }
        return this.muted;
      }

      setBpm(newBpm) {
        this.bpm = newBpm;
      }

      setTier(tierIndex) {
        this.currentTier = Math.max(0, Math.min(3, tierIndex || 0));
      }

      startBgm() {
        this.init();
        if (this.bgmPlaying) return;
        this.bgmPlaying = true;
        this.bgmStep = 0;
        if (this.ctx) {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
        }
      }

      stopBgm() {
        this.bgmPlaying = false;
      }

      updateBgm() {
        if (this.muted || !this.ctx || !this.bgmPlaying) return;
        const currentTime = this.ctx.currentTime;
        const secondsPerStep = (60.0 / this.bpm) / 4; // 16th note

        while (this.nextNoteTime < currentTime + 0.12) {
          this.scheduleBgmStep(this.bgmStep, this.nextNoteTime);
          this.nextNoteTime += secondsPerStep;
          this.bgmStep = (this.bgmStep + 1) % 64; // 4 bars (16 steps each)
        }
      }

      scheduleBgmStep(step, time) {
        if (!this.ctx || !this.bgmGain) return;

        const bar = Math.floor(step / 16);
        const beatInBar = step % 16;
        const tier = this.currentTier;

        // 1. Kick Drum: Instrumentation evolves with tiers
        let isKick = false;
        let kickGainVal = 0.32;
        if (tier === 0) {
          // Tier 0 (Day): Soft kick on downbeats 0, 8 (half notes)
          isKick = (beatInBar === 0 || beatInBar === 8);
          kickGainVal = 0.28;
        } else if (tier === 1) {
          // Tier 1 (Sunset): Four-on-the-floor
          isKick = (beatInBar % 4 === 0);
          kickGainVal = 0.33;
        } else if (tier === 2) {
          // Tier 2 (Night/Neon): Punchy four-on-the-floor
          isKick = (beatInBar % 4 === 0);
          kickGainVal = 0.36;
        } else {
          // Tier 3 (Warning/Hyper): Four-on-the-floor with driving 14-step syncopated kick
          isKick = (beatInBar % 4 === 0 || beatInBar === 14);
          kickGainVal = 0.38;
        }

        if (isKick) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(tier >= 2 ? 125 : 110, time);
          osc.frequency.exponentialRampToValueAtTime(32, time + 0.07);
          gain.gain.setValueAtTime(kickGainVal, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.09);
        }

        // 2. Hi-hat: Evolves from silent in Tier 0 to 16th-note ride in Tier 3
        let isHiHat = false;
        let hatDecay = 0.025;
        let hatGain = 0.07;
        if (tier === 1) {
          // Offbeat 8th notes (2, 6, 10, 14)
          isHiHat = (beatInBar % 4 === 2);
          hatGain = 0.07;
        } else if (tier === 2) {
          // 16th notes on all even steps (0, 2, 4, 6, 8, 10, 12, 14)
          isHiHat = (beatInBar % 2 === 0);
          hatGain = (beatInBar % 4 === 2) ? 0.08 : 0.05;
        } else if (tier >= 3) {
          // Fast driving 16th hats with open hat accents
          isHiHat = (beatInBar % 2 === 0);
          const isOpen = (beatInBar === 2 || beatInBar === 10);
          hatDecay = isOpen ? 0.055 : 0.022;
          hatGain = isOpen ? 0.10 : 0.06;
        }

        if (isHiHat) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(tier >= 2 ? 1100 : 850, time);
          gain.gain.setValueAtTime(hatGain, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + hatDecay);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + hatDecay + 0.01);
        }

        // 3. Snare / Clap: Added in Tier 2 and Tier 3 on backbeats (4, 12)
        if (tier >= 2 && (beatInBar === 4 || beatInBar === 12)) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, time);
          osc.frequency.exponentialRampToValueAtTime(75, time + 0.06);
          gain.gain.setValueAtTime(tier >= 3 ? 0.18 : 0.14, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.07);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.08);
        }

        // 4. Bassline: Am - F - C - G progression (1 bar each)
        const rootFreqs = [55.0, 43.65, 65.4, 49.0];
        const currentRoot = rootFreqs[bar];

        let isBassStep = false;
        let bassFreq = currentRoot;
        if (tier === 0) {
          // Simple root notes on 0, 8
          isBassStep = (beatInBar === 0 || beatInBar === 8);
          bassFreq = currentRoot;
        } else if (tier === 1) {
          // Standard groove pattern on 0, 3, 6, 8, 11, 14
          isBassStep = (beatInBar === 0 || beatInBar === 3 || beatInBar === 6 || beatInBar === 8 || beatInBar === 11 || beatInBar === 14);
          const freqMultiplier = (beatInBar === 6 || beatInBar === 14) ? 2.0 : 1.0;
          bassFreq = currentRoot * freqMultiplier;
        } else if (tier === 2) {
          // Funk bass on 0, 2, 3, 6, 8, 10, 11, 14 with octave jumps
          isBassStep = (beatInBar === 0 || beatInBar === 2 || beatInBar === 3 || beatInBar === 6 || beatInBar === 8 || beatInBar === 10 || beatInBar === 11 || beatInBar === 14);
          const freqMultiplier = (beatInBar === 6 || beatInBar === 14) ? 2.0 : (beatInBar === 10 ? 1.5 : 1.0);
          bassFreq = currentRoot * freqMultiplier;
        } else {
          // Driving 16th acid bassline in Tier 3
          isBassStep = (beatInBar % 2 === 0 || beatInBar === 3 || beatInBar === 7 || beatInBar === 11 || beatInBar === 15);
          const freqMultiplier = (beatInBar % 4 === 2) ? 2.0 : 1.0;
          bassFreq = currentRoot * freqMultiplier;
        }

        if (isBassStep) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (tier === 0) ? 'triangle' : 'sawtooth';
          osc.frequency.setValueAtTime(bassFreq, time);

          const bassGainVal = (tier >= 2 ? 0.20 : 0.16);
          gain.gain.setValueAtTime(bassGainVal, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + (tier === 0 ? 0.16 : 0.11));
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.14);
        }

        // 5. Arpeggiated chime / synth melody
        let isChimeStep = false;
        if (tier === 0) {
          // Gentle chimes on steps 2, 7, 10
          isChimeStep = (beatInBar === 2 || beatInBar === 7 || beatInBar === 10);
        } else if (tier === 1) {
          // Standard arpeggio on 2, 5, 7, 10, 13
          isChimeStep = (beatInBar === 2 || beatInBar === 5 || beatInBar === 7 || beatInBar === 10 || beatInBar === 13);
        } else if (tier === 2) {
          // Upbeat syncopated melody
          isChimeStep = (beatInBar % 2 === 1 || beatInBar === 6 || beatInBar === 14);
        } else {
          // High octane arpeggio stream in Tier 3
          isChimeStep = (beatInBar % 2 === 1 || beatInBar % 4 === 2);
        }

        if (isChimeStep) {
          const pentatonicOffsets = [0, 3, 7, 10, 12, 15];
          const offsetIndex = (beatInBar * 3 + bar * 2) % pentatonicOffsets.length;
          const semitone = pentatonicOffsets[offsetIndex];
          const chimeFreq = currentRoot * 8 * Math.pow(2, semitone / 12);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (tier >= 2) ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(chimeFreq, time);
          gain.gain.setValueAtTime(tier >= 2 ? 0.09 : 0.07, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.1);
        }
      }

      canPlay(isStartSound = false) {
        if (this.muted || !this.ctx || !this.sfxGain) return false;
        if (!isStartSound && typeof state !== 'undefined' && state === 'title') return false;
        return true;
      }

      // --- Differentiated SFX with Balanced Levels ---
      playFlip(isToCeiling) {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          if (isToCeiling) {
            osc.frequency.setValueAtTime(280, t);
            osc.frequency.exponentialRampToValueAtTime(560, t + 0.16);
          } else {
            osc.frequency.setValueAtTime(540, t);
            osc.frequency.exponentialRampToValueAtTime(260, t + 0.16);
          }
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.20);
        } catch(e) {}
      }

      playLand() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(130, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.07);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.10);
        } catch(e) {}
      }

      playCrash() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, t);
          osc.frequency.exponentialRampToValueAtTime(26, t + 0.42);
          gain.gain.setValueAtTime(0.28, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.46);
        } catch(e) {}
      }

      playStart() {
        if (!this.canPlay(true)) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.14);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.2);
        } catch(e) {}
      }

      playCoin(streakStep = 0, multiplier = 1, isStar = false) {
        if (!this.canPlay()) return;
        if (isStar) {
          this.playGoldStar();
          return;
        }
        try {
          const t = this.ctx.currentTime;
          // Pentatonic scale ascending with consecutive pickups
          const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0];
          const stepIndex = Math.min(scale.length - 1, Math.max(0, streakStep));
          const f1 = scale[stepIndex];
          const f2 = f1 * 1.5; // Perfect 5th harmonic

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(f1, t);
          gain1.gain.setValueAtTime(0.15, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.1);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(f2, t + 0.025);
          gain2.gain.setValueAtTime(0.16, t + 0.025);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t + 0.025);
          osc2.stop(t + 0.14);
        } catch(e) {}
      }

      // Distinct, sparkling Gold Star sound (+50)
      playGoldStar() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [880, 1108.73, 1318.51, 1760, 2217.46, 2637.02]; // A5, C#6, E6, A6, C#7, E7
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const nStart = t + idx * 0.032;
            osc.frequency.setValueAtTime(freq, nStart);
            gain.gain.setValueAtTime(0.19, nStart);
            gain.gain.exponentialRampToValueAtTime(0.001, nStart + 0.17);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(nStart);
            osc.stop(nStart + 0.19);
          });
        } catch(e) {}
      }

      playPowerUp() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5, 1318.51]; // C major rising flourish
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const noteStart = t + idx * 0.04;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.20, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.16);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.18);
          });
        } catch(e) {}
      }

      playShieldBreak() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          // Glass shattering metallic burst
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(1050, t);
          osc1.frequency.exponentialRampToValueAtTime(150, t + 0.22);
          gain1.gain.setValueAtTime(0.26, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.25);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(1800, t);
          osc2.frequency.exponentialRampToValueAtTime(280, t + 0.17);
          gain2.gain.setValueAtTime(0.20, t);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t);
          osc2.stop(t + 0.20);
        } catch(e) {}
      }

      playMilestone() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [587.33, 739.99, 880, 1174.66]; // D, F#, A, D
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const noteStart = t + idx * 0.05;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.18, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.22);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.24);
          });
        } catch(e) {}
      }

      playBestRecord() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98]; // Celebratory fanfare
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const noteStart = t + idx * 0.045;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.22, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.25);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.28);
          });
        } catch(e) {}
      }

      // Enhanced Near Miss SFX (punchy whoosh + high crystalline chime)
      playNearMiss() {
        if (!this.canPlay()) return;
        try {
          const t = this.ctx.currentTime;
          // Punchy dynamic whoosh
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(340, t);
          osc1.frequency.exponentialRampToValueAtTime(70, t + 0.14);

      if (!hex || hex[0] !== '#') return [0, 0, 0];
      let h = hex.slice(1);
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

    }

      if (!c1 || !c2) return c2 || '#000000';
      const [r1, g1, b1] = hexToRgb(c1);
      const [r2, g2, b2] = hexToRgb(c2);
      return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);

        const steps = Math.max(20, Math.round(totalSimTime * 28));

            h: FIGURE_HALF_HEIGHT * 2 - 4

            if (obs.surface === 'floor') {
              simObsY = floorY - obs.h;
            } else if (obs.surface === 'ceiling') {
              simObsY = ceilingY;
            } else {
              simObsY = obs.baseY + Math.sin((gameTime + t) * obs.speedFactor + obs.phase) * obs.amplitude - (obs.h / 2);
            }

            const margin = 8;
            if (
              simHitbox.x < simObsX + obs.w + margin &&
              simHitbox.x + simHitbox.w > simObsX - margin &&
              simHitbox.y < simObsY + obs.h + margin &&
              simHitbox.y + simHitbox.h > simObsY - margin
            ) {
              return false; // Collision risk along simulated trajectory or post-landing!
            }
          }
        }
        return true;
      }

      // 3. Find immediate danger on CURRENT surface
      const threat = obstacles.find(o => {
        if (o.x + o.w <= player.x - 5) return false;
        if (o.surface === surf) return true;
        if (o.surface === 'moving') {
          const oy = o.getY();
          const targetY = (surf === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
          return Math.abs(oy + o.h / 2 - targetY) < 70;
        }
        return false;
      });

      if (threat) {
        const timeToHit = (threat.x - (player.x + 13)) / currentSpeed;

        // Escape time calculation based on obstacle height and gravity acceleration
        const obsH = threat.h || 40;
        const minEscapeTime = Math.max(0.38, Math.sqrt((obsH + 8) * 2 / GRAVITY_ACCEL) + 0.06);

        // Check for upcoming coin arc or gold star in front of the obstacle
        const coinInFront = coins.find(c => !c.collected && c.x >= player.x && c.x <= threat.x + 20);

        if (coinInFront) {
          // If coins/stars are present ahead, wait until takeoff sweet-spot (0.32 - 0.42s)
          // to ride the aerial coin arc and collect gold stars while clearing the obstacle
          const optimalCoinFlipTime = Math.max(minEscapeTime + 0.04, 0.40);
          if (timeToHit <= optimalCoinFlipTime && autopilotActionCooldown <= 0) {
            if (isSafeToFlip() || timeToHit <= minEscapeTime) {
              autopilotActionCooldown = Math.min(0.35, transitTime * 0.4);
              player.flip();
              return;
            }
          }
        } else {
          // Standard obstacle avoidance: react with safe lookahead
          const lookaheadTime = Math.max(0.54, Math.min(0.66, transitTime * 0.58));
          if (timeToHit <= lookaheadTime && autopilotActionCooldown <= 0) {
            if (isSafeToFlip() || timeToHit <= minEscapeTime) {
              autopilotActionCooldown = Math.min(0.35, transitTime * 0.4);
              player.flip();
              return;
            }
          }
        }
      }

      // 4. Safe Opportunistic Flip for Power-ups, Gold Stars, and Coins
      // Consider flipping if current surface is safe for at least 1.05s ahead
      const isCurrentSurfaceClear = !threat || ((threat.x - player.x) / currentSpeed > 1.05);

      if (isCurrentSurfaceClear && autopilotActionCooldown <= 0) {
        // (a) Target aerial Power-ups (Shield, Magnet)
        const powerUpAhead = powerUps.find(p => !p.collected && p.x > player.x + 20 && p.x < player.x + transitDist + 90);
        if (powerUpAhead && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }

        // (b) Target high-value Gold Stars (+50)
        const starAhead = coins.find(c => !c.collected && c.type === 'star' && c.x > player.x + 20 && c.x < player.x + transitDist + 90);
        if (starAhead && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }

        // (c) Target coins on opposite surface (Runway Coins) or aerial coin arcs
        const coinsAhead = coins.filter(c => !c.collected && c.x >= player.x + 20 && c.x <= player.x + transitDist + 80);
        if (coinsAhead.length >= 2 && isSafeToFlip()) {
          autopilotActionCooldown = 0.45;
          player.flip();
          return;
        }
      }
    }

    // --- Player Object ---
    const player = {
      x: PLAYER_X,
      y: 0,
      vy: 0,
      gravityDir: 1, // 1: towards floor, -1: towards ceiling
      isGrounded: true,
      rotation: 0,   // radians
      animPhase: 0,
      groundedSurface: 'floor', // 'floor' | 'ceiling'
      ghostTrails: [],
      flipBufferTimer: 0,
      squashTimer: 0,
      hasShield: false,
      invincibleTimer: 0,

      reset() {
        this.x = PLAYER_X;
        this.gravityDir = 1;
        this.isGrounded = true;
        this.groundedSurface = 'floor';
        this.y = floorY - FIGURE_HALF_HEIGHT;
        this.vy = 0;
        this.rotation = 0;
        this.animPhase = 0;
        this.ghostTrails = [];
        this.flipBufferTimer = 0;
        this.squashTimer = 0;
        this.hasShield = false;
        this.invincibleTimer = 0;
      },

      flip() {
        if (startInputLockTimer > 0) return false;
        if (!this.isGrounded) {
          // Responsive input buffer: tap arrives up to 0.12s before landing
          this.flipBufferTimer = FLIP_BUFFER_WINDOW;
          return false;
        }
        this.flipBufferTimer = 0;
        this.isGrounded = false;
        this.gravityDir = -this.gravityDir;
        this.vy = 0;
        this.squashTimer = 0;
        sound.playFlip(this.gravityDir === -1);

        // Juice: Minor screen shake and extra trails on flip
        addScreenShake(3.2, 0.12);
        for (let i = 0; i < 3; i++) {
          this.ghostTrails.push({
            x: this.x - i * 6,
            y: this.y,
            rotation: this.rotation,
            alpha: 0.5 - i * 0.12,
            phase: this.animPhase
          });
        }

        // Spawn takeoff dust particles
        spawnDustBurst(this.x, this.y + (this.gravityDir === -1 ? FIGURE_HALF_HEIGHT : -FIGURE_HALF_HEIGHT), 8, -this.gravityDir);

        // Tutorial step 1 progression
        if (isTutorialActive && tutorialStep === 1) {
          tutorialStep = 2;
          tutorialStepTimer = 0;
          sound.playTutorialChime();
        }
        return true;
      },

      update(dt) {
        this.x = PLAYER_X;

        // Running gait animation speed tied to game speed
        if (this.isGrounded) {
          const runFrequency = (currentSpeed / 270) * 16;
          this.animPhase += runFrequency * dt;
        }

        // Squash & invincibility countdown
        if (this.squashTimer > 0) {
          this.squashTimer = Math.max(0, this.squashTimer - dt);
        }
        if (this.invincibleTimer > 0) {
          this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
        }

        const floorCenterY = floorY - FIGURE_HALF_HEIGHT;
        const ceilingCenterY = ceilingY + FIGURE_HALF_HEIGHT;
        const totalTravel = floorCenterY - ceilingCenterY;

        if (!this.isGrounded) {
          // Accelerate gently toward target surface using true physical acceleration
          this.vy += GRAVITY_ACCEL * this.gravityDir * dt;
          if (Math.abs(this.vy) > MAX_VERTICAL_SPEED) {
            this.vy = Math.sign(this.vy) * MAX_VERTICAL_SPEED;
          }
          this.y += this.vy * dt;

          // Ghost trail record during transit
          if (Math.random() < 0.5) {
            this.ghostTrails.push({
              x: this.x,
              y: this.y,
              rotation: this.rotation,
              alpha: 0.4,
              phase: this.animPhase
            });
          }

          // Check landing on floor
          if (this.gravityDir === 1 && this.y >= floorCenterY) {
            this.y = floorCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'floor';
            this.rotation = 0;
            this.squashTimer = 0.16;
            sound.playLand();
            spawnDustBurst(this.x, floorY, 6, -1);

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }
          // Check landing on ceiling
          else if (this.gravityDir === -1 && this.y <= ceilingCenterY) {
            this.y = ceilingCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'ceiling';
            this.rotation = Math.PI;
            this.squashTimer = 0.16;
            sound.playLand();
            spawnDustBurst(this.x, ceilingY, 6, 1);

            // Tutorial Step 2 progression
            if (isTutorialActive && tutorialStep === 2) {
              tutorialStep = 3;
              tutorialStepTimer = 0;
              sound.playTutorialChime();
              spawnCoinArc(this.x + 130, 'ceiling', 'floor', 6);
            }

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }

          // In-flight countdown of input buffer window
          if (!this.isGrounded && this.flipBufferTimer > 0) {
            this.flipBufferTimer = Math.max(0, this.flipBufferTimer - dt);
          }

          // Smooth 180° rotation while in transit
          if (!this.isGrounded) {
            if (this.gravityDir === -1) {
              const p = Math.max(0, Math.min(1, (floorCenterY - this.y) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = ease * Math.PI;
            } else {
              const p = Math.max(0, Math.min(1, (this.y - ceilingCenterY) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = Math.PI + ease * Math.PI;
            }
          }
        } else {
          // Grounded
          if (this.groundedSurface === 'floor') {
            this.y = floorCenterY;
            this.rotation = 0;
          } else {
            this.y = ceilingCenterY;
            this.rotation = Math.PI;
          }
          this.vy = 0;
        }

        // Update ghost trails
        for (let i = this.ghostTrails.length - 1; i >= 0; i--) {
          this.ghostTrails[i].alpha -= dt * 2.4;
          this.ghostTrails[i].x -= currentSpeed * dt * 0.45;
          if (this.ghostTrails[i].alpha <= 0) {
            this.ghostTrails.splice(i, 1);
          }
        }
      },

      getHitbox() {
        return {
          x: this.x - 7,
          y: this.y - 17,
          w: 14,
          h: 34
        };
      }
    };
    playerInitialized = true;

    // --- Particle & Floating Popup Systems ---
    const MAX_PARTICLES = 120;
    let particles = [];
    let deathDebris = [];
    let popupTexts = [];

    function addParticle(p) {
      if (particles.length >= MAX_PARTICLES) {
        particles.shift();
      }
      particles.push(p);
    }

    function spawnDustBurst(x, y, count, normalY) {
      const n = prefersReducedMotion ? Math.max(1, Math.floor(count * 0.3)) : count;
      for (let i = 0; i < n; i++) {
        const angle = normalY > 0 ? (Math.PI * 0.2 + Math.random() * Math.PI * 0.6) : (-Math.PI * 0.2 - Math.random() * Math.PI * 0.6);
        const spd = 40 + Math.random() * 80;
        addParticle({
          type: 'dust',
          x: x + (Math.random() - 0.5) * 10,
          y: y,
          vx: Math.cos(angle) * spd - currentSpeed * 0.3,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 2.5,
          alpha: 0.8,
          life: 0.3 + Math.random() * 0.25
        });
      }
    }

    function spawnCoinSparkles(x, y, count = 8) {
      const n = prefersReducedMotion ? Math.max(2, Math.floor(count * 0.3)) : count;
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 50 + Math.random() * 110;
        addParticle({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 2.5,
          color: Math.random() < 0.5 ? '#f59e0b' : '#fbbf24',
          alpha: 1.0,
          life: 0.35 + Math.random() * 0.2
        });
      }
    }

    function spawnNearMissSparkles(x, y) {
      const n = prefersReducedMotion ? 4 : 14;
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 90 + Math.random() * 160;
        addParticle({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 3.0,
          color: Math.random() < 0.5 ? '#38bdf8' : '#0284c7',
          alpha: 1.0,
          life: 0.35 + Math.random() * 0.25
        });
      }
    }

    const MAX_ACTIVE_POPUPS = 3;
    function spawnPopupText(x, y, text, color = '#0284c7', fontSize = 14, isBold = true) {
      // 1. Strict limit on simultaneous active popups to prevent screen clutter
      while (popupTexts.length >= MAX_ACTIVE_POPUPS) {
        popupTexts.shift();
      }

      // 2. Vertical offset & overlap prevention:
      // If any active popup is horizontally close (within 140px), iteratively shift targetY
      // so no two popups share the same vertical band (minimum 26px spacing).
      const nearby = popupTexts.filter(p => Math.abs(p.x - x) < 140);
      let targetY = y;
      const minDistance = 26;

      let collided = true;
      let iterations = 0;
      while (collided && iterations < 8) {
        collided = false;
        iterations++;
        for (const other of nearby) {
          if (Math.abs(other.y - targetY) < minDistance) {
            // Shift upward if space permits, otherwise shift downward
            if (targetY < ceilingY + 36) {
              targetY = other.y + minDistance;
            } else {
              targetY = other.y - minDistance;
            }
            collided = true;
            break;
          }
        }
      }

      popupTexts.push({
        x: x,
        y: targetY,
        text: text,
        color: color,
        fontSize: fontSize,
        isBold: isBold,
        vy: -32,
        alpha: 1.0,
        life: 0.85
      });
    }

    function spawnShieldBreakParticles(x, y) {
      const n = prefersReducedMotion ? 5 : 18;
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 70 + Math.random() * 180;
        addParticle({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 3.5,
          color: Math.random() < 0.5 ? '#38bdf8' : (Math.random() < 0.5 ? '#bae6fd' : '#ffffff'),
          alpha: 1.0,
          life: 0.4 + Math.random() * 0.3
        });
      }
      if (!prefersReducedMotion) {
        addParticle({
          type: 'shockwave',
          x: x,
          y: y,
          r: 8,
          maxR: 45,
          alpha: 0.8,
          life: 0.3
        });
      }
    }

    function createDeathExplosion(p) {
      deathDebris = [];
      const segments = [
        { type: 'head', x: 0, y: -20, r: 6 },
        { type: 'torso', x1: 0, y1: -14, x2: 0, y2: 2 },
        { type: 'arm1', x1: 0, y1: -12, x2: -8, y2: -4 },
        { type: 'arm2', x1: 0, y1: -12, x2: 8, y2: -4 },
        { type: 'leg1', x1: 0, y1: 2, x2: -7, y2: 18 },
        { type: 'leg2', x1: 0, y1: 2, x2: 7, y2: 18 },
        { type: 'scarf', x1: -2, y1: -14, x2: -18, y2: -14 }
      ];

      for (const seg of segments) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 90 + Math.random() * 200;
        deathDebris.push({
          ...seg,
          originX: p.x,
          originY: p.y,
          rot: p.rotation,
          rotSpeed: (Math.random() - 0.5) * 14,
          vx: Math.cos(angle) * spd - 40,
          vy: Math.sin(angle) * spd,
          alpha: 1.0
        });
      }

      if (!prefersReducedMotion) {
        addParticle({
          type: 'shockwave',
          x: p.x,
          y: p.y,
          r: 10,
          maxR: 55,
          alpha: 0.9,
          life: 0.4
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life -= dt;
        if (pt.type === 'shockwave') {
          pt.r += (pt.maxR - pt.r) * 12 * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        } else {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        }
        if (pt.life <= 0 || pt.alpha <= 0 || pt.x < -100 || pt.x > virtualW + 100 || pt.y < -100 || pt.y > virtualH + 100) {
          particles.splice(i, 1);
        }
      }

      for (let i = deathDebris.length - 1; i >= 0; i--) {
        const d = deathDebris[i];
        d.originX += d.vx * dt;
        d.originY += d.vy * dt;
        d.rot += d.rotSpeed * dt;
        d.alpha -= dt * 0.8;
        if (d.alpha <= 0 || d.originX < -150 || d.originX > virtualW + 150 || d.originY < -150 || d.originY > virtualH + 150) {
          deathDebris.splice(i, 1);
        }
      }

      for (let i = popupTexts.length - 1; i >= 0; i--) {
        const pt = popupTexts[i];
        pt.y += pt.vy * dt;
        pt.life -= dt;
        pt.alpha = Math.max(0, pt.life / 0.85);
        if (pt.life <= 0) {
          popupTexts.splice(i, 1);
        }
      }
    }

    // --- Coins & Aerial Arc Trajectories ---
    let coins = [];

    class Coin {
      constructor(x, y, type = 'coin') {
        this.x = x;
        this.y = y;
        this.type = type; // 'coin' (normal aerial: 10), 'low' (runway: 5), 'star' (gold star: 50)
        this.value = (type === 'star') ? 50 : (type === 'low' ? 5 : 10);
        this.r = (type === 'star') ? 11 : (type === 'low' ? 7 : 8.5);
        this.collected = false;
        this.animPhase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.x -= currentSpeed * dt;
        this.animPhase += dt * (this.type === 'star' ? 4.5 : 5.5);

        // Magnet suction effect toward player
        if (magnetTimer > 0 && !this.collected) {
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 260) {
            const pullSpeed = Math.max(340, 850 * (1 - dist / 260));
            this.x += (dx / dist) * pullSpeed * dt;
            this.y += (dy / dist) * pullSpeed * dt;
          }
        }
      }

      render(ctx) {
        if (this.collected) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.type === 'star') {
          // Sparkling 5-point Gold Star (+50)
          const rot = this.animPhase * 1.5;
          ctx.rotate(rot);

          // Star outer glow
          ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 7, 0, Math.PI * 2);
          ctx.fill();

          // 5-point star geometry
          ctx.fillStyle = '#fbbf24';
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          const outerR = this.r;
          const innerR = this.r * 0.44;
          for (let i = 0; i < 10; i++) {
            const r = (i % 2 === 0) ? outerR : innerR;
            const a = (i * Math.PI) / 5 - Math.PI / 2;
            const sx = Math.cos(a) * r;
            const sy = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner gleam
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'low') {
          // Low-point runway coin (+5)
          const wScale = Math.abs(Math.sin(this.animPhase));
          const coinW = Math.max(2, this.r * wScale);

          ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW + 1, this.r + 1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fcd34d';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW, this.r, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Standard Aerial Coin (+10)
          const wScale = Math.abs(Math.sin(this.animPhase));
          const coinW = Math.max(2, this.r * wScale);

          ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
          ctx.beginPath();
          ctx.arc(0, 0, this.r + 5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW + 1, this.r + 1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.ellipse(0, 0, coinW, this.r, 0, 0, Math.PI * 2);
          ctx.fill();

          if (wScale > 0.35) {
            ctx.fillStyle = '#fffbeb';
            ctx.beginPath();
            ctx.ellipse(0, 0, Math.max(1, 2 * wScale), 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      collidesWith(hitbox) {
        if (this.collected) return false;
        // Expanded forgiving collection radius
        const closestX = Math.max(hitbox.x, Math.min(this.x, hitbox.x + hitbox.w));
        const closestY = Math.max(hitbox.y, Math.min(this.y, hitbox.y + hitbox.h));
        const dx = this.x - closestX;
        const dy = this.y - closestY;
        return (dx * dx + dy * dy) < (this.r + 14) * (this.r + 14);
      }
    }

    // --- Power-ups System (Shield & Magnet, Aerial Only) ---
    class PowerUp {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'shield' | 'magnet'
        this.r = 15;
        this.collected = false;
        this.animPhase = Math.random() * Math.PI * 2;
        totalPowerUpsSpawned++;
      }

      update(dt) {
        this.x -= currentSpeed * dt;
        this.animPhase += dt * 3.5;
      }

      render(ctx) {
        if (this.collected) return;
        const bounceY = this.y + Math.sin(this.animPhase) * 4;
        ctx.save();
        ctx.translate(this.x, bounceY);

        const isShield = (this.type === 'shield');
        const auraColor = isShield ? 'rgba(56, 189, 248, 0.35)' : 'rgba(239, 68, 68, 0.35)';
        const ringColor = isShield ? '#0284c7' : '#dc2626';

        // Outer pulsing aura
        ctx.fillStyle = auraColor;
        ctx.beginPath();
        ctx.arc(0, 0, this.r + 6, 0, Math.PI * 2);
        ctx.fill();

        // Round capsule badge
        ctx.fillStyle = isShield ? '#e0f2fe' : '#fee2e2';
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (isShield) {
          // Shield crest icon
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.moveTo(0, -9);
          ctx.lineTo(8, -6);
          ctx.lineTo(6, 4);
          ctx.lineTo(0, 9);
          ctx.lineTo(-6, 4);
          ctx.lineTo(-8, -6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#bae6fd';
          ctx.beginPath();
          ctx.moveTo(0, -7);
          ctx.lineTo(5, -5);
          ctx.lineTo(4, 2);
          ctx.lineTo(0, 6);
          ctx.closePath();
          ctx.fill();
        } else {
          // Magnet U-shape icon
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(0, -2, 8, Math.PI, 0, false);
          ctx.lineTo(8, 6);
          ctx.lineTo(4, 6);
          ctx.lineTo(4, -2);
          ctx.arc(0, -2, 4, 0, Math.PI, true);
          ctx.lineTo(-4, 6);
          ctx.lineTo(-8, 6);
          ctx.closePath();
          ctx.fill();

          // Silver contact tips
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(-8, 3, 4, 4);
          ctx.fillRect(4, 3, 4, 4);
        }

        ctx.restore();
      }

      collidesWith(hitbox) {
        if (this.collected) return false;
        const closestX = Math.max(hitbox.x, Math.min(this.x, hitbox.x + hitbox.w));
        const closestY = Math.max(hitbox.y, Math.min(this.y, hitbox.y + hitbox.h));
        const dx = this.x - closestX;
        const dy = this.y - closestY;
        return (dx * dx + dy * dy) < (this.r + 15) * (this.r + 15);
      }
    }

    // Trajectory calculation using true physical acceleration & max vertical speed derived from actual trackHeight
    function getFlipTrajectoryY(fromSurface, tRatio) {
      const isFromFloor = (fromSurface === 'floor');
      const startY = isFromFloor ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      const totalTravel = (floorY - FIGURE_HALF_HEIGHT) - (ceilingY + FIGURE_HALF_HEIGHT);
      const dir = isFromFloor ? -1 : 1;
      const totalT = getTransitTime();
      const t = Math.max(0, Math.min(totalT, tRatio * totalT));
      const tAcc = MAX_VERTICAL_SPEED / GRAVITY_ACCEL; // 0.68s
      const dAcc = 0.5 * GRAVITY_ACCEL * tAcc * tAcc;  // 231.2px
      let dy = 0;
      if (t <= tAcc) {
        dy = 0.5 * GRAVITY_ACCEL * t * t;
      } else {
        dy = dAcc + MAX_VERTICAL_SPEED * (t - tAcc);
      }
      return startY + dir * Math.min(totalTravel, dy);
    }

    function spawnCoinArc(startX, fromSurface, toSurface, count = 5) {
      const transitDist = currentSpeed * getTransitTime();
      for (let i = 0; i < count; i++) {
        const tRatio = (i + 1) / (count + 1);
        const cx = startX + tRatio * transitDist;
        const cy = getFlipTrajectoryY(fromSurface, tRatio);
        coins.push(new Coin(cx, cy, 'coin'));
      }
    }

    function spawnRunwayCoins(startX, surface, count = 3, type = 'low') {
      const cy = (surface === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      for (let i = 0; i < count; i++) {
        coins.push(new Coin(startX + i * 36, cy, type));
      }
    }

    function spawnGoldStar(x, y) {
      coins.push(new Coin(x, y, 'star'));
    }

    function maybeSpawnPowerUp(spawnX) {
      if (scoreMeters - lastPowerUpSpawnDist >= 440 + Math.random() * 80) {
        // Only in aerial space (between floor and ceiling)
        const airY = trackCenterY + (Math.random() < 0.5 ? -35 : 35);
        const type = (!player.hasShield && Math.random() < 0.6) ? 'shield' : 'magnet';
        powerUps.push(new PowerUp(spawnX, airY, type));
        lastPowerUpSpawnDist = scoreMeters;
      }
    }

    function updateCoins(dt) {
      // Countdown streak timer
      if (coinStreakTimer > 0) {
        coinStreakTimer -= dt;
        if (coinStreakTimer <= 0) {
          coinStreak = 0;
        }
      }

      const hitbox = player.getHitbox();

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.update(dt);

        if ((state === 'playing' || state === 'title') && !c.collected && c.collidesWith(hitbox)) {
          c.collected = true;

          if (state === 'playing') {
            coinsCollected++;

            // Consecutive pickup chain pitch elevation
            if (coinStreakTimer > 0) {
              coinStreak++;
            } else {
              coinStreak = 0;
            }
            coinStreakTimer = 0.85;

            // Combo progression
            comboCount++;
            comboMultiplier = getComboMultiplier(comboCount);
            comboTimer = 2.0; // Reset landing timer
            maxCombo = Math.max(maxCombo, comboCount);

            const isStar = (c.type === 'star');
            const baseGain = c.value;
            const gain = baseGain * comboMultiplier;
            gameScore += gain;

            sound.playCoin(coinStreak, comboMultiplier, isStar);

            if (isStar) {
              spawnNearMissSparkles(c.x, c.y);
              spawnPopupText(c.x, c.y - 16, `★ GOLD STAR! +${gain}`, '#f59e0b', 15, true);
            } else {
              spawnCoinSparkles(c.x, c.y);
              spawnPopupText(c.x, c.y - 12, `+${gain}`, c.type === 'low' ? '#fcd34d' : '#f59e0b', 13, true);
            }

            // Tutorial Step 3 progression
            if (isTutorialActive && tutorialStep === 3) {
              advanceTutorialToStep4();
            }
          } else {
            // Title screen demo pickup: sparkle effects only, zero score impact, no audio
            if (c.type === 'star') {
              spawnNearMissSparkles(c.x, c.y);
            } else {
              spawnCoinSparkles(c.x, c.y);
            }
          }
        }

        if (c.x < -60 || c.collected) {
          coins.splice(i, 1);
        }
      }
    }

    function updatePowerUps(dt) {
      if (magnetTimer > 0) {
        magnetTimer = Math.max(0, magnetTimer - dt);
      }

      const hitbox = player.getHitbox();

      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.update(dt);

        if ((state === 'playing' || state === 'title') && !p.collected && p.collidesWith(hitbox)) {

              spawnShieldBreakParticles(p.x, p.y);
              spawnPopupText(p.x, p.y - 18, '🛡️ SHIELD GET! (1被弾無効)', '#38bdf8', 15, true);
            } else if (p.type === 'magnet') {
              magnetTimer = 5.0;
              spawnNearMissSparkles(p.x, p.y);
              spawnPopupText(p.x, p.y - 18, '🧲 MAGNET GET! (5秒吸着)', '#ef4444', 15, true);
            }
          } else {
            // Title demo pickup: visual effect only
            spawnShieldBreakParticles(p.x, p.y);

        if (p.x < -60 || p.collected) {

    // --- Obstacle Generation & Passable Patterns ---
    let obstacles = [];
    let nextSpawnX = 0;
    let patternIndex = 0;

    class Obstacle {
      constructor(opts) {
        this.surface = opts.surface; // 'floor' | 'ceiling' | 'moving'
        this.type = opts.type;       // 'spike' | 'block' | 'moving'
        this.x = opts.x;
        this.w = opts.w || 36;
        this.h = opts.h || 40;
        this.baseY = opts.baseY || trackCenterY;
        this.amplitude = opts.amplitude || 55;
        this.speedFactor = opts.speedFactor || 3.2;
        this.phase = opts.phase || 0;
        this.nearMissAwarded = false;
        this.isTutorial = !!opts.isTutorial;
        if (!this.isTutorial) {
          totalObstaclesSpawned++;
        }
      }

      getY() {
        if (this.surface === 'floor') {
          return floorY - this.h;
        } else if (this.surface === 'ceiling') {
          return ceilingY;
        } else {
          return this.baseY + Math.sin(gameTime * this.speedFactor + this.phase) * this.amplitude - (this.h / 2);
        }
      }

      collidesWith(hitbox) {
        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        if (this.type === 'block') {
          const hx = ox + 3;
          const hy = oy + 3;
          const hw = ow - 6;
          const hh = oh - 6;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        } else if (this.type === 'spike') {
          const isFloor = (this.surface === 'floor');
          const baseH = oh * 0.42;
          const baseW = ow * 0.65;
          const baseX = ox + (ow - baseW) / 2;
          const baseY = isFloor ? (oy + oh - baseH) : oy;
          if (hitbox.x < baseX + baseW && hitbox.x + hitbox.w > baseX &&
              hitbox.y < baseY + baseH && hitbox.y + hitbox.h > baseY) {
            return true;
          }
          const tipH = oh * 0.58;
          const tipW = ow * 0.32;
          const tipX = ox + (ow - tipW) / 2;
          const tipY = isFloor ? oy : (oy + oh - tipH);
          if (hitbox.x < tipX + tipW && hitbox.x + hitbox.w > tipX &&
              hitbox.y < tipY + tipH && hitbox.y + hitbox.h > tipY) {
            return true;
          }
          return false;
        } else if (this.type === 'moving') {
          const hx = ox + 4;
          const hy = oy + 4;
          const hw = ow - 8;
          const hh = oh - 8;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        }
        return false;
      }

      // NEAR MISS detection: within 14px of obstacle edge without colliding
      checkNearMiss(hitbox) {
        if (this.nearMissAwarded) return false;

        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        let dx = 0;
        if (hitbox.x + hitbox.w < ox) {
          dx = ox - (hitbox.x + hitbox.w);
        } else if (hitbox.x > ox + ow) {
          dx = hitbox.x - (ox + ow);
        }

        let dy = 0;
        if (hitbox.y + hitbox.h < oy) {
          dy = oy - (hitbox.y + hitbox.h);
        } else if (hitbox.y > oy + oh) {
          dy = hitbox.y - (oy + oh);
        }

        if (dx === 0 && dy === 0) return false; // Overlap is handled by collision

        const dist = Math.hypot(dx, dy);
        if (dist <= 14) {
          this.nearMissAwarded = true;
          return true;
        }
        return false;
      }
    }

    function resetObstacles() {
      obstacles = [];
      coins = [];
      powerUps = [];
      magnetTimer = 0;
      nextSpawnX = virtualW + 40;
      patternIndex = 0;
      totalObstaclesSpawned = 0;
      totalPowerUpsSpawned = 0;
    }

    function spawnNextPattern() {
      if (isTutorialActive) return; // Completely obstacle-free during tutorial guided zone

      const transitDist = currentSpeed * getTransitTime();
      const isFirst60s = (gameTime < 60 || scoreMeters < 300);
      const isTier3Plus = (currentTierIndex >= 2 || scoreMeters >= 700);
      const isTier4 = (currentTierIndex >= 3 || scoreMeters >= 1200);

      // Breathing zone (息継ぎ区間): 1.0s before each tier boundary (300, 700, 1200m), do NOT spawn obstacles.
      // Account for pattern width so preceding multi-obstacle patterns never encroach into the 1.0s breathing window.
      const tierBoundaries = [300, 700, 1200];
      const nextSpawnDistMeters = scoreMeters + (nextSpawnX - player.x) / 24;
      const graceDistMeters = (currentSpeed * 1.0) / 24; // Distance traveled in 1.0 second
      const patternMarginMeters = 14; // Prevents preceding pattern tail from intruding into breathing zone
      for (const boundary of tierBoundaries) {
        if (nextSpawnDistMeters >= (boundary - graceDistMeters - patternMarginMeters) && nextSpawnDistMeters <= boundary + 2) {
          const skipMeters = (boundary + 3.0) - scoreMeters;
          if (skipMeters > 0) {
            nextSpawnX = Math.max(nextSpawnX, player.x + skipMeters * 24 + 40);
          }
          return;
        }
      }

      // Chance to spawn aerial Power-Up in the gap
      maybeSpawnPowerUp(nextSpawnX + transitDist * 0.4);

      let minRunBuffer = Math.max(180, currentSpeed * 0.52);
      if (isFirst60s) {
        minRunBuffer = Math.max(260, currentSpeed * 0.7);
      } else if (isTier3Plus) {
        minRunBuffer = Math.max(110, currentSpeed * 0.32);
      }

      let choices = [0, 1];
      if (!isFirst60s) {
        choices = [0, 1, 2, 3, 4, 5, 6, 7];
        if (scoreMeters >= 380) choices.push(8); // Moving energy hazard
        if (scoreMeters >= 580) choices.push(9); // Zigzag rhythm run
        if (scoreMeters >= 700) choices.push(10); // Narrow tunnel challenge
        if (isTier4) {
          // New pattern: Triple alternating gates in Tier 4
          choices.push(11, 11);
        }
      } else {
        choices = [0, 1, 2, 3];
      }

      const patternChoice = choices[Math.floor(Math.random() * choices.length)];

      switch (patternChoice) {
        case 0: {
          // Floor Block
          obstacles.push(new Obstacle({
            surface: 'floor',
            type: 'block',
            x: nextSpawnX,
            w: 36,
            h: 40
          }));
          spawnRunwayCoins(nextSpawnX - 110, 'floor', 3, 'low');
          spawnGoldStar(nextSpawnX + 18, floorY - 56);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'floor', 'ceiling', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 50, 'ceiling', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 120;
          break;
        }

        case 1: {
          // Ceiling Block
          obstacles.push(new Obstacle({
            surface: 'ceiling',
            type: 'block',
            x: nextSpawnX,
            w: 36,
            h: 40
          }));
          spawnRunwayCoins(nextSpawnX - 110, 'ceiling', 3, 'low');
          spawnGoldStar(nextSpawnX + 18, ceilingY + 56);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'ceiling', 'floor', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 50, 'floor', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 120;
          break;
        }

        case 2: {
          // Floor Spike
          obstacles.push(new Obstacle({
            surface: 'floor',
            type: 'spike',
            x: nextSpawnX,
            w: 30,
            h: 38
          }));
          spawnRunwayCoins(nextSpawnX - 90, 'floor', 2, 'low');
          spawnGoldStar(nextSpawnX + 15, floorY - 52);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'floor', 'ceiling', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 40, 'ceiling', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 120;
          break;
        }

        case 3: {
          // Ceiling Spike
          obstacles.push(new Obstacle({
            surface: 'ceiling',
            type: 'spike',
            x: nextSpawnX,
            w: 30,
            h: 38
          }));
          spawnRunwayCoins(nextSpawnX - 90, 'ceiling', 2, 'low');
          spawnGoldStar(nextSpawnX + 15, ceilingY + 52);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'ceiling', 'floor', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 40, 'floor', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 120;
          break;
        }

        case 4: {
          // Floor Block -> Runway -> Ceiling Block
          obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 40, h: 46 }));
          spawnGoldStar(nextSpawnX + 20, floorY - 60);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.26, 'floor', 'ceiling', 4);

          const ceilingX = nextSpawnX + transitDist + minRunBuffer;
          spawnRunwayCoins(nextSpawnX + transitDist + 20, 'ceiling', 3, 'low');
          obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: ceilingX, w: 40, h: 46 }));
          spawnGoldStar(ceilingX + 20, ceilingY + 60);
          spawnCoinArc(ceilingX - currentSpeed * 0.26, 'ceiling', 'floor', 4);
          spawnRunwayCoins(ceilingX + transitDist + 40, 'floor', 3, 'low');

          nextSpawnX = ceilingX + transitDist + minRunBuffer + 130;

        case 5: {
          // Double Spikes on Floor
          obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX, w: 26, h: 36 }));
          obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX + 32, w: 26, h: 36 }));
          spawnRunwayCoins(nextSpawnX - 100, 'floor', 3, 'low');
          spawnGoldStar(nextSpawnX + 29, floorY - 52);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'floor', 'ceiling', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 50, 'ceiling', 3, 'low');

          obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX, w: 26, h: 36 }));
          obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX + 32, w: 26, h: 36 }));
          spawnRunwayCoins(nextSpawnX - 100, 'ceiling', 3, 'low');
          spawnGoldStar(nextSpawnX + 29, ceilingY + 52);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'ceiling', 'floor', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 50, 'floor', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 120;
          break;
        }

        case 7: {
          // Tall Floor Pillar (80px)
          obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 38, h: 78 }));
          spawnRunwayCoins(nextSpawnX - 110, 'floor', 3, 'low');
          spawnGoldStar(nextSpawnX + 19, floorY - 96);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'floor', 'ceiling', 5);
          spawnRunwayCoins(nextSpawnX + transitDist + 40, 'ceiling', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 130;
          break;

        case 8: {
          // Oscillating Energy Core (Faster in Tier 3+)
          const spdFactor = isTier3Plus ? 4.8 : 3.4;
          const amp = isTier3Plus ? 64 : 52;
          obstacles.push(new Obstacle({
            surface: 'moving',
            type: 'moving',
            x: nextSpawnX,
            w: 36,
            h: 36,
            baseY: trackCenterY,
            amplitude: amp,
            speedFactor: spdFactor,
            phase: Math.random() * Math.PI * 2
          }));
          spawnGoldStar(nextSpawnX + 18, trackCenterY - amp - 14);
          spawnRunwayCoins(nextSpawnX - 50, 'floor', 3, 'low');
          spawnRunwayCoins(nextSpawnX + 50, 'floor', 3, 'low');
          spawnRunwayCoins(nextSpawnX - 50, 'ceiling', 3, 'low');
          spawnRunwayCoins(nextSpawnX + 50, 'ceiling', 3, 'low');
          nextSpawnX += transitDist + minRunBuffer + 140;
          break;
        }

        case 9: {
          // Zigzag Sequence: Floor -> Ceiling -> Floor
          const gap = transitDist + minRunBuffer * 0.95;
          obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX, w: 30, h: 38 }));
          spawnGoldStar(nextSpawnX + 15, floorY - 52);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.26, 'floor', 'ceiling', 4);

          obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX + gap, w: 30, h: 38 }));
          spawnGoldStar(nextSpawnX + gap + 15, ceilingY + 52);
          spawnCoinArc(nextSpawnX + gap - currentSpeed * 0.26, 'ceiling', 'floor', 4);

          obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX + gap * 2, w: 30, h: 38 }));
          spawnGoldStar(nextSpawnX + gap * 2 + 15, floorY - 52);
          spawnCoinArc(nextSpawnX + gap * 2 - currentSpeed * 0.26, 'floor', 'ceiling', 4);

          nextSpawnX += gap * 2 + transitDist + minRunBuffer + 150;
          break;
        }

        case 10: {
          // Narrow Tunnel Timing Challenge
          obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 46, h: 48 }));
          spawnCoinArc(nextSpawnX - currentSpeed * 0.28, 'floor', 'ceiling', 4);

          const tunnelCeilingX = nextSpawnX + transitDist + Math.max(90, currentSpeed * 0.28);
          obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: tunnelCeilingX, w: 46, h: 48 }));
          spawnGoldStar((nextSpawnX + tunnelCeilingX) / 2, trackCenterY);
          spawnCoinArc(tunnelCeilingX - currentSpeed * 0.28, 'ceiling', 'floor', 4);

          nextSpawnX = tunnelCeilingX + transitDist + minRunBuffer + 150;
          break;
        }

        case 11: {
          // Triple Alternating Gates (Tier 4 Peak Challenge)
          // 3 consecutive short tunnels alternating Floor -> Ceiling -> Floor
          const gateGap = transitDist + Math.max(80, currentSpeed * 0.22);

          // Gate 1: Floor short tunnel (Floor block)
          obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 38, h: 48 }));
          spawnGoldStar(nextSpawnX + 19, floorY - 56);
          spawnCoinArc(nextSpawnX - currentSpeed * 0.25, 'floor', 'ceiling', 4);

          // Gate 2: Ceiling short tunnel (Ceiling block)
          const gate2X = nextSpawnX + gateGap;
