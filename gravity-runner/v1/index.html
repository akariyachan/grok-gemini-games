<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>重力反転ランナー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230284c7'/><path d='M16 6 L22 13 L18 13 L18 26 L14 26 L14 13 L10 13 Z' fill='%23ffffff'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <script>
  (function() {
    'use strict';

    // --- Audio System (Pure Web Audio API with procedural BGM & SFX) ---
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.bgmPlaying = false;
        this.bgmStep = 0;
        this.nextNoteTime = 0;
        this.bpm = 118;
        try {
          const saved = localStorage.getItem('gravity_runner_muted');
          if (saved !== null) this.muted = (saved === 'true');
        } catch(e) {}
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);

            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
            this.sfxGain.connect(this.masterGain);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            this.bgmGain.connect(this.masterGain);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        try {
          localStorage.setItem('gravity_runner_muted', String(this.muted));
        } catch(e) {}
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);
        }
        return this.muted;
      }

      setBpm(newBpm) {
        this.bpm = newBpm;
      }

      startBgm() {
        this.init();
        if (this.bgmPlaying) return;
        this.bgmPlaying = true;
        this.bgmStep = 0;
        if (this.ctx) {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
        }
      }

      stopBgm() {
        this.bgmPlaying = false;
      }

      updateBgm() {
        if (this.muted || !this.ctx || !this.bgmPlaying) return;
        const currentTime = this.ctx.currentTime;
        const secondsPerStep = (60.0 / this.bpm) / 4; // 16th note

        while (this.nextNoteTime < currentTime + 0.12) {
          this.scheduleBgmStep(this.bgmStep, this.nextNoteTime);
          this.nextNoteTime += secondsPerStep;
          this.bgmStep = (this.bgmStep + 1) % 64; // 4 bars (16 steps each)
        }
      }

      scheduleBgmStep(step, time) {
        if (!this.ctx || !this.bgmGain) return;

        const bar = Math.floor(step / 16);
        const beatInBar = step % 16;

        // 1. Drum: Kick on 0, 4, 8, 12 (Four-on-the-floor)
        if (beatInBar % 4 === 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115, time);
          osc.frequency.exponentialRampToValueAtTime(32, time + 0.07);
          gain.gain.setValueAtTime(0.35, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.09);
        }

        // 2. Drum: Hi-hat on offbeats (2, 6, 10, 14)
        if (beatInBar % 4 === 2) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, time);
          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.03);
        }

        // 3. Bassline: Am - F - C - G progression (1 bar each)
        // Root frequencies: A1=55, F1=43.65, C2=65.4, G1=49.0
        const rootFreqs = [55.0, 43.65, 65.4, 49.0];
        const currentRoot = rootFreqs[bar];

        // Bass groove pattern on steps 0, 3, 6, 8, 11, 14
        const isBassStep = (beatInBar === 0 || beatInBar === 3 || beatInBar === 6 || beatInBar === 8 || beatInBar === 11 || beatInBar === 14);
        if (isBassStep) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const freqMultiplier = (beatInBar === 6 || beatInBar === 14) ? 2.0 : 1.0;
          osc.frequency.setValueAtTime(currentRoot * freqMultiplier, time);

          gain.gain.setValueAtTime(0.18, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.14);
        }

        // 4. Arpeggiated high chime melody on selected syncopated steps
        const isChimeStep = (beatInBar === 2 || beatInBar === 5 || beatInBar === 7 || beatInBar === 10 || beatInBar === 13);
        if (isChimeStep) {
          const pentatonicOffsets = [0, 3, 7, 10, 12];
          const offsetIndex = (beatInBar * 3 + bar) % pentatonicOffsets.length;
          const semitone = pentatonicOffsets[offsetIndex];
          const chimeFreq = currentRoot * 8 * Math.pow(2, semitone / 12); // High register

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(chimeFreq, time);
          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
          osc.connect(gain);
          gain.connect(this.bgmGain);
          osc.start(time);
          osc.stop(time + 0.1);
        }
      }

      playFlip(isToCeiling) {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          if (isToCeiling) {
            osc.frequency.setValueAtTime(260, t);
            osc.frequency.exponentialRampToValueAtTime(540, t + 0.18);
          } else {
            osc.frequency.setValueAtTime(500, t);
            osc.frequency.exponentialRampToValueAtTime(240, t + 0.18);
          }
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.24);
        } catch(e) {}
      }

      playLand() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(45, t + 0.08);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.12);
        } catch(e) {}
      }

      playCrash() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(28, t + 0.38);
          gain.gain.setValueAtTime(0.26, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.44);
        } catch(e) {}
      }

      playStart() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.14);
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.2);
        } catch(e) {}
      }

      playCoin(multiplier = 1) {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const pitchFactor = Math.min(1.6, 1.0 + (multiplier - 1) * 0.12);
          const f1 = 880 * pitchFactor;
          const f2 = 1320 * pitchFactor;

          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(f1, t);
          gain1.gain.setValueAtTime(0.14, t);
          gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc1.connect(gain1);
          gain1.connect(this.sfxGain);
          osc1.start(t);
          osc1.stop(t + 0.11);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(f2, t + 0.04);
          gain2.gain.setValueAtTime(0.16, t + 0.04);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc2.connect(gain2);
          gain2.connect(this.sfxGain);
          osc2.start(t + 0.04);
          osc2.stop(t + 0.16);
        } catch(e) {}
      }

      playNearMiss() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1200, t);
          osc.frequency.exponentialRampToValueAtTime(2600, t + 0.05);
          osc.frequency.exponentialRampToValueAtTime(700, t + 0.13);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.16);
        } catch(e) {}
      }

      playSpeedUp() {
        if (this.muted || !this.ctx || !this.sfxGain) return;
        try {
          const t = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const noteStart = t + idx * 0.045;
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.12, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.12);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(noteStart);
            osc.stop(noteStart + 0.13);
          });
        } catch(e) {}
      }
    }

    const sound = new SoundFx();

    // --- Speed Tiers ---
    const SPEED_TIERS = [
      { minMeters: 0,    name: 'NORMAL', bpm: 118, accent: '#0284c7', bgTone: '#f8fafc', trackTone: '#f1f5f9' },
      { minMeters: 400,  name: 'FAST',   bpm: 132, accent: '#8b5cf6', bgTone: '#faf5ff', trackTone: '#f3e8ff' },
      { minMeters: 900,  name: 'TURBO',  bpm: 148, accent: '#f97316', bgTone: '#fff7ed', trackTone: '#ffedd5' },
      { minMeters: 1500, name: 'HYPER',  bpm: 165, accent: '#ec4899', bgTone: '#fdf2f8', trackTone: '#fce7f3' }
    ];
    let currentTierIndex = 0;

    // --- Canvas & Responsive Scaling ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    let dpr = 1;
    let renderScale = 1;
    const MIN_VIRTUAL_W = 800;
    const MIN_VIRTUAL_H = 500;
    let virtualW = MIN_VIRTUAL_W;
    let virtualH = MIN_VIRTUAL_H;
    let playerInitialized = false;
    let isPortrait = false;

    // Track vertical bounds (in virtual coordinates)
    const TRACK_HEIGHT = 300;
    let trackCenterY = 250;
    let ceilingY = 100;
    let floorY = 400;

    function handleResize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvasWidth = w;
      canvasHeight = h;
      isPortrait = (h > w);

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      // Always guarantee at least 800px virtual width for gameplay visibility
      renderScale = Math.min((w * dpr) / MIN_VIRTUAL_W, (h * dpr) / MIN_VIRTUAL_H);
      if (renderScale <= 0) renderScale = 1;

      virtualW = (w * dpr) / renderScale;
      virtualH = (h * dpr) / renderScale;

      trackCenterY = virtualH / 2;
      ceilingY = trackCenterY - (TRACK_HEIGHT / 2);
      floorY = trackCenterY + (TRACK_HEIGHT / 2);

      if (playerInitialized && player && player.isGrounded) {
        player.y = (player.groundedSurface === 'floor') ? (floorY - FIGURE_HALF_HEIGHT) : (ceilingY + FIGURE_HALF_HEIGHT);
      }
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    handleResize();

    // --- High Score Persistence (Score-based with backwards compatibility) ---
    const STORAGE_KEY = 'gravity_runner_best_score';
    let bestScore = 0;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        bestScore = parseInt(saved, 10) || 0;
      }
    } catch(e) {}

    // --- Game State & Metrics ---
    let state = 'title'; // 'title' | 'playing' | 'gameover'
    let gameScore = 0;
    let scoreMeters = 0;
    let coinsCollected = 0;
    let nearMissCount = 0;
    let comboCount = 0;
    let comboMultiplier = 1;
    let comboTimer = 0;
    let maxCombo = 0;
    let isNewBest = false;
    let gameOverTimer = 0;
    let gameTime = 0;
    const GAME_OVER_INPUT_LOCK = 0.6; // 0.6s input lock after game over

    // Juice timers
    let hitStopTimer = 0;
    let screenShake = { timer: 0, duration: 0, intensity: 0 };
    let speedUpBanner = { active: false, timer: 0, name: '' };

    function addScreenShake(intensity, duration) {
      screenShake.intensity = Math.max(screenShake.intensity, intensity);
      screenShake.duration = Math.max(screenShake.duration, duration);
      screenShake.timer = Math.max(screenShake.timer, duration);
    }

    function getComboMultiplier(combo) {
      if (combo >= 4) return 5;
      if (combo === 3) return 3;
      if (combo === 2) return 2;
      return 1;
    }

    // Speed configuration
    const SPEED_INITIAL = 270; // px/s
    const SPEED_MAX = 540;     // px/s
    const SPEED_RAMP_METERS = 1400;
    let currentSpeed = SPEED_INITIAL;

    // Physics parameters (soft floaty gravity)
    const GRAVITY_ACCEL = 1000; // px/s^2
    const MAX_VERTICAL_SPEED = 680;
    const FIGURE_HALF_HEIGHT = 21;
    const PLAYER_X = 84;
    const FLIP_BUFFER_WINDOW = 0.12; // 0.12s input buffer window before landing

    // --- Player Object ---
    const player = {
      x: PLAYER_X,
      y: 0,
      vy: 0,
      gravityDir: 1, // 1: towards floor, -1: towards ceiling
      isGrounded: true,
      rotation: 0,   // radians
      animPhase: 0,
      groundedSurface: 'floor', // 'floor' | 'ceiling'
      ghostTrails: [],
      flipBufferTimer: 0,
      squashTimer: 0,

      reset() {
        this.x = PLAYER_X;
        this.gravityDir = 1;
        this.isGrounded = true;
        this.groundedSurface = 'floor';
        this.y = floorY - FIGURE_HALF_HEIGHT;
        this.vy = 0;
        this.rotation = 0;
        this.animPhase = 0;
        this.ghostTrails = [];
        this.flipBufferTimer = 0;
        this.squashTimer = 0;
      },

      flip() {
        if (!this.isGrounded) {
          // Responsive input buffer: tap arrives up to 0.12s before landing
          this.flipBufferTimer = FLIP_BUFFER_WINDOW;
          return false;
        }
        this.flipBufferTimer = 0;
        this.isGrounded = false;
        this.gravityDir = -this.gravityDir;
        this.vy = 0;
        this.squashTimer = 0;
        sound.playFlip(this.gravityDir === -1);

        // Juice: Minor screen shake and extra trails on flip
        addScreenShake(3.2, 0.12);
        for (let i = 0; i < 3; i++) {
          this.ghostTrails.push({
            x: this.x - i * 6,
            y: this.y,
            rotation: this.rotation,
            alpha: 0.5 - i * 0.12,
            phase: this.animPhase
          });
        }

        // Spawn takeoff dust particles
        spawnDustBurst(this.x, this.y + (this.gravityDir === -1 ? FIGURE_HALF_HEIGHT : -FIGURE_HALF_HEIGHT), 8, -this.gravityDir);
        return true;
      },

      update(dt) {
        this.x = PLAYER_X;

        // Running gait animation speed tied to game speed
        if (this.isGrounded) {
          const runFrequency = (currentSpeed / 270) * 16;
          this.animPhase += runFrequency * dt;
        }

        // Squash timer countdown
        if (this.squashTimer > 0) {
          this.squashTimer = Math.max(0, this.squashTimer - dt);
        }

        const floorCenterY = floorY - FIGURE_HALF_HEIGHT;
        const ceilingCenterY = ceilingY + FIGURE_HALF_HEIGHT;
        const totalTravel = floorCenterY - ceilingCenterY;

        if (!this.isGrounded) {
          // Accelerate gently toward target surface
          this.vy += GRAVITY_ACCEL * this.gravityDir * dt;
          if (Math.abs(this.vy) > MAX_VERTICAL_SPEED) {
            this.vy = Math.sign(this.vy) * MAX_VERTICAL_SPEED;
          }
          this.y += this.vy * dt;

          // Ghost trail record during transit
          if (Math.random() < 0.5) {
            this.ghostTrails.push({
              x: this.x,
              y: this.y,
              rotation: this.rotation,
              alpha: 0.4,
              phase: this.animPhase
            });
          }

          // Check landing on floor
          if (this.gravityDir === 1 && this.y >= floorCenterY) {
            this.y = floorCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'floor';
            this.rotation = 0;
            this.squashTimer = 0.16; // Squash & stretch on landing
            sound.playLand();
            spawnDustBurst(this.x, floorY, 6, -1);

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }
          // Check landing on ceiling
          else if (this.gravityDir === -1 && this.y <= ceilingCenterY) {
            this.y = ceilingCenterY;
            this.vy = 0;
            this.isGrounded = true;
            this.groundedSurface = 'ceiling';
            this.rotation = Math.PI;
            this.squashTimer = 0.16; // Squash & stretch on landing
            sound.playLand();
            spawnDustBurst(this.x, ceilingY, 6, 1);

            // Execute buffered flip if a tap arrived within buffer window
            if (this.flipBufferTimer > 0) {
              this.flipBufferTimer = 0;
              this.flip();
            }
          }

          // In-flight countdown of input buffer window
          if (!this.isGrounded && this.flipBufferTimer > 0) {
            this.flipBufferTimer = Math.max(0, this.flipBufferTimer - dt);
          }

          // Smooth 180° rotation while in transit
          if (!this.isGrounded) {
            if (this.gravityDir === -1) {
              const p = Math.max(0, Math.min(1, (floorCenterY - this.y) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = ease * Math.PI;
            } else {
              const p = Math.max(0, Math.min(1, (this.y - ceilingCenterY) / totalTravel));
              const ease = p * p * (3 - 2 * p);
              this.rotation = Math.PI + ease * Math.PI;
            }
          }
        } else {
          // Grounded
          if (this.groundedSurface === 'floor') {
            this.y = floorCenterY;
            this.rotation = 0;
          } else {
            this.y = ceilingCenterY;
            this.rotation = Math.PI;
          }
          this.vy = 0;
        }

        // Update ghost trails
        for (let i = this.ghostTrails.length - 1; i >= 0; i--) {
          this.ghostTrails[i].alpha -= dt * 2.4;
          this.ghostTrails[i].x -= currentSpeed * dt * 0.45;
          if (this.ghostTrails[i].alpha <= 0) {
            this.ghostTrails.splice(i, 1);
          }
        }
      },

      getHitbox() {
        return {
          x: this.x - 7,
          y: this.y - 17,
          w: 14,
          h: 34
        };
      }
    };
    playerInitialized = true;

    // --- Particle & Floating Popup Systems ---
    let particles = [];
    let deathDebris = [];
    let popupTexts = [];

    function spawnDustBurst(x, y, count, normalY) {
      for (let i = 0; i < count; i++) {
        const angle = normalY > 0 ? (Math.PI * 0.2 + Math.random() * Math.PI * 0.6) : (-Math.PI * 0.2 - Math.random() * Math.PI * 0.6);
        const spd = 40 + Math.random() * 80;
        particles.push({
          type: 'dust',
          x: x + (Math.random() - 0.5) * 10,
          y: y,
          vx: Math.cos(angle) * spd - currentSpeed * 0.3,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 2.5,
          alpha: 0.8,
          life: 0.3 + Math.random() * 0.25
        });
      }
    }

    function spawnCoinSparkles(x, y, count = 7) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 50 + Math.random() * 110;
        particles.push({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 2.5,
          color: Math.random() < 0.5 ? '#f59e0b' : '#fbbf24',
          alpha: 1.0,
          life: 0.35 + Math.random() * 0.2
        });
      }
    }

    function spawnNearMissSparkles(x, y) {
      for (let i = 0; i < 9; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 80 + Math.random() * 140;
        particles.push({
          type: 'sparkle',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2 + Math.random() * 2.5,
          color: '#38bdf8',
          alpha: 1.0,
          life: 0.3 + Math.random() * 0.2
        });
      }
    }

    function spawnPopupText(x, y, text, color = '#0284c7', fontSize = 14, isBold = true) {
      popupTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        fontSize: fontSize,
        isBold: isBold,
        vy: -40,
        alpha: 1.0,
        life: 0.85
      });
    }

    function createDeathExplosion(p) {
      deathDebris = [];
      const segments = [
        { type: 'head', x: 0, y: -20, r: 6 },
        { type: 'torso', x1: 0, y1: -14, x2: 0, y2: 2 },
        { type: 'arm1', x1: 0, y1: -12, x2: -8, y2: -4 },
        { type: 'arm2', x1: 0, y1: -12, x2: 8, y2: -4 },
        { type: 'leg1', x1: 0, y1: 2, x2: -7, y2: 18 },
        { type: 'leg2', x1: 0, y1: 2, x2: 7, y2: 18 },
        { type: 'scarf', x1: -2, y1: -14, x2: -18, y2: -14 }
      ];

      for (const seg of segments) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 90 + Math.random() * 200;
        deathDebris.push({
          ...seg,
          originX: p.x,
          originY: p.y,
          rot: p.rotation,
          rotSpeed: (Math.random() - 0.5) * 14,
          vx: Math.cos(angle) * spd - 40,
          vy: Math.sin(angle) * spd,
          alpha: 1.0
        });
      }

      particles.push({
        type: 'shockwave',
        x: p.x,
        y: p.y,
        r: 10,
        maxR: 55,
        alpha: 0.9,
        life: 0.4
      });
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life -= dt;
        if (pt.type === 'shockwave') {
          pt.r += (pt.maxR - pt.r) * 12 * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        } else {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.alpha = Math.max(0, pt.life / 0.4);
        }
        if (pt.life <= 0 || pt.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      for (let i = deathDebris.length - 1; i >= 0; i--) {
        const d = deathDebris[i];
        d.originX += d.vx * dt;
        d.originY += d.vy * dt;
        d.rot += d.rotSpeed * dt;
        d.alpha -= dt * 0.6;
        if (d.alpha <= 0) {
          deathDebris.splice(i, 1);
        }
      }

      for (let i = popupTexts.length - 1; i >= 0; i--) {
        const pt = popupTexts[i];
        pt.y += pt.vy * dt;
        pt.life -= dt;
        pt.alpha = Math.max(0, pt.life / 0.85);
        if (pt.life <= 0) {
          popupTexts.splice(i, 1);
        }
      }
    }

    // --- Coins & Aerial Arc Trajectories ---
    let coins = [];

    class Coin {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.r = 8.5;
        this.collected = false;
        this.animPhase = Math.random() * Math.PI * 2;
      }

      update(dt) {
        this.x -= currentSpeed * dt;
        this.animPhase += dt * 5.5;
      }

      render(ctx) {
        if (this.collected) return;
        const wScale = Math.abs(Math.sin(this.animPhase));
        const coinW = Math.max(2, this.r * wScale);

        ctx.save();
        ctx.translate(this.x, this.y);

        // Subtle glowing halo
        ctx.fillStyle = 'rgba(251, 191, 36, 0.24)';
        ctx.beginPath();
        ctx.arc(0, 0, this.r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Rim
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.ellipse(0, 0, coinW + 1, this.r + 1, 0, 0, Math.PI * 2);
        ctx.fill();

        // Gold body
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.ellipse(0, 0, coinW, this.r, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner highlight slit
        if (wScale > 0.35) {
          ctx.fillStyle = '#fffbeb';
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.max(1, 2 * wScale), 3.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      collidesWith(hitbox) {
        if (this.collected) return false;
        const closestX = Math.max(hitbox.x, Math.min(this.x, hitbox.x + hitbox.w));
        const closestY = Math.max(hitbox.y, Math.min(this.y, hitbox.y + hitbox.h));
        const dx = this.x - closestX;
        const dy = this.y - closestY;
        return (dx * dx + dy * dy) < (this.r + 5) * (this.r + 5);
      }
    }

    function spawnCoinArc(startX, fromSurface, toSurface, count = 5) {
      const fromY = (fromSurface === 'floor') ? (floorY - 32) : (ceilingY + 32);
      const toY = (toSurface === 'floor') ? (floorY - 32) : (ceilingY + 32);
      const transitDist = currentSpeed * 0.72; // Flight distance matching soft gravity flip

      for (let i = 0; i < count; i++) {
        const t = (i + 1) / (count + 1);
        const cx = startX + t * transitDist;
        const ease = t * t * (3 - 2 * t);
        const cy = fromY + (toY - fromY) * ease;
        coins.push(new Coin(cx, cy));
      }
    }

    function updateCoins(dt) {
      const hitbox = player.getHitbox();

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.update(dt);

        if (state === 'playing' && !c.collected && c.collidesWith(hitbox)) {
          c.collected = true;
          coinsCollected++;

          // Combo progression
          comboCount++;
          comboMultiplier = getComboMultiplier(comboCount);
          comboTimer = 2.0; // Reset landing timer
          maxCombo = Math.max(maxCombo, comboCount);

          const gain = 10 * comboMultiplier;
          gameScore += gain;

          sound.playCoin(comboMultiplier);
          spawnCoinSparkles(c.x, c.y);
          spawnPopupText(c.x, c.y - 12, `+${gain}`, '#f59e0b', 13, true);
        }

        if (c.x < -60 || c.collected) {
          coins.splice(i, 1);
        }
      }
    }

    // --- Obstacle Generation & Passable Patterns ---
    let obstacles = [];
    let nextSpawnX = 0;
    let patternIndex = 0;

    class Obstacle {
      constructor(opts) {
        this.surface = opts.surface; // 'floor' | 'ceiling' | 'moving'
        this.type = opts.type;       // 'spike' | 'block' | 'moving'
        this.x = opts.x;
        this.w = opts.w || 36;
        this.h = opts.h || 40;
        this.baseY = opts.baseY || trackCenterY;
        this.amplitude = opts.amplitude || 55;
        this.speedFactor = opts.speedFactor || 3.2;
        this.phase = opts.phase || 0;
        this.nearMissAwarded = false;
      }

      getY() {
        if (this.surface === 'floor') {
          return floorY - this.h;
        } else if (this.surface === 'ceiling') {
          return ceilingY;
        } else {
          // Moving hazard oscillating vertically within safe bounds
          return this.baseY + Math.sin(gameTime * this.speedFactor + this.phase) * this.amplitude - (this.h / 2);
        }
      }

      collidesWith(hitbox) {
        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        if (this.type === 'block') {
          const hx = ox + 3;
          const hy = oy + 3;
          const hw = ow - 6;
          const hh = oh - 6;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        } else if (this.type === 'spike') {
          const isFloor = (this.surface === 'floor');
          // Base box
          const baseH = oh * 0.42;
          const baseW = ow * 0.65;
          const baseX = ox + (ow - baseW) / 2;
          const baseY = isFloor ? (oy + oh - baseH) : oy;
          if (hitbox.x < baseX + baseW && hitbox.x + hitbox.w > baseX &&
              hitbox.y < baseY + baseH && hitbox.y + hitbox.h > baseY) {
            return true;
          }
          // Tip box
          const tipH = oh * 0.58;
          const tipW = ow * 0.32;
          const tipX = ox + (ow - tipW) / 2;
          const tipY = isFloor ? oy : (oy + oh - tipH);
          if (hitbox.x < tipX + tipW && hitbox.x + hitbox.w > tipX &&
              hitbox.y < tipY + tipH && hitbox.y + hitbox.h > tipY) {
            return true;
          }
          return false;
        } else if (this.type === 'moving') {
          // Diamond / Round hazard
          const hx = ox + 4;
          const hy = oy + 4;
          const hw = ow - 8;
          const hh = oh - 8;
          return (
            hitbox.x < hx + hw &&
            hitbox.x + hitbox.w > hx &&
            hitbox.y < hy + hh &&
            hitbox.y + hitbox.h > hy
          );
        }
        return false;
      }

      checkNearMiss(hitbox) {
        if (this.nearMissAwarded) return false;

        const ox = this.x;
        const oy = this.getY();
        const ow = this.w;
        const oh = this.h;

        // Trigger near miss when player passes close to the obstacle horizontally
        const isHorizontallyAligned = (hitbox.x + hitbox.w >= ox - 6 && hitbox.x <= ox + ow + 12);
        if (!isHorizontallyAligned) return false;

        let verticalGap = 999;
        if (this.surface === 'floor') {
          // Gap between player bottom and obstacle top
          const playerBottom = hitbox.y + hitbox.h;
          verticalGap = oy - playerBottom;
        } else if (this.surface === 'ceiling') {
          // Gap between player top and obstacle bottom
          const playerTop = hitbox.y;
          const obstacleBottom = oy + oh;
          verticalGap = playerTop - obstacleBottom;
        } else {
          // Moving hazard
          const pCenterY = hitbox.y + hitbox.h / 2;
          const oCenterY = oy + oh / 2;
          verticalGap = Math.abs(pCenterY - oCenterY) - (hitbox.h / 2 + oh / 2);
        }

        // Within 22px without colliding counts as an exhilarating Near Miss!
        if (verticalGap >= 0 && verticalGap <= 22) {
          this.nearMissAwarded = true;
          return true;
        }
        return false;
      }
    }

    function resetObstacles() {
      obstacles = [];
      coins = [];
      nextSpawnX = virtualW + 40;
      patternIndex = 0;
    }

    function spawnNextPattern() {
      const transitDist = currentSpeed * 0.72;
      const minRunBuffer = Math.max(160, currentSpeed * 0.5);

      if (patternIndex === 0) {
        // Tutorial 1: Floor block + aerial coin arc guide
        obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 32, h: 36 }));
        spawnCoinArc(nextSpawnX - 80, 'floor', 'ceiling', 5);
        nextSpawnX += transitDist + minRunBuffer + 160;
      } else if (patternIndex === 1) {
        // Tutorial 2: Ceiling block + downward coin arc guide
        obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: nextSpawnX, w: 32, h: 36 }));
        spawnCoinArc(nextSpawnX - 80, 'ceiling', 'floor', 5);
        nextSpawnX += transitDist + minRunBuffer + 160;
      } else if (patternIndex === 2) {
        // Floor Spike + coin arc
        obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX, w: 28, h: 36 }));
        spawnCoinArc(nextSpawnX - 70, 'floor', 'ceiling', 4);
        nextSpawnX += transitDist + minRunBuffer + 140;
      } else {
        // Dynamic guaranteed-passable patterns with coin arcs
        const choices = [0, 1, 2, 3, 4, 5, 6, 7];
        // Introduce advanced hazards as distance progresses
        if (scoreMeters >= 250) choices.push(8); // Moving hazard
        if (scoreMeters >= 450) choices.push(9); // Zigzag rhythm run
        if (scoreMeters >= 700) choices.push(10); // Narrow tunnel timing

        const patternChoice = choices[Math.floor(Math.random() * choices.length)];

        switch (patternChoice) {
          case 0: {
            // Floor Spike / Block
            const isSpike = Math.random() < 0.6;
            obstacles.push(new Obstacle({
              surface: 'floor',
              type: isSpike ? 'spike' : 'block',
              x: nextSpawnX,
              w: isSpike ? 30 : 38,
              h: isSpike ? 38 : 45
            }));
            spawnCoinArc(nextSpawnX - 80, 'floor', 'ceiling', 4);
            nextSpawnX += transitDist + minRunBuffer + 110;
            break;
          }

          case 1: {
            // Ceiling Spike / Block
            const isSpike = Math.random() < 0.6;
            obstacles.push(new Obstacle({
              surface: 'ceiling',
              type: isSpike ? 'spike' : 'block',
              x: nextSpawnX,
              w: isSpike ? 30 : 38,
              h: isSpike ? 38 : 45
            }));
            spawnCoinArc(nextSpawnX - 80, 'ceiling', 'floor', 4);
            nextSpawnX += transitDist + minRunBuffer + 110;
            break;
          }

          case 2: {
            // Floor block -> Runway -> Ceiling block
            obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 42, h: 48 }));
            spawnCoinArc(nextSpawnX - 60, 'floor', 'ceiling', 4);

            const ceilingX = nextSpawnX + transitDist + minRunBuffer;
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: ceilingX, w: 42, h: 48 }));
            spawnCoinArc(ceilingX - 60, 'ceiling', 'floor', 4);

            nextSpawnX = ceilingX + transitDist + minRunBuffer + 140;
            break;
          }

          case 3: {
            // Ceiling block -> Runway -> Floor block
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: nextSpawnX, w: 42, h: 48 }));
            spawnCoinArc(nextSpawnX - 60, 'ceiling', 'floor', 4);

            const floorX = nextSpawnX + transitDist + minRunBuffer;
            obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: floorX, w: 42, h: 48 }));
            spawnCoinArc(floorX - 60, 'floor', 'ceiling', 4);

            nextSpawnX = floorX + transitDist + minRunBuffer + 140;
            break;
          }

          case 4: {
            // Double Spikes on Floor
            obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX, w: 28, h: 38 }));
            obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX + 34, w: 28, h: 38 }));
            spawnCoinArc(nextSpawnX - 60, 'floor', 'ceiling', 5);
            nextSpawnX += transitDist + minRunBuffer + 130;
            break;
          }

          case 5: {
            // Double Spikes on Ceiling
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX, w: 28, h: 38 }));
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX + 34, w: 28, h: 38 }));
            spawnCoinArc(nextSpawnX - 60, 'ceiling', 'floor', 5);
            nextSpawnX += transitDist + minRunBuffer + 130;
            break;
          }

          case 6: {
            // Tall Floor Pillar (84px) with high clearance
            obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 42, h: 84 }));
            spawnCoinArc(nextSpawnX - 70, 'floor', 'ceiling', 5);
            nextSpawnX += transitDist + minRunBuffer + 130;
            break;
          }

          case 7: {
            // Tall Ceiling Pillar (84px) with high clearance
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: nextSpawnX, w: 42, h: 84 }));
            spawnCoinArc(nextSpawnX - 70, 'ceiling', 'floor', 5);
            nextSpawnX += transitDist + minRunBuffer + 130;
            break;
          }

          case 8: {
            // Vertically Oscillating Energy Core (Always passable on floor or ceiling)
            obstacles.push(new Obstacle({
              surface: 'moving',
              type: 'moving',
              x: nextSpawnX,
              w: 36,
              h: 36,
              baseY: trackCenterY,
              amplitude: 56,
              speedFactor: 3.4,
              phase: Math.random() * Math.PI * 2
            }));
            // Guidance coins placed on both floor and ceiling runways
            coins.push(new Coin(nextSpawnX - 40, floorY - 25));
            coins.push(new Coin(nextSpawnX + 40, floorY - 25));
            coins.push(new Coin(nextSpawnX - 40, ceilingY + 25));
            coins.push(new Coin(nextSpawnX + 40, ceilingY + 25));
            nextSpawnX += transitDist + minRunBuffer + 150;
            break;
          }

          case 9: {
            // Zigzag Rhythm Sequence: Floor -> Ceiling -> Floor with guaranteed flip landing runways
            const gap = transitDist + minRunBuffer;
            obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX, w: 30, h: 36 }));
            spawnCoinArc(nextSpawnX - 50, 'floor', 'ceiling', 4);

            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'spike', x: nextSpawnX + gap, w: 30, h: 36 }));
            spawnCoinArc(nextSpawnX + gap - 50, 'ceiling', 'floor', 4);

            obstacles.push(new Obstacle({ surface: 'floor', type: 'spike', x: nextSpawnX + gap * 2, w: 30, h: 36 }));
            spawnCoinArc(nextSpawnX + gap * 2 - 50, 'floor', 'ceiling', 4);

            nextSpawnX += gap * 2 + transitDist + minRunBuffer + 160;
            break;
          }

          case 10: {
            // Narrow Tunnel Timing Challenge: Staggered overhead & ground barriers with safe trajectory
            obstacles.push(new Obstacle({ surface: 'floor', type: 'block', x: nextSpawnX, w: 50, h: 45 }));
            spawnCoinArc(nextSpawnX - 60, 'floor', 'ceiling', 4);

            const tunnelCeilingX = nextSpawnX + transitDist + 70;
            obstacles.push(new Obstacle({ surface: 'ceiling', type: 'block', x: tunnelCeilingX, w: 50, h: 45 }));
            spawnCoinArc(tunnelCeilingX - 50, 'ceiling', 'floor', 4);

            nextSpawnX = tunnelCeilingX + transitDist + minRunBuffer + 150;
            break;
          }
        }
      }

      patternIndex++;
    }

    function updateObstacles(dt) {
      if (gameTime >= 1.8) {
        while (nextSpawnX < virtualW + 850) {
          spawnNextPattern();
        }
      }

      const hitbox = player.getHitbox();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= currentSpeed * dt;

        if (state === 'playing') {
          // 1. Collision check
          if (obs.collidesWith(hitbox)) {
            triggerGameOver();
            return;
          }

          // 2. Near Miss check
          if (obs.checkNearMiss(hitbox)) {
            nearMissCount++;
            comboCount++;
            comboMultiplier = getComboMultiplier(comboCount);
            comboTimer = 2.0; // Reset landing timer
            maxCombo = Math.max(maxCombo, comboCount);

            const bonus = 50 * comboMultiplier;
            gameScore += bonus;

            sound.playNearMiss();
            spawnNearMissSparkles(player.x, player.y);
            spawnPopupText(player.x + 24, player.y - 14, `NEAR MISS! +${bonus}`, '#38bdf8', 14, true);
          }
        }

        if (obs.x + obs.w < -140) {
          obstacles.splice(i, 1);
        }
      }
    }

    // --- Background & Speed Lines ---
    let bgScroll = 0;
    const speedLines = [];
    for (let i = 0; i < 22; i++) {
      speedLines.push({
        x: Math.random() * 800,
        y: 100 + Math.random() * 300,
        len: 30 + Math.random() * 70,
        speedFactor: 0.6 + Math.random() * 0.7,
        alpha: 0.08 + Math.random() * 0.12
      });
    }

    function updateBackground(dt) {
      bgScroll = (bgScroll + currentSpeed * dt) % 60;
      for (const line of speedLines) {
        line.x -= currentSpeed * line.speedFactor * dt;
        if (line.x < -line.len) {
          line.x = virtualW + Math.random() * 150;
          line.y = ceilingY + 20 + Math.random() * (TRACK_HEIGHT - 40);
        }
      }
    }

    // --- Game Control Actions ---
    function startGame() {
      sound.init();
      sound.playStart();
      state = 'playing';
      gameTime = 0;
      gameScore = 0;
      scoreMeters = 0;
      coinsCollected = 0;
      nearMissCount = 0;
      comboCount = 0;
      comboMultiplier = 1;
      comboTimer = 0;
      maxCombo = 0;
      currentTierIndex = 0;
      hitStopTimer = 0;
      isNewBest = false;
      currentSpeed = SPEED_INITIAL;

      player.reset();
      resetObstacles();
      particles = [];
      deathDebris = [];
      popupTexts = [];

      sound.setBpm(SPEED_TIERS[0].bpm);
      sound.startBgm();

      syncGameTestingObj();
    }

    function triggerGameOver() {
      state = 'gameover';
      gameOverTimer = 0;
      player.flipBufferTimer = 0;

      // Juice: 80ms hit-stop & strong screen shake
      hitStopTimer = 0.08;
      addScreenShake(14.0, 0.42);

      sound.playCrash();
      sound.stopBgm();
      createDeathExplosion(player);

      const finalScore = Math.floor(gameScore);
      if (finalScore > bestScore) {
        bestScore = finalScore;
        isNewBest = true;
        try {
          localStorage.setItem(STORAGE_KEY, String(bestScore));
        } catch(e) {}
      }
      syncGameTestingObj();
    }

    function handleUserInput() {
      sound.init();
      if (state === 'title') {
        startGame();
      } else if (state === 'playing') {
        player.flip();
      } else if (state === 'gameover') {
        if (gameOverTimer >= GAME_OVER_INPUT_LOCK) {
          startGame();
        }
      }
    }

    // --- Input Listeners ---
    const MUTE_BTN_SIZE = 28;
    const MUTE_BTN_MARGIN = 14;

    function isMuteButtonClicked(clientX, clientY) {
      const hitPadding = 8;
      const x = canvasWidth - MUTE_BTN_MARGIN - MUTE_BTN_SIZE;
      const y = MUTE_BTN_MARGIN;
      return (
        clientX >= x - hitPadding &&
        clientX <= x + MUTE_BTN_SIZE + hitPadding &&
        clientY >= y - hitPadding &&
        clientY <= y + MUTE_BTN_SIZE + hitPadding
      );
    }

    let lastInputTime = 0;
    function handlePointer(e, clientX, clientY) {
      const now = performance.now();
      if (now - lastInputTime < 35) return;
      lastInputTime = now;

      if (isMuteButtonClicked(clientX, clientY)) {
        if (e && e.cancelable) e.preventDefault();
        sound.init();
        sound.toggleMute();
        return;
      }
      if (e && e.cancelable) e.preventDefault();
      handleUserInput();
    }

    window.addEventListener('pointerdown', (e) => {
      handlePointer(e, e.clientX, e.clientY);
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 0) {
        handlePointer(e, e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyW' || e.code === 'KeyS') {
        e.preventDefault();
        handleUserInput();
      } else if (e.code === 'KeyM') {
        sound.toggleMute();
      }
    });

    // --- Main Update Loop ---
    function update(dt) {
      // 80ms Hit-stop on death
      if (hitStopTimer > 0) {
        hitStopTimer -= dt;
        updateScreenShake(dt);
        return;
      }

      updateScreenShake(dt);

      if (state === 'playing') {
        gameTime += dt;

        // Speed ramp with distance
        const progress = Math.min(1, scoreMeters / SPEED_RAMP_METERS);
        currentSpeed = SPEED_INITIAL + (SPEED_MAX - SPEED_INITIAL) * (1 - Math.exp(-progress * 2.8));

        // Distance in meters
        const deltaMeters = (currentSpeed * dt) / 24;
        scoreMeters += deltaMeters;

        // Score progression from distance (scaled by combo multiplier)
        gameScore += deltaMeters * 5 * comboMultiplier;

        // Speed tier check & trigger
        for (let i = SPEED_TIERS.length - 1; i >= 0; i--) {
          if (scoreMeters >= SPEED_TIERS[i].minMeters) {
            if (i > currentTierIndex) {
              currentTierIndex = i;
              speedUpBanner.active = true;
              speedUpBanner.timer = 1.6;
              speedUpBanner.name = SPEED_TIERS[i].name;
              sound.setBpm(SPEED_TIERS[i].bpm);
              sound.playSpeedUp();
            }
            break;
          }
        }

        // Combo timeout check: combo does not expire in mid-air!
        // When grounded, 2.0s countdown starts
        if (player.isGrounded) {
          if (comboCount > 0) {
            comboTimer -= dt;
            if (comboTimer <= 0) {
              comboCount = 0;
              comboMultiplier = 1;
              comboTimer = 0;
            }
          }
        }

        player.update(dt);
        updateObstacles(dt);
        updateCoins(dt);
        updateBackground(dt);
        sound.updateBgm();
      } else if (state === 'title') {
        player.animPhase += 14 * dt;
        player.y = floorY - FIGURE_HALF_HEIGHT;
        player.rotation = 0;
        player.isGrounded = true;
        player.groundedSurface = 'floor';
        updateBackground(dt * 0.8);
      } else if (state === 'gameover') {
        gameOverTimer += dt;
        updateBackground(dt * 0.2);
      }

      if (speedUpBanner.active) {
        speedUpBanner.timer -= dt;
        if (speedUpBanner.timer <= 0) {
          speedUpBanner.active = false;
        }
      }

      updateParticles(dt);
      syncGameTestingObj();
    }

    function updateScreenShake(dt) {
      if (screenShake.timer > 0) {
        screenShake.timer -= dt;
        if (screenShake.timer <= 0) {
          screenShake.intensity = 0;
          screenShake.duration = 0;
        }
      }
    }

    // --- Render Functions ---
    function renderBackground() {
      const tier = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];

      // Background fill based on tier
      ctx.fillStyle = tier.bgTone;
      ctx.fillRect(0, 0, virtualW, virtualH);

      // Speed streaks
      ctx.lineWidth = 1.2;
      for (const line of speedLines) {
        ctx.strokeStyle = `rgba(148, 163, 184, ${line.alpha})`;
        ctx.beginPath();
        ctx.moveTo(line.x, line.y);
        ctx.lineTo(line.x + line.len, line.y);
        ctx.stroke();
      }

      // Outside play zone architectural hatch
      // Above ceiling
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, virtualW, ceilingY);
      ctx.clip();
      ctx.fillStyle = tier.trackTone;
      ctx.fillRect(0, 0, virtualW, ceilingY);

      ctx.strokeStyle = 'rgba(203, 213, 225, 0.45)';
      ctx.lineWidth = 1;
      const step = 24;
      const startX = -(bgScroll % step);
      ctx.beginPath();
      for (let x = startX - ceilingY; x < virtualW + step + ceilingY; x += step) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x + ceilingY, ceilingY);
      }
      ctx.stroke();
      ctx.restore();

      // Below floor
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, floorY, virtualW, virtualH - floorY);
      ctx.clip();
      ctx.fillStyle = tier.trackTone;
      ctx.fillRect(0, floorY, virtualW, virtualH - floorY);

      ctx.strokeStyle = 'rgba(203, 213, 225, 0.45)';
      ctx.lineWidth = 1;
      const floorH = virtualH - floorY;
      ctx.beginPath();
      for (let x = startX - floorH; x < virtualW + step + floorH; x += step) {
        ctx.moveTo(x, floorY);
        ctx.lineTo(x + floorH, virtualH);
      }
      ctx.stroke();
      ctx.restore();

      // Distance markers every 100m
      if (state === 'playing') {
        const markerStep = 100;
        const currentDist = scoreMeters;
        const speedPixelsPerMeter = 24;
        const nextMarkerM = Math.ceil((currentDist - 10) / markerStep) * markerStep;
        for (let m = nextMarkerM; m <= nextMarkerM + 300; m += markerStep) {
          const markerX = player.x + (m - currentDist) * speedPixelsPerMeter;
          if (markerX > -50 && markerX < virtualW + 50) {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(markerX, ceilingY + 5);
            ctx.lineTo(markerX, floorY - 5);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 11px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${m}m`, markerX, trackCenterY);
          }
        }
      }

      // Track Boundary Lines
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(0, ceilingY);
      ctx.lineTo(virtualW, ceilingY);
      ctx.moveTo(0, floorY);
      ctx.lineTo(virtualW, floorY);
      ctx.stroke();

      // Dynamic Accent stripes according to speed tier
      ctx.lineWidth = 2.0;
      ctx.strokeStyle = tier.accent;
      ctx.beginPath();
      ctx.moveTo(0, ceilingY - 3.5);
      ctx.lineTo(virtualW, ceilingY - 3.5);
      ctx.moveTo(0, floorY + 3.5);
      ctx.lineTo(virtualW, floorY + 3.5);
      ctx.stroke();
    }

    function renderObstacles() {
      const tier = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];

      for (const obs of obstacles) {
        const oy = obs.getY();

        if (obs.type === 'block') {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(obs.x, oy, obs.w, obs.h);

          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#0f172a';
          ctx.strokeRect(obs.x, oy, obs.w, obs.h);

          ctx.fillStyle = tier.accent;
          if (obs.surface === 'floor') {
            ctx.fillRect(obs.x + 3, oy + 2, obs.w - 6, 3);
          } else {
            ctx.fillRect(obs.x + 3, oy + obs.h - 5, obs.w - 6, 3);
          }

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(obs.x + 6, oy + 6);
          ctx.lineTo(obs.x + obs.w - 6, oy + obs.h - 6);
          ctx.stroke();
        } else if (obs.type === 'spike') {
          const isFloor = (obs.surface === 'floor');
          const tipY = isFloor ? oy : (oy + obs.h);
          const baseY = isFloor ? (oy + obs.h) : oy;
          const leftX = obs.x;
          const rightX = obs.x + obs.w;
          const midX = obs.x + (obs.w / 2);

          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.moveTo(leftX, baseY);
          ctx.lineTo(midX, tipY);
          ctx.lineTo(rightX, baseY);
          ctx.closePath();
          ctx.fill();

          ctx.lineWidth = 2;
          ctx.strokeStyle = tier.accent;
          ctx.stroke();

          ctx.fillStyle = tier.accent;
          ctx.beginPath();
          ctx.arc(midX, tipY + (isFloor ? 3 : -3), 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (obs.type === 'moving') {
          // Oscillating Energy Core Hazard
          const midX = obs.x + obs.w / 2;
          const midY = oy + obs.h / 2;
          const r = obs.w / 2;

          ctx.save();
          ctx.translate(midX, midY);
          ctx.rotate(gameTime * 4.0);

          // Glow halo
          ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
          ctx.beginPath();
          ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
          ctx.fill();

          // Outer diamond
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r, 0);
          ctx.lineTo(0, r);
          ctx.lineTo(-r, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner pulsing core
          const coreR = 4 + Math.sin(gameTime * 8) * 2;
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(0, 0, coreR, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }
    }

    function renderPlayerFigure(x, y, rotation, animPhase, isGrounded, alpha = 1.0, squashTimer = 0, surface = 'floor') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      // Juice: Squash & stretch animation on landing
      if (squashTimer > 0) {
        const p = 1.0 - (squashTimer / 0.16);
        const wave = Math.sin(p * Math.PI * 2) * Math.exp(-p * 3.5) * 0.35;
        // Anchor to ground surface
        ctx.scale(1.0 + wave, 1.0 - wave);
      }

      ctx.globalAlpha = alpha;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const darkColor = '#0f172a';
      const accentColor = (SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0]).accent;

      // 1. Scarf fluttering
      if (alpha > 0.8) {
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(-2, -14);
        ctx.quadraticCurveTo(-11, -14 + Math.sin(animPhase * 0.8) * 4, -20, -12 + Math.sin(animPhase * 0.8 - 0.8) * 6);
        ctx.stroke();

        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(-2, -13);
        ctx.quadraticCurveTo(-9, -17 + Math.cos(animPhase * 0.8) * 3, -16, -18 + Math.cos(animPhase * 0.8 - 0.6) * 4);
        ctx.stroke();
      }

      // 2. Limb angles
      let leftThighAngle = 0;
      let leftShinAngle = 0;
      let rightThighAngle = 0;
      let rightShinAngle = 0;
      let leftArmAngle = 0;
      let rightArmAngle = 0;

      if (isGrounded) {
        const sinP = Math.sin(animPhase);
        const cosP = Math.cos(animPhase);

        leftThighAngle = sinP * 0.65;
        leftShinAngle = Math.max(0, -cosP) * 0.85;

        rightThighAngle = -sinP * 0.65;
        rightShinAngle = Math.max(0, cosP) * 0.85;

        leftArmAngle = -sinP * 0.6;
        rightArmAngle = sinP * 0.6;
      } else {
        leftThighAngle = -0.4;
        leftShinAngle = 0.6;
        rightThighAngle = 0.5;
        rightShinAngle = 0.3;
        leftArmAngle = -0.5;
        rightArmAngle = 0.5;
      }

      ctx.strokeStyle = darkColor;
      ctx.lineWidth = 2.8;

      // 3. Back Arm
      const shoulderX = 0;
      const shoulderY = -12;
      const armLen = 11;
      const leftElbowX = shoulderX + Math.sin(leftArmAngle) * armLen;
      const leftElbowY = shoulderY + Math.cos(leftArmAngle) * armLen;
      const leftHandX = leftElbowX + Math.sin(leftArmAngle + 0.4) * armLen;
      const leftHandY = leftElbowY + Math.cos(leftArmAngle + 0.4) * armLen;

      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(leftElbowX, leftElbowY);
      ctx.lineTo(leftHandX, leftHandY);
      ctx.stroke();

      // 4. Back Leg
      const hipX = 0;
      const hipY = 2;
      const thighLen = 10;
      const shinLen = 10;
      const leftKneeX = hipX + Math.sin(leftThighAngle) * thighLen;
      const leftKneeY = hipY + Math.cos(leftThighAngle) * thighLen;
      const leftFootX = leftKneeX + Math.sin(leftThighAngle - leftShinAngle) * shinLen;
      const leftFootY = leftKneeY + Math.cos(leftThighAngle - leftShinAngle) * shinLen;

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(leftKneeX, leftKneeY);
      ctx.lineTo(leftFootX, leftFootY);
      ctx.lineTo(leftFootX + 3, leftFootY);
      ctx.stroke();

      // 5. Torso
      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(shoulderX, shoulderY);
      ctx.lineTo(0, -15);
      ctx.stroke();

      // 6. Front Leg
      const rightKneeX = hipX + Math.sin(rightThighAngle) * thighLen;
      const rightKneeY = hipY + Math.cos(rightThighAngle) * thighLen;
      const rightFootX = rightKneeX + Math.sin(rightThighAngle - rightShinAngle) * shinLen;
      const rightFootY = rightKneeY + Math.cos(rightThighAngle - rightShinAngle) * shinLen;

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(rightKneeX, rightKneeY);
      ctx.lineTo(rightFootX, rightFootY);
      ctx.lineTo(rightFootX + 3, rightFootY);
      ctx.stroke();

      // 7. Front Arm
      const rightElbowX = shoulderX + Math.sin(rightArmAngle) * armLen;
      const rightElbowY = shoulderY + Math.cos(rightArmAngle) * armLen;
      const rightHandX = rightElbowX + Math.sin(rightArmAngle + 0.4) * armLen;
      const rightHandY = rightElbowY + Math.cos(rightArmAngle + 0.4) * armLen;

      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(rightElbowX, rightElbowY);
      ctx.lineTo(rightHandX, rightHandY);
      ctx.stroke();

      // 8. Head
      const headCenterY = -20;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(0, headCenterY, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Headband
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.moveTo(-5, headCenterY - 1.5);
      ctx.lineTo(5, headCenterY - 1.5);
      ctx.stroke();

      // Eye
      ctx.fillStyle = darkColor;
      ctx.beginPath();
      ctx.arc(2.5, headCenterY + 1.0, 1.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function renderFlipIndicatorNearPlayer() {
      if (state !== 'playing') return;

      const arrowX = player.x + 28;
      const arrowY = player.y;
      const accent = (SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0]).accent;

      if (player.isGrounded) {
        const pointsUp = (player.groundedSurface === 'floor');
        const pulse = Math.sin(Date.now() * 0.008) * 2;

        ctx.save();
        ctx.translate(arrowX, arrowY + (pointsUp ? -pulse : pulse));
        ctx.strokeStyle = accent;
        ctx.fillStyle = accent;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        if (pointsUp) {
          ctx.moveTo(-4, 2);
          ctx.lineTo(0, -6);
          ctx.lineTo(4, 2);
          ctx.moveTo(0, -6);
          ctx.lineTo(0, 6);
        } else {
          ctx.moveTo(-4, -2);
          ctx.lineTo(0, 6);
          ctx.lineTo(4, -2);
          ctx.moveTo(0, 6);
          ctx.lineTo(0, -6);
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, pointsUp ? -10 : 10, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(arrowX, arrowY);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function renderParticles() {
      const accent = (SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0]).accent;

      for (const pt of particles) {
        if (pt.type === 'shockwave') {
          ctx.save();
          ctx.strokeStyle = `rgba(2, 132, 199, ${pt.alpha})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (pt.type === 'sparkle') {
          ctx.save();
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = pt.alpha;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.fillStyle = `rgba(15, 23, 42, ${pt.alpha})`;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      if (deathDebris.length > 0) {
        for (const d of deathDebris) {
          ctx.save();
          ctx.translate(d.originX, d.originY);
          ctx.rotate(d.rot);
          ctx.globalAlpha = Math.max(0, d.alpha);
          ctx.lineWidth = 2.8;
          ctx.lineCap = 'round';

          if (d.type === 'head') {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fill();
          } else if (d.type === 'scarf') {
            ctx.strokeStyle = accent;
            ctx.beginPath();
            ctx.moveTo(d.x1, d.y1);
            ctx.lineTo(d.x2, d.y2);
            ctx.stroke();
          } else {
            ctx.strokeStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(d.x1, d.y1);
            ctx.lineTo(d.x2, d.y2);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // Floating popup texts
      for (const pt of popupTexts) {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.textAlign = 'center';
        ctx.font = `${pt.isBold ? '800' : '600'} ${pt.fontSize}px system-ui, sans-serif`;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
        ctx.shadowBlur = 4;
        ctx.fillText(pt.text, pt.x, pt.y);
        ctx.restore();
      }
    }

    // --- Speed Up Banner Notification ---
    function renderSpeedUpBanner() {
      if (!speedUpBanner.active) return;
      const progress = speedUpBanner.timer / 1.6;
      const alpha = Math.min(1, progress * 2.5);
      const scale = 1.0 + Math.max(0, (1 - progress) * 0.2);

      ctx.save();
      ctx.translate(virtualW / 2, trackCenterY);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      const tier = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];
      const bannerW = 280;
      const bannerH = 64;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = tier.accent;
      ctx.lineWidth = 2.5;
      roundRect(ctx, -bannerW / 2, -bannerH / 2, bannerW, bannerH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = tier.accent;
      ctx.font = '900 13px system-ui, sans-serif';
      ctx.letterSpacing = '2px';
      ctx.fillText('SPEED UP!', 0, -10);
      ctx.letterSpacing = '0px';

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 20px system-ui, sans-serif';
      ctx.fillText(`${tier.name} TIER`, 0, 15);

      ctx.restore();
    }

    // --- Portrait Mode Hint ---
    function renderPortraitHint() {
      if (!isPortrait) return;

      const hintW = 210;
      const hintH = 26;
      const hintX = (canvasWidth - hintW) / 2;
      const hintY = 14;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      roundRect(ctx, hintX, hintY, hintW, hintH, 13);
      ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.font = '600 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📱 横持ち推奨 (Rotate for best view)', hintX + hintW / 2, hintY + hintH / 2);
      ctx.restore();
    }

    // --- HUD Overlays ---
    function renderHUD() {
      const dist = Math.floor(scoreMeters);
      const score = Math.floor(gameScore);
      const tier = SPEED_TIERS[currentTierIndex] || SPEED_TIERS[0];

      // Screen-space vertical bounds of the track
      const scaleFactor = renderScale / dpr;
      const trackScreenY = canvasHeight / 2;
      const ceilingScreenY = trackScreenY - (TRACK_HEIGHT / 2) * scaleFactor;
      const floorScreenY = trackScreenY + (TRACK_HEIGHT / 2) * scaleFactor;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Baseline for top HUD elements: comfortable margin above track ceiling line
      const ceilingClearance = Math.min(26, Math.max(18, ceilingScreenY * 0.22));
      const hudBottomY = ceilingScreenY - ceilingClearance;

      // 1. Prominent Score (Large)
      ctx.textAlign = 'left';
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 28px system-ui, sans-serif';
      ctx.fillText(score.toLocaleString(), 16, hudBottomY - 35);

      // Distance (Small, secondary)
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(`${dist} m`, 16, hudBottomY - 17);

      // Best Score (Cleared comfortably from track ceiling line)
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`BEST ${Math.max(score, bestScore).toLocaleString()}`, 16, hudBottomY);

      // 2. Flip Availability HUD Pill (Center)
      const pillW = 114;
      const pillH = 26;
      const pillX = (canvasWidth - pillW) / 2;
      const pillY = hudBottomY - 26;

      if (player.isGrounded) {
        ctx.fillStyle = 'rgba(2, 132, 199, 0.12)';
        ctx.strokeStyle = tier.accent;
        ctx.lineWidth = 1.5;
        roundRect(ctx, pillX, pillY, pillW, pillH, 13);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = tier.accent;
        ctx.beginPath();
        ctx.arc(pillX + 15, pillY + 13, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = tier.accent;
        ctx.font = '700 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('反転可能 ⇅', pillX + 63, pillY + 13);
      } else {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.08)';
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 1.2;
        roundRect(ctx, pillX, pillY, pillW, pillH, 13);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(pillX + 15, pillY + 13, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('浮遊中...', pillX + 63, pillY + 13);
      }

      // 3. Multiplier & Combo Badge (Top Right of play area)
      const comboW = 96;
      const comboH = 26;
      const comboX = canvasWidth - comboW - 16;
      const comboY = hudBottomY - 26;

      const multColors = { 1: '#64748b', 2: '#0284c7', 3: '#8b5cf6', 5: '#f59e0b' };
      const currentMultColor = multColors[comboMultiplier] || '#64748b';

      ctx.fillStyle = comboMultiplier > 1 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(241, 245, 249, 0.8)';
      ctx.strokeStyle = currentMultColor;
      ctx.lineWidth = comboMultiplier > 1 ? 2.0 : 1.2;
      roundRect(ctx, comboX, comboY, comboW, comboH, 13);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = currentMultColor;
      ctx.font = comboMultiplier > 1 ? '900 13px system-ui, sans-serif' : '700 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const comboLabel = comboMultiplier > 1 ? `x${comboMultiplier} COMBO` : 'x1 MULTI';
      ctx.fillText(comboLabel, comboX + comboW / 2, comboY + 13);

      // Remaining combo timer gauge when grounded
      if (player.isGrounded && comboCount > 0 && comboTimer > 0) {
        const timerPct = Math.max(0, comboTimer / 2.0);
        ctx.fillStyle = currentMultColor;
        ctx.fillRect(comboX + 10, comboY + comboH - 3, (comboW - 20) * timerPct, 2);
      }

      // 4. Coins Collected and Speed Gauge (Bottom Bar)
      const bottomY = floorScreenY + 14;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#d97706';
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillText(`🪙 ${coinsCollected}`, 16, bottomY + 12);

      const speedPct = Math.min(1, (currentSpeed - SPEED_INITIAL) / (SPEED_MAX - SPEED_INITIAL));
      ctx.fillStyle = 'rgba(203, 213, 225, 0.4)';
      ctx.fillRect(16, bottomY + 20, 100, 3);
      ctx.fillStyle = tier.accent;
      ctx.fillRect(16, bottomY + 20, 100 * speedPct, 3);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.fillText(`SPEED ${Math.round(currentSpeed / 10)} (${tier.name})`, 16, bottomY + 36);

      ctx.restore();
    }

    function renderTitleScreen() {
      const centerX = virtualW / 2;
      const cardW = Math.min(virtualW - 40, 500);
      const cardH = 230;
      const cardX = centerX - cardW / 2;
      const cardY = trackCenterY - cardH / 2 - 25;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(15, 23, 42, 0.12)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      roundRect(ctx, cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.stroke();

      // Title
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 34px system-ui, sans-serif';
      ctx.fillText('重力反転ランナー', centerX, cardY + 48);

      // Subtitle
      ctx.font = '700 11px system-ui, sans-serif';
      ctx.fillStyle = '#0284c7';
      ctx.letterSpacing = '3px';
      ctx.fillText('GRAVITY FLIP RUNNER', centerX, cardY + 68);
      ctx.letterSpacing = '0px';

      // Divider
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cardX + 36, cardY + 82);
      ctx.lineTo(cardX + cardW - 36, cardY + 82);
      ctx.stroke();

      // Brief Instructions
      ctx.font = '500 13px system-ui, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('・タップ / スペースキー でふんわり重力反転', centerX, cardY + 106);
      ctx.fillText('・反転中のコイン取得とニアミスでコンボ倍率UP！(最大x5)', centerX, cardY + 128);

      // Tap to start pulsing button
      const pulse = (Math.sin(Date.now() * 0.006) + 1) / 2;
      const btnW = 210;
      const btnH = 40;
      const btnX = centerX - btnW / 2;
      const btnY = cardY + cardH - 52;

      ctx.fillStyle = `rgba(2, 132, 199, ${0.1 + pulse * 0.12})`;
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      roundRect(ctx, btnX, btnY, btnW, btnH, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0284c7';
      ctx.font = '700 14px system-ui, sans-serif';
      ctx.fillText('タップでスタート', centerX, btnY + 25);

      if (bestScore > 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillText(`最高スコア: ${bestScore.toLocaleString()} pts`, centerX, cardY - 14);
      }

      ctx.restore();
    }

    function renderGameOverScreen() {
      const centerX = virtualW / 2;
      const alpha = Math.min(1, gameOverTimer / 0.25);

      ctx.save();
      ctx.globalAlpha = alpha;

      // Perfectly fitted card within play track bounds
      const cardW = Math.min(virtualW - 40, 440);
      const cardH = 260;
      const cardX = centerX - cardW / 2;
      const cardY = trackCenterY - cardH / 2;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(15, 23, 42, 0.16)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 8;
      roundRect(ctx, cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.stroke();

      // Title & Best Badge
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 24px system-ui, sans-serif';
      ctx.fillText('GAME OVER', centerX, cardY + 34);

      if (isNewBest) {
        ctx.fillStyle = '#f59e0b';
        ctx.font = '800 11px system-ui, sans-serif';
        ctx.fillText('★ NEW BEST! ★', centerX, cardY + 49);
      }

      // Divider
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(cardX + 28, cardY + 56);
      ctx.lineTo(cardX + cardW - 28, cardY + 56);
      ctx.stroke();

      // Large Score display
      const finalScore = Math.floor(gameScore);
      ctx.fillStyle = '#64748b';
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.fillText('FINAL SCORE', centerX, cardY + 72);

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 32px system-ui, sans-serif';
      ctx.fillText(finalScore.toLocaleString(), centerX, cardY + 104);

      // Stats 2-column layout
      const statsY = cardY + 124;
      const col1X = cardX + 44;
      const col2X = cardX + cardW - 44;
      const lineGap = 19;

      ctx.font = '600 11px system-ui, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.textAlign = 'left';
      ctx.fillText('走破距離', col1X, statsY);
      ctx.fillText('取得コイン', col1X, statsY + lineGap);
      ctx.fillText('最大コンボ', col1X, statsY + lineGap * 2);
      ctx.fillText('ニアミス回数', col1X, statsY + lineGap * 3);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#0f172a';
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.fillText(`${Math.floor(scoreMeters)} m`, col2X, statsY);
      ctx.fillText(`${coinsCollected} 枚`, col2X, statsY + lineGap);
      ctx.fillText(`x${getComboMultiplier(maxCombo)} (${maxCombo} 連鎖)`, col2X, statsY + lineGap * 2);
      ctx.fillText(`${nearMissCount} 回`, col2X, statsY + lineGap * 3);

      // Self Best Note
      ctx.textAlign = 'center';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.fillText(`自己ベスト: ${bestScore.toLocaleString()} pts`, centerX, cardY + 208);

      // Retry Prompt Button
      const btnW = 180;
      const btnH = 34;
      const btnX = centerX - btnW / 2;
      const btnY = cardY + cardH - 44;
      const isInputLocked = (gameOverTimer < GAME_OVER_INPUT_LOCK);

      if (isInputLocked) {
        ctx.fillStyle = 'rgba(241, 245, 249, 0.9)';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        roundRect(ctx, btnX, btnY, btnW, btnH, 17);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillText('...', centerX, btnY + 21);
      } else {
        const pulse = (Math.sin(Date.now() * 0.007) + 1) / 2;
        ctx.fillStyle = `rgba(2, 132, 199, ${0.1 + pulse * 0.12})`;
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        roundRect(ctx, btnX, btnY, btnW, btnH, 17);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0284c7';
        ctx.font = '700 13px system-ui, sans-serif';
        ctx.fillText('タップでリトライ', centerX, btnY + 22);
      }

      ctx.restore();
    }

    function renderMuteButton() {
      const x = canvasWidth - MUTE_BTN_MARGIN - MUTE_BTN_SIZE;
      const y = MUTE_BTN_MARGIN;

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, MUTE_BTN_SIZE, MUTE_BTN_SIZE, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = sound.muted ? '#94a3b8' : '#0284c7';
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sound.muted ? '🔇' : '🔊', x + MUTE_BTN_SIZE / 2, y + MUTE_BTN_SIZE / 2);

      ctx.restore();
    }

    // --- Helper Utility Functions ---
    function roundRect(c, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // --- Testing API Hook (window.__game - Preserved & Extended) ---
    function syncGameTestingObj() {
      if (!window.__game) {
        window.__game = {};
        Object.defineProperty(window.__game, 'state', { get: () => state, set: v => { state = v; }, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'score', { get: () => Math.floor(gameScore), configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'distance', { get: () => Math.floor(scoreMeters), configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'bestScore', { get: () => bestScore, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'isGrounded', { get: () => player.isGrounded, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'speed', { get: () => currentSpeed, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'player', { get: () => player, configurable: true, enumerable: true });
        Object.defineProperty(window.__game, 'obstacles', { get: () => obstacles, configurable: true, enumerable: true });
