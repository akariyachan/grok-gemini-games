<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ワンタップ・ジャンプ橋</title>
  <meta name="description" content="タイミングよく画面を長押しして棒を伸ばし、足場から足場へ橋を架け渡す爽快ミニゲーム。">
  <meta name="theme-color" content="#090d16">

  <!-- Favicon: Inline SVG data-URI to avoid 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090d16'/%3E%3Crect x='4' y='21' width='8' height='11' fill='%2338bdf8' rx='2'/%3E%3Crect x='20' y='21' width='8' height='11' fill='%2338bdf8' rx='2'/%3E%3Crect x='11' y='20' width='10' height='3' fill='%23f43f5e' rx='1'/%3E%3Cpath d='M12 21 L20 21' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='15' r='2.5' fill='%2338bdf8'/%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #05070d;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Mute button in top right */
    #mute-btn {
      position: absolute;
      top: calc(env(safe-area-inset-top, 12px) + 12px);
      right: calc(env(safe-area-inset-right, 12px) + 12px);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
      touch-action: manipulation;
    }

    #mute-btn:hover {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(56, 189, 248, 0.5);
    }

    #mute-btn:active {
      transform: scale(0.92);
    }

    #mute-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <button id="mute-btn" title="ミュート切替" aria-label="ミュート切替">
      <!-- Sound ON icon -->
      <svg id="icon-sound-on" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <!-- Sound OFF icon (hidden by default) -->
      <svg id="icon-sound-off" style="display:none;" viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      // Polyfill Canvas roundRect for older browser / headless compatibility
      if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          let radius = typeof r === 'number' ? r : 0;
          if (Array.isArray(r) && r.length > 0) radius = r[0] || 0;
          if (radius * 2 > Math.abs(w)) radius = Math.abs(w) / 2;
          if (radius * 2 > Math.abs(h)) radius = Math.abs(h) / 2;
          if (radius < 0) radius = 0;

          if (radius === 0) {
            this.rect(x, y, w, h);
            return this;
          }
          this.moveTo(x + radius, y);
          this.arcTo(x + w, y, x + w, y + h, radius);
          this.arcTo(x + w, y + h, x, y + h, radius);
          this.arcTo(x, y + h, x, y, radius);
          this.arcTo(x, y, x + w, y, radius);
          this.closePath();
          return this;
        };
      }

      function safeGetStorage(key, def) {
        try {
          const v = localStorage.getItem(key);
          return v !== null ? v : def;
        } catch (e) {
          return def;
        }
      }

      function safeSetStorage(key, val) {
        try {
          localStorage.setItem(key, val);
        } catch (e) {}
      }

      // ==========================================
      // Color & Theme Utilities
      // ==========================================
      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255
        };
      }

      function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(x => {
          const h = Math.round(Math.max(0, Math.min(255, x))).toString(16);
          return h.length === 1 ? '0' + h : h;
        }).join('');
      }

      function lerpColor(c1, c2, t) {
        t = Math.max(0, Math.min(1, t));
        const rgb1 = hexToRgb(c1);
        const rgb2 = hexToRgb(c2);
        const r = rgb1.r + (rgb2.r - rgb1.r) * t;
        const g = rgb1.g + (rgb2.g - rgb1.g) * t;
        const b = rgb1.b + (rgb2.b - rgb1.b) * t;
        return rgbToHex(r, g, b);
      }

      // 10本ごとに段階的に切り替わる5つのテーマ（昼→夕焼け→夜→オーロラ→宇宙）
      const THEMES = [
        {
          name: '昼',
          skyTop: '#1d4ed8',
          skyBottom: '#38bdf8',
          mountainFar: '#60a5fa',
          mountainNear: '#3b82f6',
          city: '#2563eb',
          pillarTop: '#64748b',
          pillarGrad1: '#1e293b',
          pillarGrad2: '#334155',
          windowColor: 'rgba(255, 255, 255, 0.45)',
          isNight: false,
          isAurora: false,
          isCosmos: false
        },
        {
          name: '夕焼け',
          skyTop: '#4c1d95',
          skyBottom: '#fb923c',
          mountainFar: '#831843',
          mountainNear: '#4a044e',
          city: '#2e1065',
          pillarTop: '#c084fc',
          pillarGrad1: '#1e1438',
          pillarGrad2: '#381c63',
          windowColor: '#fde047',
          isNight: false,
          isAurora: false,
          isCosmos: false
        },
        {
          name: '夜',
          skyTop: '#020617',
          skyBottom: '#0f172a',
          mountainFar: '#090d16',
          mountainNear: '#111827',
          city: '#0b1120',
          pillarTop: '#38bdf8',
          pillarGrad1: '#0f172a',
          pillarGrad2: '#1e293b',
          windowColor: '#38bdf8',
          isNight: true,
          isAurora: false,
          isCosmos: false
        },
        {
          name: 'オーロラ',
          skyTop: '#030712',
          skyBottom: '#042f2e',
          mountainFar: '#064e3b',
          mountainNear: '#022c22',
          city: '#011c16',
          pillarTop: '#2dd4bf',
          pillarGrad1: '#064e3b',
          pillarGrad2: '#0f766e',
          windowColor: '#34d399',
          isNight: true,
          isAurora: true,
          isCosmos: false
        },
        {
          name: '宇宙',
          skyTop: '#000000',
          skyBottom: '#180d2b',
          mountainFar: '#2e1065',
          mountainNear: '#1e1035',
          city: '#090514',
          pillarTop: '#e879f9',
          pillarGrad1: '#1e1b4b',
          pillarGrad2: '#3730a3',
          windowColor: '#c084fc',
          isNight: true,
          isAurora: false,
          isCosmos: true
        }
      ];

      let currentThemeT = 0;
      let targetThemeT = 0;

      function updateThemeTransition(dt) {
        const themeIndex = Math.min(THEMES.length - 1, Math.floor(count / 10));
        targetThemeT = themeIndex;
        currentThemeT += (targetThemeT - currentThemeT) * Math.min(1, dt * 2.0);
      }

      function getInterpolatedTheme() {
        const baseIdx = Math.floor(currentThemeT);
        const nextIdx = Math.min(THEMES.length - 1, baseIdx + 1);
        const t = currentThemeT - baseIdx;

        const t1 = THEMES[baseIdx];
        const t2 = THEMES[nextIdx];

        return {
          skyTop: lerpColor(t1.skyTop, t2.skyTop, t),
          skyBottom: lerpColor(t1.skyBottom, t2.skyBottom, t),
          mountainFar: lerpColor(t1.mountainFar, t2.mountainFar, t),
          mountainNear: lerpColor(t1.mountainNear, t2.mountainNear, t),
          city: lerpColor(t1.city, t2.city, t),
          pillarTop: lerpColor(t1.pillarTop, t2.pillarTop, t),
          pillarGrad1: lerpColor(t1.pillarGrad1, t2.pillarGrad1, t),
          pillarGrad2: lerpColor(t1.pillarGrad2, t2.pillarGrad2, t),
          windowColor: t2.windowColor,
          isNight: t1.isNight || t2.isNight,
          isAurora: t1.isAurora || t2.isAurora,
          isCosmos: t1.isCosmos || t2.isCosmos,
          themeIndex: baseIdx
        };
      }

      // ==========================================
      // Constants & Tuning
      // ==========================================
      const GROW_SPEED = 380;       // 棒が伸びる速度 (px/秒)
      const FALL_STICK_TIME = 0.16; // 棒が倒れる時間 (秒) - 超高速でテンポ重視
      const RUN_SPEED = 640;        // 棒人間の走る基本速度 (px/秒)
      const CAMERA_SPEED = 12;      // カメラスムーズ追従係数
      const PERFECT_TOLERANCE = 5.0;// PERFECT判定の許容半幅 (px)
      const PERFECT_MARKER_W = 8;   // 足場上端の赤マーカー幅 (px)

      // ==========================================
      // Audio System (Web Audio API)
      // ==========================================
      let audioCtx = null;
      let isMuted = safeGetStorage('bridgeJumpMuted', 'false') === 'true';
      let growOsc = null;
      let growGain = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function updateMuteButtonUI() {
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');
        if (isMuted) {
          iconOn.style.display = 'none';
          iconOff.style.display = 'block';
        } else {
          iconOn.style.display = 'block';
          iconOff.style.display = 'none';
        }
      }

      function toggleMute() {
        initAudio();
        isMuted = !isMuted;
        safeSetStorage('bridgeJumpMuted', isMuted ? 'true' : 'false');
        if (isMuted) {
          stopGrowSound();
        }
        updateMuteButtonUI();
      }

      function playGrowSound() {
        if (isMuted || !audioCtx) return;
        try {
          stopGrowSound();
          growOsc = audioCtx.createOscillator();
          growGain = audioCtx.createGain();
          growOsc.type = 'triangle';
          const now = audioCtx.currentTime;
          growOsc.frequency.setValueAtTime(220, now);
          growOsc.frequency.exponentialRampToValueAtTime(880, now + 2.0);

          growGain.gain.setValueAtTime(0.08, now);
          growOsc.connect(growGain);
          growGain.connect(audioCtx.destination);
          growOsc.start(now);
        } catch (e) {}
      }

      function stopGrowSound() {
        if (growOsc) {
          try {
            const now = audioCtx ? audioCtx.currentTime : 0;
            if (growGain) {
              growGain.gain.setTargetAtTime(0, now, 0.02);
            }
            growOsc.stop(now + 0.04);
          } catch (e) {}
          growOsc = null;
          growGain = null;
        }
      }

      function playStickLandSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch (e) {}
      }

      function playSuccessSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const freqs = [523.25, 659.25]; // C5, E5
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const t = now + idx * 0.04;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.12);
          });
        } catch (e) {}
      }

      function playGreatSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const freqs = [659.25, 880.00]; // E5, A5
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const t = now + idx * 0.04;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.14, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.16);
          });
        } catch (e) {}
      }

      function playGirigiriSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(360, now + 0.1);

          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}
      }

      function playPerfectSound(comboCount) {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00];
          const baseIndex = Math.min(scale.length - 3, Math.max(0, (comboCount - 1) % scale.length));
          const freqs = [scale[baseIndex], scale[baseIndex + 1], scale[baseIndex + 2]];

          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const t = now + idx * 0.035;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.24);
          });
        } catch (e) {}
      }

      function playMilestoneSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 - E5 - G5 - C6
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const t = now + idx * 0.06;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          });
        } catch (e) {}
      }

      function playFallSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.35);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {}
      }

      // ボーナスコイン取得音（キラッと鳴る高音チャイム）
      function playCoinSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const freqs = [987.77, 1318.51, 1567.98]; // B5, E6, G6
          freqs.forEach((f, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const t = now + idx * 0.045;
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.18);
          });
        } catch (e) {}
      }

      // 自己ベスト更新時のファンファーレ
      function playFanfareSound() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const notes = [
            { f: 523.25, t: 0.00, d: 0.10 }, // C5
            { f: 659.25, t: 0.09, d: 0.10 }, // E5
            { f: 783.99, t: 0.18, d: 0.12 }, // G5
            { f: 1046.50, t: 0.30, d: 0.48 }, // C6
            { f: 1318.51, t: 0.30, d: 0.48 }  // E6 和音
          ];
          notes.forEach(n => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const st = now + n.t;
            osc.frequency.setValueAtTime(n.f, st);
            gain.gain.setValueAtTime(0.19, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + n.d);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(st);
            osc.stop(st + n.d);
          });
        } catch (e) {}
      }

      // ラッシュモード中のビート音（BGM代わりの軽快なキック＆パルス）
      function playRushBeat() {
        if (isMuted || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          // Kick sound
          const oscK = audioCtx.createOscillator();
          const gainK = audioCtx.createGain();
          oscK.type = 'sine';
          oscK.frequency.setValueAtTime(140, now);
          oscK.frequency.exponentialRampToValueAtTime(42, now + 0.08);
          gainK.gain.setValueAtTime(0.18, now);
          gainK.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
          oscK.connect(gainK);
          gainK.connect(audioCtx.destination);
          oscK.start(now);
          oscK.stop(now + 0.10);

          // Synth Hat / Shimmer
          const oscH = audioCtx.createOscillator();
          const gainH = audioCtx.createGain();
          oscH.type = 'triangle';
          oscH.frequency.setValueAtTime(1046.5, now);
          gainH.gain.setValueAtTime(0.05, now);
          gainH.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          oscH.connect(gainH);
          gainH.connect(audioCtx.destination);
          oscH.start(now);
          oscH.stop(now + 0.04);
        } catch (e) {}
      }

      // スマホのバイブレーション安全トリガー
      let userHasInteracted = false;
      function triggerVibrate(ms) {
        if (userHasInteracted && typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          try {
            navigator.vibrate(ms);
          } catch (e) {}
        }
      }

      // ==========================================
      // Canvas & Viewport Sizing
      // ==========================================
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const muteBtn = document.getElementById('mute-btn');

      let screenW = window.innerWidth;
      let screenH = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;

      // Virtual logical coordinates
      let viewScale = 1;
      let viewOffsetX = 0;
      let virtualW = 390;
      let virtualH = 844;
      let groundY = 530; // 画面下から約37%

      function resize() {
        screenW = window.innerWidth;
        screenH = window.innerHeight;

          viewScale = screenH / 844;
          virtualW = 390;
          virtualH = 844;
          viewOffsetX = (screenW - virtualW * viewScale) / 2;
        } else {
          viewScale = screenW / 390;
          virtualW = 390;
          virtualH = screenH / viewScale;
          viewOffsetX = 0;
        }

        groundY = virtualH * 0.63;

      function getPointerVirtualPos(e) {
        if (!e) return { x: -999, y: -999 };
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const screenX = (clientX - rect.left) * (canvas.width / rect.width) / dpr;
        const screenY = (clientY - rect.top) * (canvas.height / rect.height) / dpr;
        const vx = (screenX - viewOffsetX) / viewScale;
        const vy = screenY / viewScale;
        return { x: vx, y: vy };

      // ==========================================
      // Pillar Generation & Difficulty Curve
      // ==========================================
      function createPillar(x, w, type = 'normal') {
        return {
          x: x,
          w: w,
          baseX: x,
          perfectX: x + w / 2,
          type: type, // 'normal' | 'gold' | 'moving' | 'distant'
          isNarrow: false,
          bounceY: 0,
          bounceVy: 0,
          // 動く足場パラメータ
          moveAmp: 26 + Math.random() * 14, // 26〜40px 振幅
          moveSpeed: 1.6 + Math.random() * 0.5, // 往復速度 (rad/s)
          movePhase: Math.random() * Math.PI * 2,
          isStopped: false,
          hasBestFlag: false
        };
      }

      function getNextPillarParams(countIndex) {
        // 指示6: 最初の2本は必ず近くて広い足場にして、始めた直後の事故死を減らす
        if (countIndex < 2) {
          const w = 82 + Math.random() * 10; // 82〜92
          const gap = 52 + Math.random() * 8; // 52〜60
          return {
            w: Math.round(w),
            gap: Math.round(gap),
            type: 'normal'
          };
        }

        // 2本目以降の難易度カーブと足場バリエーション（10本以降に出現）
        let w, gap;
        let type = 'normal';

        if (countIndex < 10) {
          // 2〜9本: 徐々に間隔が広がるがノーマル足場
          w = 54 + Math.random() * 26; // 54〜80
          gap = 70 + Math.random() * 55; // 70〜125
        } else if (countIndex < 20) {
          // 10〜19本: ゴールド足場・遠い足場が時々出現
          w = 42 + Math.random() * 24; // 42〜66
          gap = 85 + Math.random() * 70; // 85〜155

          const roll = Math.random();
          if (roll < 0.22) {
            type = 'gold'; // ゴールド足場 (赤印で+5 & 金色紙吹雪)
          } else if (roll < 0.44) {
            type = 'distant'; // 遠い足場 (間隔が広め、届けば+2)
            gap = 160 + Math.random() * 60; // 160〜220
          }
        } else {
          // 20本以降: 動く足場（20本以降）・ゴールド・遠い足場
          w = 34 + Math.random() * 24; // 34〜58
          gap = 85 + Math.random() * 85; // 85〜170

          const roll = Math.random();
          if (roll < 0.24) {
            type = 'moving'; // 動く足場
          } else if (roll < 0.44) {
            type = 'gold'; // ゴールド足場
          } else if (roll < 0.64) {
            type = 'distant'; // 遠い足場
            gap = 175 + Math.random() * 75; // 175〜250
          }
        }

        return {
          w: Math.round(w),
          gap: Math.round(gap),
          type: type
        };
      }

      function ensurePillarsAhead() {
        const targetRight = cameraX + virtualW + 450;
        let lastP = pillars[pillars.length - 1];
        while (lastP.x + lastP.w < targetRight) {
          const nextCount = pillars.length - 1;
          const { w, gap, type } = getNextPillarParams(nextCount);
          const newX = lastP.x + lastP.w + gap;
          const newP = createPillar(newX, w, type);

          // 自己ベストの位置に「BEST」の旗を足場の上に立てる
          if (bestCount > 0 && nextCount === bestCount) {
            newP.hasBestFlag = true;
          }

          // ボーナスコイン: 足場の間の空中にたまにコインが浮かぶ（確率約40%）
          if (nextCount >= 2 && Math.random() < 0.40) {
            coins.push({
              x: lastP.x + lastP.w + gap * (0.35 + Math.random() * 0.3),
              baseY: groundY - (42 + Math.random() * 46),
              y: groundY - 50,
              r: 9,
              collected: false,
              phase: Math.random() * Math.PI * 2
            });
          }

          pillars.push(newP);
          lastP = newP;
        }
      }

                  activeMissionIds[curIdx] = candidate;
                  break;

      function spawnParticles(x, y, pCount, type) {
        for (let i = 0; i < pCount; i++) {
          if (type === 'perfect') {
            const angle = Math.random() * Math.PI * 2;
            const spd = 70 + Math.random() * 200;
            particles.push({
              x: x,
              y: y,

            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;

              maxLife: 1.35,
              rot: Math.random() * Math.PI * 2,
              rotSpd: (Math.random() - 0.5) * 14,

          } else if (type === 'coin') {
            // コイン獲得時のキラキラ金星
            const angle = Math.random() * Math.PI * 2;
            const spd = 50 + Math.random() * 120;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - 30,

              maxLife: 0.70
            });
          } else if (type === 'great') {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
            const spd = 60 + Math.random() * 140;
            particles.push({
              x: x,
              y: y,
