          isGold: isGold,
          rushActive: rushActive,
          shake: type === 'GIRIGIRI' ? 1.0 : 0
        };
      }

      function spawnComboEndPopup(x, y) {
        comboEndPopup = {
          x: x,
          y: y,
          vy: -35,
          life: 0.65,
          maxLife: 0.65
        };
      }

      function setMilestonePopup(text) {
        milestonePopup = {
          text: text,
          life: 1.3,
          maxLife: 1.3
        };
      }

      // ==========================================
      // Input Handling
      // ==========================================
      function handleDressUpModalClick(vx, vy) {
        const cardX = 25;
        const cardY = 90;
        const cardW = 340;
        const cardH = 430;
        const closeBtn = { x: cardX + (cardW - 130) / 2, y: cardY + cardH - 36, w: 130, h: 28 };

        // Tap close button or outside modal card to close
        if (vx < cardX || vx > cardX + cardW || vy < cardY || vy > cardY + cardH ||
            (vx >= closeBtn.x && vx <= closeBtn.x + closeBtn.w && vy >= closeBtn.y && vy <= closeBtn.y + closeBtn.h)) {
          activeModal = null;
          return;
        }

        // Check skin cards click
        for (let i = 0; i < SKINS.length; i++) {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const sx = col === 0 ? cardX + 12 : cardX + 176;
          const sy = cardY + 50 + row * 82;
          const sw = 152;
          const sh = 76;

          if (vx >= sx && vx <= sx + sw && vy >= sy && vy <= sy + sh) {
            const sk = SKINS[i];
            const isUnlocked = unlockedSkins.includes(sk.id);
            if (isUnlocked) {
              equippedSkin = sk.id;
              safeSetStorage('bridgeJumpEquippedSkin', sk.id);
              playSuccessSound();
            } else if (totalCoins >= sk.cost) {
              if (!unlockedSkins.includes(sk.id)) {
                unlockedSkins.push(sk.id);
              }
              safeSetStorage('bridgeJumpUnlockedSkins', JSON.stringify(unlockedSkins));
              equippedSkin = sk.id;
              safeSetStorage('bridgeJumpEquippedSkin', sk.id);
              playFanfareSound();
              spawnParticles(vx, vy, 24, 'gold_confetti');
            }
            return;
          }
        }
      }

      function handleInputDown(e) {
        initAudio();
        userHasInteracted = true;

        if (gameState === 'title') {
          if (isBot) {
            activeModal = null;
            startGame();
            isInputHeld = true;
            startGrowing();
            return;
          }

          const pos = getPointerVirtualPos(e);

          if (activeModal === 'how_to_play') {
            activeModal = null;
            return;
          }

          if (activeModal === 'dress_up') {
            handleDressUpModalClick(pos.x, pos.y);
            return;
          }

          // Button click check: "あそびかた"
          if (pos.x >= btnHowToPlay.x && pos.x <= btnHowToPlay.x + btnHowToPlay.w &&
              pos.y >= btnHowToPlay.y && pos.y <= btnHowToPlay.y + btnHowToPlay.h) {
            activeModal = 'how_to_play';
            playSuccessSound();
            return;
          }

          // Button click check: "きせかえ"
          if (pos.x >= btnDressUp.x && pos.x <= btnDressUp.x + btnDressUp.w &&
              pos.y >= btnDressUp.y && pos.y <= btnDressUp.y + btnDressUp.h) {
            activeModal = 'dress_up';
            playSuccessSound();
            return;
          }

          // Anywhere else on title screen (including "長押しでスタート"): start game & grow
          startGame();
          isInputHeld = true;
          startGrowing();
          return;
        }

        if (gameState === 'over') {
          // 指示5: リトライはワンタップ即開始のまま
          if (performance.now() - gameOverTime < 120) {
            return;
          }
          resetGame(true);
          return;
        }

        if (gameState === 'play' && playSubState === 'ready') {
          startGrowing();
        }
      }

      function startGrowing() {
        playSubState = 'growing';
        stickLength = 0;
        stickAngle = 0;
        prevStickAngle = 0;
        const curP = pillars[currentPillarIndex];
        stickStartX = curP.x + curP.w;
        isInputHeld = true;
        playGrowSound();
      }

      function handleInputUp() {
        if (!isInputHeld) return;
        isInputHeld = false;

        if (gameState === 'play' && playSubState === 'growing') {
          stopGrowSound();

          if (stickLength < 30) {
            stickLength = 0;
            stickAngle = 0;
            prevStickAngle = 0;
            playSubState = 'ready';
            return;
          }

          // 指示1: 動く足場: 棒を離した瞬間に足場は停止して判定
          const nxtP = pillars[currentPillarIndex + 1];
          if (nxtP && nxtP.type === 'moving') {
            nxtP.isStopped = true;
          }

          playSubState = 'falling_stick';
          stickFallTimer = 0;
          prevStickAngle = 0;
        }
      }

      // Setup listeners
      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        handleInputDown(e);
      }, { passive: false });

      window.addEventListener('pointerup', (e) => {
        e.preventDefault();
        handleInputUp();
      }, { passive: false });

      window.addEventListener('pointercancel', () => {
        handleInputUp();
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          if (!e.repeat) {
            e.preventDefault();
            if (activeModal !== null) {
              activeModal = null;
              return;
            }
            handleInputDown();
          }
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          handleInputUp();
        }
      });

      // Mute button click
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        toggleMute();
      });
      muteBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
      });

      // Context menu disable
      window.addEventListener('contextmenu', (e) => e.preventDefault());

      // ==========================================
      // Main Game Logic Update
      // ==========================================
      let lastTime = performance.now();

      function update(dt) {
        if (dt > 0.08) dt = 0.08;

        // Background theme transition
        updateThemeTransition(dt);

        // Visual effects decay
        if (screenShake > 0) {
          screenShake = Math.max(0, screenShake - dt * 25);
        }
        if (screenFlash > 0) {
          screenFlash = Math.max(0, screenFlash - dt * 3.5);
        }

        // 指示3: テンポのご褒美「ラッシュ」のタイマー & ビート音
        if (isRush) {
          rushTimer -= dt;
          rushBeatTimer -= dt;
          if (rushBeatTimer <= 0) {
            rushBeatTimer = 0.28; // ~107 BPMのビート
            playRushBeat();
          }
          if (rushTimer <= 0) {
            isRush = false;
            rushTimer = 0;
          }
        }

        // 動く足場の更新（停止していなければゆっくり左右に往復）
        for (let i = 0; i < pillars.length; i++) {
          const p = pillars[i];
          if (p.type === 'moving' && !p.isStopped) {
            p.movePhase += p.moveSpeed * dt;
            p.x = p.baseX + Math.sin(p.movePhase) * p.moveAmp;
            p.perfectX = p.x + p.w / 2;
          }
        }

        // コインのふわふわ上下アニメーション
        const nowMs = performance.now();
        for (let i = 0; i < coins.length; i++) {
          const c = coins[i];
          if (!c.collected) {
            c.y = c.baseY + Math.sin(nowMs * 0.005 + c.phase) * 5;
          }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += (p.isConfetti ? 180 : 320) * dt; // 紙吹雪はふわりと舞う
          if (p.rotSpd) {
            p.rot += p.rotSpd * dt;
          }
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        // Ring Effects (PERFECT)
        for (let i = ringEffects.length - 1; i >= 0; i--) {
          const r = ringEffects[i];
          r.life -= dt;
          const prog = 1.0 - (r.life / r.maxLife);
          r.r = 4 + prog * (r.maxR - 4);
          if (r.life <= 0) {
            ringEffects.splice(i, 1);
          }
        }

        // Popups
        if (currentJudgePopup) {
          currentJudgePopup.y += currentJudgePopup.vy * dt;
          currentJudgePopup.life -= dt;
          if (currentJudgePopup.life <= 0) {
            currentJudgePopup = null;
          }
        }

        if (comboEndPopup) {
          comboEndPopup.y += comboEndPopup.vy * dt;
          comboEndPopup.life -= dt;
          if (comboEndPopup.life <= 0) {
            comboEndPopup = null;
          }
        }

        if (milestonePopup) {
          milestonePopup.life -= dt;
          if (milestonePopup.life <= 0) {
            milestonePopup = null;
          }
        }

        // Pillars bounce decay
        for (let i = 0; i < pillars.length; i++) {
          const p = pillars[i];
          if (p.bounceY !== 0 || p.bounceVy !== 0) {
            p.bounceY += p.bounceVy * dt;
            p.bounceVy -= p.bounceY * 360 * dt;
            p.bounceVy *= Math.pow(0.12, dt);
            if (Math.abs(p.bounceY) < 0.1 && Math.abs(p.bounceVy) < 1) {
              p.bounceY = 0;
              p.bounceVy = 0;
            }
          }
        }

        // Speed multiplier based on combo (up to ~1.5x)
        const speedMult = 1.0 + Math.min(0.5, combo * 0.08);

        // Substate logic
        if (gameState === 'play') {
          const curP = pillars[currentPillarIndex];
          const nxtP = pillars[currentPillarIndex + 1];

          if (playSubState === 'growing') {
            stickLength += GROW_SPEED * dt;
          } else if (playSubState === 'falling_stick') {
            stickFallTimer += dt;
            const progress = Math.min(1, stickFallTimer / FALL_STICK_TIME);
            prevStickAngle = stickAngle;
            stickAngle = (progress * progress) * (Math.PI / 2);

            // 指示2: ボーナスコイン: 倒れる棒がそこを通過すると取得（+1、キラッと音）
            for (let i = 0; i < coins.length; i++) {
              const c = coins[i];
              if (!c.collected) {
                const cdx = c.x - stickStartX;
                const cdy = groundY - c.y; // 上方向正
                if (cdx > 0 && cdy > 0) {
                  const dist = Math.hypot(cdx, cdy);
                  if (dist <= stickLength + c.r + 6 && dist >= 8) {
                    const coinAngle = Math.atan2(cdx, cdy); // 0: 真上, PI/2: 水平
                    if (stickAngle >= coinAngle - 0.12 && prevStickAngle <= coinAngle + 0.35) {
                      c.collected = true;
                      runCoins++;
                      totalCoins++;
                      safeSetStorage('bridgeJumpCoins', totalCoins.toString());
                      playCoinSound();
                      spawnParticles(c.x, c.y, 14, 'coin');
                      setJudgePopup('COIN', c.x, c.y - 12, 1, 0, false, false, false);
                    }
                  }
                }
              }
            }

            if (progress >= 1) {
              stickAngle = Math.PI / 2;
              playStickLandSound();

              const tipX = stickStartX + stickLength;

              nxtP.bounceVy = 55;
              screenShake = 3.2;
              spawnLandDust(tipX, groundY);

              // Check hit on next pillar
              const isOnNextPillar = tipX >= nxtP.x && tipX <= (nxtP.x + nxtP.w);

              if (isOnNextPillar) {
                // SUCCESS
                playSubState = 'walking';
                playerWalkTargetX = nxtP.x + nxtP.w - 16;
                count++;

                // 4段階判定
                const targetCenter = nxtP.perfectX;
                const distToCenter = Math.abs(tipX - targetCenter);
                const distToLeft = tipX - nxtP.x;
                const distToRight = (nxtP.x + nxtP.w) - tipX;
                const minDistToEdge = Math.min(distToLeft, distToRight);

                let judgeType = '';
                if (distToCenter <= PERFECT_TOLERANCE) {
                  judgeType = 'PERFECT';
                } else if (minDistToEdge <= 5.5) {
                  judgeType = 'GIRIGIRI';
                } else if (distToCenter <= 14.0) {
                  judgeType = 'GREAT';
                } else {
                  judgeType = 'GOOD';
                }

                // 指示1: 遠い足場: 間隔がいつもより広いが、届けば +2
                const isDistant = nxtP.type === 'distant';
                const distantBonus = isDistant ? 2 : 0;
                const isGold = nxtP.type === 'gold';

                if (judgeType === 'PERFECT') {
                  combo++;
                  runPerfects++;
                  if (combo > maxCombo) maxCombo = combo;
                  if (nxtP.type === 'gold') runGoldPerf++;

                  // 指示1: ゴールド足場: 赤印に入れると +5 と金色の紙吹雪
                  const goldBonus = isGold ? 5 : 0;
                  const comboBonus = Math.min(10, combo * 2); // PERFECTのコンボボーナスは +2×コンボ で上限 +10
                  let baseAndCombo = 1 + comboBonus;

                  // 指示3: ラッシュ2倍は基本点とPERFECTボーナスのみに掛ける
                  if (isRush) {
                    baseAndCombo *= 2;
                  }

                  let pts = baseAndCombo + goldBonus + distantBonus;
                  score += pts;

                  playPerfectSound(combo);
                  screenFlash = 0.42;
                  screenShake = 4.2;

                  ringEffects.push({
                    x: targetCenter,
                    y: groundY,
                    r: 4,
                    maxR: 44,
                    life: 0.42,
                    maxLife: 0.42,
                    color: isGold ? '#fbbf24' : '#f43f5e'
                  });

                  if (isGold) {
                    spawnParticles(tipX, groundY, 36, 'gold_confetti');
                  } else {
                    spawnParticles(tipX, groundY, 26, 'perfect');
                  }
                  triggerVibrate(15);
                  setJudgePopup('PERFECT', tipX, groundY - 65, pts, combo, isDistant, isGold, isRush);

                  // 指示3: テンポのご褒美「ラッシュ」: PERFECT が5連続するとラッシュモード突入（5秒きっかり）
                  if (combo === 5 || (combo > 5 && !isRush)) {
                    isRush = true;
                    runRushes++;
                    rushTimer = 5.0;
                    rushBeatTimer = 0.05;
                    setMilestonePopup('🔥 RUSH MODE! 得点2倍 🔥');
                  }
                } else {
                  if (combo > 0) {
                    spawnComboEndPopup(tipX, groundY - 88);
                  }
                  combo = 0;

                  let basePts = 1;
                  if (judgeType === 'GREAT') basePts = 2;
                  if (isRush) basePts *= 2; // 基本点のみ2倍

                  let pts = basePts + distantBonus;
                  score += pts;

                  if (judgeType === 'GREAT') {
                    playGreatSound();
                    screenShake = 2.2;
                    spawnParticles(tipX, groundY, 12, 'great');
                    setJudgePopup('GREAT', tipX, groundY - 62, pts, 0, isDistant, false, isRush);
                  } else if (judgeType === 'GIRIGIRI') {
                    runGirigiri++;
                    playGirigiriSound();
                    screenShake = 3.6;
                    spawnParticles(tipX, groundY, 8, 'land');
                    setJudgePopup('GIRIGIRI', tipX, groundY - 62, pts, 0, isDistant, false, isRush);
                  } else {
                    playSuccessSound();
                    screenShake = 1.8;
                    spawnParticles(tipX, groundY, 6, 'land');
                    setJudgePopup('GOOD', tipX, groundY - 62, pts, 0, isDistant, false, isRush);
                  }
                }

                // 指示4: 自己ベストの位置に「BEST」の旗を足場の上に立て、超えた瞬間に「ベスト更新!」とファンファーレ
                if (!hasCelebratedBest && (
                  (bestCount > 0 && count >= bestCount) ||
                  (previousBestScore > 0 && score > previousBestScore)
                )) {
                  hasCelebratedBest = true;
                  playFanfareSound();
                  setMilestonePopup('👑 ベスト更新! 👑');
                  spawnParticles(playerX, groundY - 45, 36, 'gold_confetti');
                } else if (count > 0 && count % 10 === 0) {
                  setMilestonePopup(`${count}本突破!`);
                  playMilestoneSound();
                }

                if (score > best) {
                  best = score;
                  safeSetStorage('bridgeJumpBest', best.toString());
                  isNewBest = true;
                }
                if (count > bestCount) {
                  bestCount = count;
                  safeSetStorage('bridgeJumpBestCount', bestCount.toString());
                }

                updateGameHook();
                targetCameraX = nxtP.x - 45;
              } else {
                // FAIL
                playSubState = 'walking';
                if (combo > 0) {
                  spawnComboEndPopup(tipX, groundY - 88);
                }
                combo = 0;
                playerWalkTargetX = tipX;
                updateGameHook();
              }
            }
          } else if (playSubState === 'walking') {
            playerWalkCycle += dt * 28 * speedMult;
            const dx = playerWalkTargetX - playerX;
            const step = RUN_SPEED * speedMult * dt;

            const tipX = stickStartX + stickLength;
            const isOnNextPillar = tipX >= nxtP.x && tipX <= (nxtP.x + nxtP.w);

            const remainingDist = Math.abs(playerWalkTargetX - playerX);
            if (isOnNextPillar && remainingDist < 42) {
              const jumpT = (42 - remainingDist) / 42;
              playerJumpY = -Math.sin(jumpT * Math.PI) * 13;
            } else {
              playerJumpY = 0;
            }

            if (Math.abs(dx) <= step) {
              playerX = playerWalkTargetX;
              playerJumpY = 0;

              if (isOnNextPillar) {
                spawnParticles(playerX, groundY, 5, 'land');
                currentPillarIndex++;
                stickLength = 0;
                stickAngle = 0;
                prevStickAngle = 0;
                stickStartX = nxtP.x + nxtP.w;

                // 渡りきった足場は停止を維持（足場が揺れないように）
                nxtP.isStopped = true;

                if (nxtP.type === 'moving') {
                  runMoving++;
                }

                if (!isGuideDone && count >= 3) {
                  isGuideDone = true;
                  safeSetStorage('bridgeJumpGuideDone', 'true');
                }

                ensurePillarsAhead();

                playSubState = 'ready';
                if (isInputHeld) {
                  startGrowing();
                }
              } else {
                playSubState = 'falling_player';
                fallTimer = 0;
                playerVy = 60;
                playFallSound();
              }
            } else {
              playerX += Math.sign(dx) * step;
              if (Math.random() < 0.4) {
                spawnParticles(playerX, groundY, 1, 'dust');
              }
            }
          } else if (playSubState === 'falling_player') {
            fallTimer += dt;
            playerVy += 1200 * dt;
            playerY += playerVy * dt;
            playerFallRot += dt * 9.5;

            if (stickAngle < Math.PI) {
              stickAngle += dt * 8.0;
            }

            if (fallTimer >= 0.58 || playerY > virtualH + 90) {
              gameState = 'over';
              gameOverTime = performance.now();
              if (score > best) {
                best = score;
                safeSetStorage('bridgeJumpBest', best.toString());
                isNewBest = true;
              }
              if (count > bestCount) {
                bestCount = count;
                safeSetStorage('bridgeJumpBestCount', bestCount.toString());
              }

              // Evaluate active missions
              const runStats = {
                score: score,
                count: count,
                maxCombo: maxCombo,
                runCoins: runCoins,
                runPerfects: runPerfects,
                runRushes: runRushes,
                runGoldPerf: runGoldPerf,
                runGirigiri: runGirigiri,
                runMoving: runMoving,
                totalCoins: totalCoins
              };

              missionsCompletedThisRun = [];
              for (let i = 0; i < activeMissionIds.length; i++) {
                const m = MISSION_POOL.find(x => x.id === activeMissionIds[i]);
                if (m && m.check(runStats)) {
                  missionsCompletedThisRun.push(m.id);
                }
              }

              const prevCount = completedMissionsCount;
              if (missionsCompletedThisRun.length > 0) {
                completedMissionsCount += missionsCompletedThisRun.length;
                safeSetStorage('bridgeJumpCompletedMissionsCount', completedMissionsCount.toString());

                const oldTier = getTitleIndex(prevCount);
                const newTier = getTitleIndex(completedMissionsCount);
                if (newTier > oldTier) {
                  hasTitleRankUp = true;
                  rankUpTitleName = TITLES[newTier].name;
                  playFanfareSound();
                  spawnParticles(virtualW / 2 + cameraX, virtualH * 0.25, 40, 'gold_confetti');
                } else {
                  playGreatSound();
                }
              }

              updateGameHook();
            }
          }
        }

        // Camera smoothly follows targetCameraX
        const camDiff = targetCameraX - cameraX;
        const currentCamSpeed = CAMERA_SPEED * speedMult;
        cameraX += camDiff * Math.min(1, dt * currentCamSpeed);

        // Remove out-of-screen coins
        if (coins.length > 30) {
          coins = coins.filter(c => c.x > cameraX - 120);
        }
      }

      // ==========================================
      // Rendering
      // ==========================================
      function render() {
        ctx.save();

        // High DPI clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.scale(dpr, dpr);

        const theme = getInterpolatedTheme();

        // Fill background
        const bgGrad = ctx.createLinearGradient(0, 0, 0, screenH);
        bgGrad.addColorStop(0, theme.skyTop);
        bgGrad.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, screenW, screenH);

        // Letterbox border on wide screens
        if (viewOffsetX > 0) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = 1;
          ctx.strokeRect(viewOffsetX, 0, virtualW * viewScale, screenH);
          ctx.restore();
        }

        // Clip to active play area
        ctx.save();
        ctx.beginPath();
        ctx.rect(viewOffsetX, 0, virtualW * viewScale, screenH);
        ctx.clip();

        ctx.translate(viewOffsetX, 0);
        ctx.scale(viewScale, viewScale);

        // Screen shake
        if (screenShake > 0) {
          const sx = (Math.random() - 0.5) * screenShake;
          const sy = (Math.random() - 0.5) * screenShake;
          ctx.translate(sx, sy);
        }

        // Background Parallax
        drawBackgroundEnvironment(theme);

        // World coordinates translation (Camera)
        ctx.save();
        ctx.translate(-cameraX, 0);

        // Draw Pillars (種類ごとの色・アイコン・BEST旗)
        drawPillars(theme);

        // Draw Coins (浮遊ボーナスコイン)
        drawCoins();

        // Draw Stick
        drawStick();

        // Draw Guide Ghost (初回プレイの最初の3本案内)
        drawGuideGhost();

        // Draw Player
        drawPlayer();

        // Draw Ring Effects
        drawRingEffects();

        // Draw Particles
        drawParticles();

        // Draw Popups
        drawPopups();

        ctx.restore(); // Restore camera

        // Screen Flash (PERFECT hit)
        if (screenFlash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, screenFlash)})`;
          ctx.fillRect(0, 0, virtualW, virtualH);
        }

        // 指示3: ラッシュモード突入時の画面端の光り（ネオン枠線発光）
        if (isRush) {
          drawRushBorderGlow();
        }

        // HUD & Overlays
        drawHUD();

        ctx.restore(); // Restore clip
        ctx.restore(); // Restore root
      }

      // ==========================================
      // Parallax Environment
      // ==========================================
      function drawBackgroundEnvironment(theme) {
        ctx.save();

        // Layer 1: 天体 & 雲 / 星 / オーロラ / 宇宙
        if (theme.isNight) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          for (let i = 0; i < 35; i++) {
            const sx = ((i * 37) + cameraX * 0.03) % virtualW;
            const sy = (i * 23) % (groundY * 0.65);
            const twinkle = 0.4 + Math.sin(performance.now() * 0.004 + i) * 0.4;
            ctx.globalAlpha = twinkle;
            ctx.fillRect(sx, sy, 1.5, 1.5);
          }
          ctx.globalAlpha = 1.0;

          if (theme.isCosmos) {
            ctx.save();
            const px = ((virtualW * 0.8) - cameraX * 0.02) % (virtualW + 100);
            const py = 120;
            const gradP = ctx.createRadialGradient(px - 10, py - 10, 5, px, py, 35);
            gradP.addColorStop(0, '#f472b6');
            gradP.addColorStop(0.7, '#831843');
            gradP.addColorStop(1, '#3b0764');
            ctx.fillStyle = gradP;
            ctx.beginPath();
            ctx.arc(px, py, 32, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(244, 114, 182, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(px, py, 52, 12, -0.3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          } else if (theme.isAurora) {
            ctx.save();
            const nowTime = performance.now() * 0.0015;
            for (let a = 0; a < 2; a++) {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              for (let x = 0; x <= virtualW; x += 20) {
                const waveY = 80 + Math.sin(x * 0.015 + nowTime + a) * 30 + Math.cos(x * 0.008 - nowTime) * 20;
                ctx.lineTo(x, waveY);
              }
              ctx.lineTo(virtualW, 0);
              ctx.closePath();
              ctx.fillStyle = a === 0 ? 'rgba(52, 211, 153, 0.22)' : 'rgba(168, 85, 247, 0.18)';
              ctx.fill();
            }
            ctx.restore();
          } else {
            ctx.save();
            const mx = ((virtualW * 0.82) - cameraX * 0.02) % (virtualW + 80);
            const my = 90;
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(mx, my, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = theme.skyTop;
            ctx.beginPath();
            ctx.arc(mx + 7, my - 3, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        } else {
          ctx.save();
          const sunX = ((virtualW * 0.8) - cameraX * 0.02) % (virtualW + 80);
          const sunY = theme.skyBottom.includes('fb923c') ? 140 : 85;
          const sunGrad = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 32);
          sunGrad.addColorStop(0, '#ffffff');
          sunGrad.addColorStop(0.3, '#fef08a');
          sunGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
          ctx.fillStyle = sunGrad;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          for (let c = 0; c < 3; c++) {
            const cx = ((c * 150 + 40) - cameraX * 0.05) % (virtualW + 120);
            const cy = 60 + c * 35;
            drawCloud(ctx, cx, cy, 32);
          }
          ctx.restore();
        }

        // Layer 2: 遠景の山並み
        const MOUNTAIN_TILE_W = 400;
        const mountainParallax = 0.12;
        const mountainOffset = -((cameraX * mountainParallax) % MOUNTAIN_TILE_W);

        function getMountainHeight(relX) {
          const normX = ((relX % MOUNTAIN_TILE_W) + MOUNTAIN_TILE_W) % MOUNTAIN_TILE_W;
          const t = (normX / MOUNTAIN_TILE_W) * Math.PI * 2;
          return 75 + Math.sin(t) * 35 + Math.cos(t * 2) * 20 + Math.sin(t * 3 + 1.2) * 15;
        }

        ctx.fillStyle = theme.mountainFar;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        for (let x = 0; x <= virtualW; x += 10) {
          const worldX = x - mountainOffset;
          const y = groundY - getMountainHeight(worldX);
          ctx.lineTo(x, y);
        }
        const yEnd = groundY - getMountainHeight(virtualW - mountainOffset);
        ctx.lineTo(virtualW, yEnd);
        ctx.lineTo(virtualW, groundY);
        ctx.closePath();
        ctx.fill();

        // Layer 3: 中景のビル群
        const CITY_TILE_W = 360;
        const cityParallax = 0.22;
        const cityOffset = -((cameraX * cityParallax) % CITY_TILE_W);

        const CITY_BUILDINGS = [
          { x: 0, w: 32, h: 65, spire: 8 },
          { x: 34, w: 26, h: 45 },
          { x: 62, w: 38, h: 90, antenna: 14 },
          { x: 102, w: 30, h: 55 },
          { x: 134, w: 44, h: 75 },
          { x: 180, w: 28, h: 105, spire: 12 },
          { x: 210, w: 38, h: 50 },
          { x: 250, w: 34, h: 80, antenna: 12 },
          { x: 286, w: 30, h: 60 },
          { x: 318, w: 40, h: 70 }
        ];

        ctx.fillStyle = theme.city;
        ctx.fillRect(0, groundY - 25, virtualW, 25);

        const startTileX = cityOffset <= 0 ? cityOffset : cityOffset - CITY_TILE_W;
        for (let tx = startTileX; tx < virtualW + CITY_TILE_W; tx += CITY_TILE_W) {
          for (let i = 0; i < CITY_BUILDINGS.length; i++) {
            const b = CITY_BUILDINGS[i];
            const bx = tx + b.x;
            if (bx + b.w < -20 || bx > virtualW + 20) continue;

            const by = groundY - b.h;
            ctx.fillStyle = theme.city;
            ctx.fillRect(bx, by, b.w, b.h);

            if (b.antenna) {
              ctx.lineWidth = 1.5;
              ctx.strokeStyle = theme.city;
              ctx.beginPath();
              ctx.moveTo(bx + b.w / 2, by);
              ctx.lineTo(bx + b.w / 2, by - b.antenna);
              ctx.stroke();
            }

            if (b.spire) {
              ctx.fillStyle = theme.city;
              ctx.beginPath();
              ctx.moveTo(bx + b.w / 2 - 4, by);
              ctx.lineTo(bx + b.w / 2, by - b.spire);
              ctx.lineTo(bx + b.w / 2 + 4, by);
              ctx.closePath();
              ctx.fill();
            }

            const winColor = (theme.isNight || theme.skyBottom.includes('fb923c'))
              ? theme.windowColor
              : 'rgba(255, 255, 255, 0.3)';
            ctx.fillStyle = winColor;
            for (let wy = by + 8; wy < groundY - 12; wy += 9) {
              for (let wx = bx + 5; wx < bx + b.w - 5; wx += 7) {
                const hash = ((wx * 17 + wy * 31) % 10);
                if (hash > 2) {
                  ctx.fillRect(wx, wy, 2.5, 3.5);
                }
              }
            }
          }
        }

        // 足場の上端（groundY）より下を暗い谷で埋める
        const valleyGrad = ctx.createLinearGradient(0, groundY, 0, virtualH);
        if (theme.isNight) {
          valleyGrad.addColorStop(0, '#060a12');
          valleyGrad.addColorStop(1, '#020306');
        } else if (theme.skyBottom.includes('fb923c')) {
          valleyGrad.addColorStop(0, '#1a091a');
          valleyGrad.addColorStop(1, '#09030d');
        } else {
          valleyGrad.addColorStop(0, '#0f172a');
          valleyGrad.addColorStop(0.3, '#090d16');
          valleyGrad.addColorStop(1, '#020617');
        }
        ctx.fillStyle = valleyGrad;
        ctx.fillRect(0, groundY, virtualW, virtualH - groundY + 10);

        ctx.restore();
      }

      function drawCloud(c, x, y, size) {
        c.beginPath();
        c.arc(x, y, size * 0.5, 0, Math.PI * 2);
        c.arc(x + size * 0.4, y - size * 0.2, size * 0.55, 0, Math.PI * 2);
        c.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
        c.fill();
      }

      // ==========================================
      // Pillars Rendering (足場のバリエーション & BEST旗)
      // ==========================================
      function drawPillars(theme) {
        const viewLeft = cameraX - 60;
        const viewRight = cameraX + virtualW + 60;
        const timeNow = performance.now();

        for (let i = 0; i < pillars.length; i++) {
          const p = pillars[i];
          if (p.x + p.w < viewLeft || p.x > viewRight) continue;

          const currentGroundY = groundY + p.bounceY;
          const pillarH = virtualH - currentGroundY;

          // 指示1: 足場のバリエーション（色と小さなアイコンで一目で分かるように）
          if (p.type === 'gold') {
            // ゴールド足場: 金色グラデーション＋光沢
            const grad = ctx.createLinearGradient(p.x, currentGroundY, p.x + p.w, currentGroundY);
            grad.addColorStop(0, '#b45309');
            grad.addColorStop(0.4, '#f59e0b');
            grad.addColorStop(0.8, '#fbbf24');
            grad.addColorStop(1, '#b45309');
            ctx.fillStyle = grad;
            ctx.fillRect(p.x, currentGroundY, p.w, pillarH);

            // 金色の上面ハイライト
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(p.x, currentGroundY, p.w, 4);

            // 側面の金色の輝き枠線
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 1;
            ctx.strokeRect(p.x, currentGroundY, p.w, pillarH);

            // 小さなアイコン「👑 +5」
            ctx.save();
            ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fef08a';
            ctx.shadowColor = 'rgba(251, 191, 36, 0.9)';
            ctx.shadowBlur = 6;
            ctx.fillText('👑 +5', p.perfectX, currentGroundY - 8);
            ctx.restore();
          } else if (p.type === 'moving') {
            // 動く足場: ネオンシアン/エレクトリックブルー調＋矢印パターン
            const grad = ctx.createLinearGradient(p.x, currentGroundY, p.x + p.w, currentGroundY);
            grad.addColorStop(0, '#0369a1');
            grad.addColorStop(0.5, '#06b6d4');
            grad.addColorStop(1, '#0284c7');
            ctx.fillStyle = grad;
            ctx.fillRect(p.x, currentGroundY, p.w, pillarH);

            // シアン上面ハイライト
            ctx.fillStyle = '#67e8f9';
            ctx.fillRect(p.x, currentGroundY, p.w, 4);

            // 停止中と移動中の区別
            ctx.save();
            ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#a5f3fc';
            ctx.shadowColor = 'rgba(6, 182, 212, 0.8)';
            ctx.shadowBlur = 6;
            ctx.fillText(p.isStopped ? '⏹ STOP' : '↔ MOVE', p.perfectX, currentGroundY - 8);
            ctx.restore();
          } else if (p.type === 'distant') {
            // 遠い足場: ネオンマゼンタ/バイオレット調＋「≫ +2」
            const grad = ctx.createLinearGradient(p.x, currentGroundY, p.x + p.w, currentGroundY);
            grad.addColorStop(0, '#581c87');
            grad.addColorStop(0.5, '#9333ea');
            grad.addColorStop(1, '#c026d3');
            ctx.fillStyle = grad;
            ctx.fillRect(p.x, currentGroundY, p.w, pillarH);

            // バイオレット上面ハイライト
            ctx.fillStyle = '#f5d0fe';
            ctx.fillRect(p.x, currentGroundY, p.w, 4);

            // 小さなアイコン「≫ +2」
            ctx.save();
            ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#f0abfc';
            ctx.shadowColor = 'rgba(192, 38, 211, 0.9)';
            ctx.shadowBlur = 6;
            ctx.fillText('≫ +2', p.perfectX, currentGroundY - 8);
            ctx.restore();
          } else {
            // 通常足場
            const grad = ctx.createLinearGradient(p.x, currentGroundY, p.x + p.w, currentGroundY);
            grad.addColorStop(0, theme.pillarGrad1);
            grad.addColorStop(0.4, theme.pillarGrad2);
            grad.addColorStop(0.85, theme.pillarGrad2);
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            ctx.fillRect(p.x, currentGroundY, p.w, pillarH);

            ctx.fillStyle = theme.pillarTop;
            ctx.fillRect(p.x, currentGroundY, p.w, 3.5);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(p.x, currentGroundY, 1, pillarH);
          }

          // Red PERFECT marker at the top center
          const markerW = Math.min(PERFECT_MARKER_W, p.w * 0.28);
          const markerX = p.perfectX - markerW / 2;

          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(markerX, currentGroundY, markerW, 4);

          ctx.fillStyle = '#ffe4e6';
          ctx.fillRect(p.perfectX - 1, currentGroundY, 2, 4);

          // 指示4: 自己ベストの位置に「BEST」の旗を足場の上に立てる
          if (p.hasBestFlag) {
            ctx.save();
            const poleX = p.x + p.w - 8;
            const poleBaseY = currentGroundY;
            const poleH = 34;
            const poleTopY = poleBaseY - poleH;

            // 旗竿（メタリックシルバー）
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(poleX, poleBaseY);
            ctx.lineTo(poleX, poleTopY);
            ctx.stroke();

            // 竿先の金玉
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(poleX, poleTopY, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 風になびく旗（三角ペナント）
            const flutter = Math.sin(timeNow * 0.006 + p.x) * 3;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(poleX, poleTopY);
            ctx.lineTo(poleX + 22, poleTopY + 7 + flutter);
            ctx.lineTo(poleX, poleTopY + 15);
            ctx.closePath();
            ctx.fill();

            // 「BEST」の文字
            ctx.font = '900 8px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('BEST', poleX + 2, poleTopY + 10 + flutter * 0.4);

            ctx.restore();
          }
        }
      }

      // ==========================================
      // Bonus Coins Rendering
      // ==========================================
      function drawCoins() {
        const viewLeft = cameraX - 20;
        const viewRight = cameraX + virtualW + 20;
        const timeNow = performance.now();

        for (let i = 0; i < coins.length; i++) {
          const c = coins[i];
          if (c.collected || c.x < viewLeft || c.x > viewRight) continue;

          ctx.save();
          ctx.translate(c.x, c.y);

          // コインの輝き回転（少し横方向にスケールして回転感を出す）
          const rotScale = Math.cos(timeNow * 0.004 + c.phase);
          ctx.scale(Math.max(0.2, Math.abs(rotScale)), 1.0);

          // 外枠ゴールド
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(0, 0, c.r, 0, Math.PI * 2);
          ctx.fill();

          // 内側ブライトゴールド
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(0, 0, c.r - 2, 0, Math.PI * 2);
          ctx.fill();

          // 中央のキラ星
          ctx.fillStyle = '#fef08a';
          ctx.font = '900 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', 0, 0);

          ctx.restore();
        }
      }

      // ==========================================
      // Stick (Bridge) Rendering & Ghost Guide
      // ==========================================
      function drawStick() {
        if (stickLength <= 0) return;

        ctx.save();
        ctx.translate(stickStartX, groundY);
        ctx.rotate(stickAngle - Math.PI / 2);

        // Stick body
        ctx.lineCap = 'round';
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(stickLength, 0);
        ctx.stroke();

        // 棒が伸びる間は先端が光る
        if (playSubState === 'growing') {
          const pulse = 1.0 + Math.sin(performance.now() * 0.02) * 0.3;
          ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
          ctx.beginPath();
          ctx.arc(stickLength, 0, 8 * pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(stickLength, 0, 3.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(stickLength, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawGuideGhost() {
        // 指示1: はじめての人向けガイド（初回プレイの最初の3本だけ、半透明のゴースト棒と「ここまで伸ばして離す」を表示）
        if (isGuideDone || count >= 3 || gameState !== 'play') return;
        if (playSubState !== 'ready' && playSubState !== 'growing') return;
        const curP = pillars[currentPillarIndex];
        const nxtP = pillars[currentPillarIndex + 1];
        if (!curP || !nxtP) return;

        const startX = curP.x + curP.w;
        const targetX = nxtP.perfectX;
        const reqLen = targetX - startX;
        if (reqLen <= 0) return;

        ctx.save();
        // 半透明ゴースト棒（破線＆ネオングロー）
        ctx.save();
        ctx.translate(startX, groundY);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.42)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(reqLen, 0);
        ctx.stroke();
        ctx.setLineDash([]);

        // 目標地点のリングエフェクト
        const pulse = 1.0 + Math.sin(performance.now() * 0.008) * 0.25;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.28)';
        ctx.beginPath();
        ctx.arc(reqLen, 0, 8 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(reqLen, 0, 3.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 案内テキスト「ここまで伸ばして離す ▼」
        const floatY = Math.sin(performance.now() * 0.008) * 3.5;
        const labelX = targetX;
        const labelY = groundY - 26 + floatY;

        ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        const guideText = 'ここまで伸ばして離す ▼';
        const textW = ctx.measureText(guideText).width;
        const bW = textW + 18;
        const bH = 24;
        const bX = labelX - bW / 2;
        const bY = labelY - bH;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.2;
        drawRoundRect(ctx, bX, bY, bW, bH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.7)';
        ctx.shadowBlur = 6;
        ctx.fillText(guideText, labelX, labelY - 7);
        ctx.restore();
      }

      // ==========================================
      // Player (Stickman) Rendering with Skins
      // ==========================================
      function drawPlayer() {
        ctx.save();
        ctx.translate(playerX, playerY + playerJumpY);

        if (playSubState === 'falling_player') {
          ctx.rotate(playerFallRot);
        }

        renderStickmanFigure(ctx, playSubState, playerWalkCycle, equippedSkin);
        ctx.restore();
      }

      function renderStickmanFigure(c, subState, walkCycle, skinId, isPreview = false) {
        const headR = 4.5;
        const hipY = -6;
        const shoulderY = -14;
        const headY = -20;

        let legAngle1 = 0;
        let legAngle2 = 0;
        let armAngle1 = 0;
        let armAngle2 = 0;

        if (subState === 'walking') {
          legAngle1 = Math.sin(walkCycle) * 0.7;
          legAngle2 = -Math.sin(walkCycle) * 0.7;
          armAngle1 = -Math.sin(walkCycle) * 0.7;
          armAngle2 = Math.sin(walkCycle) * 0.7;
        } else if (subState === 'growing') {
          armAngle1 = -1.1;
          armAngle2 = 0.2;
        } else if (subState === 'falling_player') {
          armAngle1 = -2.2;
          armAngle2 = -2.0;
          legAngle1 = 0.6;
          legAngle2 = -0.5;
        }

        const isNinja = skinId === 'ninja';
        const isNeko = skinId === 'neko';
        const isCrown = skinId === 'crown';
        const isAstro = skinId === 'astro';
        const isCyber = skinId === 'cyber';

        const bodyColor = isNinja ? '#475569' : (isCyber ? '#06b6d4' : '#f8fafc');

        c.lineWidth = 2.2;
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.strokeStyle = bodyColor;

        // Back accessories (Cape for Crown, Sheath for Ninja, Oxygen Tank for Astro, Tail for Neko)
        if (isCrown) {
          const capeWave = subState === 'walking' ? Math.sin(walkCycle * 1.5) * 6 : (isPreview ? 2 : Math.sin(performance.now() * 0.005) * 2.5);
          c.fillStyle = '#dc2626';
          c.beginPath();
          c.moveTo(-1, shoulderY);
          c.lineTo(1, shoulderY);
          c.lineTo(-4 + capeWave, hipY + 8);
          c.lineTo(-10 + capeWave, hipY + 6);
          c.closePath();
          c.fill();
          c.strokeStyle = '#fbbf24';
          c.lineWidth = 1;
          c.stroke();
          c.strokeStyle = bodyColor;
          c.lineWidth = 2.2;
        }

        if (isAstro) {
          c.fillStyle = '#475569';
          c.strokeStyle = '#94a3b8';
          c.lineWidth = 1.2;
          drawRoundRect(c, -7, shoulderY + 1, 4, 11, 2);
          c.fill();
          c.stroke();
          c.strokeStyle = bodyColor;
          c.lineWidth = 2.2;
        }

        if (isNinja) {
          c.strokeStyle = '#94a3b8';
          c.lineWidth = 1.8;
          c.beginPath();
          c.moveTo(-2, shoulderY - 4);
          c.lineTo(-8, hipY + 4);
          c.stroke();
          c.strokeStyle = '#e2e8f0';
          c.lineWidth = 2.2;
          c.beginPath();
          c.moveTo(-2, shoulderY - 4);
          c.lineTo(0, shoulderY - 7);
          c.stroke();
          c.strokeStyle = bodyColor;
          c.lineWidth = 2.2;
        }

        if (isNeko) {
          const tailWave = subState === 'walking' ? Math.sin(walkCycle * 1.5) * 5 : (isPreview ? 2 : Math.sin(performance.now() * 0.006) * 3);
          c.strokeStyle = '#f8fafc';
          c.lineWidth = 2.4;
          c.beginPath();
          c.moveTo(0, hipY);
          c.quadraticCurveTo(-8, hipY - 6 + tailWave, -13, hipY - 2 + tailWave);
          c.stroke();
          c.strokeStyle = bodyColor;
          c.lineWidth = 2.2;
        }

        // Torso
        c.beginPath();
        c.moveTo(0, shoulderY);
        c.lineTo(0, hipY);
        c.stroke();

        // Legs
        c.beginPath();
        c.moveTo(0, hipY);
        const l1x = Math.sin(legAngle1) * 7;
        const l1y = hipY + Math.cos(legAngle1) * 6;
        c.lineTo(l1x, l1y);
        c.lineTo(l1x + Math.sin(legAngle1 + 0.3) * 5, 0);
        c.stroke();

        c.beginPath();
        c.moveTo(0, hipY);
        const l2x = Math.sin(legAngle2) * 7;
        const l2y = hipY + Math.cos(legAngle2) * 6;
        c.lineTo(l2x, l2y);
        c.lineTo(l2x + Math.sin(legAngle2 + 0.3) * 5, 0);
        c.stroke();

        // Arms
        c.beginPath();
        c.moveTo(0, shoulderY);
        c.lineTo(Math.sin(armAngle1) * 8, shoulderY + Math.cos(armAngle1) * 8);
        c.stroke();

        c.beginPath();
        c.moveTo(0, shoulderY);
        c.lineTo(Math.sin(armAngle2) * 8, shoulderY + Math.cos(armAngle2) * 8);
        c.stroke();

        // Head
        c.fillStyle = bodyColor;
        c.beginPath();
        c.arc(0, headY, headR, 0, Math.PI * 2);
        c.fill();

        // Head accessories & Face
        if (isAstro) {
          // Helmet
          c.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          c.lineWidth = 1.6;
          c.beginPath();
          c.arc(0, headY, headR + 2.5, 0, Math.PI * 2);
          c.stroke();
          // Visor
          c.fillStyle = '#0284c7';
          c.beginPath();
          c.arc(1.5, headY - 0.5, headR * 0.8, -0.7, 1.8);
          c.fill();
          c.fillStyle = '#fef08a';
          c.beginPath();
          c.arc(2.5, headY - 1.5, 1.2, 0, Math.PI * 2);
          c.fill();
        } else if (isCyber) {
          // Cyber glowing visor
          c.fillStyle = '#22d3ee';
          c.shadowColor = '#06b6d4';
          c.shadowBlur = 8;
          c.fillRect(-1, headY - 2.5, 7, 3);
          c.shadowBlur = 0;
        } else {
          // Eye
          c.fillStyle = isNinja ? '#f8fafc' : '#090d16';
          c.beginPath();
          c.arc(2, headY - 0.5, 1, 0, Math.PI * 2);
          c.fill();
        }

        if (isNinja) {
          // Red headband
          c.fillStyle = '#ef4444';
          c.fillRect(-headR - 1, headY - 1.5, headR * 2 + 2, 2.5);
          // Forehead metal plate
          c.fillStyle = '#cbd5e1';
          c.fillRect(2, headY - 2, 3, 3);
          // Trailing ribbons
          const ribbonWave = subState === 'walking' ? Math.sin(walkCycle * 1.5) * 4 : (isPreview ? 2 : Math.sin(performance.now() * 0.005) * 2.5);
          c.strokeStyle = '#ef4444';
          c.lineWidth = 1.6;
          c.beginPath();
          c.moveTo(-headR, headY);
          c.quadraticCurveTo(-headR - 6, headY - 2 + ribbonWave, -headR - 12, headY + 2 + ribbonWave);
          c.stroke();
        }

        if (isNeko) {
          // Cat ears
          c.fillStyle = '#f8fafc';
          c.beginPath();
          c.moveTo(-headR + 1, headY - 2);
          c.lineTo(-headR - 2, headY - 7);
          c.lineTo(-headR + 3, headY - 5);
          c.closePath();
          c.fill();

          c.beginPath();
          c.moveTo(headR - 1, headY - 2);
          c.lineTo(headR + 2, headY - 7);
          c.lineTo(headR - 3, headY - 5);
          c.closePath();
          c.fill();

          // Pink inner ears
          c.fillStyle = '#f43f5e';
          c.beginPath();
          c.moveTo(-headR + 0.6, headY - 2);
          c.lineTo(-headR - 1.2, headY - 6);
          c.lineTo(-headR + 2.2, headY - 4.5);
          c.closePath();
          c.fill();

          c.beginPath();
          c.moveTo(headR - 0.6, headY - 2);
          c.lineTo(headR + 1.2, headY - 6);
          c.lineTo(headR - 2.2, headY - 4.5);
          c.closePath();
          c.fill();

          // Bell collar
          c.fillStyle = '#fbbf24';
          c.beginPath();
          c.arc(1, shoulderY + 1, 2, 0, Math.PI * 2);
          c.fill();
        }

        if (isCrown) {
          // Gold crown
          c.fillStyle = '#fbbf24';
          c.beginPath();
          c.moveTo(-4, headY - headR);
          c.lineTo(-4, headY - headR - 5);
          c.lineTo(-2, headY - headR - 2);
          c.lineTo(0, headY - headR - 6);
          c.lineTo(2, headY - headR - 2);
          c.lineTo(4, headY - headR - 5);
          c.lineTo(4, headY - headR);
          c.closePath();
          c.fill();
          // Ruby jewel
          c.fillStyle = '#ef4444';
          c.beginPath();
          c.arc(0, headY - headR - 2, 1.2, 0, Math.PI * 2);
          c.fill();
        }

        // Neck / Scarf
        if (isCyber) {
          const scarfWave = subState === 'walking' ? Math.sin(walkCycle * 1.5) * 4 : 0;
          c.strokeStyle = '#c084fc';
          c.shadowColor = '#a855f7';
          c.shadowBlur = 8;
          c.lineWidth = 2.6;
          c.beginPath();
          c.moveTo(0, shoulderY);
          c.quadraticCurveTo(-6, shoulderY - 2 + scarfWave, -12, shoulderY + scarfWave);
          c.stroke();
          c.shadowBlur = 0;
        } else if (!isCrown && !isAstro && !isNeko) {
          c.fillStyle = '#f43f5e';
          c.beginPath();
          c.arc(0, shoulderY, 2.5, 0, Math.PI * 2);
          c.fill();

          const scarfSwing = subState === 'walking' ? Math.sin(walkCycle * 1.5) * 4 : 0;
          c.strokeStyle = '#f43f5e';
          c.lineWidth = 2.5;
          c.beginPath();
          c.moveTo(0, shoulderY);
          c.quadraticCurveTo(-6, shoulderY - 2 + scarfSwing, -12, shoulderY + scarfSwing);
          c.stroke();
        }
      }

      function drawSkinPreview(c, px, py, skinId) {
        c.save();
        c.translate(px, py);
        c.scale(0.85, 0.85);
        renderStickmanFigure(c, 'ready', 0, skinId, true);
        c.restore();
      }

      function drawRingEffects() {
        for (let i = 0; i < ringEffects.length; i++) {
          const r = ringEffects[i];
          const alpha = Math.max(0, r.life / r.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = r.color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawParticles() {
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;

          if (p.isConfetti) {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot || 0);
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // ==========================================
      // Popups
      // ==========================================
      function drawPopups() {
        if (currentJudgePopup) {
          const pop = currentJudgePopup;
          const progress = pop.life / pop.maxLife;
          const alpha = Math.min(1, progress * 1.6);
          const scale = 1.0 + (1.0 - progress) * 0.25;

          ctx.save();
          let posX = pop.x;
          let posY = pop.y;

          if (pop.shake > 0) {
            posX += (Math.random() - 0.5) * 6;
            posY += (Math.random() - 0.5) * 4;
          }

          // 判定ごとの情報定義
          let titleText = '';
          let titleFont = '900 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          let titleColor = '#ffffff';
          let titleShadowColor = 'rgba(0, 0, 0, 0.6)';
          let titleShadowBlur = 8;
          let subTextColor = '#ffffff';
          let subLines = [];
          let subFontSize = 11;

          if (pop.type === 'COIN') {
            titleText = '+1 🪙';
            titleFont = '900 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            titleColor = '#fbbf24';
            titleShadowColor = 'rgba(251, 191, 36, 0.9)';
            titleShadowBlur = 8;
          } else {
            const detailParts = [];
            if (pop.isGold) detailParts.push('金+5');
            if (pop.isDistant) detailParts.push('遠距離+2');
            if (pop.rushActive) detailParts.push('×2');

            let baseScoreText = `+${pop.pts}`;
            if (pop.type === 'PERFECT') {
              titleText = pop.isGold ? 'GOLD PERFECT!' : 'PERFECT!';
              titleFont = '900 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              titleColor = pop.isGold ? '#fef08a' : '#fbbf24';
              titleShadowColor = pop.isGold ? 'rgba(251, 191, 36, 1.0)' : 'rgba(251, 191, 36, 0.8)';
              titleShadowBlur = pop.isGold ? 16 : 12;
              subTextColor = '#ffffff';
              baseScoreText = `+${pop.pts} (x${pop.combo})`;
            } else if (pop.type === 'GREAT') {
              titleText = 'GREAT!';
              titleFont = '800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              titleColor = '#38bdf8';
              titleShadowColor = 'rgba(56, 189, 248, 0.8)';
              titleShadowBlur = 8;
              subTextColor = '#e0f2fe';
            } else if (pop.type === 'GIRIGIRI') {
              titleText = 'ギリギリ!';
              titleFont = '900 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              titleColor = '#ef4444';
              titleShadowColor = 'rgba(239, 68, 68, 0.9)';
              titleShadowBlur = 10;
              subTextColor = '#fecaca';
            } else {
              titleText = 'GOOD';
              titleFont = '700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              titleColor = '#34d399';
              titleShadowColor = 'rgba(52, 211, 153, 0.7)';
              titleShadowBlur = 6;
              subTextColor = '#d1fae5';
            }

            // 内訳テキストの構築（短縮形: 例「+32 (x15) 遠距離+2 ×2」）
            const detailsStr = detailParts.join(' ');
            const singleLineText = detailsStr ? `${baseScoreText} ${detailsStr}` : baseScoreText;

            // テキスト幅チェック＆必要に応じて折り返しまたはフォント縮小
            ctx.font = `bold ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            const singleW = ctx.measureText(singleLineText).width;

            // 1行で 170px を超え、内訳パーツがある場合は2行に分割
            if (singleW > 170 && detailParts.length > 0) {
              subLines = [baseScoreText, detailsStr];
            } else {
              subLines = [singleLineText];
            }

            // サブライン幅が画面最大許容幅を超える場合はフォントを縮小
            const maxAllowedSubW = (virtualW - 36) / scale;
            let currentMaxSubW = 0;
            for (let i = 0; i < subLines.length; i++) {
              const w = ctx.measureText(subLines[i]).width;
              if (w > currentMaxSubW) currentMaxSubW = w;
            }

            while (currentMaxSubW > maxAllowedSubW && subFontSize > 8) {
              subFontSize--;
              ctx.font = `bold ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
              currentMaxSubW = 0;
              for (let i = 0; i < subLines.length; i++) {
                const w = ctx.measureText(subLines[i]).width;
                if (w > currentMaxSubW) currentMaxSubW = w;
              }
            }
          }

          // タイトル幅とサブライン幅の最大値を計測
          ctx.font = titleFont;
          let maxTotalW = ctx.measureText(titleText).width;
          ctx.font = `bold ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          for (let i = 0; i < subLines.length; i++) {
            const w = ctx.measureText(subLines[i]).width;
            if (w > maxTotalW) maxTotalW = w;
          }

          // 画面両端から絶対に切れないよう動的マージンでクランプ
          const halfW = (maxTotalW / 2) * scale;
          const margin = Math.ceil(halfW + 8);
          const screenX = posX - cameraX;
          const clampedScreenX = Math.max(margin, Math.min(virtualW - margin, screenX));
          posX = clampedScreenX + cameraX;

          ctx.translate(posX, posY);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;
          ctx.textAlign = 'center';

          // タイトル描画
          ctx.font = titleFont;
          ctx.fillStyle = titleColor;
          ctx.shadowColor = titleShadowColor;
          ctx.shadowBlur = titleShadowBlur;
          ctx.fillText(titleText, 0, 0);

          // サブライン描画
          if (subLines.length > 0) {
            ctx.font = `bold ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = subTextColor;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 4;

            if (subLines.length === 1) {
              ctx.fillText(subLines[0], 0, 16);
            } else {
              ctx.fillText(subLines[0], 0, 15);
              ctx.fillText(subLines[1], 0, 27);
            }
          }

          ctx.restore();
        }

        if (comboEndPopup) {
          const cPop = comboEndPopup;
          const alpha = Math.max(0, cPop.life / cPop.maxLife);
          ctx.save();
          const margin = 50;
          const screenX = cPop.x - cameraX;
          const clampedScreenX = Math.max(margin, Math.min(virtualW - margin, screenX));
          ctx.translate(clampedScreenX + cameraX, cPop.y);
          ctx.globalAlpha = alpha;
          ctx.textAlign = 'center';
          ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = '#cbd5e1';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
          ctx.shadowBlur = 4;
          ctx.fillText('コンボ終了', 0, 0);
          ctx.restore();
        }

        if (milestonePopup) {
          const mPop = milestonePopup;
          const alpha = Math.min(1, (mPop.life / mPop.maxLife) * 1.5);
          const scale = 0.9 + (1.0 - mPop.life / mPop.maxLife) * 0.2;

          ctx.save();
          ctx.translate(virtualW / 2 + cameraX, virtualH * 0.22);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;
          ctx.textAlign = 'center';

          ctx.font = '900 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = '#fef08a';
          ctx.shadowColor = 'rgba(251, 191, 36, 0.9)';
          ctx.shadowBlur = 16;
          ctx.fillText(mPop.text, 0, 0);
          ctx.restore();
        }
      }

      // ==========================================
      // Rush Mode Glowing Border Effect
      // ==========================================
      function drawRushBorderGlow() {
        ctx.save();
        const pulse = 0.7 + Math.sin(performance.now() * 0.012) * 0.3;
        ctx.strokeStyle = `rgba(251, 191, 36, ${0.85 * pulse})`;
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, virtualW - 6, virtualH - 6);

        // 内側の赤いネオン線
        ctx.strokeStyle = `rgba(244, 63, 94, ${0.65 * pulse})`;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(6, 6, virtualW - 12, virtualH - 12);
        ctx.restore();
      }

      // ==========================================
      // HUD & Overlays
      // ==========================================

        ctx.save();

        const currentTitle = getTitle(completedMissionsCount);

        if (gameState === 'play') {
          ctx.textAlign = 'center';

          // 大きくスコア
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 2;
          ctx.fillText(score.toString(), virtualW / 2, 78);

          // その下に小さく渡った本数とベスト
          const hudText = `渡った本数 ${count}   /   BEST ${best}`;
          ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          const textW = ctx.measureText(hudText).width;
          const badgeW = textW + 24;
          const badgeH = 24;
          const badgeX = (virtualW - badgeW) / 2;
          const badgeY = 92;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.68)';

          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1;
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.lineWidth = 2.5;
          ctx.strokeText(hudText, virtualW / 2, 108);
          ctx.fillText(hudText, virtualW / 2, 108);
          ctx.restore();

          // 指示4: 称号を HUD に小さく表示
          ctx.save();
          const titleBadgeText = `🎖️ ${currentTitle.name}`;
          ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          const tTextW = ctx.measureText(titleBadgeText).width;
          const tBadgeW = tTextW + 18;
          const tBadgeH = 20;
          const tBadgeX = (virtualW - tBadgeW) / 2;

          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';

          ctx.strokeStyle = currentTitle.color;
          ctx.lineWidth = 1;
          drawRoundRect(ctx, tbX, tbY, tbW, tbH, 11);

          ctx.stroke();

          ctx.fillStyle = currentTitle.color;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 4;
          ctx.fillText(titleBadgeText, virtualW / 2, tbY + 15);
          ctx.restore();

          // 指示2: タイトルに常に3つのミッションを表示
          const mCardX = 35;
          const mCardY = 102;
          const mCardW = 320;
          const mCardH = 96;

          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';

            } else {
              ctx.fillStyle = '#64748b';
              ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.fillText(`🔒 🪙${sk.cost}`, bX + 4, bY + 14);
            }

            ctx.restore();
          }

          // Close button at bottom
          const closeBtn = { x: cardX + (cardW - 130) / 2, y: cardY + cardH - 36, w: 130, h: 28 };
          ctx.save();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1;
          drawRoundRect(ctx, closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h, 14);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText('✕ とじる', closeBtn.x + closeBtn.w / 2, closeBtn.y + 18);
          ctx.restore();
        }

        ctx.restore();
      }

      function drawRoundRect(c, x, y, w, h, r) {
        let radius = typeof r === 'number' ? r : 0;
        if (radius * 2 > Math.abs(w)) radius = Math.abs(w) / 2;
        if (radius * 2 > Math.abs(h)) radius = Math.abs(h) / 2;
        if (radius < 0) radius = 0;

        if (typeof c.roundRect === 'function') {
          c.beginPath();
          c.roundRect(x, y, w, h, radius);
          return;
        }

        c.beginPath();
        if (radius === 0) {
          c.rect(x, y, w, h);
          return;
        }
        c.moveTo(x + radius, y);
        c.arcTo(x + w, y, x + w, y + h, radius);
        c.arcTo(x + w, y + h, x, y + h, radius);
        c.arcTo(x, y + h, x, y, radius);
        c.arcTo(x, y, x + w, y, radius);
        c.closePath();
      }

      // ==========================================
      // Bot Automation (?bot=1)
      // ==========================================
      function runBotLogic() {
        if (!isBot) return;
        activeModal = null; // bot実行時はモーダルを開かない

        if (gameState === 'title') {
          if (!botTimer) {
            botTimer = setTimeout(() => {
              botTimer = null;
              if (gameState === 'title') {
                activeModal = null;
                startGame();
              }
            }, 300);
          }
          return;
        }

        if (gameState === 'over') {
          if (!botTimer) {
            const elapsed = performance.now() - gameOverTime;
            const waitTime = Math.max(0, 2000 - elapsed);
            botTimer = setTimeout(() => {
              botTimer = null;
              if (gameState === 'over') {
                resetGame(true);
              }
            }, waitTime);
          }
          return;
        }

        if (gameState === 'play' && playSubState === 'ready' && !botHolding) {
          const curP = pillars[currentPillarIndex];
          const nxtP = pillars[currentPillarIndex + 1];
          if (!nxtP) return;

          const startX = curP.x + curP.w;
          let idealLength = 0;

          // 動く足場の場合はリリース時の着地位置を予測計算
          if (nxtP.type === 'moving' && !nxtP.isStopped) {
            let tEst = (nxtP.baseX + nxtP.w / 2 - startX) / GROW_SPEED;
            for (let iter = 0; iter < 3; iter++) {
              const predX = nxtP.baseX + nxtP.w / 2 + Math.sin(nxtP.movePhase + nxtP.moveSpeed * tEst) * nxtP.moveAmp;
              tEst = (predX - startX) / GROW_SPEED;
            }
            const finalPredX = nxtP.baseX + nxtP.w / 2 + Math.sin(nxtP.movePhase + nxtP.moveSpeed * tEst) * nxtP.moveAmp;
            idealLength = finalPredX - startX;
          } else {
            idealLength = nxtP.perfectX - startX;
          }

          const halfW = nxtP.w / 2;

          // 失敗確率カーブ: 15〜50回でだいたい失敗する確率を維持
          let pMiss = 0;
          if (count >= 48) {
            pMiss = 1.0;
          } else if (count >= 14) {
            pMiss = Math.pow((count - 13) / 35, 1.8) * 0.45;
          }

          let errorPx = 0;
          if (Math.random() < pMiss) {
            const dir = Math.random() < 0.5 ? -1 : 1;
            errorPx = dir * (halfW + 15 + Math.random() * 20);
          } else {
            const sigma = 0.8 + Math.pow(count / 25, 2) * 2.4;
            const u1 = Math.max(1e-6, Math.random());
            const u2 = Math.random();
            const normalRand = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            errorPx = normalRand * sigma;
          }

          const chosenLength = Math.max(35, idealLength + errorPx);
          const holdTimeMs = (chosenLength / GROW_SPEED) * 1000;

          botHolding = true;
          setTimeout(() => {
            if (gameState === 'play' && playSubState === 'ready') {
              handleInputDown();
              setTimeout(() => {
                handleInputUp();
                botHolding = false;
              }, holdTimeMs);
            } else {
              botHolding = false;
            }
          }, 80);
        }
      }

      // ==========================================
      // Main Game Loop
      // ==========================================
      function gameLoop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        update(dt);
        render();
        updateGameHook(); // 毎フレーム window.__game を更新

        if (isBot) {
          runBotLogic();
        }

        requestAnimationFrame(gameLoop);
      }

      // Initial game setup
      updateMuteButtonUI();
      resetGame(false);
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
