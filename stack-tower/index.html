      function spawnMovingBlock(level) {
        const topBlock = tower[tower.length - 1];
        const width = topBlock.regrow ? topBlock.regrow.targetW : topBlock.width;
        const y = topBlock.y - BLOCK_HEIGHT;
        let hue = getBlockHue(level);

        // 1. 序盤の理不尽をなくす (最初の3段は塔の真上付近から開始、移動範囲も狭めて早押し即死を防止)
        let minX, maxX, startX, dir;
        const baseSpeed = getBlockSpeed(level);

        if (level <= 3) {
          dir = (level % 2 === 1) ? 1 : -1;
          const offset = 30; // 塔の真上から30pxだけずらした位置から発進 (即押しでも170px残る)
          startX = topBlock.x + (dir > 0 ? -offset : offset);
          const travel = 85; // 塔の真上付近(左右85px)の狭い範囲をゆっくり往復
          minX = topBlock.x - travel;
          maxX = topBlock.x + travel;
        } else {
          minX = -width - 25;
          maxX = V_WIDTH + 25;
          dir = (level % 2 === 1) ? 1 : -1;
          startX = (dir > 0) ? minX : maxX;
        }

        // 2. 特殊ブロック判定 (10段を過ぎてから、だいたい6〜10段に1回)
        let specialType = 'normal';
        let currentSpeed = baseSpeed;

        if (level > 10 && level >= nextSpecialLevel) {
          // 50% ゴールドブロック (金色の光、PERFECTで+100pt & 幅大幅回復)
          // 50% 速いブロック (1.6倍速、残像つき、置けたら+30pt)
          specialType = Math.random() < 0.5 ? 'gold' : 'fast';
          nextSpecialLevel = level + 6 + Math.floor(Math.random() * 5); // 6〜10段に1回
        }

        if (specialType === 'gold') {
          hue = 46; // Gold hue
        } else if (specialType === 'fast') {
          currentSpeed = baseSpeed * 1.6;
        }

        // 3. 動きの変化
        // 20段以降: 往復中にゆっくり加減速する (wave)
        // 40段以降: たまに一瞬止まるフェイント (feint)
        let motionType = 'normal';
        let hasFeint = false;

        if (specialType === 'normal' && level > 3) {
          if (level >= 40 && Math.random() < 0.22) {
            hasFeint = true;
          } else if (level >= 20 && Math.random() < 0.35) {
            motionType = 'wave';
          }
        }

        movingBlock = {
          x: startX,
          y: y,
          width: width,
          height: BLOCK_HEIGHT,
          hue: hue,
          dir: dir,
          baseSpeed: baseSpeed,
          currentSpeed: currentSpeed,
          minX: minX,
          maxX: maxX,
          specialType: specialType,
          motionType: motionType,
          motionTime: 0,
          hasFeint: hasFeint,
          feintDone: false,
          feintTimer: 0,
          afterimages: []
        };

        // Autopilot target calculation for ?bot=1:
        // Showcase combos and regrowth initially, naturally failing between 20-60 levels.
        // Higher levels progressively increase error rate and misplacement size until game over.
        if (isBotActive) {
          if (level < 16) {
            // Early levels: gentle demonstration, occasional small cut
            const willCut = Math.random() < 0.22;
            if (willCut) {
              const sign = Math.random() < 0.5 ? -1 : 1;
              botTargetOffset = sign * (PERFECT_TOLERANCE + 0.6 + Math.random() * 3.0);
            } else {
              botTargetOffset = (Math.random() - 0.5) * (PERFECT_TOLERANCE * 0.75);
            }
          } else {
            // Progression from level 16 up to 55 (100% fail by level 55-60)
            const progress = Math.min(1.0, (level - 16) / 39); // 0 at 16, 1.0 at 55
            const errorChance = 0.30 + progress * 0.70; // 0.30 -> 1.0

            if (Math.random() > errorChance) {
              // Perfect placement
              botTargetOffset = (Math.random() - 0.5) * (PERFECT_TOLERANCE * 0.8);
            } else {
              // Miss or heavy cut error
              // Fatal chance: 0% at level 20, scaling up to 100% at level 55
              const fatalChance = level < 20 ? 0 : Math.min(1.0, (level - 20) / 35);
              if (level >= 55 || Math.random() < fatalChance) {
                // Complete miss (guaranteed game over)
                let sign = Math.random() < 0.5 ? -1 : 1;
                if (topBlock.x + (width + 15) > maxX - 10) {
                  sign = -1;
                } else if (topBlock.x - (width + 15) < minX + 10) {
                  sign = 1;
                }
                botTargetOffset = sign * (width + 12 + Math.random() * 20);
              } else {
                // Progressive partial cuts: cut grows larger as level increases
                let sign = Math.random() < 0.5 ? -1 : 1;
                const cutRatio = 0.15 + progress * 0.40 + Math.random() * 0.25;
                botTargetOffset = sign * Math.max(PERFECT_TOLERANCE + 1.2, width * cutRatio);
              }
            }
          }

          // Ensure target falls well within moving block's accessible span
          const targetX = topBlock.x + botTargetOffset;
          if (targetX < minX + 10) {
            botTargetOffset = (minX + 10) - topBlock.x;
          } else if (targetX > maxX - 10) {
            botTargetOffset = (maxX - 10) - topBlock.x;
          }
        }

        syncGameHook();
      }

      // --- Debris & Particle Spawners ---
      function spawnDebris(x, y, width, height, hue, vx, vy, vRot) {
        if (width <= 0) return;
        if (debrisList.length >= MAX_DEBRIS) {
          debrisList.shift();
        }
        debrisList.push({
          x: x,
          y: y,
          width: width,
          height: height,
          hue: hue,
          vx: vx,
          vy: vy,
          rot: 0,
          vRot: vRot,
          alpha: 1.0
        });
      }

      function addParticle(p) {
        if (particles.length >= MAX_PARTICLES) {
          particles.shift();
        }
        particles.push(p);
      }

      function spawnCutSparks(x, y, count, dirVx = 0) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.random() * Math.PI) - (Math.PI / 2);
          const spd = Math.random() * 140 + 70;
          addParticle({
            x: x,
            y: y,
            vx: Math.cos(angle) * spd + (dirVx > 0 ? 50 : (dirVx < 0 ? -50 : 0)),
            vy: Math.sin(angle) * spd - 60,
            size: Math.random() * 3 + 2,
            color: '#ffffff',
            alpha: 1.0,
            life: 0.35
          });
        }
      }

      function spawnFloatingText(type, text, x, y, color, baseScale = 1.0, vy = -45, fontSize = 18, glow = null, jitter = false) {
        // Remove existing popup of the same category so old ones don't linger and overlap
        if (type) {
          floatingTexts = floatingTexts.filter(ft => ft.type !== type);
        }
        floatingTexts.push({
          type: type,
          text: text,
          x: x,
          y: y,
          vy: vy,
          alpha: 1.0,
          baseScale: baseScale,
          currentScale: 0.35 * baseScale,
          age: 0,
          fontSize: fontSize,
          color: color,
          glow: glow,
          jitter: jitter
        });
      }

      function spawnPerfectFX(block, comboCount, willRegrow, earnedPts, isGold = false, isFast = false) {
        // Glowing expanding ring
        rings.push({
          x: block.x + block.width / 2,
          y: block.y + BLOCK_HEIGHT / 2,
          radiusX: block.width / 2,
          radiusY: BLOCK_HEIGHT / 2,
          scale: 1.0,
          maxScale: isGold ? 3.0 : 2.2,
          alpha: 1.0,
          hue: isGold ? 48 : block.hue
        });

        // Sparkle bursts
        const sparkCount = isGold ? 32 : 18;
        for (let i = 0; i < sparkCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 190 + 90;
          particles.push({
            x: block.x + Math.random() * block.width,
            y: block.y + Math.random() * BLOCK_HEIGHT,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - (isGold ? 40 : 0),
            size: Math.random() * 4 + 2,
            color: isGold ? ((i % 2 === 0) ? '#ffd700' : '#ffffff') : ((Math.random() < 0.5) ? '#ffffff' : `hsl(${block.hue}, 95%, 75%)`),
            alpha: 1.0,
            life: isGold ? 0.6 : 0.45
          });
        }

        // Floating judgment text
        const midX = block.x + block.width / 2;
        let judgmentText = 'PERFECT!';
        let textColor = isGold ? '#ffd700' : '#00f2fe';
        let fontSize = 24;
        let scale = 1.15;

        if (isGold) {
          judgmentText = 'GOLD PERFECT!';
          textColor = '#ffd700';
          fontSize = 26;
          scale = 1.3;
        } else if (isFast) {
          judgmentText = comboCount >= 2 ? `SPEED PERFECT! x${comboCount}` : 'SPEED PERFECT!';
          textColor = '#38bdf8';
          fontSize = 25;
          scale = 1.25;
        } else if (comboCount >= 2) {
          judgmentText = `PERFECT! x${comboCount}`;
          textColor = comboCount >= 5 ? '#ffea00' : '#ffe600';
          fontSize = Math.min(30, 24 + comboCount * 1.2);
          scale = Math.min(1.4, 1.2 + comboCount * 0.04);
        }

        // 判定文字を主役として大きく1つ、ポイントはその下、「幅UP!」はさらに下に縦に並べて重ならないように配置
        const baseY = block.y;
        // 上: 判定文字（主役、大きく1つ）
        spawnFloatingText('judgment', judgmentText, midX, baseY - 58, textColor, scale, -45, fontSize, textColor);
        // 中: ポイント（その下）
        const ptText = isGold ? `+${earnedPts} pt (GOLD!)` : (isFast ? `+${earnedPts} pt (SPEED!)` : `+${earnedPts} pt`);
        spawnFloatingText('point', ptText, midX, baseY - 34, isGold ? '#ffe066' : '#38bdf8', 1.0, -45, 16);
        // 下: 幅UP!（さらに下）
        if (willRegrow) {
          const regrowMsg = isGold ? '大幅幅UP!' : '幅UP!';
          spawnFloatingText('status', regrowMsg, midX, baseY - 14, isGold ? '#ffd700' : '#34d399', 1.15, -45, 16, isGold ? '#ffd700' : '#34d399');
        } else {
          // 幅UPがない場合は古いstatus（コンボ終了等）を消去
          floatingTexts = floatingTexts.filter(ft => ft.type !== 'status');
        }
      }

      function triggerMilestone(lvl) {
        const area = getAreaName(lvl);
        milestoneBanner = {
          text: `${lvl}段到達!`,
          subText: `${area}エリア突入！`,
          timer: 2.2,
          duration: 2.2
        };

        // Celebratory starburst particles
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 210 + 90;
          particles.push({
            x: V_WIDTH / 2,
            y: vHeight * 0.28,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: Math.random() * 4 + 2,
            color: (i % 2 === 0) ? '#ffd700' : '#38bdf8',
            alpha: 1.0,
            life: 0.65
          });
        }

        playSound('milestone');
      }

      // --- Core Action Handling (Tap / Click / Space) ---
      function handleAction(vx, vy) {
        initAudio();

        // 一時停止中のメニュー内タップ判定
        if (isPaused) {
          if (vx !== undefined && vy !== undefined) {
            const mw = 290;
            const mh = 360;
            const mx = (V_WIDTH - mw) / 2;
            const my = (vHeight - mh) / 2;

            // 1. BGM (音楽) ON/OFF
            const row1Y = my + 86;
            if (vx >= mx + 16 && vx <= mx + mw - 16 && vy >= row1Y && vy <= row1Y + 38) {
              window.__game.bgmEnabled = !bgmEnabled;
              playSound('countdown');
              return;
            }
            // 2. 効果音 ON/OFF
            const row2Y = my + 134;
            if (vx >= mx + 16 && vx <= mx + mw - 16 && vy >= row2Y && vy <= row2Y + 38) {
              window.__game.soundEnabled = !window.__game.soundEnabled;
              playSound('countdown');
              return;
            }
            // 3. 画面の揺れ ON/OFF
            const row3Y = my + 182;
            if (vx >= mx + 16 && vx <= mx + mw - 16 && vy >= row3Y && vy <= row3Y + 38) {
              window.__game.shakeEnabled = !shakeEnabled;
              playSound('countdown');
              return;
            }
            // 4. 振動 ON/OFF
            const row4Y = my + 230;
            if (vx >= mx + 16 && vx <= mx + mw - 16 && vy >= row4Y && vy <= row4Y + 38) {
              window.__game.vibrateEnabled = !vibrateEnabled;
              playSound('countdown');
              return;
            }
            // 5. ゲーム再開ボタン
            const resumeBtnW = 230;
            const resumeBtnH = 42;
            const resumeBtnX = (V_WIDTH - resumeBtnW) / 2;
            const resumeBtnY = my + 292;
            if (vx >= resumeBtnX && vx <= resumeBtnX + resumeBtnW && vy >= resumeBtnY && vy <= resumeBtnY + resumeBtnH) {
              startResumeCountdown();
              return;
            }
          }
          return;
        }

        // 一時停止中または再開カウントダウン中はブロックを落とさない
        if (isCountingDown) {
          return;
        }

        // もし「あそびかた」モーダルが開いている場合
        if (showHelpModal) {
          showHelpModal = false;
          return;
        }

        if (gameState === 'title') {
          // タイトル画面で「あそびかた」ボタンがタップされたか判定
          if (vx !== undefined && vy !== undefined) {
            const layout = getTitleLayout(vHeight);
            if (vx >= layout.helpBtnX && vx <= layout.helpBtnX + layout.btnW &&
                vy >= layout.helpBtnY && vy <= layout.helpBtnY + layout.btnH) {
              showHelpModal = true;
              return;
            }
          }

          gameState = 'play';
          gameStartCooldown = 0.28; // スタート直後の誤ドロップ防止 (280ms)
          updatePauseUI();
          initTower();
          return;
        }

        if (gameState === 'over') {
          // パネル表示遅延(0.75s) + 入力無効(0.6s) = 1.35s (1350ms)
          if (performance.now() - gameOverTime < 1350) return;

          const boxW = 330;
          const boxH = 464;
          const boxX = (V_WIDTH - boxW) / 2;
          const boxY = Math.max(12, (vHeight - boxH) / 2);

          const copyBtnW = 220;
          const copyBtnH = 38;
          const copyBtnX = (V_WIDTH - copyBtnW) / 2;
          const copyBtnY = boxY + 352;

          const retryBtnW = 220;
          const retryBtnH = 42;
          const retryBtnX = (V_WIDTH - retryBtnW) / 2;
          const retryBtnY = boxY + 406;

          // 「結果をコピー」ボタン判定（リトライと誤爆させずコピーのみ実行）
          if (vx !== undefined && vy !== undefined) {
            // コピーボタン（上下左右のタッチマージンを含む）
            if (vx >= copyBtnX - 8 && vx <= copyBtnX + copyBtnW + 8 && vy >= copyBtnY - 4 && vy <= copyBtnY + copyBtnH + 4) {
              copyShareResult();
              return;
            }

            // コピーボタン周辺およびボタン間のデッドゾーン（リトライの誤爆を防止）
            if (vy >= copyBtnY - 6 && vy < retryBtnY - 4) {
              return;
            }

            // モーダル上部（統計情報やミッション進捗）の誤タップ防止:
            // リトライボタン領域（またはモーダル下部）以外はリトライを発動させない
            if (vy < retryBtnY - 4) {
              return;
            }
          }

          gameState = 'play';
          gameStartCooldown = 0.28;
          updatePauseUI();
          initTower();
          return;
        }

        if (gameState === 'play' && movingBlock) {
          // スタート直後の誤ドロップクールダウン中は操作を受け付けない
          if (gameStartCooldown > 0 && !isBotAction) return;

          // ボタン周囲（画面最上部の左右端）の誤タップ防止ガード
          if (vx !== undefined && vy !== undefined && !isBotAction) {
            if (vy <= 75 && (vx <= 75 || vx >= V_WIDTH - 75)) {
              return;
            }
          }

          const topBlock = tower[tower.length - 1];
          const diff = movingBlock.x - topBlock.x;
          const absDiff = Math.abs(diff);

          if (absDiff <= PERFECT_TOLERANCE) {
            // ==========================================
            // 1. PERFECT SNAP
            // ==========================================
            combo++;
            perfectCount++;
            if (combo > maxCombo) {
              maxCombo = combo;
            }
            streakGreat++;
            if (streakGreat > maxGreatStreak) {
              maxGreatStreak = streakGreat;
            }
            movingBlock.x = topBlock.x;

            const isGold = (movingBlock.specialType === 'gold');
            const isFast = (movingBlock.specialType === 'fast');

            // ポイント計算: 10 + 25 * combo (ゴールドなら+100pt, 速いなら+30pt)
            let earnedPts = 10 + 25 * combo;
            if (isGold) {
              earnedPts += 100;
              goldCount++;
              goldPlacedCount++;
              goldPerfectCount++;
            }
            if (isFast) {
              earnedPts += 30;
            }
            points += earnedPts;

            // 幅の回復計算 (ゴールドは大幅回復+35、通常はcombo>=3で+8)
            let willRegrow = false;
            let regrowAmount = REGROW_AMOUNT;
            if (isGold && movingBlock.width < INITIAL_WIDTH) {
              willRegrow = true;
              regrowAmount = 35; // ゴールド大幅回復
            } else if (combo >= 3 && movingBlock.width < INITIAL_WIDTH) {
              willRegrow = true;
              regrowAmount = REGROW_AMOUNT;
            }

            const prevW = movingBlock.width;
            const targetW = willRegrow ? Math.min(INITIAL_WIDTH, prevW + regrowAmount) : prevW;
            const prevX = movingBlock.x;
            const targetX = willRegrow ? Math.max(10, Math.min(V_WIDTH - targetW - 10, prevX - (targetW - prevW) / 2)) : prevX;

            const placed = {
              x: willRegrow ? prevX : movingBlock.x,
              y: movingBlock.y,
              width: willRegrow ? prevW : movingBlock.width,
              height: BLOCK_HEIGHT,
              hue: movingBlock.hue,
              flash: 1.0,
              dangerPulse: 0,
              specialType: movingBlock.specialType,
              isBase: false,
              regrow: willRegrow ? {
                fromW: prevW,
                targetW: targetW,
                fromX: prevX,
                targetX: targetX,
                timer: 0.35,
                duration: 0.35
              } : null
            };

            // Haptic vibration on mobile
            triggerVibrate(15);

            tower.push(placed);
            spawnPerfectFX(placed, combo, willRegrow, earnedPts, isGold, isFast);

            if (isGold) {
              playSound('gold_perfect');
            } else if (isFast) {
              playSound('speed_bonus');
            } else {
              playSound('perfect', combo);
            }

            // Tactile Tower bounce & screen shake & white flash
            towerBounceY = 4.0;
            towerBounceVy = 0;
            screenShake = isGold ? 4.5 : 3.5;
            screenWhiteFlash = isGold ? 0.38 : 0.28;
            comboBadgePulse = 1.35;

          } else if (movingBlock.x + movingBlock.width <= topBlock.x || movingBlock.x >= topBlock.x + topBlock.width) {
            // ==========================================
            // COMPLETE MISS -> GAME OVER
            // ==========================================
            combo = 0;
            streakGreat = 0;
            // The whole block falls and tumbles away
            spawnDebris(
              movingBlock.x,
              movingBlock.y,
              movingBlock.width,
              BLOCK_HEIGHT,
              movingBlock.hue,
              movingBlock.dir * 85,
              -45,
              movingBlock.dir * 5.0
            );
            movingBlock = null;
            screenShake = 7.5;
            triggerGameOver();
            return;

          } else {
            // ==========================================
            // PARTIAL OVERLAP (CUT)
            // ==========================================
            const hadCombo = combo > 0;
            combo = 0; // Combo breaks

            let overhangWidth = 0;
            let newWidth = 0;
            let newX = 0;
            let debrisX = 0;
            let debrisWidth = 0;
            let debrisVx = 0;
            let debrisVRot = 0;

            if (diff < 0) {
              overhangWidth = topBlock.x - movingBlock.x;
              newWidth = movingBlock.width - overhangWidth;
              newX = topBlock.x;
              debrisX = movingBlock.x;
              debrisWidth = overhangWidth;
              debrisVx = -80 - Math.random() * 25;
              debrisVRot = -4.8 - Math.random() * 2.0;
            } else {
              overhangWidth = (movingBlock.x + movingBlock.width) - (topBlock.x + topBlock.width);
              newWidth = movingBlock.width - overhangWidth;
              newX = movingBlock.x;
              debrisX = topBlock.x + topBlock.width;
              debrisWidth = overhangWidth;
              debrisVx = 80 + Math.random() * 25;
              debrisVRot = 4.8 + Math.random() * 2.0;
            }

            if (newWidth <= 1.5) {
              // Remaining sliver is too small -> complete miss
              spawnDebris(
                movingBlock.x,
                movingBlock.y,
                movingBlock.width,
                BLOCK_HEIGHT,
                movingBlock.hue,
                movingBlock.dir * 85,
                -45,
                movingBlock.dir * 5.0
              );
              movingBlock = null;
              screenShake = 7.5;
              triggerGameOver();
              return;
            }

            // Sliced debris pops slightly up and rotates off towards sliced side
            spawnDebris(
              debrisX,
              movingBlock.y,
              debrisWidth,
              BLOCK_HEIGHT,
              movingBlock.hue,
              debrisVx,
              -40,
              debrisVRot
            );
            spawnCutSparks(debrisVx > 0 ? debrisX : debrisX + debrisWidth, movingBlock.y + BLOCK_HEIGHT / 2, 10, debrisVx);
            playSound('slice');

            // Determine Judgment Tier: ギリギリ! / GREAT / GOOD
            let tierName = 'GOOD';
            let tierColor = '#38bdf8';
            let tierPts = 10;
            let flashVal = 0.35;
            let dangerPulse = 0;
            let fontSize = 22;
            let scale = 1.05;

            if (newWidth <= DANGER_WIDTH) {
              // ギリギリ! (Remaining width is narrow)
              streakGreat = 0;
              tierName = 'ギリギリ!';
              tierColor = '#ff3355';
              tierPts = 10;
              flashVal = 0.7;
              dangerPulse = 1.2; // Red pulsing tension effect
              fontSize = 25;
              scale = 1.25;
              playSound('danger');
              screenShake = 4.5;
            } else if (absDiff <= GREAT_TOLERANCE) {
              // GREAT! (Small offset)
              streakGreat++;
              if (streakGreat > maxGreatStreak) {
                maxGreatStreak = streakGreat;
              }
              tierName = 'GREAT!';
              tierColor = '#4ade80';
              tierPts = 10 + 15; // 25pt
              flashVal = 0.55;
              fontSize = 24;
              scale = 1.15;
              playSound('great');
              screenShake = 2.2;
            } else {
              // GOOD
              streakGreat = 0;
              tierName = 'GOOD';
              tierColor = '#38bdf8';
              tierPts = 10;
              flashVal = 0.35;
              fontSize = 22;
              scale = 1.05;
              playSound('drop');
              screenShake = 2.0;
            }

            // 速いブロックは置けたらボーナス +30pt
            const isFast = (movingBlock.specialType === 'fast');
            const isGold = (movingBlock.specialType === 'gold');
            if (isGold) {
              goldCount++;
              goldPlacedCount++;
            }
            let bonusPts = isFast ? 30 : 0;
            if (isFast) {
              playSound('speed_bonus');
            }
            points += tierPts + bonusPts;

            const midX = newX + newWidth / 2;
            const isDanger = tierName === 'ギリギリ!';
            const baseY = movingBlock.y;

            // 判定文字を主役として大きく1つ、ポイントはその下、「コンボ終了」はさらに下に縦に並べて重ならないように配置
            spawnFloatingText('judgment', tierName, midX, baseY - 58, tierColor, scale, -45, fontSize, tierColor, isDanger);
            const ptText = bonusPts > 0 ? `+${tierPts + bonusPts} pt (SPEED!)` : `+${tierPts} pt`;
            spawnFloatingText('point', ptText, midX, baseY - 34, bonusPts > 0 ? '#38bdf8' : '#e2e8f0', 1.0, -45, 16);
            if (hadCombo) {
              spawnFloatingText('status', 'コンボ終了', midX, baseY - 14, '#94a3b8', 1.0, -45, 14);
            } else {
              floatingTexts = floatingTexts.filter(ft => ft.type !== 'status');
            }

            const placed = {
              x: newX,
              y: movingBlock.y,
              width: newWidth,
              height: BLOCK_HEIGHT,
              hue: movingBlock.hue,
              flash: flashVal,
              dangerPulse: dangerPulse,
              specialType: movingBlock.specialType,
              isBase: false,
              regrow: null
            };
            tower.push(placed);

            // Tactile Tower bounce on landing
            towerBounceY = 3.6;
            towerBounceVy = 0;
          }

          // Advance score (段数)
          const placedBlock = tower[tower.length - 1];
          score = tower.length - 1;
          if (score > best) {
            best = score;
            saveBest(best);
            syncGameHook();
          }

          // 50段以降の「細い塔ボーナス」（残り幅が元の30%以下で置くと +50pt）
          if (score >= 50 && placedBlock && placedBlock.width <= INITIAL_WIDTH * 0.3) {
            points += 50;
            playSound('thin_bonus');
            const thinMidX = placedBlock.x + placedBlock.width / 2;
            spawnFloatingText('thin_bonus', '細い塔ボーナス! +50pt', thinMidX, placedBlock.y - 78, '#fb7185', 1.25, -45, 17, '#fb7185');
            for (let i = 0; i < 18; i++) {
              const angle = Math.random() * Math.PI * 2;
              const spd = Math.random() * 160 + 60;
              particles.push({
                x: thinMidX,
                y: placedBlock.y + BLOCK_HEIGHT / 2,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd - 30,
                size: Math.random() * 3 + 1.5,
                color: (i % 2 === 0) ? '#fb7185' : '#ffd700',
                alpha: 1.0,
                life: 0.55
              });
            }
          }

          // チュートリアル3段目完了判定
          if (score >= 3 && !hasSeenTutorial) {
            hasSeenTutorial = true;
            localStorage.setItem('stackTowerTutorialSeen', 'true');
          }

          // ミッション進捗チェック
          checkMissions();

          // 4. ベスト目標: 超えたら「ベスト更新!」の演出とファンファーレ
          if (prevBest > 0 && score > prevBest && !hasCelebratedBest) {
            hasCelebratedBest = true;
            isNewBest = true;
            playSound('fanfare');

            // 祝賀花火・星パーティクル
            for (let i = 0; i < 36; i++) {
              const angle = Math.random() * Math.PI * 2;
              const spd = Math.random() * 230 + 80;
              particles.push({
                x: V_WIDTH / 2,
                y: placedBlock ? placedBlock.y : movingBlock.y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd - 50,
                size: Math.random() * 4 + 2,
                color: ['#ffd700', '#38bdf8', '#ff3366', '#ffffff', '#4ade80'][i % 5],
                alpha: 1.0,
                life: 0.85
              });
            }
            screenWhiteFlash = 0.35;
            screenShake = 4.0;
            spawnFloatingText('milestone', '👑 ベスト更新!!', V_WIDTH / 2, (placedBlock ? placedBlock.y : movingBlock.y) - 70, '#ffd700', 1.35, -45, 26, '#ffd700');
          }

          // 10-layer milestone announcement
          if (score > 0 && score % 10 === 0) {
            triggerMilestone(score);
          }

          spawnMovingBlock(tower.length);
        }
      }

      function triggerGameOver() {
        gameState = 'over';
        gameOverTime = performance.now();
        playSound('gameover');

        if (score > best) {
          best = score;
          saveBest(best);
        }
        best = Math.max(best, getLatestBest());

        if (score > prevBest && score > 0) {
          isNewBest = true;
        }

        // 1プレイ遊んだらチュートリアル完了扱い
        if (!hasSeenTutorial) {
          hasSeenTutorial = true;
          localStorage.setItem('stackTowerTutorialSeen', 'true');
        }

        // 称号アップ判定
        const currentRank = getPlayerRank(clearedMissionIds.length);
        if (currentRank.index > startRunRankIndex) {
          rankedUpThisRun = currentRank;
          setTimeout(() => {
            if (gameState === 'over') {
              playSound('rank_up');
              for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * 240 + 80;
                particles.push({
                  x: V_WIDTH / 2,
                  y: vHeight * 0.45,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 4 + 2,
                  color: ['#ffd700', '#ec4899', '#38bdf8', '#4ade80'][i % 4],
                  alpha: 1.0,
                  life: 0.9
                });
              }
            }
          }, 850);
        }

        syncGameHook();
      }

      // --- Input Event Listeners (No double fire, robust coordinate tracking) ---
      let lastInputTime = 0;
      function onUserInput(e) {
        hasUserInteracted = true;
        if (e && e.target && e.target.closest && (
          e.target.closest('#mute-btn') ||
          e.target.closest('#pause-btn') ||
          e.target.closest('#back-link')
        )) return;
        if (e && e.preventDefault && e.cancelable) {
          e.preventDefault();
        }
        const now = performance.now();
        if (now - lastInputTime < 180) return; // Debounce rapid multi-events
        lastInputTime = now;

        let vx = undefined;
        let vy = undefined;
        if (e && (e.clientX !== undefined || (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]))) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : 0));
          const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : 0));
          const canvasX = clientX - rect.left;
          const canvasY = clientY - rect.top;
          vx = (canvasX - colLeft) / colScale;
          vy = canvasY / colScale;
        }

        handleAction(vx, vy);
      }

      window.addEventListener('pointerdown', onUserInput, { passive: false });
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          onUserInput(e);
        } else if (e.code === 'Escape' || e.code === 'KeyP' || e.key === 'p' || e.key === 'P' || e.key === 'Esc' || e.key === 'Escape') {
          e.preventDefault();
          if (gameState === 'play') {
            togglePause();
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && gameState === 'play' && (!isPaused || isCountingDown)) {
          pauseGame();
        }
      });
      window.addEventListener('blur', () => {
        if (gameState === 'play' && (!isPaused || isCountingDown)) {
          pauseGame();
        }
      });

      // --- Autopilot for ?bot=1 ---
      let botTargetOffset = 0;
      let botWaitTimer = 0;

      function updateBot(dt) {
        if (!isBotActive) return;

        if (gameState === 'title') {
          botWaitTimer += dt;
          if (botWaitTimer > 0.4) {
            botWaitTimer = 0;
            isBotAction = true;
            handleAction();
            isBotAction = false;
          }
        } else if (gameState === 'play' && movingBlock) {
          // フェイントで停止中はタップしない
          if (movingBlock.feintTimer > 0) return;

          const topBlock = tower[tower.length - 1];
          const targetX = topBlock.x + botTargetOffset;
          const currentX = movingBlock.x;
          const currentSpeed = movingBlock.currentSpeed || movingBlock.baseSpeed || 200;
          const step = currentSpeed * dt;

          const dist = targetX - currentX;
          const movingTowards = (movingBlock.dir > 0 && dist >= 0) || (movingBlock.dir < 0 && dist <= 0);

          // 高速や加減速でも取りこぼさないよう判定マージンを調整
          const threshold = Math.max(step * 1.25, 7.5);
          if (movingTowards && Math.abs(dist) <= threshold) {
            movingBlock.x = targetX;
            isBotAction = true;
            handleAction();
            isBotAction = false;
          }
        } else if (gameState === 'over') {
          const timeSinceOver = (performance.now() - gameOverTime) / 1000;
          const panelDelay = 0.75;
          // 結果パネルが表示されてから2.5秒待ってからリトライ
          if (timeSinceOver >= panelDelay + 2.5) {
            isBotAction = true;
            handleAction();
            isBotAction = false;
          }
        }
      }

      // --- Update Loop ---
      function update(dt) {
        updateNavUI();
        updateBgmScheduler();

        if (copyFeedbackTimer > 0) {
          copyFeedbackTimer = Math.max(0, copyFeedbackTimer - dt);
        }

        if (gameState === 'title') {
          updateDemo(dt);
        }

        // 一時停止中はゲーム世界の更新を停止
        if (isPaused) {
          syncGameHook();
          return;
        }

        // 再開カウントダウン中（数字の更新と効果音、終了時の再開）
        if (isCountingDown) {
          countdownTimer -= dt;
          const curSec = Math.min(3, Math.max(1, Math.ceil(countdownTimer)));
          if (curSec !== lastCountdownSec && countdownTimer > 0) {
            lastCountdownSec = curSec;
            playSound('countdown');
          }
          if (countdownTimer <= 0) {
            isCountingDown = false;
            countdownTimer = 0;
            playSound('countdown_go');
            updatePauseUI();
          }
          syncGameHook();
          return;
        }

        // Autopilot
        updateBot(dt);

        // Tower Bounce spring physics
        if (towerBounceY !== 0 || towerBounceVy !== 0) {
          const k = 360; // Spring stiffness
          const d = 26;  // Damping
          const accel = -k * towerBounceY - d * towerBounceVy;
          towerBounceVy += accel * dt;
          towerBounceY += towerBounceVy * dt;
          if (Math.abs(towerBounceY) < 0.05 && Math.abs(towerBounceVy) < 0.1) {
            towerBounceY = 0;
            towerBounceVy = 0;
          }
        }

        // Screen shake & white flash decay
        if (screenShake > 0) {
          screenShake = Math.max(0, screenShake - dt * 25);
        }
        if (screenWhiteFlash > 0) {
          screenWhiteFlash = Math.max(0, screenWhiteFlash - dt * 4.2);
        }
        if (comboBadgePulse > 1.0) {
          comboBadgePulse = Math.max(1.0, comboBadgePulse - dt * 2.8);
        }
        if (gameStartCooldown > 0) {
          gameStartCooldown = Math.max(0, gameStartCooldown - dt);
        }
        if (missionClearBanner) {
          missionClearBanner.timer -= dt;
          if (missionClearBanner.timer <= 0) {
            missionClearBanner = null;
          }
        }

        // Camera scroll
        if (tower.length > 0) {
          const topY = tower[tower.length - 1].y;
          // Keep active block at ~42% of viewport height once tower grows into upper half
          const idealCameraY = Math.min(0, topY - vHeight * 0.42);
          targetCameraY = idealCameraY;
          cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 5.0);
        }

        // Moving block update
        if (movingBlock) {
          const topBlock = tower[tower.length - 1];

          // 3. 動きの変化: フェイント処理 (40段以降でたまに一瞬停止)
          if (movingBlock.feintTimer > 0) {
            movingBlock.feintTimer -= dt;
            if (movingBlock.feintTimer <= 0) {
              movingBlock.feintDone = true;
            }
          } else {
            // フェイント発動判定 (塔の中央手前に近づいた瞬間にピクッと一瞬停止)
            if (movingBlock.hasFeint && !movingBlock.feintDone && topBlock) {
              const distToCenter = Math.abs(movingBlock.x - topBlock.x);
              if (distToCenter < 55) {
                movingBlock.feintTimer = 0.20; // 0.2秒停止
                movingBlock.feintDone = true;
                playSound('feint');
                // ブレーキ微小火花
                for (let i = 0; i < 5; i++) {
                  particles.push({
                    x: movingBlock.x + (movingBlock.dir > 0 ? 0 : movingBlock.width),
                    y: movingBlock.y + BLOCK_HEIGHT,
                    vx: -movingBlock.dir * (Math.random() * 50 + 20),
                    vy: -Math.random() * 35,
                    size: Math.random() * 2 + 1,
                    color: '#ff9933',
                    alpha: 0.9,
                    life: 0.2
                  });
                }
              }
            }

            // 速度計算 (速いブロック: 1.6倍 / 20段以降: 往復中に加減速)
            let effSpeed = movingBlock.baseSpeed;
            if (movingBlock.specialType === 'fast') {
              effSpeed = movingBlock.baseSpeed * 1.6;
            } else if (movingBlock.motionType === 'wave') {
              movingBlock.motionTime += dt;
              // 0.65倍〜1.35倍で滑らかに加減速
              const waveFactor = Math.sin(movingBlock.motionTime * 3.4);
              effSpeed = movingBlock.baseSpeed * (1.0 + 0.35 * waveFactor);
            }
            movingBlock.currentSpeed = effSpeed;

            // 残像保存 (速いブロック)
            if (movingBlock.specialType === 'fast') {
              movingBlock.afterimages.push({
                x: movingBlock.x,
                y: movingBlock.y,
                width: movingBlock.width,
                height: movingBlock.height,
                alpha: 0.38
              });
              if (movingBlock.afterimages.length > 5) {
                movingBlock.afterimages.shift();
              }
            }

            // ゴールドブロックの周囲キラキラパーティクル
            if (movingBlock.specialType === 'gold' && Math.random() < 0.25) {
              particles.push({
                x: movingBlock.x + Math.random() * movingBlock.width,
                y: movingBlock.y + Math.random() * movingBlock.height,
                vx: (Math.random() - 0.5) * 30,
                vy: (Math.random() - 0.5) * 30 - 15,
                size: Math.random() * 2.5 + 1.2,
                color: (Math.random() < 0.6) ? '#ffd700' : '#ffffff',
                alpha: 0.85,
                life: 0.35
              });
            }

            // 移動と折り返し
            movingBlock.x += movingBlock.dir * effSpeed * dt;
            if (movingBlock.dir > 0 && movingBlock.x >= movingBlock.maxX) {
              movingBlock.dir = -1;
              movingBlock.x = movingBlock.maxX;
            } else if (movingBlock.dir < 0 && movingBlock.x <= movingBlock.minX) {
              movingBlock.dir = 1;
              movingBlock.x = movingBlock.minX;
            }
          }

          // 残像の減衰
          if (movingBlock.afterimages && movingBlock.afterimages.length > 0) {
            for (let i = movingBlock.afterimages.length - 1; i >= 0; i--) {
              const img = movingBlock.afterimages[i];
              img.alpha -= dt * 2.4;
              if (img.alpha <= 0) {
                movingBlock.afterimages.splice(i, 1);
              }
            }
          }
        }

        // Placed blocks updates: recent blocks only for maximum lightweight performance
        const updateStartIdx = Math.max(0, tower.length - 25);
        for (let i = updateStartIdx; i < tower.length; i++) {
          const b = tower[i];
          if (b.flash > 0) {
            b.flash = Math.max(0, b.flash - dt * 4.0);
          }
          if (b.dangerPulse > 0) {
            b.dangerPulse = Math.max(0, b.dangerPulse - dt * 0.8);
          }
          if (b.regrow) {
            b.regrow.timer -= dt;
            const t = 1 - Math.max(0, b.regrow.timer) / b.regrow.duration;
            const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
            b.width = lerp(b.regrow.fromW, b.regrow.targetW, ease);
            b.x = lerp(b.regrow.fromX, b.regrow.targetX, ease);

            // Emit outward expanding sparkles from both ends
            if (Math.random() < 0.7) {
              addParticle({
                x: b.x,
                y: b.y + BLOCK_HEIGHT / 2,
                vx: -Math.random() * 110 - 40,
                vy: (Math.random() - 0.5) * 50,
                size: Math.random() * 3 + 1.5,
                color: '#34d399',
                alpha: 1.0,
                life: 0.35
              });
              addParticle({
                x: b.x + b.width,
                y: b.y + BLOCK_HEIGHT / 2,
                vx: Math.random() * 110 + 40,
                vy: (Math.random() - 0.5) * 50,
                size: Math.random() * 3 + 1.5,
                color: '#34d399',
                alpha: 1.0,
                life: 0.35
              });
            }

            if (b.regrow.timer <= 0) {
              b.width = b.regrow.targetW;
              b.x = b.regrow.targetX;
              b.regrow = null;
            }
          }
        }

        // Debris physics (capped and culled)
        for (let i = debrisList.length - 1; i >= 0; i--) {
          const d = debrisList[i];
          d.vy += GRAVITY * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.rot += d.vRot * dt;
          d.alpha -= dt * 0.7; // Smooth fade as it falls
          if (d.alpha <= 0 || d.y - cameraY > vHeight + 60 || d.y - cameraY < -200 || d.x < -100 || d.x > V_WIDTH + 100) {
            debrisList.splice(i, 1);
          }
        }
        if (debrisList.length > MAX_DEBRIS) {
          debrisList.splice(0, debrisList.length - MAX_DEBRIS);
        }

        // Particles (capped and culled)
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += GRAVITY * 0.4 * dt;
          p.alpha -= dt / p.life;
          if (p.alpha <= 0 || p.y - cameraY > vHeight + 40 || p.y - cameraY < -80 || p.x < -50 || p.x > V_WIDTH + 50) {
            particles.splice(i, 1);
          }
        }
        if (particles.length > MAX_PARTICLES) {
          particles.splice(0, particles.length - MAX_PARTICLES);
        }

        // Expanding rings
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.scale += dt * 3.5;
          r.alpha -= dt * 2.5;
          if (r.alpha <= 0 || r.scale >= r.maxScale) {
            rings.splice(i, 1);
          }
        }

        // Floating texts with tactile spring-pop bounce
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.age = (ft.age || 0) + dt;
          ft.y += ft.vy * dt;
          ft.alpha -= dt * 1.25;

          // Tactile spring-pop bounce on spawn
          if (ft.age < 0.10) {
            const t = ft.age / 0.10;
            ft.currentScale = ft.baseScale * (0.35 + 1.05 * Math.sin(t * Math.PI * 0.7));
          } else if (ft.age < 0.20) {
            const t = (ft.age - 0.10) / 0.10;
            ft.currentScale = ft.baseScale * (1.4 - 0.4 * t);
          } else {
            ft.currentScale = ft.baseScale;
          }

          if (ft.alpha <= 0) {
            floatingTexts.splice(i, 1);
          }
        }

        // Milestone Banner decay
        if (milestoneBanner) {
          milestoneBanner.timer -= dt;
          if (milestoneBanner.timer <= 0) {
            milestoneBanner = null;
          }
        }

        // Ambient clouds
        for (let c of clouds) {
          c.x += c.speed * dt;
          if (c.x > V_WIDTH + 60) {
            c.x = -c.width - 60;
          }
        }

        syncGameHook();
      }

      // --- Rendering Functions ---
      function draw2DBlock(context, x, y, w, h, hue, flash = 0, dangerPulse = 0, regrowAnim = null, specialType = null, isBase = false) {
        if (w <= 0) return;

        context.save();

        if (isBase) {
          // 土台専用の重厚な台座メタルブロックデザイン
          const baseGrad = context.createLinearGradient(x, y, x, y + h);
          baseGrad.addColorStop(0, '#334155');
          baseGrad.addColorStop(0.4, '#1e293b');
          baseGrad.addColorStop(1, '#0f172a');
          context.fillStyle = baseGrad;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.fill();

          // 金属ハイライト線
          context.fillStyle = 'rgba(255, 255, 255, 0.35)';
          context.fillRect(x + 1, y + 1, w - 2, 2);

          // 境界線
          context.strokeStyle = 'rgba(148, 163, 184, 0.45)';
          context.lineWidth = 1;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.stroke();

          // 中央に控えめな「BASE (土台)」刻印
          context.fillStyle = 'rgba(255, 255, 255, 0.55)';
          context.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText('BASE (土台)', x + w / 2, y + h / 2);
          context.textBaseline = 'alphabetic';
          context.restore();
          return;
        }

        // Base block gradient (2.5D bevel effect, specialized for Gold or Fast blocks)
        const grad = context.createLinearGradient(x, y, x, y + h);
        if (specialType === 'gold') {
          grad.addColorStop(0, '#fff3a8');
          grad.addColorStop(0.3, '#ffd700');
          grad.addColorStop(0.7, '#f59e0b');
          grad.addColorStop(1, '#b45309');
        } else if (specialType === 'fast') {
          grad.addColorStop(0, '#67e8f9');
          grad.addColorStop(0.5, '#06b6d4');
          grad.addColorStop(1, '#0e7490');
        } else {
          grad.addColorStop(0, `hsl(${hue}, 88%, 65%)`);
          grad.addColorStop(0.5, `hsl(${hue}, 82%, 52%)`);
          grad.addColorStop(1, `hsl(${hue}, 84%, 42%)`);
        }

        context.fillStyle = grad;
        context.beginPath();
        context.roundRect(x, y, w, h, 3);
        context.fill();

        // Top highlight bevel
        context.fillStyle = specialType === 'gold' ? 'rgba(255, 255, 255, 0.65)' : 'rgba(255, 255, 255, 0.42)';
        context.beginPath();
        context.roundRect(x + 1, y + 1, w - 2, Math.min(3, h * 0.25), 1.5);
        context.fill();

        // Bottom shade
        context.fillStyle = 'rgba(0, 0, 0, 0.22)';
        context.beginPath();
        context.roundRect(x + 1, y + h - 3, w - 2, 2.5, 1);
        context.fill();

        // Left highlight
        context.fillStyle = 'rgba(255, 255, 255, 0.2)';
        context.fillRect(x, y + 2, 2, h - 4);

        // Right shade
        context.fillStyle = 'rgba(0, 0, 0, 0.18)';
        context.fillRect(x + w - 2, y + 2, 2, h - 4);

        // Drop shadow cast downward
        const shadowGrad = context.createLinearGradient(x, y + h, x, y + h + 5);
        shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.22)');
        shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.fillStyle = shadowGrad;
        context.fillRect(x, y + h, w, 5);

        // Gold Block special shimmering border & aura
        if (specialType === 'gold') {
          context.strokeStyle = 'rgba(255, 235, 120, 0.9)';
          context.lineWidth = 1.6;
          context.shadowColor = '#ffd700';
          context.shadowBlur = 8;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.stroke();
          context.shadowBlur = 0;
        }

        // ギリギリ (Danger) Red Pulsing Aura & Tint
        if (dangerPulse > 0 || w <= DANGER_WIDTH) {
          const pulse = Math.sin(performance.now() * 0.015) * 0.4 + 0.6;
          const intensity = Math.max(dangerPulse, w <= DANGER_WIDTH ? 0.75 : 0);

          // Red surface tint
          context.fillStyle = `rgba(255, 45, 75, ${0.35 * intensity * pulse})`;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.fill();

          // Red pulsating border
          context.strokeStyle = `rgba(255, 50, 75, ${0.9 * pulse * intensity})`;
          context.lineWidth = 2.5;
          context.shadowColor = 'rgba(255, 30, 60, 0.9)';
          context.shadowBlur = 8;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.stroke();
          context.shadowBlur = 0;
        }

        // Snap white flash overlay
        if (flash > 0) {
          context.fillStyle = `rgba(255, 255, 255, ${flash * 0.8})`;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.fill();
        }

        // Width UP both ends expanding animation indicators
        if (regrowAnim) {
          const animAlpha = Math.max(0, regrowAnim.timer / regrowAnim.duration);
          context.save();
          context.strokeStyle = `rgba(52, 211, 153, ${animAlpha * 0.9})`;
          context.lineWidth = 3;
          context.shadowColor = '#34d399';
          context.shadowBlur = 8;

          // Left expanding wing bar
          context.beginPath();
          context.moveTo(x, y - 2);
          context.lineTo(x, y + h + 2);
          context.stroke();

          // Right expanding wing bar
          context.beginPath();
          context.moveTo(x + w, y - 2);
          context.lineTo(x + w, y + h + 2);
          context.stroke();

          context.restore();
        }

        context.restore();
      }

      function drawDebris(context, d) {
        context.save();
        context.translate(d.x + d.width / 2, d.y + d.height / 2);
        context.rotate(d.rot);
        context.globalAlpha = Math.max(0, d.alpha);

        draw2DBlock(context, -d.width / 2, -d.height / 2, d.width, d.height, d.hue, 0, 0, null, null, false);

        context.restore();
      }

      // --- Height Meter (画面右端の細い高度メーター) ---
      function drawHeightMeter(context) {
        const meterW = 5;
        const meterX = V_WIDTH - 12;
        const meterTop = 90;
        const meterBottom = vHeight - 110;
        const meterH = meterBottom - meterTop;

        context.save();
        // トラック背景
        context.fillStyle = 'rgba(15, 23, 42, 0.55)';
        context.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        context.lineWidth = 1;
        context.beginPath();
        context.roundRect(meterX, meterTop, meterW, meterH, 2.5);
        context.fill();
        context.stroke();

        const nextMilestone = Math.floor(score / 10 + 1) * 10;
        const maxDisplayLevel = Math.max(30, (best || 0) + 5, nextMilestone + 5);

        // 10段マイルストーン目盛り
        for (let lvl = 10; lvl <= maxDisplayLevel; lvl += 10) {
          const ratio = lvl / maxDisplayLevel;
          const my = meterBottom - ratio * meterH;
          if (my >= meterTop && my <= meterBottom) {
            const isTarget = (lvl === nextMilestone);
            context.fillStyle = isTarget ? '#38bdf8' : 'rgba(255, 255, 255, 0.35)';
            context.fillRect(meterX - (isTarget ? 3 : 2), my - 1, meterW + (isTarget ? 6 : 4), 2);
            if (isTarget) {
              context.font = 'bold 9px -apple-system, sans-serif';
              context.fillStyle = '#38bdf8';
              context.textAlign = 'right';
              context.fillText(`${lvl}`, meterX - 5, my + 3);
            }
          }
        }

        // 自己ベストマーカー
        if (best > 0) {
          const bRatio = Math.min(1.0, best / maxDisplayLevel);
          const by = meterBottom - bRatio * meterH;
          context.fillStyle = '#ffd700';
          context.fillRect(meterX - 3, by - 1.5, meterW + 6, 3);
          context.font = 'bold 8px -apple-system, sans-serif';
          context.fillStyle = '#ffd700';
          context.textAlign = 'right';
          context.fillText(`👑${best}`, meterX - 5, by + 3);
        }

        // 現在の高さインジケーター（下からのフィル）
        const curRatio = Math.min(1.0, score / maxDisplayLevel);
        const fillH = curRatio * meterH;
        if (fillH > 0) {
          const barGrad = context.createLinearGradient(0, meterBottom, 0, meterBottom - fillH);
          barGrad.addColorStop(0, '#00f2fe');
          barGrad.addColorStop(1, '#38bdf8');
          context.fillStyle = barGrad;
          context.beginPath();
          context.roundRect(meterX, meterBottom - fillH, meterW, fillH, 2.5);
          context.fill();

          const curY = meterBottom - fillH;
          context.shadowColor = '#00f2fe';
          context.shadowBlur = 6;
          context.fillStyle = '#ffffff';
          context.beginPath();
          context.arc(meterX + meterW / 2, curY, 3, 0, Math.PI * 2);
          context.fill();
          context.shadowBlur = 0;
        }

        context.restore();
      }

      // --- First-time Tutorial Prompt (ブロックの直上、親指で隠れない位置) ---

      // --- Mission Card Drawing Helper (タイトル画面 & 結果画面で共通利用) ---
      function drawMissionCard(context, m, x, y, w, h) {
        context.save();
        context.fillStyle = 'rgba(15, 23, 42, 0.65)';
        context.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        context.lineWidth = 1;
        const radius = Math.min(8, Math.round(h * 0.24));
        context.beginPath();
        context.roundRect(x, y, w, h, radius);
        context.fill();
        context.stroke();

        const curVal = getMissionCurrentValue(m);
        const targetVal = m.target;
        const isDone = clearedMissionIds.includes(m.id) || curVal >= targetVal;

        const titleFontSize = Math.max(10, Math.min(12, Math.round(h * 0.35)));
        const numFontSize = Math.max(9, Math.min(11, Math.round(h * 0.32)));
        const textY = y + Math.round(h * 0.44);
        const barY = y + Math.round(h * 0.68);
        const barH = Math.max(3, Math.min(4, Math.round(h * 0.11)));

        context.fillStyle = '#ffffff';
        context.font = `bold ${titleFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
        context.textAlign = 'left';
        context.fillText(`🎯 ${m.title}`, x + 10, textY);

        context.textAlign = 'right';
        context.font = `bold ${numFontSize}px -apple-system, sans-serif`;
        context.fillStyle = isDone ? '#4ade80' : '#38bdf8';
        context.fillText(isDone ? 'CLEAR!' : `${curVal} / ${targetVal}`, x + w - 10, textY);

        // プログレスバー
        const barX = x + 10;
        const barW = w - 20;
        context.fillStyle = 'rgba(255, 255, 255, 0.12)';
        context.beginPath();
        context.roundRect(barX, barY, barW, barH, 2);
        context.fill();

        const progress = isDone ? 1.0 : Math.min(1.0, curVal / targetVal);
        if (progress > 0) {
          context.fillStyle = isDone ? '#4ade80' : '#38bdf8';
          context.beginPath();
          context.roundRect(barX, barY, barW * progress, barH, 2);
          context.fill();
        }

        context.restore();
      }
