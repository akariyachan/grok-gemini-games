            const boxY = vHeight * 0.21;

            ctx.fillStyle = 'rgba(23, 32, 51, 0.94)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 18);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff4d6d';
            ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('GAME OVER', V_WIDTH / 2, boxY + 36);

            // Score (段数)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
            ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('タワーの高さ', V_WIDTH / 2, boxY + 62);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${score}段`, V_WIDTH / 2, boxY + 104);

            // Points (ポイント)
            ctx.fillStyle = '#38bdf8';
            ctx.font = '600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`獲得ポイント: ${points.toLocaleString()} pt`, V_WIDTH / 2, boxY + 130);

            // 統計プレート (PERFECT回数、最大コンボ、ゴールド取得数)
            const statsPlateX = boxX + 16;
            const statsPlateY = boxY + 146;
            const statsPlateW = boxW - 32;
            const statsPlateH = 64;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(statsPlateX, statsPlateY, statsPlateW, statsPlateH, 12);
            ctx.fill();
            ctx.stroke();

            // 3つのスタッツカラム
            const colW = statsPlateW / 3;
            // 1. PERFECT回数
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('PERFECT', statsPlateX + colW * 0.5, statsPlateY + 22);
            ctx.fillStyle = '#00f2fe';
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${perfectCount}回`, statsPlateX + colW * 0.5, statsPlateY + 46);

            // 区切り線1
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.beginPath();
            ctx.moveTo(statsPlateX + colW, statsPlateY + 12);
            ctx.lineTo(statsPlateX + colW, statsPlateY + statsPlateH - 12);
            ctx.stroke();

            // 2. 最大コンボ
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('最大コンボ', statsPlateX + colW * 1.5, statsPlateY + 22);
            ctx.fillStyle = '#ffe600';
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`x${maxCombo}`, statsPlateX + colW * 1.5, statsPlateY + 46);

            // 区切り線2
            ctx.beginPath();
            ctx.moveTo(statsPlateX + colW * 2, statsPlateY + 12);
            ctx.lineTo(statsPlateX + colW * 2, statsPlateY + statsPlateH - 12);
            ctx.stroke();

            // 3. ゴールド取得数
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('ゴールド', statsPlateX + colW * 2.5, statsPlateY + 22);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${goldCount}個`, statsPlateX + colW * 2.5, statsPlateY + 46);

            // ベスト目標 / NEW BEST / あと◯段でベスト表示
            if (isNewBest && score > 0) {
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.fillText('★ NEW BEST RECORD! ★', V_WIDTH / 2, boxY + 236);
            } else if (prevBest > 0) {
              const diff = prevBest - score;
              if (diff > 0) {
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
                ctx.fillText(`あと ${diff}段 で自己ベスト更新 (${prevBest}段)`, V_WIDTH / 2, boxY + 236);
              } else {
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
                ctx.fillText(`自己ベストタイ記録！ (${prevBest}段)`, V_WIDTH / 2, boxY + 236);
              }
            } else {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
              ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
              ctx.fillText(`自己ベスト: ${best}段`, V_WIDTH / 2, boxY + 236);
            }

            // Retry Prompt (パネル表示後 0.6s は入力無効維持、つまり timeSinceOver >= 1.35s で有効化)
            const canRetry = (timeSinceOver >= panelDelay + 0.6);
            if (canRetry) {
              const retryPulse = Math.sin(performance.now() * 0.007) * 0.25 + 0.75;
              ctx.save();
              ctx.globalAlpha = fade * retryPulse;

              const rBtnW = 200;
              const rBtnH = 44;
              const rBtnX = (V_WIDTH - rBtnW) / 2;
              const rBtnY = boxY + 272;

              ctx.fillStyle = 'rgba(78, 237, 255, 0.18)';
              ctx.strokeStyle = '#4eedff';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.roundRect(rBtnX, rBtnY, rBtnW, rBtnH, 22);
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#4eedff';
              ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
              ctx.fillText('▶ タップでリトライ', V_WIDTH / 2, rBtnY + 28);
              ctx.restore();
            } else {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
              ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
              ctx.fillText('少しお待ちください...', V_WIDTH / 2, boxY + 296);
            }

            ctx.restore();
          }
        }

        // Screen white flash overlay on PERFECT
        if (screenWhiteFlash > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 255, 255, ${screenWhiteFlash})`;
          ctx.fillRect(0, 0, V_WIDTH, vHeight);
          ctx.restore();
        }

        ctx.restore(); // Restore virtual play area transformation

        // Pillarbox letterboxing on widescreen/desktop
        if (colLeft > 0) {
          ctx.save();
          ctx.fillStyle = '#0a0d14';
          ctx.fillRect(0, 0, colLeft * dpr, canvas.height);
          ctx.fillRect((colLeft + colWidth) * dpr, 0, (screenWidth - (colLeft + colWidth)) * dpr, canvas.height);

          // Subtle column border lines
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 1 * dpr;
          ctx.beginPath();
          ctx.moveTo(colLeft * dpr, 0);
          ctx.lineTo(colLeft * dpr, canvas.height);
          ctx.moveTo((colLeft + colWidth) * dpr, 0);
          ctx.lineTo((colLeft + colWidth) * dpr, canvas.height);
          ctx.stroke();
          ctx.restore();
        }
      }

      // --- Main Animation Loop with Clamped Delta Time ---
      let lastTime = performance.now();

      function gameLoop(now) {
        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(rawDt, 0.1); // Clamp to prevent jump on tab switch

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
      }

      // Start on title screen
      initTower();
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
</html>
