      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sky colors based on current altitude (0: Ground -> 10: Clouds -> 20: Sunset -> 30: Night -> 40: Space)
        const sky = getSkyColors(score);
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, `rgb(${sky.top[0]}, ${sky.top[1]}, ${sky.top[2]})`);
        skyGrad.addColorStop(1, `rgb(${sky.bottom[0]}, ${sky.bottom[1]}, ${sky.bottom[2]})`);

        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Stars (fade in as tower grows taller into night and space)
        const starAlpha = Math.min(1.0, Math.max(0, (score - 16) / 24));
        if (starAlpha > 0) {
          ctx.save();
          const timeSec = performance.now() * 0.001;
          for (let s of stars) {
            const twinkle = Math.sin(timeSec * s.twinkleSpeed) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starAlpha * twinkle})`;
            ctx.beginPath();
            ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size * dpr, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Apply screen shake (respecting shakeEnabled setting)
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        if (screenShake > 0 && shakeEnabled) {
          shakeOffsetX = (Math.random() - 0.5) * screenShake * colScale;
          shakeOffsetY = (Math.random() - 0.5) * screenShake * colScale;
        }

        // Setup Virtual Play Area Transformation
        ctx.save();
        ctx.translate(colLeft * dpr + shakeOffsetX * dpr, shakeOffsetY * dpr);
        ctx.scale(colScale * dpr, colScale * dpr);

        // Draw soft ambient clouds in lower atmosphere (fade out as you ascend)
        const cloudAlpha = Math.max(0, 1.0 - score / 16) * 0.35;
        if (cloudAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
          for (let c of clouds) {
            ctx.beginPath();
            const cy = c.y * vHeight;
            ctx.ellipse(c.x + c.width / 2, cy, c.width / 2, c.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (gameState === 'title') {
          // タイトル画面の背景デモ（薄め・ゆっくり）
          renderDemo(ctx);
        } else {
          // Camera offset for world objects
          ctx.save();
          ctx.translate(0, -cameraY);

          // Apply tactile tower bounce to pedestal and placed blocks
          ctx.save();
          ctx.translate(0, towerBounceY);

          // Draw ground foundation pedestal
          const floorY = vHeight * 0.70;
          const pedestalHeight = Math.max(300, vHeight - floorY + 200);
          const pedestalGrad = ctx.createLinearGradient(0, floorY + BLOCK_HEIGHT, 0, floorY + BLOCK_HEIGHT + pedestalHeight);
          pedestalGrad.addColorStop(0, '#1a2332');
          pedestalGrad.addColorStop(1, '#0b111a');
          ctx.fillStyle = pedestalGrad;
          ctx.beginPath();
          ctx.roundRect((V_WIDTH - 240) / 2, floorY + BLOCK_HEIGHT, 240, pedestalHeight, [4, 4, 0, 0]);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.fillRect((V_WIDTH - 236) / 2, floorY + BLOCK_HEIGHT, 236, 2);

          // 4. ベスト目標: 塔の横（世界座標）に自己ベストの高さの位置に「BEST」の点線ラインを描く
          if (best > 0) {
            const bestY = floorY - best * BLOCK_HEIGHT;
            if (bestY - cameraY >= -80 && bestY - cameraY <= vHeight + 80) {
              ctx.save();
              ctx.setLineDash([6, 5]);
              ctx.strokeStyle = 'rgba(255, 215, 0, 0.75)';
              ctx.lineWidth = 1.8;
              ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.moveTo(10, bestY);
              ctx.lineTo(V_WIDTH - 18, bestY);
              ctx.stroke();
              ctx.setLineDash([]);

              // BEST フラグラベル（画面右端の高度メーターより内側に収め、目盛りと重ならないように配置）
              const labelW = 80;
              const labelH = 20;
              const labelX = V_WIDTH - 100 - labelW;
              const labelY = bestY - 10;
              ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
              ctx.strokeStyle = '#ffd700';
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.roundRect(labelX, labelY, labelW, labelH, 4);
              ctx.fill();
              ctx.stroke();

              ctx.shadowBlur = 0;
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`👑 BEST ${best}段`, labelX + labelW / 2, labelY + 14);
              ctx.restore();
            }
          }

          // Draw placed tower blocks (View frustum culling)
          for (let b of tower) {
            if (b.y - cameraY > vHeight + 50 || b.y + b.height - cameraY < -50) continue;
            draw2DBlock(ctx, b.x, b.y, b.width, b.height, b.hue, b.flash, b.dangerPulse, b.regrow, b.specialType, b.isBase);
          }

          ctx.restore(); // Restore towerBounceY

          // Draw moving block (with残像 for fast blocks, gold aura for gold blocks)
          if (movingBlock) {
            // 速いブロックの残像描画
            if (movingBlock.specialType === 'fast' && movingBlock.afterimages) {
              for (let img of movingBlock.afterimages) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, img.alpha * 0.55);
                draw2DBlock(ctx, img.x, img.y, img.width, img.height, movingBlock.hue, 0, 0, null, 'fast', false);
                ctx.restore();
              }
            }

            // 移動ブロック本体
            draw2DBlock(ctx, movingBlock.x, movingBlock.y, movingBlock.width, movingBlock.height, movingBlock.hue, 0, 0, null, movingBlock.specialType, false);

            // 特殊ブロックのヘッドバッジ (見た目ですぐ分かるように)
            if (movingBlock.specialType === 'gold') {
              ctx.save();
              const badgeW = 68;
              const badgeH = 18;
              const badgeX = movingBlock.x + (movingBlock.width - badgeW) / 2;
              const badgeY = movingBlock.y - 23;
              ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
              ctx.strokeStyle = '#ffd700';
              ctx.lineWidth = 1.2;
              ctx.shadowColor = 'rgba(255, 215, 0, 0.7)';
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 9);
              ctx.fill();
              ctx.stroke();

              ctx.shadowBlur = 0;
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('★ GOLD ★', badgeX + badgeW / 2, badgeY + 13);
              ctx.restore();
            } else if (movingBlock.specialType === 'fast') {
              ctx.save();
              const badgeW = 76;
              const badgeH = 18;
              const badgeX = movingBlock.x + (movingBlock.width - badgeW) / 2;
              const badgeY = movingBlock.y - 23;
              ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
              ctx.strokeStyle = '#00f2fe';
              ctx.lineWidth = 1.2;
              ctx.shadowColor = 'rgba(0, 242, 254, 0.7)';
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 9);
              ctx.fill();
              ctx.stroke();

              ctx.shadowBlur = 0;
              ctx.fillStyle = '#00f2fe';
              ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('⚡ SPEED 1.6x', badgeX + badgeW / 2, badgeY + 13);
              ctx.restore();
            }
          }

          // Draw falling sliced debris (View frustum culling)
          for (let d of debrisList) {
            if (d.y - cameraY > vHeight + 50 || d.y + d.height - cameraY < -50) continue;
            drawDebris(ctx, d);
          }

          // Draw expanding rings
          for (let r of rings) {
            ctx.save();
            ctx.strokeStyle = `hsla(${r.hue}, 100%, 75%, ${r.alpha})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.radiusX * r.scale, r.radiusY * r.scale * 1.5, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Draw particles (View frustum culling)
          for (let p of particles) {
            if (p.y - cameraY > vHeight + 30 || p.y - cameraY < -30) continue;
            ctx.save();
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Draw floating judgment and score popup texts
          for (let ft of floatingTexts) {
            ctx.save();
            const currentScale = ft.currentScale || ft.baseScale || 1.0;
            const drawX = ft.jitter ? ft.x + (Math.random() - 0.5) * 3.5 : ft.x;
            const drawY = ft.jitter ? ft.y + (Math.random() - 0.5) * 3.5 : ft.y;
            ctx.font = `bold ${Math.round((ft.fontSize || 18) * currentScale)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif`;
            ctx.textAlign = 'center';
            ctx.globalAlpha = Math.max(0, ft.alpha);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 5;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 1.5;
            ctx.strokeStyle = '#070c18';
            ctx.lineWidth = ft.type === 'point' ? 3.5 : 4;
            ctx.strokeText(ft.text, drawX, drawY);

            ctx.fillStyle = ft.color;
            if (ft.glow) {
              ctx.shadowColor = ft.glow;
              ctx.shadowBlur = 12;
            } else {
              ctx.shadowBlur = 0;
            }
            ctx.fillText(ft.text, drawX, drawY);
            ctx.restore();
          }

          ctx.restore(); // Restore camera translation
        }

        // --- HUD Overlay (Fixed Screen Space within Column) ---
        if (gameState === 'play') {
          ctx.save();
          ctx.textAlign = 'center';

          // Main Height Score (段数)
          ctx.font = 'bold 50px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.strokeStyle = '#070c18';
          ctx.lineWidth = 4;
          ctx.strokeText(`${score}段`, V_WIDTH / 2, 78);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 2;
          ctx.fillText(`${score}段`, V_WIDTH / 2, 78);

          // Points (ポイント)
          ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.strokeStyle = '#070d19';
          ctx.lineWidth = 3.5;
          ctx.strokeText(`${points.toLocaleString()} pt`, V_WIDTH / 2, 102);
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1.5;
          ctx.fillText(`${points.toLocaleString()} pt`, V_WIDTH / 2, 102);

          // Best score badge
          ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.strokeStyle = '#070d19';
          ctx.lineWidth = 3;
          ctx.strokeText(`BEST ${best}段`, V_WIDTH / 2, 122);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1;
          ctx.fillText(`BEST ${best}段`, V_WIDTH / 2, 122);

          // Active Combo Multiplier Badge with tactile bounce
          if (combo >= 2) {
            ctx.save();
            ctx.translate(V_WIDTH / 2, 144);
            ctx.scale(comboBadgePulse, comboBadgePulse);
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = combo >= 3 ? '#ffe600' : '#4eedff';
            ctx.shadowColor = combo >= 3 ? 'rgba(255, 230, 0, 0.6)' : 'rgba(78, 237, 255, 0.6)';
            ctx.shadowBlur = 8;
            ctx.fillText(`★ COMBO x${combo}`, 0, 0);
            ctx.restore();
          }

          // Milestone Announcement Banner (10段ごとにポップ表示)
          if (milestoneBanner && milestoneBanner.timer > 0) {
            const banner = milestoneBanner;
            const t = banner.timer / banner.duration;
            const bannerAlpha = Math.min(1.0, t < 0.2 ? t / 0.2 : (banner.duration - banner.timer < 0.25 ? (banner.duration - banner.timer) / 0.25 : 1.0));

            ctx.save();
            ctx.globalAlpha = bannerAlpha;

            const bw = 240;
            const bh = 54;
            const bx = (V_WIDTH - bw) / 2;
            const by = 168;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.55)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 27);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
            ctx.fillText(banner.text, V_WIDTH / 2, by + 24);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
            ctx.fillText(banner.subText, V_WIDTH / 2, by + 42);

            ctx.restore();
          }

          // 高さの見える化（画面右端の細い高度メーター）
          drawHeightMeter(ctx);

          // 初回チュートリアル（親指で隠れないブロック直上）
          drawTutorialPrompt(ctx);

          // プレイ中ミッション達成バナー
          drawMissionBanner(ctx);

          ctx.restore();
        }

        // --- Title Screen Screen Space ---
        if (gameState === 'title') {
          best = Math.max(best, getLatestBest());
          syncGameHook();
          ctx.save();
          ctx.textAlign = 'center';

          const layout = getTitleLayout(vHeight);

          // 1. タイトルロゴ
          ctx.font = `bold ${layout.titleFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.7)';
          ctx.lineWidth = 4;
          ctx.strokeText('積み上げタワー', V_WIDTH / 2, layout.titleY);
          ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 2;
          ctx.fillStyle = '#ffffff';
          ctx.fillText('積み上げタワー', V_WIDTH / 2, layout.titleY);

          // 2. サブタイトル帯
          ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 2;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
          ctx.beginPath();
          ctx.roundRect(layout.descX, layout.descY, layout.descW, layout.descH, layout.descH / 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1;
          ctx.font = `600 ${layout.descFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText('タイミングよくタップしてブロックを積もう！', V_WIDTH / 2, layout.descY + Math.round(layout.descH * 0.65));

          // 3. 称号表示バッジ
          const playerRank = getPlayerRank(clearedMissionIds.length);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
          ctx.strokeStyle = playerRank.color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(layout.rankX, layout.rankY, layout.rankW, layout.rankH, layout.rankH / 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = `bold ${layout.rankFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.fillStyle = playerRank.color;
          ctx.fillText(`称号: ${playerRank.name} ${playerRank.stars}`, V_WIDTH / 2, layout.rankY + Math.round(layout.rankH * 0.65));

          // 4. 「❓ あそびかた」ボタン & 「👑 自己ベスト」
          // あそびかたボタン（濃い背景＋白文字で青空の上でもはっきり読める）
          ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(layout.helpBtnX, layout.helpBtnY, layout.btnW, layout.btnH, layout.btnH / 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = `bold ${layout.btnFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.fillText('❓ あそびかた', layout.helpBtnX + layout.btnW / 2, layout.helpBtnY + Math.round(layout.btnH * 0.65));

          // 自己ベスト
          ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
          ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(layout.bestBtnX, layout.bestBtnY, layout.btnW, layout.btnH, layout.btnH / 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffd700';
          ctx.font = `bold ${layout.btnFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          ctx.fillText(`👑 BEST: ${best}段`, layout.bestBtnX + layout.btnW / 2, layout.bestBtnY + Math.round(layout.btnH * 0.65));

          // 5. 常に3つのミッション表示
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${layout.missionHeaderFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText('🎯 現在のミッション (3つ)', 32, layout.missionHeaderY);
          ctx.textAlign = 'right';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.font = `${Math.max(10, layout.missionHeaderFontSize - 2)}px -apple-system, sans-serif`;
          ctx.fillText(`達成: ${clearedMissionIds.length} / ${MISSION_LIST.length}`, V_WIDTH - 32, layout.missionHeaderY);

          const activeMissions = getActiveMissions();
          let cardY = layout.cardStartY;
          for (let m of activeMissions) {
            drawMissionCard(ctx, m, 30, cardY, V_WIDTH - 60, layout.cardH);
            cardY += layout.cardH + layout.cardGap;
          }

          // 6. スタートボタン
          const pulse = Math.sin(performance.now() * 0.005) * 0.2 + 0.8;
          ctx.save();
          ctx.fillStyle = `rgba(15, 23, 42, ${0.60 * pulse + 0.15})`;
          ctx.strokeStyle = `rgba(78, 237, 255, ${0.5 * pulse + 0.3})`;
          ctx.lineWidth = 1.8;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 3;
          ctx.beginPath();
          ctx.roundRect(layout.startBtnX, layout.startBtnY, layout.startBtnW, layout.startBtnH, layout.startBtnH / 2);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${layout.startBtnFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif`;
          ctx.fillText('▶ タップでスタート', V_WIDTH / 2, layout.startBtnY + Math.round(layout.startBtnH * 0.46));

          ctx.font = `${layout.startBtnSubFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
          ctx.fillText('[Space] キーまたはクリック', V_WIDTH / 2, layout.startBtnY + Math.round(layout.startBtnH * 0.78));
          ctx.restore();

          // 7. あそびかたモーダル描画
          drawHelpModal(ctx);

          ctx.restore();
        }

        // --- Game Over Screen Screen Space ---
        if (gameState === 'over') {
          const timeSinceOver = (performance.now() - gameOverTime) / 1000;
          const panelDelay = 0.75; // 最後のブロックがゆっくり落ちていく様子が見えるように少し間を取る

          if (timeSinceOver >= panelDelay) {
            ctx.save();
            const fade = Math.min(1.0, (timeSinceOver - panelDelay) / 0.25);
            ctx.globalAlpha = fade;

            // Dark frosted overlay
            ctx.fillStyle = 'rgba(10, 15, 26, 0.78)';
            ctx.fillRect(0, 0, V_WIDTH, vHeight);

            // Modal Box (330 x 464)
            const boxW = 330;
            const boxH = 464;
            const boxX = (V_WIDTH - boxW) / 2;
            const boxY = Math.max(12, (vHeight - boxH) / 2);

            ctx.fillStyle = 'rgba(23, 32, 51, 0.95)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 18);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff4d6d';
            ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('GAME OVER', V_WIDTH / 2, boxY + 28);

            // Score (段数) & Points (ポイント)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('タワーの高さ', V_WIDTH / 2, boxY + 47);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${score}段`, V_WIDTH / 2, boxY + 78);

            ctx.fillStyle = '#38bdf8';
            ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`獲得ポイント: ${points.toLocaleString()} pt`, V_WIDTH / 2, boxY + 98);

            // 統計プレート (PERFECT回数、最大コンボ、ゴールド取得数)
            const statsPlateX = boxX + 16;
            const statsPlateY = boxY + 108;
            const statsPlateW = boxW - 32;
            const statsPlateH = 48;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(statsPlateX, statsPlateY, statsPlateW, statsPlateH, 10);
            ctx.fill();
            ctx.stroke();

            const colW = statsPlateW / 3;
            // 1. PERFECT回数
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('PERFECT', statsPlateX + colW * 0.5, statsPlateY + 16);
            ctx.fillStyle = '#00f2fe';
            ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${perfectCount}回`, statsPlateX + colW * 0.5, statsPlateY + 35);

            // 区切り線1
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.beginPath();
            ctx.moveTo(statsPlateX + colW, statsPlateY + 8);
            ctx.lineTo(statsPlateX + colW, statsPlateY + statsPlateH - 8);
            ctx.stroke();

            // 2. 最大コンボ
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('最大コンボ', statsPlateX + colW * 1.5, statsPlateY + 16);
            ctx.fillStyle = '#ffe600';
            ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`x${maxCombo}`, statsPlateX + colW * 1.5, statsPlateY + 35);

            // 区切り線2
            ctx.beginPath();
            ctx.moveTo(statsPlateX + colW * 2, statsPlateY + 8);
            ctx.lineTo(statsPlateX + colW * 2, statsPlateY + statsPlateH - 8);
            ctx.stroke();

            // 3. ゴールド取得数
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('ゴールド', statsPlateX + colW * 2.5, statsPlateY + 16);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`${goldCount}個`, statsPlateX + colW * 2.5, statsPlateY + 35);

            // 称号表示 or 称号アップ演出バナー
            const currentRank = getPlayerRank(clearedMissionIds.length);
            const rankBannerY = boxY + 164;
            const rankBannerH = 26;
            if (rankedUpThisRun) {
              // 称号アップ! 祝賀バナー
              ctx.save();
              const rPulse = Math.sin(performance.now() * 0.008) * 0.15 + 0.85;
              ctx.fillStyle = 'rgba(236, 72, 153, 0.22)';
              ctx.strokeStyle = '#ec4899';
              ctx.lineWidth = 1.4;
              ctx.shadowColor = '#ec4899';
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.roundRect(boxX + 16, rankBannerY, boxW - 32, rankBannerH, 13);
              ctx.fill();
              ctx.stroke();

              ctx.shadowBlur = 0;
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
              ctx.fillText(`🎉 称号アップ! 【${rankedUpThisRun.name}】に昇格!`, V_WIDTH / 2, rankBannerY + 18);
              ctx.restore();
            } else {
              // 通常の称号表示
              ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
              ctx.strokeStyle = currentRank.color;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.roundRect(boxX + 24, rankBannerY, boxW - 48, rankBannerH, 13);
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = currentRank.color;
              ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
              ctx.fillText(`現在の称号: ${currentRank.name} ${currentRank.stars}`, V_WIDTH / 2, rankBannerY + 17);
            }

            // ミッション進捗（常に3つのミッション表示）
            const mSecY = boxY + 204;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('🎯 ミッション進捗', boxX + 18, mSecY);
            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.fillText(`累計達成: ${clearedMissionIds.length}個`, boxX + boxW - 18, mSecY);

            const activeMissions = getActiveMissions();
            let mCardY = mSecY + 7;
            for (let m of activeMissions) {
              drawMissionCard(ctx, m, boxX + 16, mCardY, boxW - 32, 30);
              mCardY += 35;
            }

            // ベスト目標 / NEW BEST / あと◯段でベスト表示
            const bestInfoY = boxY + 334;
            ctx.textAlign = 'center';
            if (isNewBest && score > 0) {
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
              ctx.fillText('★ NEW BEST RECORD! ★', V_WIDTH / 2, bestInfoY);
            } else if (prevBest > 0) {
              const diff = prevBest - score;
              if (diff > 0) {
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
                ctx.fillText(`あと ${diff}段 で自己ベスト更新 (${prevBest}段)`, V_WIDTH / 2, bestInfoY);
              } else {
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
                ctx.fillText(`自己ベストタイ記録！ (${prevBest}段)`, V_WIDTH / 2, bestInfoY);
              }
            } else {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
              ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
              ctx.fillText(`自己ベスト: ${best}段`, V_WIDTH / 2, bestInfoY);
            }

            // 「結果をコピー」ボタン & 「リトライ」ボタン
            const canRetry = (timeSinceOver >= panelDelay + 0.6);
            const copyBtnW = 220;
            const copyBtnH = 38;
            const copyBtnX = (V_WIDTH - copyBtnW) / 2;
            const copyBtnY = boxY + 352;

            const isCopied = copyFeedbackTimer > 0;
            ctx.save();
            ctx.fillStyle = isCopied ? 'rgba(74, 222, 128, 0.22)' : 'rgba(56, 189, 248, 0.18)';
            ctx.strokeStyle = isCopied ? '#4ade80' : '#38bdf8';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.roundRect(copyBtnX, copyBtnY, copyBtnW, copyBtnH, 19);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = isCopied ? '#4ade80' : '#38bdf8';
            ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
            ctx.fillText(isCopied ? '✔ コピーしました！' : '📋 結果をコピー', V_WIDTH / 2, copyBtnY + 24);
            ctx.restore();

            // Retry Prompt
            const retryBtnW = 220;
            const retryBtnH = 42;
            const retryBtnX = (V_WIDTH - retryBtnW) / 2;
            const retryBtnY = boxY + 406;

            if (canRetry) {
              const retryPulse = Math.sin(performance.now() * 0.007) * 0.25 + 0.75;
              ctx.save();
              ctx.globalAlpha = fade * retryPulse;

              ctx.fillStyle = 'rgba(78, 237, 255, 0.2)';
              ctx.strokeStyle = '#4eedff';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.roundRect(retryBtnX, retryBtnY, retryBtnW, retryBtnH, 21);
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#4eedff';
              ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
              ctx.fillText('▶ タップでリトライ', V_WIDTH / 2, retryBtnY + 26);
              ctx.restore();
            } else {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
              ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
              ctx.fillText('少しお待ちください...', V_WIDTH / 2, retryBtnY + 26);
            }

            ctx.restore();
          }
        }

        // Screen white flash overlay on PERFECT
        if (screenWhiteFlash > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 255, 255, ${screenWhiteFlash})`;
          ctx.fillRect(0, 0, V_WIDTH, vHeight);
          ctx.restore();
        }

        // 一時停止メニュー & カウントダウン描画
        drawPauseMenu(ctx);
        drawCountdownOverlay(ctx);

        ctx.restore(); // Restore virtual play area transformation

        // Pillarbox letterboxing on widescreen/desktop
        if (colLeft > 0) {
          ctx.save();
          ctx.fillStyle = '#0a0d14';
          ctx.fillRect(0, 0, colLeft * dpr, canvas.height);
          ctx.fillRect((colLeft + colWidth) * dpr, 0, (screenWidth - (colLeft + colWidth)) * dpr, canvas.height);

          // Subtle column border lines
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 1 * dpr;
          ctx.beginPath();
          ctx.moveTo(colLeft * dpr, 0);
          ctx.lineTo(colLeft * dpr, canvas.height);
          ctx.moveTo((colLeft + colWidth) * dpr, 0);
          ctx.lineTo((colLeft + colWidth) * dpr, canvas.height);
          ctx.stroke();
          ctx.restore();
        }
      }

      // --- Main Animation Loop with Clamped Delta Time ---
      let lastTime = performance.now();

      function gameLoop(now) {
        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(rawDt, 0.1); // Clamp to prevent jump on tab switch

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
      }

      // Start on title screen
      initDemoTower();
      initTower();
      updateNavUI();
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
</html>
