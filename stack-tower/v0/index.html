<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>積み上げタワー</title>
  <!-- Inline SVG favicon to prevent 404 requests -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='28' height='7' x='2' y='22' rx='2' fill='%234facfe'/%3E%3Crect width='22' height='7' x='5' y='13' rx='2' fill='%2300f2fe'/%3E%3Crect width='16' height='7' x='8' y='4' rx='2' fill='%23ff0844'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #mute-btn {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, background 0.2s ease;
      touch-action: manipulation;
    }
    #mute-btn:active {
      transform: scale(0.92);
      background: rgba(15, 23, 42, 0.7);
    }
    #mute-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <button id="mute-btn" aria-label="音声切替">
    <svg id="mute-icon-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="mute-icon-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <script>
    (function() {
      'use strict';

      // --- Constants & Configurations ---
      const V_WIDTH = 390;            // Standard portrait virtual width
      const BLOCK_HEIGHT = 26;        // Height of each block in virtual px
      const INITIAL_WIDTH = 200;      // Starting block width
      const PERFECT_TOLERANCE = 3.5;  // Tolerance in px for PERFECT snap
      const REGROW_AMOUNT = 8;        // Width regrowth when combo >= 3
      const BASE_SPEED = 220;         // Virtual px/sec at level 0
      const MAX_SPEED = 500;          // Capped virtual px/sec
      const GRAVITY = 950;            // Falling debris gravity in virtual px/sec^2

      // --- Canvas & Coordinate System Setup ---
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const muteBtn = document.getElementById('mute-btn');
      const muteIconOn = document.getElementById('mute-icon-on');
      const muteIconOff = document.getElementById('mute-icon-off');

      let dpr = 1;
      let screenWidth = 0;
      let screenHeight = 0;
      let colWidth = 390;
      let colLeft = 0;
      let colScale = 1;
      let vHeight = 844;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;

        canvas.width = Math.round(screenWidth * dpr);
        canvas.height = Math.round(screenHeight * dpr);

        // Portrait column sizing
        let maxCol = 420;
        if (screenWidth > screenHeight) {
          // Landscape: limit column width to preserve portrait aspect ratio
          maxCol = Math.min(maxCol, screenHeight * 0.58);
        }
        colWidth = Math.min(screenWidth, maxCol);
        colLeft = (screenWidth - colWidth) / 2;
        colScale = colWidth / V_WIDTH;
        vHeight = screenHeight / colScale;
      }
      window.addEventListener('resize', resize);
      resize();

      // --- Audio System (Web Audio API) ---
      let audioCtx = null;
      let isMuted = localStorage.getItem('stackTowerMuted') === 'true';

      function updateMuteUI() {
        muteIconOn.style.display = isMuted ? 'none' : 'block';
        muteIconOff.style.display = isMuted ? 'block' : 'none';
      }
      updateMuteUI();

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      let lastMuteTime = 0;
      function toggleMute(e) {
        if (e) {
          if (e.preventDefault && e.cancelable) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
        }
        const now = performance.now();
        if (now - lastMuteTime < 100) return;
        lastMuteTime = now;
        isMuted = !isMuted;
        localStorage.setItem('stackTowerMuted', isMuted ? 'true' : 'false');
        updateMuteUI();
        initAudio();
      }
      muteBtn.addEventListener('pointerdown', toggleMute);
      muteBtn.addEventListener('click', toggleMute);

      // Pentatonic pitch scale for combos
      const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

      function playSound(type, combo = 1) {
        if (isMuted) return;
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (type === 'drop') {
          // Soft tactile thud
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'perfect') {
          // Bright crystalline chime with rising pitch
          const noteIndex = Math.min(combo - 1, PENTATONIC.length - 1);
          let freq = PENTATONIC[noteIndex];
          if (combo > PENTATONIC.length) {
            freq *= Math.pow(1.05, combo - PENTATONIC.length);
          }

          // Fundamental Sine
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);

          gain1.gain.setValueAtTime(0.22, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.3);

          // Harmonic Triangle
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, now);

          gain2.gain.setValueAtTime(0.09, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start(now);
          osc2.stop(now + 0.22);

          // If combo >= 3, add sparkle third chime for regrowth
          if (combo >= 3) {
            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(freq * 1.5, now + 0.05);

            gain3.gain.setValueAtTime(0, now);
            gain3.gain.setValueAtTime(0.15, now + 0.05);
            gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

            osc3.connect(gain3);
            gain3.connect(audioCtx.destination);
            osc3.start(now + 0.05);
            osc3.stop(now + 0.32);
          }
        } else if (type === 'gameover') {
          // Melancholy descending glide
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.45);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      }

      // --- Game State Variables ---
      let gameState = 'title'; // 'title' | 'play' | 'over'
      let score = 0;
      let best = parseInt(localStorage.getItem('stackTowerBest'), 10) || 0;
      let prevBest = best;
      let combo = 0;
      let gameOverTime = 0;
      let isNewBest = false;

      // Tower & Block structures
      let tower = [];
      let movingBlock = null;
      let debrisList = [];
      let particles = [];
      let floatingTexts = [];
      let rings = [];

      // Camera
      let cameraY = 0;
      let targetCameraY = 0;
      let screenShake = 0;

      // Testing Hook Object
      window.__game = {
        state: 'title',
        score: 0,
        best: best,
        combo: 0,
        width: INITIAL_WIDTH
      };

      function syncGameHook() {
        window.__game.state = gameState;
        window.__game.score = score;
        window.__game.best = best;
        window.__game.combo = combo;
        const currentW = movingBlock ? movingBlock.width : (tower.length > 0 ? tower[tower.length - 1].width : INITIAL_WIDTH);
        window.__game.width = Math.round(currentW * 10) / 10;
      }

      // --- Color & Atmosphere Helpers ---
      function getBlockHue(level) {
        return (210 + level * 8) % 360;
      }

      // Sky gradient color stops across altitudes
      const SKY_STOPS = [
        { level: 0,   top: [26, 42, 75],    bottom: [248, 178, 142] }, // Dawn
        { level: 18,  top: [33, 114, 185],  bottom: [150, 222, 252] }, // Sunny Day
        { level: 42,  top: [78, 22, 88],    bottom: [250, 130, 70] },  // Sunset
        { level: 75,  top: [22, 14, 48],    bottom: [142, 45, 120] },  // Twilight
        { level: 110, top: [6, 8, 20],      bottom: [32, 22, 58] }     // Deep Space
      ];

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function getSkyColors(currentLevel) {
        if (currentLevel <= SKY_STOPS[0].level) {
          return { top: SKY_STOPS[0].top, bottom: SKY_STOPS[0].bottom };
        }
        for (let i = 0; i < SKY_STOPS.length - 1; i++) {
          const s1 = SKY_STOPS[i];
          const s2 = SKY_STOPS[i + 1];
          if (currentLevel >= s1.level && currentLevel <= s2.level) {
            const t = (currentLevel - s1.level) / (s2.level - s1.level);
            return {
              top: [
                Math.round(lerp(s1.top[0], s2.top[0], t)),
                Math.round(lerp(s1.top[1], s2.top[1], t)),
                Math.round(lerp(s1.top[2], s2.top[2], t))
              ],
              bottom: [
                Math.round(lerp(s1.bottom[0], s2.bottom[0], t)),
                Math.round(lerp(s1.bottom[1], s2.bottom[1], t)),
                Math.round(lerp(s1.bottom[2], s2.bottom[2], t))
              ]
            };
          }
        }
        const last = SKY_STOPS[SKY_STOPS.length - 1];
        return { top: last.top, bottom: last.bottom };
      }

      // Background stars & clouds
      const stars = [];
      for (let i = 0; i < 45; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() * 1.8 + 0.8,
          alpha: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 2 + 1
        });
      }

      const clouds = [
        { x: -50, y: 0.25, width: 140, height: 40, speed: 12 },
        { x: 180, y: 0.40, width: 180, height: 48, speed: 8 },
        { x: 80,  y: 0.60, width: 120, height: 35, speed: 10 }
      ];

      // --- Initialization & Resets ---
      function initTower() {
        tower = [];
        debrisList = [];
        particles = [];
        floatingTexts = [];
        rings = [];
        score = 0;
        combo = 0;
        prevBest = best;
        isNewBest = false;
        cameraY = 0;
        targetCameraY = 0;
        screenShake = 0;

        // Base foundation block
        const floorY = vHeight * 0.70;
        const baseWidth = INITIAL_WIDTH;
        const baseX = (V_WIDTH - baseWidth) / 2;
        tower.push({
          x: baseX,
          y: floorY,
          width: baseWidth,
          height: BLOCK_HEIGHT,
          hue: getBlockHue(0),
          flash: 0
        });

        spawnMovingBlock(1);
        syncGameHook();
      }

      function spawnMovingBlock(level) {
        const topBlock = tower[tower.length - 1];
        const width = topBlock.width;
        const y = topBlock.y - BLOCK_HEIGHT;
        const hue = getBlockHue(level);

        // Ping-pong across play area, ensuring moving block completely clears the tower on both sides
        const minX = -width - 25;
        const maxX = V_WIDTH + 25;

        // Alternate start direction
        const dir = (level % 2 === 1) ? 1 : -1;
        const speed = Math.min(BASE_SPEED + level * 6.0, MAX_SPEED);
        const startX = (dir > 0) ? minX : maxX;

        movingBlock = {
          x: startX,
          y: y,
          width: width,
          height: BLOCK_HEIGHT,
          hue: hue,
          dir: dir,
          speed: speed,
          minX: minX,
          maxX: maxX
        };

        // Autopilot target calculation for ?bot=1
        if (isBotActive) {
          // 75% perfect/near-perfect, 25% slight cut to test combos, cuts, and eventual misses
          const willCut = Math.random() < 0.25;
          if (willCut) {
            const sign = Math.random() < 0.5 ? -1 : 1;
            botTargetOffset = sign * (PERFECT_TOLERANCE + 1.2 + Math.random() * 3.5);
          } else {
            botTargetOffset = (Math.random() - 0.5) * (PERFECT_TOLERANCE * 0.75);
          }
        }

        syncGameHook();
      }

      // --- Debris & Particle Spawners ---
      function spawnDebris(x, y, width, height, hue, vx, vy, vRot) {
        if (width <= 0) return;
        debrisList.push({
          x: x,
          y: y,
          width: width,
          height: height,
          hue: hue,
          vx: vx,
          vy: vy,
          rot: 0,
          vRot: vRot,
          alpha: 1.0
        });
      }

      function spawnCutSparks(x, y, count) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.random() * Math.PI) - (Math.PI / 2);
          const spd = Math.random() * 140 + 60;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 60,
            size: Math.random() * 3 + 2,
            color: '#ffffff',
            alpha: 1.0,
            life: 0.35
          });
        }
      }

      function spawnPerfectFX(block, comboCount) {
        // Glowing expanding ring
        rings.push({
          x: block.x + block.width / 2,
          y: block.y + BLOCK_HEIGHT / 2,
          radiusX: block.width / 2,
          radiusY: BLOCK_HEIGHT / 2,
          scale: 1.0,
          maxScale: 2.2,
          alpha: 1.0,
          hue: block.hue
        });

        // Corner sparkle bursts
        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 160 + 80;
          particles.push({
            x: block.x + Math.random() * block.width,
            y: block.y + Math.random() * BLOCK_HEIGHT,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: Math.random() * 3.5 + 2,
            color: (Math.random() < 0.5) ? '#ffffff' : `hsl(${block.hue}, 95%, 75%)`,
            alpha: 1.0,
            life: 0.45
          });
        }

        // Floating combo text
        let msg = 'PERFECT!';
        if (comboCount >= 3) {
          msg = `PERFECT! x${comboCount} (幅UP!)`;
        } else if (comboCount > 1) {
          msg = `PERFECT! x${comboCount}`;
        }
        floatingTexts.push({
          text: msg,
          x: block.x + block.width / 2,
          y: block.y - 12,
          vy: -55,
          alpha: 1.0,
          scale: comboCount >= 3 ? 1.25 : 1.0,
          color: comboCount >= 3 ? '#ffea79' : '#ffffff'
        });

        screenShake = 4.0;
      }

      // --- Core Action Handling (Tap / Click / Space) ---
      function handleAction() {
        initAudio();

        if (gameState === 'title') {
          gameState = 'play';
          initTower();
          return;
        }

        if (gameState === 'over') {
          // Ignore input for 0.6s after game over
          if (performance.now() - gameOverTime < 600) return;
          gameState = 'play';
          initTower();
          return;
        }

        if (gameState === 'play' && movingBlock) {
          const topBlock = tower[tower.length - 1];
          const diff = movingBlock.x - topBlock.x;
          const absDiff = Math.abs(diff);

          if (absDiff <= PERFECT_TOLERANCE) {
            // --- PERFECT SNAP ---
            combo++;
            movingBlock.x = topBlock.x;

            // Regrow width if combo >= 3
            if (combo >= 3 && movingBlock.width < INITIAL_WIDTH) {
              const prevW = movingBlock.width;
              movingBlock.width = Math.min(INITIAL_WIDTH, movingBlock.width + REGROW_AMOUNT);
              // Expand symmetrically around center
              movingBlock.x = Math.max(10, Math.min(V_WIDTH - movingBlock.width - 10, movingBlock.x - (movingBlock.width - prevW) / 2));
            }

            const placed = {
              x: movingBlock.x,
              y: movingBlock.y,
              width: movingBlock.width,
              height: BLOCK_HEIGHT,
              hue: movingBlock.hue,
              flash: 1.0
            };
            tower.push(placed);
            spawnPerfectFX(placed, combo);
            playSound('perfect', combo);

          } else if (movingBlock.x + movingBlock.width <= topBlock.x || movingBlock.x >= topBlock.x + topBlock.width) {
            // --- COMPLETE MISS -> GAME OVER ---
            combo = 0;
            // The whole block falls
            spawnDebris(
              movingBlock.x,
              movingBlock.y,
              movingBlock.width,
              BLOCK_HEIGHT,
              movingBlock.hue,
              movingBlock.dir * 60,
              -40,
              (Math.random() - 0.5) * 6
            );
            movingBlock = null;
            triggerGameOver();
            return;

          } else {
            // --- PARTIAL OVERLAP (CUT) ---
            combo = 0;
            let overhangWidth = 0;
            let newWidth = 0;
            let newX = 0;
            let debrisX = 0;
            let debrisWidth = 0;
            let debrisVx = 0;

            if (diff < 0) {
              // Overhang on left
              overhangWidth = topBlock.x - movingBlock.x;
              newWidth = movingBlock.width - overhangWidth;
              newX = topBlock.x;
              debrisX = movingBlock.x;
              debrisWidth = overhangWidth;
              debrisVx = -50;
            } else {
              // Overhang on right
              overhangWidth = (movingBlock.x + movingBlock.width) - (topBlock.x + topBlock.width);
              newWidth = movingBlock.width - overhangWidth;
              newX = movingBlock.x;
              debrisX = topBlock.x + topBlock.width;
              debrisWidth = overhangWidth;
              debrisVx = 50;
            }

            if (newWidth <= 1.5) {
              // Remaining sliver is too small -> complete miss
              combo = 0;
              spawnDebris(
                movingBlock.x,
                movingBlock.y,
                movingBlock.width,
                BLOCK_HEIGHT,
                movingBlock.hue,
                movingBlock.dir * 60,
                -40,
                (Math.random() - 0.5) * 6
              );
              movingBlock = null;
              triggerGameOver();
              return;
            }

            spawnDebris(
              debrisX,
              movingBlock.y,
              debrisWidth,
              BLOCK_HEIGHT,
              movingBlock.hue,
              debrisVx,
              -30,
              debrisVx > 0 ? 3.5 : -3.5
            );
            spawnCutSparks(debrisVx > 0 ? debrisX : debrisX + debrisWidth, movingBlock.y + BLOCK_HEIGHT / 2, 9);

            const placed = {
              x: newX,
              y: movingBlock.y,
              width: newWidth,
              height: BLOCK_HEIGHT,
              hue: movingBlock.hue,
              flash: 0.6
            };
            tower.push(placed);
            playSound('drop');
          }

          // Advance score
          score = tower.length - 1;
          if (score > best) {
            best = score;
            localStorage.setItem('stackTowerBest', best);
          }

          spawnMovingBlock(tower.length);
        }
      }

      function triggerGameOver() {
        gameState = 'over';
        gameOverTime = performance.now();
        playSound('gameover');

        if (score > prevBest && score > 0) {
          isNewBest = true;
        }

        syncGameHook();
      }

      // --- Input Event Listeners (No double fire, no scroll/zoom) ---
      let lastInputTime = 0;
      function onUserInput(e) {
        if (e && e.target && e.target.closest && e.target.closest('#mute-btn')) return;
        if (e && e.preventDefault && e.cancelable) {
          e.preventDefault();
        }
        const now = performance.now();
        if (now - lastInputTime < 40) return; // Debounce rapid multi-events (pointerdown + touchstart + click)
        lastInputTime = now;
        handleAction();
      }

      window.addEventListener('pointerdown', onUserInput, { passive: false });
      window.addEventListener('touchstart', onUserInput, { passive: false });
      window.addEventListener('click', onUserInput);
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          onUserInput(e);
        }
      });

      // --- Autopilot for ?bot=1 ---
      const urlParams = new URLSearchParams(window.location.search);
      const isBotActive = urlParams.get('bot') === '1';
      let botTargetOffset = 0;
      let botWaitTimer = 0;

      function updateBot(dt) {
        if (!isBotActive) return;

        if (gameState === 'title') {
          botWaitTimer += dt;
          if (botWaitTimer > 0.4) {
            botWaitTimer = 0;
            handleAction();
          }
        } else if (gameState === 'play' && movingBlock) {
          const topBlock = tower[tower.length - 1];
          const targetX = topBlock.x + botTargetOffset;
          const currentX = movingBlock.x;
          const step = movingBlock.speed * dt;

          const dist = targetX - currentX;
          const movingTowards = (movingBlock.dir > 0 && dist >= 0) || (movingBlock.dir < 0 && dist <= 0);

          if (movingTowards && Math.abs(dist) <= Math.max(step * 1.05, 5)) {
            movingBlock.x = targetX;
            handleAction();
          }
        } else if (gameState === 'over') {
          botWaitTimer += dt;
          if (botWaitTimer > 0.85) {
            botWaitTimer = 0;
            handleAction();
          }
        }
      }

      // --- Update Loop ---
      function update(dt) {
        // Autopilot
        updateBot(dt);

        // Screen shake decay
        if (screenShake > 0) {
          screenShake = Math.max(0, screenShake - dt * 25);
        }

        // Camera scroll
        if (tower.length > 0) {
          const topY = tower[tower.length - 1].y;
          // Keep active block at ~42% of viewport height once tower grows into upper half
          const idealCameraY = Math.min(0, topY - vHeight * 0.42);
          targetCameraY = idealCameraY;
          cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 5.0);
        }

        // Moving block update
        if (movingBlock) {
          movingBlock.x += movingBlock.dir * movingBlock.speed * dt;
          if (movingBlock.dir > 0 && movingBlock.x >= movingBlock.maxX) {
            movingBlock.dir = -1;
            movingBlock.x = movingBlock.maxX;
          } else if (movingBlock.dir < 0 && movingBlock.x <= movingBlock.minX) {
            movingBlock.dir = 1;
            movingBlock.x = movingBlock.minX;
          }
        }

        // Placed blocks flash decay
        for (let b of tower) {
          if (b.flash > 0) {
            b.flash = Math.max(0, b.flash - dt * 4.0);
          }
        }

        // Debris physics
        for (let i = debrisList.length - 1; i >= 0; i--) {
          const d = debrisList[i];
          d.vy += GRAVITY * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.rot += d.vRot * dt;
          d.alpha -= dt * 0.7; // Smoothly fades out as it falls
          if (d.alpha <= 0 || d.y - cameraY > vHeight + 100) {
            debrisList.splice(i, 1);
          }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += GRAVITY * 0.4 * dt;
          p.alpha -= dt / p.life;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }

        // Expanding rings
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.scale += dt * 3.5;
          r.alpha -= dt * 2.5;
          if (r.alpha <= 0 || r.scale >= r.maxScale) {
            rings.splice(i, 1);
          }
        }

        // Floating texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.alpha -= dt * 1.4;
          if (ft.alpha <= 0) {
            floatingTexts.splice(i, 1);
          }
        }

        // Ambient clouds
        for (let c of clouds) {
          c.x += c.speed * dt;
          if (c.x > V_WIDTH + 60) {
            c.x = -c.width - 60;
          }
        }

        syncGameHook();
      }

      // --- Rendering Functions ---
      function draw2DBlock(context, x, y, w, h, hue, flash = 0) {
        if (w <= 0) return;

        context.save();
        // Base block gradient (2.5D bevel effect)
        const grad = context.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, `hsl(${hue}, 88%, 65%)`);
        grad.addColorStop(0.5, `hsl(${hue}, 82%, 52%)`);
        grad.addColorStop(1, `hsl(${hue}, 84%, 42%)`);

        context.fillStyle = grad;
        context.beginPath();
        context.roundRect(x, y, w, h, 3);
        context.fill();

        // Top highlight bevel
        context.fillStyle = 'rgba(255, 255, 255, 0.42)';
        context.beginPath();
        context.roundRect(x + 1, y + 1, w - 2, Math.min(3, h * 0.25), 1.5);
        context.fill();

        // Bottom shade
        context.fillStyle = 'rgba(0, 0, 0, 0.22)';
        context.beginPath();
        context.roundRect(x + 1, y + h - 3, w - 2, 2.5, 1);
        context.fill();

        // Left highlight
        context.fillStyle = 'rgba(255, 255, 255, 0.2)';
        context.fillRect(x, y + 2, 2, h - 4);

        // Right shade
        context.fillStyle = 'rgba(0, 0, 0, 0.18)';
        context.fillRect(x + w - 2, y + 2, 2, h - 4);

        // Drop shadow cast downward
        const shadowGrad = context.createLinearGradient(x, y + h, x, y + h + 5);
        shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.22)');
        shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.fillStyle = shadowGrad;
        context.fillRect(x, y + h, w, 5);

        // Flash overlay for snap
        if (flash > 0) {
          context.fillStyle = `rgba(255, 255, 255, ${flash * 0.75})`;
          context.beginPath();
          context.roundRect(x, y, w, h, 3);
          context.fill();
        }

        context.restore();
      }

      function drawDebris(context, d) {
        context.save();
        context.translate(d.x + d.width / 2, d.y + d.height / 2);
        context.rotate(d.rot);
        context.globalAlpha = Math.max(0, d.alpha);

        draw2DBlock(context, -d.width / 2, -d.height / 2, d.width, d.height, d.hue, 0);

        context.restore();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sky colors based on current height
        const sky = getSkyColors(score);
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, `rgb(${sky.top[0]}, ${sky.top[1]}, ${sky.top[2]})`);
        skyGrad.addColorStop(1, `rgb(${sky.bottom[0]}, ${sky.bottom[1]}, ${sky.bottom[2]})`);

        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Stars (fade in as tower grows taller)
        const starAlpha = Math.min(1.0, Math.max(0, (score - 20) / 40));
        if (starAlpha > 0) {
          ctx.save();
          const timeSec = performance.now() * 0.001;
          for (let s of stars) {
            const twinkle = Math.sin(timeSec * s.twinkleSpeed) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starAlpha * twinkle})`;
            ctx.beginPath();
            ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size * dpr, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Apply screen shake
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        if (screenShake > 0) {
          shakeOffsetX = (Math.random() - 0.5) * screenShake * colScale;
          shakeOffsetY = (Math.random() - 0.5) * screenShake * colScale;
        }

        // Setup Virtual Play Area Transformation
        ctx.save();
        ctx.translate(colLeft * dpr + shakeOffsetX * dpr, shakeOffsetY * dpr);
        ctx.scale(colScale * dpr, colScale * dpr);

        // Draw soft clouds in background (lower altitude)
        const cloudAlpha = Math.max(0, 1.0 - score / 45) * 0.35;
        if (cloudAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
          for (let c of clouds) {
            ctx.beginPath();
            const cy = c.y * vHeight;
            ctx.ellipse(c.x + c.width / 2, cy, c.width / 2, c.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Camera offset for world objects
        ctx.save();
        ctx.translate(0, -cameraY);

        // Draw ground foundation pedestal
        const floorY = vHeight * 0.70;
        const pedestalHeight = Math.max(300, vHeight - floorY + 200);
        const pedestalGrad = ctx.createLinearGradient(0, floorY + BLOCK_HEIGHT, 0, floorY + BLOCK_HEIGHT + pedestalHeight);
        pedestalGrad.addColorStop(0, '#1a2332');
        pedestalGrad.addColorStop(1, '#0b111a');
        ctx.fillStyle = pedestalGrad;
        ctx.beginPath();
        ctx.roundRect((V_WIDTH - 240) / 2, floorY + BLOCK_HEIGHT, 240, pedestalHeight, [4, 4, 0, 0]);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect((V_WIDTH - 236) / 2, floorY + BLOCK_HEIGHT, 236, 2);

        // Draw placed tower blocks
        for (let b of tower) {
          // Viewport culling
          if (b.y - cameraY > vHeight + 50 || b.y + b.height - cameraY < -50) continue;
          draw2DBlock(ctx, b.x, b.y, b.width, b.height, b.hue, b.flash);
        }

        // Draw moving block
        if (movingBlock) {
          draw2DBlock(ctx, movingBlock.x, movingBlock.y, movingBlock.width, movingBlock.height, movingBlock.hue, 0);
        }

        // Draw falling debris
        for (let d of debrisList) {
          drawDebris(ctx, d);
        }

        // Draw expanding rings
        for (let r of rings) {
          ctx.save();
          ctx.strokeStyle = `hsla(${r.hue}, 100%, 75%, ${r.alpha})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, r.radiusX * r.scale, r.radiusY * r.scale * 1.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Draw particles
        for (let p of particles) {
          ctx.save();
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Draw floating combo texts
        for (let ft of floatingTexts) {
          ctx.save();
          ctx.font = `bold ${Math.round(18 * ft.scale)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillStyle = ft.color;
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
          ctx.shadowBlur = 6;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        ctx.restore(); // Restore camera translation

        // --- HUD Overlay (Fixed Screen Space within Column) ---
        if (gameState === 'play') {
          // Large Score Top Center
          ctx.save();
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 2;

          ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillText(score, V_WIDTH / 2, 88);

          // Best score badge
          ctx.font = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
          ctx.fillText(`BEST ${best}`, V_WIDTH / 2, 114);

          // Active Combo Multiplier Badge
          if (combo >= 2) {
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = combo >= 3 ? '#ffe600' : '#4eedff';
            ctx.fillText(`★ COMBO x${combo}`, V_WIDTH / 2, 140);
          }
          ctx.restore();
        }

        // --- Title Screen Screen Space ---
        if (gameState === 'title') {
          ctx.save();
          ctx.textAlign = 'center';

          // Decorative Title Glow & Shadow
          ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 3;

          ctx.font = 'bold 38px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('積み上げタワー', V_WIDTH / 2, vHeight * 0.22);

          // One-line instruction
          ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.shadowBlur = 4;
          ctx.fillText('タイミングよくタップしてブロックを積もう！', V_WIDTH / 2, vHeight * 0.27);

          // High score on title if exists
          if (best > 0) {
            ctx.font = '600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = '#ffd152';
            ctx.fillText(`自己ベスト: ${best}段`, V_WIDTH / 2, vHeight * 0.32);
          }

          // Pulsing Tap to Start prompt
          const pulse = Math.sin(performance.now() * 0.005) * 0.2 + 0.8;
          ctx.globalAlpha = pulse;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
          ctx.fillText('▶ タップでスタート', V_WIDTH / 2, vHeight * 0.52);

          // Desktop Space hint
          ctx.globalAlpha = 0.65;
          ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillText('[Space] キーまたはクリック', V_WIDTH / 2, vHeight * 0.56);

          ctx.restore();
        }

        // --- Game Over Screen Screen Space ---
        if (gameState === 'over') {
          ctx.save();
          // Dark frosted overlay
          ctx.fillStyle = 'rgba(10, 15, 26, 0.72)';
          ctx.fillRect(0, 0, V_WIDTH, vHeight);

          // Modal Box
          const boxW = 310;
          const boxH = 260;
          const boxX = (V_WIDTH - boxW) / 2;
          const boxY = vHeight * 0.28;

          ctx.fillStyle = 'rgba(23, 32, 51, 0.9)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(boxX, boxY, boxW, boxH, 16);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.fillStyle = '#ff4d6d';
          ctx.font = 'bold 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillText('GAME OVER', V_WIDTH / 2, boxY + 44);

          // Score
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillText('スコア', V_WIDTH / 2, boxY + 76);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 44px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillText(`${score}段`, V_WIDTH / 2, boxY + 124);

          // Best score & New Best badge
          if (isNewBest && score > 0) {
            ctx.fillStyle = '#ffda55';
            ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText('★ NEW BEST! ★', V_WIDTH / 2, boxY + 154);
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(`自己ベスト: ${best}段`, V_WIDTH / 2, boxY + 154);
          }

          // Retry Prompt (Ignore input for 0.6s)
          const timeSinceOver = (performance.now() - gameOverTime) / 1000;
          if (timeSinceOver >= 0.6) {
            const retryPulse = Math.sin(performance.now() * 0.007) * 0.25 + 0.75;
            ctx.globalAlpha = retryPulse;
            ctx.fillStyle = '#4eedff';
            ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
            ctx.fillText('タップでリトライ', V_WIDTH / 2, boxY + 214);
          } else {
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('少しお待ちください...', V_WIDTH / 2, boxY + 214);
          }

          ctx.restore();
        }

        ctx.restore(); // Restore virtual play area transformation

        // Pillarbox letterboxing on widescreen/desktop
        if (colLeft > 0) {
          ctx.save();
          ctx.fillStyle = '#0a0d14';
          ctx.fillRect(0, 0, colLeft * dpr, canvas.height);
          ctx.fillRect((colLeft + colWidth) * dpr, 0, (screenWidth - (colLeft + colWidth)) * dpr, canvas.height);

          // Subtle column border lines
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 1 * dpr;
          ctx.beginPath();
          ctx.moveTo(colLeft * dpr, 0);
          ctx.lineTo(colLeft * dpr, canvas.height);
          ctx.moveTo((colLeft + colWidth) * dpr, 0);
          ctx.lineTo((colLeft + colWidth) * dpr, canvas.height);
          ctx.stroke();
          ctx.restore();
        }
      }

      // --- Main Animation Loop with Clamped Delta Time ---
      let lastTime = performance.now();

      function gameLoop(now) {
        const rawDt = (now - lastTime) / 1000;
        lastTime = now;
        const dt = Math.min(rawDt, 0.1); // Clamp to prevent jump on tab switch

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
      }

      // Start on title screen
      initTower();
      requestAnimationFrame(gameLoop);

    })();
  </script>
</body>
</html>
