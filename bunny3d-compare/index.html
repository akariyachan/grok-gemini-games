<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>バニー 3D 比較ビューア | Grok × Gemini Games</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #e6def8 0%, #c5b6e8 65%, #9f8cd0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      color: #f6f0ff;
    }
    #stage { display: block; width: 100%; height: 100%; }
    .pill {
      background: rgba(45, 24, 72, 0.72);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(40, 16, 70, 0.18);
    }
    #back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: #f6f0ff;
      z-index: 2;
    }
    #back-link:hover { background: rgba(70, 40, 110, 0.82); }
    #hint {
      position: fixed;
      top: 60px;
      left: 16px;
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 2;
    }
    #pose-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      padding: 4px;
      z-index: 2;
    }
    #pose-toggle button, #nav button {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      color: #e6dcf8;
      background: transparent;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    #pose-toggle button.active {
      background: #8e5ce6;
      color: #fff;
      font-weight: 600;
    }
    #pose-toggle button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #nav {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 6px 6px;
      z-index: 2;
      max-width: calc(100% - 32px);
    }
    #nav button.arrow {
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      color: #fff;
      background: rgba(142, 92, 230, 0.9);
      flex: 0 0 auto;
    }
    #nav button.arrow:hover { background: #7a48d8; }
    #nav button.arrow:disabled {
      opacity: 0.4;
      background: rgba(80, 50, 120, 0.5);
    }
    #model-name {
      min-width: 200px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      padding: 0 14px;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    #model-index {
      display: block;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.75;
      margin-top: 2px;
    }
    #status {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 18px;
      font-size: 14px;
      z-index: 3;
      display: none;
    }
    #status.visible { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a id="back-link" class="pill" href="../">← ゲーム一覧</a>
  <div id="hint" class="pill">ドラッグで回転 / スクロールで拡大 / 左右キーでモデル切替</div>
  <div id="pose-toggle" class="pill">
    <button id="btn-sit" class="active" type="button">すわる</button>
    <button id="btn-stand" type="button">たつ</button>
  </div>
  <div id="nav" class="pill">
    <button id="btn-prev" class="arrow" type="button" aria-label="前のモデル">◀</button>
    <div id="model-name">読み込み中…<span id="model-index"></span></div>
    <button id="btn-next" class="arrow" type="button" aria-label="次のモデル">▶</button>
  </div>
  <div id="status" class="pill"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { createThreeJsBunny } from './threejs-v5/runtime.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.domElement.id = 'stage';
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.05, 80);
    camera.position.set(0, 0.95, 3.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.7, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.6;
    controls.maxDistance = 10;
    controls.update();

    scene.add(new THREE.HemisphereLight(0xfff7ff, 0xc98be8, 1.38));
    const keyLight = new THREE.DirectionalLight(0xfff6f2, 1.15);
    keyLight.position.set(2.3, 3.6, 3.8);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xeae2ff, 0.55);
    fillLight.position.set(2.0, 1.2, 1.8);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffcaf8, 0.9);
    rimLight.position.set(-2.3, 2.8, -2.8);
    scene.add(rimLight);
    const backFill = new THREE.DirectionalLight(0xe4c6ff, 0.36);
    backFill.position.set(2.2, 2.2, -2.6);
    scene.add(backFill);

    const loader = new GLTFLoader();
    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('model-name');
    const indexEl = document.getElementById('model-index');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSit = document.getElementById('btn-sit');
    const btnStand = document.getElementById('btn-stand');

    let catalog = [];
    let index = 0;
    let pose = 'sit';
    let current = { kind: null, object: null, mixer: null, morphs: [], procedural: null, dispose: null, gltf: null };
    const cache = new Map();
    const clock = new THREE.Clock();
    let blinkClock = 0;
    let nextBlink = 2.5;

    function showStatus(text) {
      statusEl.textContent = text || '';
      statusEl.classList.toggle('visible', Boolean(text));
    }

    async function fileExists(url) {
      if (!url) return false;
      try {
        const res = await fetch(url, { method: 'HEAD' });
        if (res.ok) return true;
      } catch (_) {}
      try {
        const res = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' } });
        return res.ok;
      } catch (_) {
        return false;
      }
    }

    async function resolveGltfEntry(entry) {
      const poses = { sit: null, stand: null };
      const tryUrls = (key) => {
        const list = [];
        if (entry[key]) list.push(entry[key]);
        if (entry.alternates && entry.alternates[key]) list.push(...entry.alternates[key]);
        return list;
      };
      for (const url of tryUrls('sit')) {
        if (await fileExists(url)) { poses.sit = url; break; }
      }
      for (const url of tryUrls('stand')) {
        if (await fileExists(url)) { poses.stand = url; break; }
      }
      if (!poses.sit && !poses.stand) return null;
      return { ...entry, poses };
    }

    async function loadCatalog() {
      const res = await fetch('./models.json');
      const data = await res.json();
      const ready = [];
      for (const entry of data.models || []) {
        if (entry.type === 'procedural') {
          ready.push({ ...entry, poses: { sit: true, stand: true } });
          continue;
        }
        const isOptional = Boolean(entry.optional);
        if (!isOptional) {
          const poses = { sit: entry.sit || null, stand: entry.stand || null };
          if (poses.sit || poses.stand) ready.push({ ...entry, poses });
          continue;
        }
        const resolved = await resolveGltfEntry(entry);
        if (resolved) ready.push(resolved);
      }
      return ready;
    }

    function clearCurrent(disposeHard = false) {
      if (current.mixer) current.mixer.stopAllAction();
      if (current.object) scene.remove(current.object);
      if (disposeHard && current.dispose) current.dispose();
      current = { kind: null, object: null, mixer: null, morphs: [], procedural: null, dispose: null, gltf: null };
    }

    function frameObject(object, preferSit) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3();
      const tmp = new THREE.Box3();
      const tmpSize = new THREE.Vector3();
      object.traverse((obj) => {
        if (!obj.isMesh || obj.visible === false) return;
        tmp.setFromObject(obj);
        if (tmp.isEmpty()) return;
        tmp.getSize(tmpSize);
        if (tmpSize.length() > 12) return;
        box.union(tmp);
      });
      if (box.isEmpty()) box.setFromObject(object);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const height = Math.max(size.y, 0.4);
      const dist = Math.max(height * 2.2, size.x * 2.4, size.z * 2.4, 2.0);
      const targetY = center.y + height * 0.04;
      controls.target.set(center.x, targetY, center.z);
      camera.position.set(center.x + 0.05, targetY + height * 0.12, center.z + dist * 0.92);
      camera.near = Math.max(0.02, dist / 80);
      camera.far = Math.max(40, dist * 20);
      camera.updateProjectionMatrix();
      controls.minDistance = dist * 0.35;
      controls.maxDistance = dist * 4.5;
      controls.update();
      void preferSit;
    }

    function collectMorphs(root) {
      const morphs = [];
      root.traverse((obj) => {
        if (!obj.morphTargetDictionary || !obj.morphTargetInfluences) return;
        const dict = obj.morphTargetDictionary;
        const names = Object.keys(dict).filter((n) => /blink|eyeclose|まばたき/i.test(n));
        if (names.length) {
          morphs.push({ mesh: obj, indices: names.map((n) => dict[n]) });
        }
      });
      return morphs;
    }

    function loadGltf(url) {
      if (cache.has(url)) return Promise.resolve(cache.get(url));
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (gltf) => {
            const item = { scene: gltf.scene, animations: gltf.animations || [] };
            cache.set(url, item);
            resolve(item);
          },
          undefined,
          reject
        );
      });
    }

    function findPoseClip(animations, poseName) {
      const pats = poseName === 'stand'
        ? [/stand/i, /standing/i]
        : [/kneel/i, /kneeling/i, /sit/i, /sitting/i];
      return animations.find((c) => pats.some((re) => re.test(c.name || ''))) || null;
    }

    function hasPoseClip(animations, poseName) {
      return Boolean(findPoseClip(animations, poseName));
    }

    function applyGltfPose(mixer, gltf, poseName) {
      if (!mixer || !gltf) return;
      mixer.stopAllAction();
      const clip = findPoseClip(gltf.animations, poseName);
      if (!clip) return;
      const action = mixer.clipAction(clip);
      action.reset();
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.clampWhenFinished = true;
      action.play();
      action.paused = true;
      action.time = clip.duration > 0 ? clip.duration : 0;
      mixer.update(0);
    }

    function makeMixer(gltf, object, poseName) {
      if (!gltf.animations.length) return null;
      const mixer = new THREE.AnimationMixer(object);
      applyGltfPose(mixer, gltf, poseName);
      return mixer;
    }

    async function showModel(nextIndex, nextPose) {
      if (!catalog.length) return;
      index = (nextIndex + catalog.length) % catalog.length;
      const entry = catalog[index];
      const available = entry.poses;
      if (nextPose && available[nextPose]) pose = nextPose;
      else if (!available[pose]) pose = available.sit ? 'sit' : 'stand';

      nameEl.childNodes[0].nodeValue = entry.name;
      indexEl.textContent = `${index + 1} / ${catalog.length}`;
      btnSit.disabled = !available.sit;
      btnStand.disabled = !available.stand;
      btnSit.classList.toggle('active', pose === 'sit');
      btnStand.classList.toggle('active', pose === 'stand');
      showStatus('読み込み中…');

      try {
        if (entry.type === 'procedural') {
          let proc = cache.get('procedural:threejs-v5');
          if (!proc) {
            proc = createThreeJsBunny();
            cache.set('procedural:threejs-v5', proc);
          }
          clearCurrent(false);
          proc.setPose(pose, true);
          scene.add(proc.root);
          current = {
            kind: 'procedural',
            object: proc.root,
            mixer: null,
            morphs: [],
            procedural: proc,
            dispose: proc.dispose,
          };
          frameObject(proc.root, pose === 'sit');
        } else {
          const url = available[pose] || available.sit || available.stand;
          const gltf = await loadGltf(url);
          clearCurrent(false);
          const object = gltf.scene;
          scene.add(object);
          const mixer = makeMixer(gltf, object, pose);
          current = {
            kind: 'gltf',
            object,
            mixer,
            morphs: collectMorphs(object),
            procedural: null,
            dispose: null,
            gltf,
          };
          frameObject(object, pose === 'sit');
          const clipsEnableSit = hasPoseClip(gltf.animations, 'sit');
          const clipsEnableStand = hasPoseClip(gltf.animations, 'stand');
          btnSit.disabled = !(available.sit || clipsEnableSit);
          btnStand.disabled = !(available.stand || clipsEnableStand);
        }
        showStatus('');
      } catch (err) {
        console.error(err);
        showStatus('読み込みに失敗しました');
      }
    }

    function shiftModel(delta) {
      showModel(index + delta, pose);
    }

    function setPose(next) {
      const entry = catalog[index];
      if (!entry) return;
      const can = entry.poses[next] || (current.gltf && hasPoseClip(current.gltf.animations, next));
      if (!can) return;
      if (current.kind === 'procedural' && current.procedural) {
        pose = next;
        current.procedural.setPose(pose, false);
        btnSit.classList.toggle('active', pose === 'sit');
        btnStand.classList.toggle('active', pose === 'stand');
        return;
      }
      if (current.kind === 'gltf' && current.mixer && current.gltf && hasPoseClip(current.gltf.animations, next)) {
        pose = next;
        applyGltfPose(current.mixer, current.gltf, pose);
        if (current.object) frameObject(current.object, pose === 'sit');
        btnSit.classList.toggle('active', pose === 'sit');
        btnStand.classList.toggle('active', pose === 'stand');
        return;
      }
      showModel(index, next);
    }

    btnPrev.addEventListener('click', () => shiftModel(-1));
    btnNext.addEventListener('click', () => shiftModel(1));
    btnSit.addEventListener('click', () => setPose('sit'));
    btnStand.addEventListener('click', () => setPose('stand'));
    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); shiftModel(-1); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); shiftModel(1); }
      else if (ev.key === 'ArrowDown' || ev.key.toLowerCase() === 's') setPose('sit');
      else if (ev.key === 'ArrowUp' || ev.key.toLowerCase() === 't') setPose('stand');
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function updateGltfBlink(dt) {
      if (!current.morphs.length) return;
      let amount = 0;
      if (blinkClock > 0) {
        blinkClock -= dt;
        const u = Math.max(0, Math.min(1, 1 - blinkClock / 0.14));
        amount = Math.sin(u * Math.PI);
      } else {
        nextBlink -= dt;
        if (nextBlink <= 0) {
          blinkClock = 0.14;
          nextBlink = 2.0 + Math.random() * 4.0;
        }
      }
      for (const m of current.morphs) {
        for (const i of m.indices) m.mesh.morphTargetInfluences[i] = amount;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      if (current.procedural) current.procedural.update(dt);
      if (current.mixer) current.mixer.update(dt);
      if (current.kind === 'gltf') updateGltfBlink(dt);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    const params = new URLSearchParams(location.search);
    catalog = await loadCatalog();
    if (!catalog.length) {
      showStatus('表示できるモデルがありません');
    } else {
      const startId = params.get('model');
      const startPose = params.get('pose') === 'stand' ? 'stand' : (params.get('pose') === 'sit' ? 'sit' : 'sit');
      const startIndex = Math.max(0, catalog.findIndex((m) => m.id === startId));
      await showModel(startIndex === -1 ? 0 : startIndex, startPose);
      window.__viewer = {
        get model() { return catalog[index] && catalog[index].id; },
        get name() { return catalog[index] && catalog[index].name; },
        get pose() { return pose; },
        get count() { return catalog.length; },
        catalog,
        next: () => shiftModel(1),
        prev: () => shiftModel(-1),
        setPose,
        show: (id, p) => {
          const i = catalog.findIndex((m) => m.id === id);
          return showModel(i < 0 ? index : i, p || pose);
        },
      };
    }
  </script>
</body>
</html>
